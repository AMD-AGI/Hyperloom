# v0.8 M4 — specialist domain → PR Monitor repos + default keywords.
# Reference: KB_design §3.13 M4 §7.
#
# Loaded by ``orchestrator.knowledge_plane.load_domain_repos()`` at
# Coordinator startup. The leading underscore in the filename keeps
# the ``ActionRegistry`` loader (which scans ``actions/_meta/*.yaml``)
# from interpreting this file as an action metadata.
#
# Schema (per-domain):
#   repos:            list[str] | "*"   — repo names as PR Monitor
#                                          reports them (owner/name);
#                                          "*" means "every monitored
#                                          repo" (pr_intel_specialist).
#   default_keywords: list[str]         — case-insensitive filter
#                                          terms applied to PR title +
#                                          labels + body snippet.
#
# Cross-reference with the PR Monitor's monitored-repo list (see
# primus-cortex-pr-monitor-access.md §"当前监控仓库"); repos listed
# here but not yet monitored upstream are tolerated — the REST
# wrapper logs a warning and skips them.

kernel_switch_specialist:
  repos:
    - ROCm/aiter
    - triton-lang/triton
    - ROCm/composable_kernel
  default_keywords:
    - kernel
    - gemm
    - moe
    - attention
    - fmoe
    - ck
    - triton

serving_specialist:
  repos:
    - sgl-project/sglang
    - ROCm/vllm
  default_keywords:
    - vllm
    - sglang
    - scheduler
    - cuda_graph
    - kv_cache
    - max-num-seqs
    - chunked

comm_specialist:
  repos:
    - ROCm/aiter
    - pytorch/pytorch
    - NVIDIA/nccl-tests
  default_keywords:
    - rccl
    - nccl
    - allreduce
    - quickreduce
    - collective
    - reduce-scatter
    - all-gather

compiler_specialist:
  repos:
    - triton-lang/triton
    - pytorch/pytorch
  default_keywords:
    - inductor
    - torch.compile
    - codegen
    - triton
    - amdgcn
    - register

system_specialist:
  repos:
    - ROCm/hip
    - ROCm/ROCm
  default_keywords:
    - hip
    - rocm
    - driver
    - kfd
    - dispatch

pr_intel_specialist:
  repos: "*"
  default_keywords: []
