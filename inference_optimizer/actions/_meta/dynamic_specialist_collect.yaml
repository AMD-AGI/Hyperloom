# `family` / `cost_minutes_*` / `expected_gain_pct` / `accuracy_risk` /
# `crash_risk` / `typical_runtime_min` are prompt-advisory metadata
# (see action_registry.py docstring); the runtime never gates on them.
name: dynamic_specialist_collect
family: creative
cost_minutes_p50: 0.0
cost_minutes_p75: 0.0
expected_gain_pct: [0.0, 0.0]
accuracy_risk: 0.0
crash_risk: 0.0
prerequisites:
  - baseline
requires_lanes: []
allowed_tools:
  - emit_intent
side_effects: []
preferred_backend: claude
preferred_model: claude-opus-4-7
max_turns: 1
lease_ttl_sec: 300
description: "Collect the full results of a completed dynamic specialist: completion report, incremental findings, and patches. Read-only retrieval keyed by agent_id from a prior dispatch observation."
pipeline_phase: explore
typical_runtime_min: 0.0
verdict_class: exploration
applicable_when:
  - "phase == 'EXPLORE'"
params_schema:
  agent_id:
    type: string
    description: |
      Required. The agent id from a ``dynamic_specialist_dispatched`` or
      ``dynamic_specialist_completed`` observation.
