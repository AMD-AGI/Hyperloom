# `family` / `cost_minutes_*` / `expected_gain_pct` / `accuracy_risk` /
# `crash_risk` / `typical_runtime_min` are prompt-advisory metadata
# (see action_registry.py docstring); the runtime never gates on them.
name: specialist
family: creative
cost_minutes_p50: 6.0
cost_minutes_p75: 12.0
expected_gain_pct: [0.0, 0.0]
accuracy_risk: 0.0
crash_risk: 0.0
prerequisites:
  - baseline
requires_lanes:
  - research_lane
allowed_tools:
  - emit_intent
  - Read
  - Grep
  - Glob
  - Bash
  - Edit
  - Write
  - MultiEdit
  - WebSearch
  - WebFetch
side_effects:
  - workspace_write
preferred_backend: claude
preferred_model: claude-opus-4-7
max_turns: 12
lease_ttl_sec: 1800
description: "Dispatch an LLM specialist on research_lane; reads KB / PR feed for knowledge-domain tags, may write worktree patches, emits one specialist_done intent."
pipeline_phase: explore
typical_runtime_min: 6.0
applicable_when:
  - "phase == 'EXPLORE'"
params_schema:
  tags:
    type: list
    description: |
      Canonical. One or more controlled knowledge-domain tags, derived
      from SpecialistDomain kb_anchor values: ``framework`` / ``kernel`` /
      ``communication`` / ``compiler`` / ``systems`` /
      ``pr_intelligence`` / ``research_scout``. Tags select KB anchors,
      PR repo subsets, focus templates, and breakdown attribution keys.
  domain:
    type: string
    description: |
      Backward-compatible alias for a single tag. When supplied without
      ``tags``, PolicyGate maps the SpecialistDomain key to its kb_anchor.
      Known keys include:
      ``serving_specialist`` / ``kernel_switch_specialist`` / ``comm_specialist``
      / ``compiler_specialist`` / ``system_specialist`` /
      ``pr_intel_specialist`` / ``research_scout_specialist``.
  gap_canonical_id:
    type: string
    description: |
      Required. Stable id of the gap the specialist should investigate
      (e.g. ``gap.framework.cuda_graph_inefficient.session-<sid>``). The
      SpecialistRunner anchors its KB traverse + PR feed on this id; the
      ``specialist_done.gap_canonical_id`` must match so Coordinator can
      route the result back to the gap row in ``SharedState.gaps[]``.
  gap_symptom:
    type: string
    description: |
      Optional. Human-readable summary of the symptom (e.g. ``decode kernel
      at 30% of HBM peak``) embedded into the specialist prompt to ground
      its KB / PR search.
  gap_layer:
    type: string
    description: |
      Optional. Layer label (``kernel`` / ``framework`` / ``communication``
      / …) used to pick KB anchor when ``params.kb_subgraph`` is empty.
  gap_evidence:
    type: object
    description: |
      Optional. Evidence dict forwarded verbatim into the prompt; typically
      profile path + metrics extracted from the most recent
      ``last_profile_trace``.
  max_turns:
    type: integer
    description: |
      Optional. Turn cap (default 1000, hard ceiling 1000; 0 means
      unbounded). PolicyGate R2 ``specialist_max_turns_excess`` rejects
      values outside [0, 1000]. Specialist depth is primarily bounded by the
      explicit wall-clock budget.
  needs_gpu:
    type: boolean
    description: |
      Optional, default false. Set true for wall-budgeted GPU work. GPU
      specialists receive isolated visible-device env vars from the
      Coordinator-managed GPU specialist pool (carved disjoint from the live
      serving cards) and serialize against serving via ``gpu_research_lane``.
      On their leased cards they may start/stop their own servers (any port
      that is not the production serving port 8888), profile, autotune, and
      run real benchmark loops; the one invariant is that they must not touch
      the production serving process, its cards, or port 8888.
  gpu_count:
    type: integer
    description: |
      Optional. Number of GPUs requested from the specialist GPU pool. When
      ``needs_gpu`` is true and ``gpu_count`` is unset, the Coordinator
      defaults it to the live serving TP so a TP-coupled gap is reproducible
      on the real topology; an explicit value still wins (e.g. fewer cards for
      a single-card kernel probe). PolicyGate rejects non-positive values or
      requests above the configured GPU specialist ceiling.
