name: replay_warm_recipe
family: prep
cost_minutes_p50: 5.0
cost_minutes_p75: 10.0
expected_gain_pct: [0.0, 25.0]
accuracy_risk: 0.0
crash_risk: 0.05
prerequisites:
  - baseline_done
requires_lanes:
  - server_lifecycle
  - benchmark_lane
allowed_tools:
  - emit_intent
  - Read
  - Bash
side_effects:
  - launches_server
  - reads_server
  - writes_results
preferred_backend: claude
preferred_model: claude-opus-4-7
max_turns: 25
lease_ttl_sec: 4200
description: "Coordinator-internal one-shot replay of T0 warm_start_recipe.best_config; reproducing ≥ --warm-replay-min-reproduce-pct of the historical gain pushes the warm config onto optimization_stack."
pipeline_phase: measure
typical_runtime_min: 5.0
applicable_when:
  # The Coordinator gates the enqueue (one-shot via ``warm_replay_attempted``
  # + ``warm_start_recipe.confidence`` >= ``--warm-replay-min-confidence``),
  # so ``applicable_when`` here is descriptive only.
  - "baseline_tput > 0"
  - "warm_replay_attempted == False"
# Descriptive (not validated by ActionRegistry) — the Coordinator constructs
# these params directly from ``state.warm_start_recipe.recipe.attrs.best_config``;
# operators don't get to set them via propose_action (PolicyGate denies).
params_schema:
  extra_sglang_args:
    type: string
    description: |
      ``best_config.extra_sglang_args`` from the warm-start recipe. Applied
      verbatim by BaselineExecutor's materialize_config_with_envs path.
  extra_envs:
    type: object
    description: |
      ``best_config.extra_envs`` from the warm-start recipe.
  config_path:
    type: string
    description: |
      Forwarded from ``SharedState.baseline_config_path`` so the replay
      benchmarks against the exact workload contract baseline used.
  warm_expected_gain_pct:
    type: number
    description: |
      Recipe's recorded historical gain — used by ``_promote_warm_replay``
      to judge "reproduced" vs "drift".
  warm_recipe_tier:
    type: string
    description: |
      ``T1_exact`` / ``T1_exact_legacy`` / ``T2_same_shape`` — the
      fallback-ladder tier that produced this recipe.
  warm_recipe_conf:
    type: number
    description: |
      Tier confidence the ladder stamped on the recipe.
  baseline_tput_anchor:
    type: number
    description: |
      ``SharedState.baseline_tput`` at the moment the replay was enqueued.
      Carried forward so the promote path doesn't depend on a moving
      baseline value (defensive against race with another baseline retry).
