name: framework_pr
family: shallow
cost_minutes_p50: 12.0
cost_minutes_p75: 20.0
expected_gain_pct: [0.0, 8.0]
accuracy_risk: 0.05
crash_risk: 0.10
prerequisites:
  - "baseline_tput > 0"
requires_lanes:
  - server_lifecycle
  - benchmark_lane
allowed_tools:
  - emit_intent
  - Read
  - Bash
side_effects:
  - mutates_framework_source
  - launches_server
  - reads_server
  - writes_results
preferred_backend: claude
preferred_model: claude-opus-4-7
max_turns: 10
lease_ttl_sec: 1800
description: "fa-driven PR discovery + apply + A/B bench against base_tput; KEEP on +min_gain_pct, DISCARD auto-rolls back the sglang worktree to the previous git head."
pipeline_phase: explore
typical_runtime_min: 12.0
applicable_when:
  - "baseline_tput > 0"
params_schema:
  max_candidates:
    type: integer
    description: |
      Top-K candidates the fa subprocess returns. Executor picks top-1
      after filtering out refs already tried this session.
      Default: 5.
  min_gain_pct:
    type: float
    description: |
      Minimum delta_pct (PR-applied vs previous best) required to KEEP.
      Below this the executor rolls sglang back to the previous head.
      Default: 1.0 — picked to sit above the noise floor (~0.2-0.5%
      typical bench variance) so a single noisy round does not lock in
      a non-improvement.
  gap_override:
    type: string
    description: |
      Manual gap_description string passed verbatim to fa, bypassing
      the auto-composer (which derives gap from manifest workload +
      latest profile bottleneck). Use when the LLM has stronger
      domain knowledge than the composer.
  keyword_override:
    type: array
    description: |
      Manual keyword list passed verbatim to fa, bypassing both
      gap_override and the auto-composer. Use to surgically target
      specific PR areas (e.g. ["fp8", "moe"]).
  dry_run:
    type: boolean
    description: |
      When true, executor only logs what would be applied (the top-1
      candidate ref + head_sha) without performing git fetch/checkout
      or running the bench. Useful for prompt-engineering / smoke
      tests. Default: false.
