name: gemm_tuning
family: deep_kernel
cost_minutes_p50: 20.0
cost_minutes_p75: 45.0
expected_gain_pct: [5.0, 20.0]
accuracy_risk: 0.10
crash_risk: 0.10
prerequisites:
  - baseline
  - roofline
requires_lanes:
  - server_lifecycle
  - workspace_mutation
  - benchmark_lane
allowed_tools:
  - emit_intent
  - Read
  - Bash
  - Edit
side_effects:
  - workspace_write
  - server_restart
  - writes_config
preferred_backend: claude
preferred_model: claude-opus-4-7
max_turns: 25
lease_ttl_sec: 5400
description: >
  Deterministic GEMM dispatch tuning (forge-gemm-tune) or legacy GEAK A8W8
  block-scale workflow. Forge supports bf16/fp8/fp4 MoE + dense, sglang + vllm.
  Backend selected via GEMM_TUNING_BACKEND or KERNEL_OPT_BACKEND_ORDER.
pipeline_phase: deep
typical_runtime_min: 20.0
applicable_when:
  - "framework in ('sglang', 'vllm')"
  - "(precision == 'fp8' or is_moe or precision in ('bf16', 'fp4'))"
  - "operator_bottleneck_identified or phase == 'deep'"
