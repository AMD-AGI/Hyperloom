name: gemm_tuning
family: deep_kernel
cost_minutes_p50: 20.0
cost_minutes_p75: 45.0
expected_gain_pct: [5.0, 20.0]
accuracy_risk: 0.10
crash_risk: 0.10
prerequisites:
  - baseline
  - roofline
requires_lanes:
  - server_lifecycle
  - workspace_mutation
  - benchmark_lane
allowed_tools:
  - emit_intent
  - Read
  - Bash
  - Edit
side_effects:
  - workspace_write
  - server_restart
  - writes_config
preferred_backend: forge
preferred_model: null
max_turns: 25
lease_ttl_sec: 5400
description: >
  GEMM dispatch tuning via forge-gemm-tune or legacy GEAK. Forge supports
  bf16/fp8/fp4 MoE+dense on sglang/vllm; backend selected by
  GEMM_TUNING_BACKEND.
pipeline_phase: deep
typical_runtime_min: 20.0
applicable_when:
  # forge handles any precision (bf16/fp16/fp8/fp4/mxfp4), dense or MoE; do not
  # pre-filter on precision/MoE (real e2e KEEPs include bf16 dense). Gate only
  # on a supported framework + the deep phase.
  - "framework in ('sglang', 'vllm', 'vllm-aiter')"
  - "operator_bottleneck_identified or phase == 'deep'"
