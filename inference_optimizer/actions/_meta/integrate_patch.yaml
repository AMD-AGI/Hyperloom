name: integrate_patch
family: shallow
cost_minutes_p50: 10.0
cost_minutes_p75: 25.0
expected_gain_pct: [0.0, 12.0]
accuracy_risk: 0.10
crash_risk: 0.15
prerequisites:
  - specialist
requires_lanes:
  - server_lifecycle
  - workspace_mutation
  - benchmark_lane
allowed_tools:
  # integrate_patch is a deterministic Python executor (max_turns set
  # for surface compatibility; the action has no LLM driver). The tool
  # list is declarative — the existing
  # ``test_actions_with_workspace_lane_have_edit_tool`` invariant
  # requires ``Edit`` whenever ``workspace_mutation`` is in
  # ``requires_lanes``; the executor itself shells out to
  # ``git apply`` via Bash and never uses Edit. Keeping Edit in the
  # whitelist satisfies the invariant + lets a future repair-loop
  # specialist (PR-A7+) inherit the same yaml's tool surface if we
  # ever attach an LLM repair pass to a failed integrate.
  - emit_intent
  - Read
  - Bash
  - Edit
  - Write
side_effects:
  - workspace_write
  - server_restart
  - launches_server
  - reads_server
  - writes_results
preferred_backend: claude
preferred_model: claude-opus-4-7
max_turns: 4
lease_ttl_sec: 3600
description: "Apply specialist worktree patches to framework_source_roots, restart server, run throughput + accuracy gate, KEEP or REVERT. EXPLORE-phase deterministic executor."
pipeline_phase: explore
typical_runtime_min: 10.0
applicable_when:
  - "phase == 'EXPLORE'"
  - "specialist_done_with_patches_pending"
# PR-A1 / PR-A4 (Arbor dispatch into Hyperloom):
#
# IntegratePatchExecutor reads ``params.specialist_task_id`` to look up the
# specialist's worktree under ``runs/specialist/<task_id>/worktree/``, applies
# its ``patches: [paths]`` to the framework source roots via ``git apply``,
# restarts the inference server, runs a Magpie throughput benchmark plus the
# GSM8K accuracy gate, and emits KEEP / REVERT.
#
# Inv-5.1 update (this PR): specialists in EXPLORE may now write source
# patches, but only into ``runs/specialist/<task_id>/worktree/``; the
# physical ``git apply`` against framework_source_roots is done by THIS
# action (orchestrator-side, serving-lane-locked), preserving Inv-3 single
# tenant GPU + Coordinator-as-sole-fact-layer-writer.
params_schema:
  specialist_task_id:
    type: string
    description: |
      Required. Task id of the completed specialist whose worktree contains
      the patches to integrate. The executor reads
      ``runs/specialist/<task_id>/specialist_done.json`` and
      ``runs/specialist/<task_id>/patches/`` to materialise the patch set.
  patches:
    type: list
    description: |
      Optional. Explicit list of patch file paths (relative to the
      specialist workspace or absolute under SESSION_DIR) to apply. When
      omitted, the executor falls back to ``specialist_done.patches_written``.
      Each entry must be a unified diff file produced inside the
      specialist's worktree (``git diff > patches/NNN_<slug>.patch``).
  config_changes:
    type: object
    description: |
      Optional. Extra ``env_var -> value`` map to layer on top of the
      patch application, mirroring Arbor's ``CompletionReport.config_changes``.
      Applied to the server launch env BEFORE restart; reverted with the
      patches if the gate fails.
  keep_threshold_pct:
    type: number
    description: |
      Optional. KEEP threshold in percent (default 0.2). The gated
      throughput must improve at least this much over baseline_tput to be
      kept; otherwise REVERT.
  accuracy_baseline:
    type: object
    description: |
      Optional. Per-(task, metric) baseline scores read from
      ``$SESSION_DIR/baseline_accuracy.json``. Defaults to the file when
      omitted; REVERT fires on any metric dropping >1pp.
