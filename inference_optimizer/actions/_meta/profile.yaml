name: profile
family: analysis
cost_minutes_p50: 3.0
cost_minutes_p75: 6.0
expected_gain_pct: [0.0, 0.0]
accuracy_risk: 0.0
crash_risk: 0.05
prerequisites:
  - baseline
requires_lanes:
  - profile_lane
allowed_tools:
  - emit_intent
  - Read
  - Bash
side_effects:
  - reads_server
  - writes_results
preferred_backend: claude
preferred_model: claude-opus-4-7
max_turns: 15
lease_ttl_sec: 2700
description: "Run torch_profiler against the running server to produce a hot-kernel trace; required before any kernel-opt action."
pipeline_phase: analysis
typical_runtime_min: 3.0
applicable_when:
  - "baseline_tput > 0"
  - "trace_path == ''"
# Descriptive — see baseline.yaml. ProfileExecutor inherits BaselineExecutor
# and consumes the same params surface, so the same script/result_dir
# overrides apply when the profile invocation also lands on a leaky script.
params_schema:
  benchmark_script:
    type: string
    description: |
      Bare *.sh file name. Same semantics as baseline.params_schema.
      benchmark_script.
  result_dir:
    type: string
    description: |
      Absolute or workspace-relative path forwarded as $RESULT_DIR for
      this profile subprocess.
