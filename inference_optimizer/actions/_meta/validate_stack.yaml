name: validate_stack
family: prep
cost_minutes_p50: 8.0
cost_minutes_p75: 15.0
expected_gain_pct: [0.0, 0.0]
accuracy_risk: 0.0
crash_risk: 0.05
prerequisites:
  - baseline
requires_lanes:
  - server_lifecycle
  - benchmark_lane
allowed_tools:
  - emit_intent
  - Read
  - Bash
side_effects:
  - launches_server
  - reads_server
  - writes_results
preferred_backend: claude
preferred_model: claude-opus-4-7
max_turns: 20
lease_ttl_sec: 4200
description: "Apply ALL KEEP'd entries in optimization_stack on a fresh server, rebench, and write cumulative_gain_validated."
pipeline_phase: validate
typical_runtime_min: 8.0
applicable_when:
  - "baseline_tput > 0"
  - "optimization_stack_has_unvalidated_keeps"
# Descriptive — see baseline.yaml. validate_stack re-enters BaselineExecutor
# after pre-rendering its own YAML; both render passes honor these knobs.
params_schema:
  benchmark_script:
    type: string
    description: |
      Bare *.sh file name. Force-pin Magpie script for the re-baseline
      run, same semantics as baseline.params_schema.benchmark_script.
  result_dir:
    type: string
    description: |
      Absolute or workspace-relative path forwarded as $RESULT_DIR for
      the validate_stack subprocess.
