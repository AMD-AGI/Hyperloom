name: comm_optimization
family: long
cost_minutes_p50: 60.0
cost_minutes_p75: 120.0
expected_gain_pct: [3.0, 15.0]
accuracy_risk: 0.05
crash_risk: 0.10
prerequisites:
  - profile
requires_lanes:
  - server_lifecycle
  - workspace_mutation
  - benchmark_lane
allowed_tools:
  - emit_intent
  - Read
  - Bash
  - Edit
side_effects:
  - workspace_write
  - server_restart
preferred_backend: claude
preferred_model: claude-opus-4-7
max_turns: 30
lease_ttl_sec: 7200
applicable_when:
  - "tp_size > 1"
  - "comm_overhead_pct > 10"
