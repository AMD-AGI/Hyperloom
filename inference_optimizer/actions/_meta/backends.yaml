name: backends
family: shallow
cost_minutes_p50: 8.0
cost_minutes_p75: 15.0
expected_gain_pct: [3.0, 12.0]
accuracy_risk: 0.0
crash_risk: 0.10
prerequisites:
  - baseline
requires_lanes:
  - server_lifecycle
  - benchmark_lane
allowed_tools:
  - emit_intent
  - Read
  - Bash
  - Edit
side_effects:
  - launches_server
  - writes_config
  - writes_results
preferred_backend: claude
preferred_model: claude-opus-4-7
max_turns: 30
lease_ttl_sec: 7200
description: "A/B test attention/moe/sampling backends (aiter/triton/flash); <=5 variants + <=4 combos per round (IR-26 picks next). Override via params.grid / synergy_groups / max_candidates_per_round=0."
pipeline_phase: explore
typical_runtime_min: 8.0
applicable_when:
  - "baseline_tput > 0"
# Descriptive — see baseline.yaml. Each grid variant inherits these knobs
# so the script pinning persists across phase-1 and phase-2 (synergy)
# variants without an extra round-trip through the orchestrator.
params_schema:
  benchmark_script:
    type: string
    description: |
      Bare *.sh file name. Force-pin Magpie script for every variant in
      this grid run; same semantics as baseline.params_schema.benchmark_script.
  result_dir:
    type: string
    description: |
      Absolute or workspace-relative path forwarded as $RESULT_DIR for
      every variant. Coordinator defaults RESULT_DIR to the variant slot;
      only override when redirecting to a known leak destination.
