# IR-7 (Saturday May 2026 / report iter 19 lesson):
#
# This action is a thin wrapper that dispatches the
# ``session_steward_specialist`` domain. The Coordinator may also
# enqueue this internally on plateau detection, bypassing PolicyGate;
# the LLM-side propose path is allowed but throttled via
# ``assess_remaining_gaps_throttle`` so it cannot spam more than one
# steward run per
# ``INFERENCE_OPTIMIZER_ASSESSMENT_MIN_INTERVAL_SEC`` window (default
# 1800s).
#
# The wrapper's only required param is ``reason`` (free-form string
# explaining why the LLM thought a steward assessment was useful);
# Coordinator-enqueued tasks set ``reason='coordinator_plateau'``.
# ``params.domain`` and ``params.gap_canonical_id`` are auto-filled by
# the executor wiring; LLM callers should NOT supply them.
params_schema:
  reason:
    type: string
    description: |
      Required. Human-readable reason for invoking the steward. Recognised:
      ``llm_uncertainty`` (LLM thinks plateau is near but PolicyGate hasn't
      fired plateau yet), ``coordinator_plateau`` (set by Coordinator when
      the plateau judge triggered), ``operator_request`` (resume/recovery).
