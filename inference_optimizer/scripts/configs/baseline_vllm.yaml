# Magpie baseline benchmark config for vLLM.
# Used as the default vLLM benchmark config; the inference_optimizer
# pipeline overrides `benchmark.model` and injects `benchmark.runner_type`
# at runtime (see baseline_sglang.yaml header for the full rationale).

benchmark:
  framework: vllm
  # benchmark_script: vllm_mi300x.sh  # uncomment to force a specific Magpie script
  model: /wekafs/models/Qwen-Qwen3-8B  # OVERRIDDEN at runtime; see header.
  precision: bf16
  run_mode: local

  envs:
    TP: 8
    CONC: 64
    ISL: 256
    OSL: 256
    RANDOM_RANGE_RATIO: 1
    MAX_MODEL_LEN: 8192
    # ROCR_VISIBLE_DEVICES injected at runtime by baseline.py
    # (`0..TP-1`); export `ROCR_VISIBLE_DEVICES=...` to override.
    PATH: "/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    # Kimi-K2.6 int4 known-good serving config (kimi-2.6-vllm.md). Without
    # --max-num-seqs 256, full cudagraph capture at batch>=512 over-allocates
    # Triton LDS (>64 KiB) and the engine core dies at startup. Appended to the
    # vllm serve command via EXTRA_VLLM_ARGS (vllm_mi300x.sh).
    EXTRA_VLLM_ARGS: "--block-size 64 --no-enable-prefix-caching --max-num-seqs 256 --mm-encoder-tp-mode data"
    # Corrected int4 W4A16 fused-MoE config (BLOCK_SIZE_N capped to 128) so the
    # E=384,N=256 kernel fits MI300X 64 KiB LDS. Without this the shipped config
    # over-allocates (69632 B) and EngineCore dies at cudagraph capture.
    VLLM_TUNED_CONFIG_FOLDER: "/wekafs/chaox/test_results/kimi_k2.6_20260617/vllm_tuned_configs"

  gpu_selection:
    auto: false                # executor pins via ROCR_VISIBLE_DEVICES at runtime

  timeout_seconds: 2400        # 40 min hard cap

  profiler:
    torch_profiler:
      enabled: false
    system_profiler:
      enabled: false
    tracelens:
      enabled: false
