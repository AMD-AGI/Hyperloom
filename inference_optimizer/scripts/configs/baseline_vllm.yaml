# Magpie baseline benchmark config for vLLM / MI300X.
# Used as the single-node vLLM smoke config; the inference_optimizer
# pipeline overrides `benchmark.model` at runtime (see baseline_sglang.yaml
# header for the full rationale).

benchmark:
  framework: vllm
  model: /wekafs/models/Qwen-Qwen3-8B  # OVERRIDDEN at runtime; see header.
  precision: bf16
  run_mode: local

  envs:
    TP: 1
    CONC: 8
    ISL: 256
    OSL: 256
    RANDOM_RANGE_RATIO: 1
    MAX_MODEL_LEN: 8192
    ROCR_VISIBLE_DEVICES: "1"
    PATH: "/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

  gpu_selection:
    auto: false

  benchmark_script: vllm_mi300x.sh
  timeout_seconds: 600

  profiler:
    torch_profiler:
      enabled: false
    system_profiler:
      enabled: false
    tracelens:
      enabled: false
