# Magpie baseline benchmark config for vLLM.
# Used as the default vLLM benchmark config; the inference_optimizer
# pipeline overrides `benchmark.model` and injects `benchmark.runner_type`
# at runtime (see baseline_sglang.yaml header for the full rationale).

benchmark:
  framework: vllm
  # benchmark_script: vllm_mi300x.sh  # uncomment to force a specific Magpie script
  model: /wekafs/models/Qwen-Qwen3-8B  # OVERRIDDEN at runtime; see header.
  precision: bf16
  run_mode: local

  envs:
    TP: 8
    CONC: 64
    ISL: 256
    OSL: 256
    RANDOM_RANGE_RATIO: 1
    MAX_MODEL_LEN: 8192
    # ROCR_VISIBLE_DEVICES injected at runtime by baseline.py
    # (`0..TP-1`); export `ROCR_VISIBLE_DEVICES=...` to override.
    PATH: "/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

  gpu_selection:
    auto: false                # executor pins via ROCR_VISIBLE_DEVICES at runtime

  timeout_seconds: 2400        # 40 min hard cap

  profiler:
    torch_profiler:
      enabled: false
    system_profiler:
      enabled: false
    tracelens:
      enabled: false
