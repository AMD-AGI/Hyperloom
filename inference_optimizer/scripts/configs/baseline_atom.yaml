# Magpie baseline benchmark config for Atom.
# Used by inference_optimizer.orchestrator.action_executors.baseline /
# sweep / backends / params as the default benchmark config when
# $FRAMEWORK=atom.
#
# Two fields are FALLBACK ONLY and overridden at run time by the executor:
#   - `benchmark.model`     <- --model / $MODEL_PATH
#   - `benchmark.runner_type` <- --gpu-type / $GPU_TYPE / rocm-smi probe
# So the hardcoded `model:` below is just a placeholder; `runner_type:` is
# deliberately omitted so Magpie auto-detects the GPU when this YAML is
# used directly with `Magpie -v benchmark`.
#
# `benchmark_script:` is also intentionally NOT set: with runner_type fed
# in at run time, Magpie's resolver picks `atom_{runner_type}.sh`
# (e.g. atom_mi355x.sh).
#
# IMPORTANT — atom-specific constraints (see atom_boost_tutorials.md
# and SKILL.md IR-8):
#   - precision is fp8 by default (DeepSeek-R1 / GLM5 are shipped FP8).
#   - EXTRA_ATOM_ARGS includes --trust-remote-code because most production
#     atom-served models ship their modeling code in the model dir
#     (e.g. modeling_deepseek.py + configuration_deepseek.py).
#   - profile / roofline / TraceLens DO work on atom. The Magpie atom
#     wrapper (atom_mi*x.sh) bridges PROFILE=1 to atom's --torch-profiler-dir
#     CLI flag and the InferenceX bench client auto-POSTs /start_profile +
#     /stop_profile. Set PROFILE=1 (env) or use profile_atom.yaml (which
#     pre-flips the profiler block below to true) for the profile /
#     roofline executors. atom writes *.pt.trace.json.gz under
#     <torch_profiler_dir>/rank_<N>/ which TraceLens consumes unchanged.
#   - Multi-node is unsupported; cli.py rejects --framework atom + --nodes>=2.
#   - Kernel-agent + framework-agent + profile / roofline / TraceLens
#     all run on atom after atom_plan/ phases 1-3. The only remaining
#     auto-tighten in cli.py is the --nodes>=2 fail-fast guard
#     (_apply_atom_auto_tighten / _assert_atom_single_node); --no-kernel
#     and --no-framework are NO LONGER auto-flipped.

benchmark:
  framework: atom
  # benchmark_script: atom_mi355x.sh  # uncomment to force a specific Magpie script
  model: /wekafs/models/Qwen-Qwen3-8B  # OVERRIDDEN at runtime; see header.
  precision: fp8
  run_mode: local

  envs:
    TP: 8                      # full-node default; env can override
    CONC: 32                   # production throughput default; env can override
    ISL: 128
    OSL: 128
    RANDOM_RANGE_RATIO: 0.8
    MAX_MODEL_LEN: 4096        # atom-side max context (VRAM-sensitive on MI355X)
    EXTRA_ATOM_ARGS: "--trust-remote-code"
    # ROCR_VISIBLE_DEVICES is INTENTIONALLY NOT SET here. The executor
    # (`_materialize_config_with_envs` in baseline.py) injects it at
    # runtime as `0..TP-1` (or whatever the operator exports), which
    # keeps the YAML host-agnostic. To pin to specific GPUs, export
    # `ROCR_VISIBLE_DEVICES=4,5,6,7` before launch — env always wins.
    # NOTE: do NOT set HIP_VISIBLE_DEVICES — on this stack HIP_VISIBLE
    # makes torch.cuda.is_available() return False even when device_count=1.

    # The benchmark script uses bare `python3`; without putting venv first
    # the subprocess picks /usr/bin/python3 (no torch with ROCm) and atom
    # raises "No accelerator". Force PATH ahead of system.
    PATH: "/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

  gpu_selection:
    auto: false                # executor pins via ROCR_VISIBLE_DEVICES at runtime

  timeout_seconds: 3600        # 60 min hard cap — atom cold start (aiter MoE
                               # JIT + weights load) can hit ~6 min on first run

  profiler:
    # baseline doesn't profile — profile_atom.yaml flips these to
    # true. After atom_plan/ phase 1 the atom wrapper (atom_mi*x.sh)
    # bridges PROFILE=1 to --torch-profiler-dir, so atom's profile
    # executor produces the same chrome traces TraceLens consumes
    # for sglang / vllm. Set PROFILE=1 here or use profile_atom.yaml
    # to enable.
    torch_profiler:
      enabled: false
    system_profiler:
      enabled: false
    tracelens:
      enabled: false
