# Magpie profile config for vLLM.
# Same shape as baseline_vllm.yaml but with torch_profiler ON so the run
# produces a torch_trace dir downstream consumers (Kernel agent /
# TraceLens) can read. `benchmark.model` and `benchmark.runner_type` are
# OVERRIDDEN at runtime — see baseline_sglang.yaml header for the full
# rationale.
#
# TraceLens integration (#126): profiler is configured for:
#   1. Graph capture tracing (--profiler-config.capture_torch_profiler_dir)
#   2. Detailed annotations (--profiler-config.detailed_trace_annotation)
#   3. Steady-state windowing (--profiler-config.delay_iterations/max_iterations)
# These are required for TraceLens fusion / roofline analysis.

benchmark:
  framework: vllm
  # benchmark_script: vllm_mi300x.sh  # uncomment to force a specific Magpie script
  model: /wekafs/models/Qwen-Qwen3-8B  # OVERRIDDEN at runtime; see header.
  precision: bf16
  run_mode: local

  envs:
    TP: 1
    CONC: 8
    ISL: 256
    OSL: 256
    RANDOM_RANGE_RATIO: 1
    MAX_MODEL_LEN: 8192
    ROCR_VISIBLE_DEVICES: "1"
    PATH: "/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    # --- Profiler: vLLM graph capture + annotations + steady-state (#126) ---
    # These flags are appended to the vllm serve command via EXTRA_VLLM_ARGS.
    # delay_iterations and max_iterations control the steady-state window:
    #   delay = 5 * CONC (skip warmup); max = clamp(16 * OSL / CONC, 4, 64)
    # capture_torch_profiler_dir enables graph-capture tracing (issue #126
    # §3.1.4 item 1) — TraceLens needs this dir to resolve the actual
    # kernels executed under cudagraph mode (vs the eager prefill kernels).
    # All values are overridden at runtime by _materialize_config_with_envs.
    EXTRA_VLLM_ARGS: "--profiler-config.detailed_trace_annotation True --profiler-config.ignore_frontend True"
    # vLLM timeout must be extended during profiling (graph capture is slow)
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1200"
    # --- Profile mode: cap prompts to reduce trace size ---
    PROFILE: "1"

  gpu_selection:
    auto: false

  timeout_seconds: 900               # profile adds ~30-90s vs plain baseline

  profiler:
    torch_profiler:
      enabled: true                  # ← key difference vs baseline yaml
    system_profiler:
      enabled: false
    tracelens:
      enabled: false                 # we run TraceLens analysis ourselves
                                     # via Hyperloom/kernel-agent tools
