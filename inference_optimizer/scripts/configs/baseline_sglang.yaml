# Magpie baseline benchmark config for SGLang.
# Used by inference_optimizer.orchestrator.action_executors.baseline /
# sweep / backends / params as the default benchmark config.
#
# Two fields are FALLBACK ONLY and overridden at run time by the executor:
#   - `benchmark.model`     <- --model / $MODEL_PATH
#   - `benchmark.runner_type` <- --gpu-type / $GPU_TYPE / rocm-smi probe
# So the hardcoded `model:` below is just a placeholder; `runner_type:` is
# deliberately omitted so Magpie auto-detects the GPU when this YAML is
# used directly with `Magpie -v benchmark`.
#
# `benchmark_script:` is also intentionally NOT set: with runner_type fed
# in at run time, Magpie's resolver picks `{framework}_{runner_type}.sh`
# (e.g. sglang_mi300x.sh / sglang_mi355x.sh). To force a specific script
# during manual debugging, uncomment the line under `framework:` below.
#
# Local mode (no Docker) — the orchestrator already runs inside the sglang
# container; no need to nest one.

benchmark:
  framework: sglang
  # benchmark_script: sglang_mi300x.sh  # uncomment to force a specific Magpie script
  model: /wekafs/models/Qwen-Qwen3-8B  # OVERRIDDEN at runtime; see header.
  precision: bf16
  run_mode: local

  envs:
    TP: 8                      # full-node default; env can override
    CONC: 64                   # production throughput default; env can override
    ISL: 256
    OSL: 256
    RANDOM_RANGE_RATIO: 1
    MAX_MODEL_LEN: 8192        # smaller context = faster warmup
    # ROCR_VISIBLE_DEVICES is INTENTIONALLY NOT SET here. The executor
    # (`_materialize_config_with_envs` in baseline.py) injects it at
    # runtime as `0..TP-1` (or whatever the operator exports), which
    # keeps the YAML host-agnostic. To pin to specific GPUs, export
    # `ROCR_VISIBLE_DEVICES=4,5,6,7` before launch — env always wins.
    # NOTE: do NOT set HIP_VISIBLE_DEVICES — on this stack HIP_VISIBLE
    # makes torch.cuda.is_available() return False even when device_count=1.

    # The benchmark script uses bare `python3`; without putting venv first
    # the subprocess picks /usr/bin/python3 (no torch with ROCm) and sglang
    # raises "No accelerator". Force PATH ahead of system.
    PATH: "/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

  gpu_selection:
    auto: false                # executor pins via ROCR_VISIBLE_DEVICES at runtime

  timeout_seconds: 7200        # 120 min hard cap (Qwen-32B TP=1 CONC=64 ISL/OSL=1024 NUM_PROMPTS=320 needs ~85 min incl. server boot)

  profiler:
    torch_profiler:
      enabled: false           # skip profiler for the smoke run; baseline
                               # only needs throughput/latency numbers
    system_profiler:
      enabled: false
    tracelens:
      enabled: false
