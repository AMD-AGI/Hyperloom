# Magpie profile config for SGLang.
# Same shape as baseline_sglang.yaml but with torch_profiler ON so the run
# produces a torch_trace dir downstream consumers (Kernel agent /
# TraceLens) can read. `benchmark.model` and `benchmark.runner_type` are
# OVERRIDDEN at runtime — see baseline_sglang.yaml header for the full
# rationale.
#
# TraceLens integration (#126): profiler is configured for:
#   1. Graph capture tracing (--enable-profile-cuda-graph)
#   2. Shape + callstack annotations (SGLANG_PROFILE_* env vars)
#   3. Steady-state windowing (PROFILE_EXTRA_BODY start_step/num_steps)
# These are required for TraceLens fusion / roofline analysis.
#
# Note: upstream issue #126 also lists
# `--enable-shape-discovery-for-cuda-graph-profile`, but the SGLang
# build on the current validation nodes rejects it ("unrecognized
# arguments"). It stays out of the default args until the deployed
# SGLang accepts it; override via EXTRA_SGLANG_ARGS or the materialized
# ASSET_ROOT yaml when running on a newer SGLang.

benchmark:
  framework: sglang
  # benchmark_script: sglang_mi300x.sh  # uncomment to force a specific Magpie script
  model: /wekafs/models/Qwen-Qwen3-8B  # OVERRIDDEN at runtime; see header.
  precision: bf16
  run_mode: local

  envs:
    TP: 8
    CONC: 64
    ISL: 256
    OSL: 256
    RANDOM_RANGE_RATIO: 1
    MAX_MODEL_LEN: 8192
    # ROCR_VISIBLE_DEVICES injected at runtime by baseline.py
    # (`0..TP-1`); export `ROCR_VISIBLE_DEVICES=...` to override.
    PATH: "/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    # --- Profiler: shape + callstack annotations (#126) ---
    SGLANG_PROFILE_WITH_STACK: "true"
    SGLANG_PROFILE_RECORD_SHAPE: "true"
    # --- Profiler: graph capture (#126; shape-discovery flag dropped
    # because the deployed SGLang argparse rejects it) ---
    EXTRA_SGLANG_ARGS: "--enable-profile-cuda-graph"
    # --- Profiler: steady-state window via extra_body (#194) ---
    # PROFILE_EXTRA_BODY is consumed by InferenceX benchmark_lib.sh to inject
    # into the benchmark request body. start_step skips warmup, num_steps
    # limits trace size. Values are overridden at runtime by
    # _materialize_config_with_envs using the TraceLens magpie skill
    # formulas (issue #194):
    #   num_steps   (max_iters)   = min(1024, max(256, OSL * 16 / CONC))
    #   start_step  (delay_iters) = OSL * (RANDOM_RANGE_RATIO + 1) * 3
    #                                 - max_iters / 2
    PROFILE_EXTRA_BODY: '{"shape_discovery": true, "roofline_annotations": true, "start_step": 40, "num_steps": 16, "merge_profiles": false, "profile_by_stage": false}'
    # --- Profile mode: cap prompts to reduce trace size ---
    PROFILE: "1"

  gpu_selection:
    auto: false                # executor pins via ROCR_VISIBLE_DEVICES at runtime

  timeout_seconds: 2400              # 40 min hard cap (profile adds ~30-90s vs plain baseline)

  profiler:
    torch_profiler:
      enabled: true                  # ← key difference vs baseline yaml
    system_profiler:
      enabled: false
    tracelens:
      enabled: false                 # we run TraceLens analysis ourselves
                                     # via Hyperloom/kernel-agent tools
