name: Pylint

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    branches:
      - main
      - dev
      - "release/**"
    paths-ignore:
      - 'docs/**'
      - 'slides/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.cursor/**'
      - '.github/workflows/pytest.yaml'
      - '.github/workflows/lint.yaml'
      - '.github/workflows/secret-scan.yaml'
  pull_request:
    branches:
      - main
      - dev
      - "release/**"
    paths-ignore:
      - 'docs/**'
      - 'slides/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.cursor/**'
      - '.github/workflows/pytest.yaml'
      - '.github/workflows/lint.yaml'
      - '.github/workflows/secret-scan.yaml'

jobs:
  pylint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        run: |
          uv pip install --system -e '.[test]'
          uv pip install --system pylint
      - name: Run pylint (fail only on errors)
        run: |
          # --errors-only restricts failures to E/F messages (real errors),
          # not style/convention. import-error / no-name-in-module are disabled
          # because optional GPU / SDK deps are not installed in CI and would
          # otherwise produce spurious failures.
          pylint inference_optimizer \
            --errors-only \
            --disable=import-error,no-name-in-module
