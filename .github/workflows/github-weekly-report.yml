name: Weekly GitHub Issues Report

on:
  schedule:
    # Every Thursday at 5:00 PM UTC
    # Adjust for your timezone:
    #   PST (UTC-8)    → cron: '0 1 * * 5'
    #   EST (UTC-5)    → cron: '0 22 * * 4'
    #   IST (UTC+5:30) → cron: '30 11 * * 4'
    - cron: '0 17 * * 4'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  weekly-issues-report:
    runs-on: ubuntu-latest
    permissions:
      issues: read      # Read repo issues
      contents: read    # Read repo contents

    steps:
      # ── Step 1: Fetch issues and generate report ───────────────────────────
      - name: Generate Issue Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
        run: |
          python3 << 'EOF'
          import os, json, urllib.request, datetime

          token = os.environ["GH_TOKEN"]
          repo  = os.environ["REPO"]

          headers = {
              "Authorization": f"token {token}",
              "Accept": "application/vnd.github+json"
          }

          def gh_get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          # Fetch up to 100 issues (open + closed), excluding pull requests
          url    = (f"https://api.github.com/repos/{repo}/issues"
                    f"?state=all&per_page=100&sort=updated&direction=desc")
          issues = [i for i in gh_get(url) if "pull_request" not in i]

          now = datetime.datetime.utcnow()

          def relative_time(iso):
              dt   = datetime.datetime.strptime(iso, "%Y-%m-%dT%H:%M:%SZ")
              diff = now - dt
              h    = int(diff.total_seconds() // 3600)
              d    = diff.days
              if h < 24:   return f"{h}h ago"
              elif d == 1: return "1d ago"
              else:        return f"{d}d ago"

          open_issues   = [i for i in issues if i["state"] == "open"]
          closed_issues = [i for i in issues if i["state"] == "closed"]

          week_str  = now.strftime("%B %d, %Y")
          repo_name = repo.split("/")[-1]
          repo_url  = f"https://github.com/{repo}/issues"

          # ── Build issue rows for markdown table ────────────────────────────
          def issue_rows_md(issue_list):
              rows = ""
              for i in issue_list:
                  num    = i["number"]
                  title  = i["title"][:60] + ("…" if len(i["title"]) > 60 else "")
                  author = i["user"]["login"]
                  status = i["state"]
                  upd    = relative_time(i["updated_at"])
                  url    = i["html_url"]
                  badge  = "🔴 open" if status == "open" else "✅ closed"
                  rows  += f"| [#{num}]({url}) | {title} | {author} | {badge} | {upd} |\n"
              return rows

          # ── Build the full markdown summary ───────────────────────────────
          summary = f"""# 📋 Weekly Issues Report — {repo_name}
**Week of {week_str}** &nbsp;|&nbsp; [View Full Board]({repo_url})

---

## 📊 Summary

| | Count |
|---|---|
| 🔴 Open Issues | **{len(open_issues)}** |
| ✅ Closed Issues | **{len(closed_issues)}** |
| 📁 Total Issues | **{len(issues)}** |

---

## 🔴 Open Issues ({len(open_issues)})

| # | Title | Author | Status | Updated |
|---|-------|--------|--------|---------|
{issue_rows_md(open_issues)}
---

## ✅ Closed Issues ({len(closed_issues)})

| # | Title | Author | Status | Updated |
|---|-------|--------|--------|---------|
{issue_rows_md(closed_issues)}
---

> 🤖 Auto-generated by GitHub Actions every Thursday 5PM &nbsp;|&nbsp; [View All Issues]({repo_url})
"""

          with open("/tmp/summary.md", "w") as f:
              f.write(summary)

          print("Report generated successfully.")
          print(f"  Open:   {len(open_issues)}")
          print(f"  Closed: {len(closed_issues)}")
          print(f"  Total:  {len(issues)}")
          EOF

      # ── Step 2: Write report to GitHub Actions Summary page ───────────────
      - name: Publish to Actions Summary
        run: cat /tmp/summary.md >> $GITHUB_STEP_SUMMARY
