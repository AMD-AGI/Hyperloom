name: github-weekly-report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-issues-report:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Generate Issue Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
        run: |
          python3 <<'PYEOF'
          import os, json, urllib.request, datetime

          token = os.environ["GH_TOKEN"]
          repo  = os.environ["REPO"]

          headers = {
              "Authorization": f"token {token}",
              "Accept": "application/vnd.github+json",
          }

          def gh_get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          # Fetch all issues (open + closed) with pagination, excluding PRs.
          issues = []
          page = 1
          while True:
              url = (
                  f"https://api.github.com/repos/{repo}/issues"
                  f"?state=all&per_page=100&page={page}"
                  f"&sort=updated&direction=desc"
              )
              batch = gh_get(url)
              if not batch:
                  break
              issues.extend(i for i in batch if "pull_request" not in i)
              if len(batch) < 100:
                  break
              page += 1

          now = datetime.datetime.utcnow()

          def relative_time(iso):
              dt   = datetime.datetime.strptime(iso, "%Y-%m-%dT%H:%M:%SZ")
              diff = now - dt
              h    = int(diff.total_seconds() // 3600)
              d    = diff.days
              if h < 24:
                  return f"{h}h ago"
              if d == 1:
                  return "1d ago"
              return f"{d}d ago"

          open_issues   = [i for i in issues if i["state"] == "open"]
          closed_issues = [i for i in issues if i["state"] == "closed"]

          week_str  = now.strftime("%B %d, %Y")
          repo_name = repo.split("/")[-1]
          repo_url  = f"https://github.com/{repo}/issues"
          
          def label_value(labels, prefix):
              vals = sorted({
                  n.split(":", 1)[1].strip()
                  for n in labels
                  if n.lower().startswith(prefix)
              })
              return ", ".join(vals) if vals else "—"

          def issue_rows_md(issue_list):
              rows = []
              for i in issue_list:
                  num     = i["number"]
                  raw     = i["title"]
                  title   = raw[:60] + ("…" if len(raw) > 60 else "")
                  title   = title.replace("|", "\\|")
                  author  = i["user"]["login"]
                  upd     = relative_time(i["updated_at"])
                  url     = i["html_url"]
                  badge   = "🔴 open" if i["state"] == "open" else "✅ closed"
                  labels  = [l["name"] for l in i.get("labels", [])]
                  release = label_value(labels, "release:")
                  type_   = label_value(labels, "type:")
                  rows.append(
                      f"| [#{num}]({url}) | {title} | {author} | {badge} | {release} | {type_} | {upd} |"
                  )
              return "\n".join(rows) if rows else "| _none_ |  |  |  |  |  |  |"

          summary = (
              f"# 📋 Weekly Issues Report - {repo_name}\n"
              f"**Week of {week_str}** | [View Full Board]({repo_url})\n"
              f"\n---\n\n"
              f"## 📊 Summary\n\n"
              f"| | Count |\n"
              f"|---|---|\n"
              f"| 🔴 Open Issues | **{len(open_issues)}** |\n"
              f"| ✅ Closed Issues | **{len(closed_issues)}** |\n"
              f"| 📁 Total Issues | **{len(issues)}** |\n"
              f"\n---\n\n"
              f"## 🔴 Open Issues ({len(open_issues)})\n\n"
              f"| # | Title | Author | Status | Release | Type | Updated |\n"
              f"|---|-------|--------|--------|---------|------|---------|\n"
              f"{issue_rows_md(open_issues)}\n"
              f"\n---\n\n"
              f"## ✅ Closed Issues ({len(closed_issues)})\n\n"
              f"| # | Title | Author | Status | Release | Type | Updated |\n"
              f"|---|-------|--------|--------|---------|------|---------|\n"
              f"{issue_rows_md(closed_issues)}\n"
              f"\n---\n\n"
              f"> 🤖 Auto-generated by GitHub Actions | "
              f"[View All Issues]({repo_url})\n"
          )

          with open("/tmp/summary.md", "w") as f:
              f.write(summary)

          print("Report generated successfully.")
          print(f"  Open:   {len(open_issues)}")
          print(f"  Closed: {len(closed_issues)}")
          print(f"  Total:  {len(issues)}")
          PYEOF

      - name: Publish to Actions Summary
        run: cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish report to sticky GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:  ${{ github.repository }}
        run: |
          set -euo pipefail

          TITLE="📋 Weekly Issues Report"

          # Find an existing report issue by exact title (stable across runs).
          EXISTING=$(gh issue list \
            --search "in:title \"$TITLE\"" \
            --state all \
            --limit 1 \
            --json number,state \
            --jq 'if length > 0 then "\(.[0].number) \(.[0].state)" else empty end' || true)

          if [ -n "$EXISTING" ]; then
            NUM="${EXISTING% *}"
            STATE="${EXISTING#* }"
            echo "Updating existing report issue #$NUM (state=$STATE)"
            gh issue edit "$NUM" --body-file /tmp/summary.md
            if [ "$STATE" = "CLOSED" ]; then
              gh issue reopen "$NUM"
            fi
            echo "issue-url=$(gh issue view "$NUM" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Creating new report issue"
            URL=$(gh issue create \
              --title "$TITLE" \
              --body-file /tmp/summary.md)
            echo "issue-url=$URL" >> "$GITHUB_STEP_SUMMARY"
          fi
