name: Pytest

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    branches:
      - main
      - dev
      - "release/**"
    paths-ignore:
      - 'docs/**'
      - 'slides/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.cursor/**'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/auto-label.yml'
  pull_request:
    branches:
      - main
      - dev
      - "release/**"
    paths-ignore:
      - 'docs/**'
      - 'slides/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.cursor/**'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/auto-label.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        run: |
          uv pip install --system -e '.[test]' pytest-cov pytest-xdist
      - name: Run pytest
        run: pytest -v --cov --cov-branch -n auto
