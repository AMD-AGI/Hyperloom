name: Auto Label Issues

on:
  issues:
    types: [opened]

env:
  REPO: ${{ github.repository }}

jobs:
  auto-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Rule-based labeling from template fields
        id: rules
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          LABELS=""

          # --- Detect target release from "Target release" dropdown ---
          if echo "$ISSUE_BODY" | grep -qi "Target release"; then
            release_val=$(echo "$ISSUE_BODY" | grep -A1 "Target release" | tail -1 | xargs)
            case "$release_val" in
              v0.2|v0.3|v0.4) LABELS="$LABELS,release:$release_val" ;;
            esac
          fi

          # --- Detect domain from "Optimization domain" dropdown ---
          if echo "$ISSUE_BODY" | grep -qi "Optimization domain"; then
            domain_val=$(echo "$ISSUE_BODY" | grep -A1 "Optimization domain" | tail -1 | xargs)
            case "$domain_val" in
              Inference) LABELS="$LABELS,domain:inference" ;;
              Training)  LABELS="$LABELS,domain:training" ;;
              Both)      LABELS="$LABELS,domain:inference,domain:training" ;;
            esac
          fi

          # --- Detect sub-domain from "Issue type" dropdown (bug report) ---
          if echo "$ISSUE_BODY" | grep -qi "Issue type"; then
            issue_type=$(echo "$ISSUE_BODY" | grep -A1 "Issue type" | tail -1 | xargs)
            case "$issue_type" in
              "MCP tool failure") LABELS="$LABELS,domain:mcp" ;;
              "UI issue")         LABELS="$LABELS,domain:ui" ;;
            esac
          fi

          # --- Detect entry point ---
          if echo "$ISSUE_BODY" | grep -qi "Hyperloom UI (PrimusClaw)"; then
            if ! echo "$LABELS" | grep -q "domain:ui"; then
              LABELS="$LABELS,domain:ui"
            fi
          fi

          # Clean up leading comma
          LABELS=$(echo "$LABELS" | sed 's/^,//')

          echo "rule_labels=$LABELS" >> "$GITHUB_OUTPUT"

          # Check if this issue came from a known template
          if echo "$ISSUE_BODY" | grep -qi "How were you running Hyperloom"; then
            echo "from_template=bug" >> "$GITHUB_OUTPUT"
          elif echo "$ISSUE_BODY" | grep -qi "Problem / use case"; then
            echo "from_template=feature" >> "$GITHUB_OUTPUT"
          else
            echo "from_template=none" >> "$GITHUB_OUTPUT"
          fi

      - name: LLM-based labeling
        id: llm
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          FROM_TEMPLATE: ${{ steps.rules.outputs.from_template }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "LLM_API_KEY not set, skipping LLM labeling"
            echo "llm_labels=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Truncate body to avoid token limits
          BODY_TRUNCATED=$(echo "$ISSUE_BODY" | head -c 3000)

          # Build the type instruction based on whether a template was used
          if [ "$FROM_TEMPLATE" = "none" ]; then
            TYPE_INSTRUCTION='- "kind": one of "kind:bug", "kind:feature", "kind:question", "kind:task", "kind:docs". Pick the best match.'
          else
            TYPE_INSTRUCTION='- "kind": leave as empty string (already determined by template).'
          fi

          PROMPT=$(cat <<PROMPT_END
          You are a GitHub issue classifier for Hyperloom, an AI-powered performance optimization platform for AMD GPUs.

          Analyze the following issue and return a JSON object with these fields:
          $TYPE_INSTRUCTION
          - "domains": array of applicable domains from ["domain:inference", "domain:training", "domain:mcp", "domain:ui"]. Can be empty.

          Issue title: $ISSUE_TITLE

          Issue body:
          $BODY_TRUNCATED

          Respond with ONLY the JSON object, no markdown fences, no explanation.
          PROMPT_END
          )

          RESPONSE=$(curl -sk https://oci-slc.primus-safe.amd.com/api/v1/llm-proxy/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LLM_API_KEY" \
            -d "$(jq -n \
              --arg prompt "$PROMPT" \
              '{
                model: "openai/gpt-5.2",
                messages: [{role: "user", content: $prompt}],
                temperature: 0,
                max_tokens: 200
              }')")

          LLM_OUTPUT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$LLM_OUTPUT" ]; then
            echo "LLM returned empty response"
            echo "llm_labels=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "LLM output: $LLM_OUTPUT"

          # Parse LLM JSON output
          TYPE_LABEL=$(echo "$LLM_OUTPUT" | jq -r '.kind // empty')
          DOMAIN_LABELS=$(echo "$LLM_OUTPUT" | jq -r '.domains[]? // empty' | paste -sd ',' -)

          LABELS=""
          [ -n "$TYPE_LABEL" ] && LABELS="$TYPE_LABEL"
          [ -n "$DOMAIN_LABELS" ] && LABELS="${LABELS:+$LABELS,}$DOMAIN_LABELS"

          echo "llm_labels=$LABELS" >> "$GITHUB_OUTPUT"

      - name: Apply labels
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          RULE_LABELS: ${{ steps.rules.outputs.rule_labels }}
          LLM_LABELS: ${{ steps.llm.outputs.llm_labels }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Combine and deduplicate labels
          ALL_LABELS=$(echo "$RULE_LABELS,$LLM_LABELS" | tr ',' '\n' | grep -v '^$' | sort -u | paste -sd ',' -)

          if [ -z "$ALL_LABELS" ]; then
            echo "No labels to apply"
            exit 0
          fi

          echo "Applying labels: $ALL_LABELS"

          IFS=',' read -ra LABEL_ARRAY <<< "$ALL_LABELS"
          for label in "${LABEL_ARRAY[@]}"; do
            label=$(echo "$label" | xargs)
            if [ -n "$label" ]; then
              echo "  Adding: $label"
              gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "$label" || true
            fi
          done

          echo "Done! Applied ${#LABEL_ARRAY[@]} label(s)."
