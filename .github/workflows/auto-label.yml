name: Auto Label Issues

on:
  issues:
    types: [opened]

env:
  REPO: ${{ github.repository }}

jobs:
  auto-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      models: read
    steps:
      - name: Rule-based labeling from template fields
        id: rules
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          LABELS=""

          # --- Detect target release ---
          if echo "$ISSUE_BODY" | grep -qi "Target release"; then
            release_val=$(echo "$ISSUE_BODY" | grep -A1 "Target release" | tail -1 | xargs)
            case "$release_val" in
              v0.2|v0.3|v0.4) LABELS="$LABELS,release:$release_val" ;;
            esac
          fi

          # --- Detect domain from "Optimization domain" or "Related area" dropdown ---
          if echo "$ISSUE_BODY" | grep -qiE "Optimization domain|Related area"; then
            domain_val=$(echo "$ISSUE_BODY" | grep -A1 -iE "Optimization domain|Related area" | tail -1 | xargs)
            case "$domain_val" in
              Inference)          LABELS="$LABELS,domain:inference" ;;
              Training)           LABELS="$LABELS,domain:training" ;;
              Both)               LABELS="$LABELS,domain:inference,domain:training" ;;
              "MCP tools")        LABELS="$LABELS,domain:mcp" ;;
              "UI / PrimusClaw")  LABELS="$LABELS,domain:ui" ;;
            esac
          fi

          # --- Detect sub-domain from "Issue type" dropdown (bug report) ---
          if echo "$ISSUE_BODY" | grep -qi "Issue type"; then
            issue_type=$(echo "$ISSUE_BODY" | grep -A1 "Issue type" | tail -1 | xargs)
            case "$issue_type" in
              "MCP tool failure") LABELS="$LABELS,domain:mcp" ;;
              "UI issue")         LABELS="$LABELS,domain:ui" ;;
            esac
          fi

          # --- Detect entry point ---
          if echo "$ISSUE_BODY" | grep -qi "Hyperloom UI (PrimusClaw)"; then
            if ! echo "$LABELS" | grep -q "domain:ui"; then
              LABELS="$LABELS,domain:ui"
            fi
          fi

          # --- Detect type from General template ---
          if echo "$ISSUE_BODY" | grep -qi "What kind of issue"; then
            kind_val=$(echo "$ISSUE_BODY" | grep -A1 "What kind of issue" | tail -1 | xargs)
            case "$kind_val" in
              "Suggestion / Feature idea") LABELS="$LABELS,type:feature" ;;
              "Question")                  LABELS="$LABELS,type:question" ;;
              "Task / Chore")              LABELS="$LABELS,type:task" ;;
              "Documentation")             LABELS="$LABELS,type:docs" ;;
            esac
          fi

          # Clean up leading comma
          LABELS=$(echo "$LABELS" | sed 's/^,//')

          echo "rule_labels=$LABELS" >> "$GITHUB_OUTPUT"

          # Determine if type was already set by template
          EXISTING_LABELS="${{ join(github.event.issue.labels.*.name, ',') }}"
          if echo "$EXISTING_LABELS" | grep -q "type:"; then
            echo "has_type=true" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q "type:"; then
            echo "has_type=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_type=false" >> "$GITHUB_OUTPUT"
          fi

      - name: LLM classification via GitHub Models
        id: llm
        if: steps.rules.outputs.has_type != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          BODY_TRUNCATED=$(echo "$ISSUE_BODY" | head -c 3000)

          RESPONSE=$(curl -s https://models.github.ai/inference/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -d "$(jq -n \
              --arg title "$ISSUE_TITLE" \
              --arg body "$BODY_TRUNCATED" \
              '{
                model: "openai/gpt-4o-mini",
                messages: [{
                  role: "user",
                  content: ("You are a GitHub issue classifier for Hyperloom, an AI-powered performance optimization platform for AMD GPUs.\n\nAnalyze this issue and return ONLY a JSON object (no markdown fences):\n- \"type\": one of \"type:bug\", \"type:feature\", \"type:question\", \"type:task\", \"type:docs\"\n- \"domains\": array from [\"domain:inference\", \"domain:training\", \"domain:mcp\", \"domain:ui\"], can be empty\n\nIssue title: " + $title + "\n\nIssue body:\n" + $body)
                }],
                temperature: 0,
                max_tokens: 150
              }')")

          LLM_OUTPUT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$LLM_OUTPUT" ]; then
            echo "LLM returned empty response"
            echo "llm_labels=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "LLM output: $LLM_OUTPUT"

          TYPE_LABEL=$(echo "$LLM_OUTPUT" | jq -r '.type // empty' 2>/dev/null)
          DOMAIN_LABELS=$(echo "$LLM_OUTPUT" | jq -r '.domains[]? // empty' 2>/dev/null | paste -sd ',' -)

          LABELS=""
          [ -n "$TYPE_LABEL" ] && LABELS="$TYPE_LABEL"
          [ -n "$DOMAIN_LABELS" ] && LABELS="${LABELS:+$LABELS,}$DOMAIN_LABELS"

          echo "llm_labels=$LABELS" >> "$GITHUB_OUTPUT"

      - name: Apply labels
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          RULE_LABELS: ${{ steps.rules.outputs.rule_labels }}
          LLM_LABELS: ${{ steps.llm.outputs.llm_labels }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          ALL_LABELS=$(echo "$RULE_LABELS,$LLM_LABELS" | tr ',' '\n' | grep -v '^$' | sort -u | paste -sd ',' -)

          if [ -z "$ALL_LABELS" ]; then
            echo "No labels to apply"
            exit 0
          fi

          echo "Applying labels: $ALL_LABELS"

          IFS=',' read -ra LABEL_ARRAY <<< "$ALL_LABELS"
          for label in "${LABEL_ARRAY[@]}"; do
            label=$(echo "$label" | xargs)
            if [ -n "$label" ]; then
              echo "  Adding: $label"
              gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "$label" || true
            fi
          done

          echo "Done! Applied ${#LABEL_ARRAY[@]} label(s)."
