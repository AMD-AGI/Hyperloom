name: Release Provenance

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      # The build backend runs npm for the Inspector UI (build_backend/hyperloom_build.py).
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/inspector/package-lock.json
      - name: Build distributions
        env:
          # A release without the Inspector UI is a packaging bug, not a fallback.
          HYPERLOOM_REQUIRE_UI: "1"
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'
