name: Verify SaFE Artifacts API

# One-shot probe: hit SaFE /api/v1/optimization/tasks/<id>/artifacts with the
# CLAW_API_KEY secret and dump the JSON response so we can decide whether to
# revert the Claw bypass. Will be deleted after verification.
# (re-trigger 2026-05-12 — earlier run sat queued overnight)

on:
  push:
    branches: [feature/ci-remote-mode-glm5]
    paths: ['.github/workflows/verify-safe-api.yml']

jobs:
  probe:
    runs-on: hyperloom-mh826
    timeout-minutes: 10
    env:
      CLAW_API_KEY: ${{ secrets.CLAW_API_KEY }}
      SAFE_BASE_URL: ${{ secrets.SAFE_BASE_URL }}
    steps:
      - name: Probe 16 historical tasks for ci_metrics.json availability
        shell: bash
        run: |
          set -u
          BASE="${SAFE_BASE_URL:-https://core42.example-internal-host.invalid}"
          BASE="${BASE%/}"
          # (task_id, model) — the 20-model run from 2026-05-08 (run 25570644944),
          # nvidia excluded (NVFP4 incompatible w/ MI300X).
          declare -a TASKS=(
            "opt-c2c90039-a9f1-45f0-a2c7-8c4a1183b6a8|Qwen2.5-14B-Instruct-AWQ"
            "opt-104d2d29-3288-413a-8ff2-db7b51832dc6|Qwen2.5-7B"
            "opt-2a607346-7761-4579-8dc4-064130cd5119|Qwen2.5-7B-Instruct"
            "opt-ef1a51d7-078e-44b3-bcf4-1a079bd7a448|Qwen2.5-Coder-7B"
            "opt-a82bd200-98fb-4e79-933e-c971cd31ad70|Qwen2.5-Coder-7B-Instruct"
            "opt-3c14ea91-cae8-49fb-9874-29196305216e|Qwen3-8B"
            "opt-af0501fc-4afb-4dc1-9349-e9fd3c527dc6|Qwen3-8B-AWQ"
            "opt-dc6faa7c-2847-4660-b725-2da77ccc8bce|Qwen3-Coder-30B-A3B-Instruct"
            "opt-af4dc673-221a-4e6d-b77f-aee0eb0c3c25|DeepSeek-R1-0528"
            "opt-2effa6ac-10f0-4b33-a84e-88afc789dcac|DeepSeek-R1-Distill-Llama-8B"
            "opt-dd4a0d8d-88c2-4a52-b5f9-5d48227e31ec|DeepSeek-V3.2"
            "opt-6e35b44d-db18-48db-aae8-b8721ee942f8|dolphin-2.9.1-yi-1.5-34b"
            "opt-a35850b2-c2e0-461f-9022-604196b2d98f|Llama-3.1-8B-Instruct"
            "opt-a1739a8f-083e-463f-b8a1-6bc285328d5d|Mistral-7B-Instruct-v0.2"
            "opt-d21e5b0d-8ef4-4921-8ed8-b8a78bfe4741|gpt-oss-120b"
            "opt-82915ed5-1874-4895-a8d3-bca2c86021c7|gpt-oss-20b"
          )
          printf "\n%-42s %-32s %-6s %s\n" "TASK_ID" "MODEL" "FILES" "ci_metrics.json size"
          printf "%-42s %-32s %-6s %s\n" "$(printf '=%.0s' {1..42})" "$(printf '=%.0s' {1..32})" "======" "===================="
          set +e
          for entry in "${TASKS[@]}"; do
            tid="${entry%%|*}"
            model="${entry##*|}"
            url="$BASE/api/v1/optimization/tasks/$tid/artifacts"
            resp=$(curl -sS -H "Authorization: Bearer $CLAW_API_KEY" "$url" 2>/dev/null)
            n_files=$(echo "$resp" | jq '(.data // .) | length' 2>/dev/null)
            n_files="${n_files:-0}"
            ci_size=$(echo "$resp" | jq -r '[(.data // .)[] | select(.path | endswith("ci_metrics.json")) | .size] | first // "MISSING"' 2>/dev/null)
            ci_size="${ci_size:-MISSING}"
            report_size=$(echo "$resp" | jq -r '[(.data // .)[] | select(.path | endswith("optimization_report.md")) | .size] | first // "MISSING"' 2>/dev/null)
            report_size="${report_size:-MISSING}"
            printf "%-42s %-32s %6s  ci_metrics=%-10s report=%s\n" "$tid" "$model" "$n_files" "$ci_size" "$report_size"
          done

      - name: (kept) Hit each artifacts endpoint
        if: false
        shell: bash
        run: |
          set -u
          BASE="${SAFE_BASE_URL:-https://core42.example-internal-host.invalid}"
          BASE="${BASE%/}"
          echo "BASE=$BASE"
          for tid in opt-9a2bd79d-0bd6-4210-ae7e-d1f37082b136 opt-6b715236-5334-4f56-9dbd-40f83aecae48 opt-0c5f4582-55b2-4e15-92df-c8e1477cd9a7; do
            echo ""
            echo "===================================================="
            echo "task_id = $tid"
            echo "===================================================="

            # 1) List artifacts (try /api/v1/... first, then /api/... as fallback)
            for prefix in "/api/v1/optimization/tasks" "/api/optimization/tasks"; do
              url="$BASE$prefix/$tid/artifacts"
              echo ""
              echo "--- GET $url ---"
              code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
                -H "Authorization: Bearer $CLAW_API_KEY" \
                -H "Accept: application/json" \
                "$url" || echo "curl_err")
              echo "HTTP $code"
              if [ "$code" = "200" ]; then
                echo "--- body (first 4KB) ---"
                head -c 4096 /tmp/resp.json
                echo ""
                echo "--- pretty (jq) ---"
                jq . /tmp/resp.json 2>/dev/null | head -80 || head -80 /tmp/resp.json
                # If list succeeded, also probe ONE file's download URL on the same prefix.
                first_path=$(jq -r '
                  ( .data // .items // .artifacts // .files // . )
                  | if type == "array" then .[0] else . end
                  | ( .path // .name // .filename // .key // empty )
                ' /tmp/resp.json 2>/dev/null | head -1)
                first_id=$(jq -r '
                  ( .data // .items // .artifacts // .files // . )
                  | if type == "array" then .[0] else . end
                  | ( .id // .artifact_id // empty )
                ' /tmp/resp.json 2>/dev/null | head -1)
                echo ""
                echo "--- first_path=$first_path  first_id=$first_id ---"

                # Try a few likely download URL patterns; just print status codes.
                for dl_url in \
                    "$BASE$prefix/$tid/artifacts/$first_path" \
                    "$BASE$prefix/$tid/artifacts/$first_id/download" \
                    "$BASE$prefix/$tid/artifacts/download?path=$first_path" \
                    "$BASE$prefix/$tid/artifacts?path=$first_path" \
                    "$BASE$prefix/$tid/artifact?path=$first_path"
                do
                  [ -z "$first_path$first_id" ] && break
                  dl_code=$(curl -sS -o /tmp/dl.bin -w "%{http_code}|%{size_download}|%{content_type}" \
                    -H "Authorization: Bearer $CLAW_API_KEY" \
                    "$dl_url" || echo "curl_err")
                  echo "  DL [$dl_code] $dl_url"
                done
                break  # don't try the next prefix once one works
              else
                echo "--- error body (first 400B) ---"
                head -c 400 /tmp/resp.json
                echo ""
              fi
            done
          done
