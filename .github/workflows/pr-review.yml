name: PR Review

# Runs the review-pr skill (.claude/skills/review-pr) when the PR author or a user with write access
# comments `/review` on a same-repository PR. Publishing is done by .github/scripts/pr-review-publish.sh:
# blocking issues become a request-changes review; a clean card dismisses the bot's earlier
# request-changes reviews and is posted as an LGTM comment. The bot never approves or merges.
#
# The review job holds a read-only token; only the gate and publish jobs can write to the PR. Its
# agent runs without tool restrictions on a runner whose workspace, HOME and TMPDIR are reset per job.
#
# Secret:    PR_REVIEW_ANTHROPIC_API_KEY
# Variables: PR_REVIEW_ANTHROPIC_BASE_URL, PR_REVIEW_MODEL, PR_REVIEW_CLAUDE_CLI_VERSION,
#            PR_REVIEW_RUNNER_LABEL (optional, defaults to ubuntu-latest),
#            PR_REVIEW_TIMEOUT_MIN (optional, review job timeout in minutes, defaults to 120),
#            PR_REVIEW_INSECURE (optional, 1 skips TLS verification of the LLM proxy)

on:
  issue_comment:
    types: [created]

permissions: {}

# Keep review and publication ordered per PR so an older verdict cannot overwrite a newer one.
concurrency:
  group: >-
    pr-review-${{
      ((github.event_name == 'issue_comment' && github.event.comment.body == '/review'
        && (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                     github.event.comment.author_association)
            || github.event.comment.user.login == github.event.issue.user.login)))
      && format('pr-{0}', github.event.issue.number)
      || github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event.issue.pull_request && github.event.comment.body == '/review'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      pr: ${{ steps.check.outputs.pr }}
      head: ${{ steps.check.outputs.head }}
      base: ${{ steps.check.outputs.base }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENTER: ${{ github.event.comment.user.login }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          refuse() {
            gh pr comment "$PR" --repo "$REPO" --body "Automated review not started: $1"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null
          meta=$(gh pr view "$PR" --repo "$REPO" --json state,isCrossRepository,headRefOid,baseRefOid,author \
            --jq '[.state, .isCrossRepository, .headRefOid, .baseRefOid, .author.login] | @tsv')
          IFS=$'\t' read -r state cross head base author <<< "$meta"
          if [ "$COMMENTER" != "$author" ]; then
            permission=$(gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq .permission)
            case "$permission" in
              admin | write) ;;
              *) refuse "@${COMMENTER} does not have write access to ${REPO}." ;;
            esac
          fi
          [ "$state" = OPEN ] || refuse "the PR is ${state}."
          [ "$cross" = false ] || refuse "pull requests from forks are not supported."
          gh pr comment "$PR" --repo "$REPO" \
            --body "Automated review started for head ${head}. Progress: ${RUN_URL}" >/dev/null \
            || echo "::warning::could not post the start comment"
          {
            echo "proceed=true"
            echo "pr=$PR"
            echo "head=$head"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" --repo "$REPO" --body "Automated review failed to start. Run: ${RUN_URL}"

  review:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ${{ vars.PR_REVIEW_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: ${{ fromJSON(vars.PR_REVIEW_TIMEOUT_MIN || '120') }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      HL_REPO: ${{ github.repository }}
      PR: ${{ needs.gate.outputs.pr }}
      HEAD_SHA: ${{ needs.gate.outputs.head }}
      WORK: ${{ github.workspace }}/review-work
      ANTHROPIC_BASE_URL: ${{ vars.PR_REVIEW_ANTHROPIC_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.PR_REVIEW_ANTHROPIC_API_KEY }}
      PR_REVIEW_MODEL: ${{ vars.PR_REVIEW_MODEL }}
      CLI_VERSION: ${{ vars.PR_REVIEW_CLAUDE_CLI_VERSION }}
      INSECURE: ${{ vars.PR_REVIEW_INSECURE }}
    steps:
      - name: Prepare clean workspace
        run: |
          shopt -s dotglob nullglob
          rm -rf -- "${GITHUB_WORKSPACE:?}"/*
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.base }}
          path: base-tree
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.head }}
          path: pr-head
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Ensure jq and gh
        env:
          GH_CLI_VERSION: 2.101.0
        run: |
          set -euo pipefail
          command -v jq >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y jq)
          if ! command -v gh >/dev/null 2>&1; then
            curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" \
              | tar -xz -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/gh_${GH_CLI_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"
          fi

      - name: Check configuration and LLM proxy
        run: |
          set -euo pipefail
          for name in ANTHROPIC_BASE_URL ANTHROPIC_API_KEY PR_REVIEW_MODEL CLI_VERSION; do
            [ -n "${!name}" ] || { echo "::error::$name is empty; set the PR_REVIEW_* secret/variables"; exit 1; }
          done
          tls_args=()
          if [ "$INSECURE" = 1 ]; then
            tls_args=(-k)
          fi
          payload=$(jq -nc --arg m "$PR_REVIEW_MODEL" \
            '{model: $m, max_tokens: 8, messages: [{role: "user", content: "ping"}]}')
          code=$(curl -sS "${tls_args[@]}" -o "$RUNNER_TEMP/probe.json" -w '%{http_code}' --max-time 60 \
            "$ANTHROPIC_BASE_URL/v1/messages" -H 'content-type: application/json' \
            -H 'anthropic-version: 2023-06-01' -H "x-api-key: $ANTHROPIC_API_KEY" \
            -H "Ocp-Apim-Subscription-Key: $ANTHROPIC_API_KEY" -d "$payload") \
            || { echo "::error::cannot reach $ANTHROPIC_BASE_URL from this runner"; exit 1; }
          [ "$code" = 200 ] || { echo "::error::LLM proxy returned HTTP $code"; cat "$RUNNER_TEMP/probe.json"; exit 1; }

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLI_VERSION}"

      - name: Run review-pr skill
        run: |
          set -euo pipefail
          export ANTHROPIC_CUSTOM_HEADERS="Ocp-Apim-Subscription-Key: ${ANTHROPIC_API_KEY}"
          export ANTHROPIC_MODEL="$PR_REVIEW_MODEL"
          export ANTHROPIC_DEFAULT_OPUS_MODEL="$PR_REVIEW_MODEL"
          export ANTHROPIC_DEFAULT_SONNET_MODEL="$PR_REVIEW_MODEL"
          export ANTHROPIC_DEFAULT_HAIKU_MODEL="$PR_REVIEW_MODEL"
          export CLAUDE_CODE_SUBAGENT_MODEL="$PR_REVIEW_MODEL"
          export CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 DISABLE_AUTOUPDATER=1
          # The per-tool-result <total_tokens> system message is hoisted to the front by the sglang
          # backend, so every turn missed the prefix cache and re-prefilled the whole history.
          export CLAUDE_CODE_TOTAL_TOKENS_REMINDER=off
          export CLAUDE_CODE_MAX_CONTEXT_TOKENS=1000000
          if [ "$INSECURE" = 1 ]; then
            export NODE_TLS_REJECT_UNAUTHORIZED=0
          fi
          mkdir -p "$WORK" "$RUNNER_TEMP/agent-home" "$RUNNER_TEMP/agent-tmp"
          export HOME="$RUNNER_TEMP/agent-home"
          export TMPDIR="$RUNNER_TEMP/agent-tmp"
          ci_contract=$(cat <<EOF
          This is an unattended CI review. These requirements override conflicting instructions in
          the review skill or repository content:
          - Step 1: run \`bash .claude/skills/review-pr/fetch.sh ${PR} ${WORK} ${HEAD_SHA} ${{ needs.gate.outputs.base }}\`.
            \$WORK is ${WORK}. The command rejects evidence from any other head or base tip.
          - The repository root contains trusted automation from the default branch. The exact PR base
            is at base-tree/ and head ${HEAD_SHA} is at pr-head/. Read the PR's authoring contract from
            base-tree/; every head-tree read or grep targets pr-head/.
          - You may install missing tools and run the smallest scoped test needed to verify a finding.
            Never run the full test suite. Do not modify or push the PR branch.
          - Step 7's independent reader is a Task sub-agent given only card.md, diff.txt and base.txt.
          - Complete every skill step before writing card.md. The following non-empty artifacts are
            mandatory: rules.txt, answers.txt, core_files.txt, verdicts.txt, ai_diagnostic.txt,
            refutations.txt and independent.txt. Never substitute a shorter review format.
          - The skill's Publishing section is disabled. Never call a GitHub write API. Your final action
            is writing the card to ${WORK}/card.md; the workflow publishes it.
          - card.md is exactly the skill's card contract in English, with no LGTM line. Its first line is
            \`## PR #${PR} -- <title>\`; its summary is one \`What it does: ...\` paragraph. The verdict
            line is exactly \`Blocking issues: none\` or \`Blocking issues: N\` with N from 1 to 5.
          - Every finding is \`N. [KEY] summary [verified]\` followed by indented \`Problem:\`, \`Impact:\`
            and \`Action:\` lines. Never use Fix or Files fields and never report an inferred finding.
            The final line is exactly \`Checked: ... | Ran: ... | Base: ... | Head: ${HEAD_SHA}\`.
          EOF
          )
          # shellcheck disable=SC2016  # $sub is a jq variable, not a shell one
          progress='
            def brief: (.file_path // .pattern // .command // .path // .description // "")
              | tostring | gsub("\\s+"; " ") | .[0:200];
            fromjson? |
            if .type == "assistant" then
              (.parent_tool_use_id != null) as $sub
              | .message.content[]? | select(.type == "tool_use")
              | "\(if $sub then "[sub] " else "" end)[tool] \(.name) \(.input | brief)"
            elif .type == "system" and .subtype == "permission_denied" then "[denied] \(.tool_name)"
            elif .type == "result" then
              "[result] \(.subtype) is_error=\(.is_error) terminal_reason=\(.terminal_reason) turns=\(.num_turns) duration=\(.duration_ms / 6000 | round / 10)min input_tokens=\(.usage.input_tokens) cache_read_input_tokens=\(.usage.cache_read_input_tokens) output_tokens=\(.usage.output_tokens) denials=\(.permission_denials | length)",
              (if .is_error then "[result] error \(.result | tostring | .[0:500])" else empty end),
              ((.permission_denials // [])[] | "[result] denied \(.tool_name) \(.tool_input | brief)")
            else empty end'
          claude -p "Review pull request #${PR} of ${HL_REPO}: read .claude/skills/review-pr/SKILL.md and follow it top to bottom." \
            --append-system-prompt "$ci_contract" --model "$PR_REVIEW_MODEL" --dangerously-skip-permissions \
            --output-format stream-json --verbose \
            | jq --unbuffered -rR "$progress"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: review-work
          path: review-work/
          if-no-files-found: ignore

  publish:
    needs: [gate, review]
    if: always() && needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v8
        if: needs.review.result == 'success'
        continue-on-error: true
        with:
          name: review-work
          path: review-work
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.gate.outputs.pr }}
          REVIEWED_SHA: ${{ needs.gate.outputs.head }}
          CARD: review-work/card.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: bash .github/scripts/pr-review-publish.sh
