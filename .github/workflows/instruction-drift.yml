name: Instruction Drift

# Advisory, non-blocking check that AI instruction files (AGENTS.md,
# copilot-instructions.md, .github/instructions/*.instructions.md) don't
# reference repo paths or ``python -m`` modules that no longer exist.
#
# Unlike lint/tests, this MUST run on documentation-only PRs, because the files
# it checks are Markdown -- so there is deliberately no ``paths-ignore`` skip.
# It is advisory (``continue-on-error``): a stale reference annotates the PR but
# never gates merge, matching how bandit/pylint are treated today.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instruction-drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check AI instruction files for stale references
        run: python .github/scripts/check_instruction_drift.py
