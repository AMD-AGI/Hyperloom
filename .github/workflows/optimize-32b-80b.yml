name: SaFE Optimize 32B-80B (local pool, one-shot)

# One-shot optimization run over the locally-cached 32B-80B model pool at
#   /wekafs/weilei/claw-dev/ci-candidates-filtered/models_32b_80b_local.json
# (built from the gt100_rotate + sub100_pulse pools, filtered to models that are
# present under /wekafs/models AND whose size is between 32B and 80B).
#
# Like optimize-tiny.yml, this is a THIN DISPATCHER: it forwards the whole pool
# to `SaFE Optimize Submit` (optimize-submit.yml) so submission, waiting,
# artifact collection, summary rendering, webhook, and perf publishing stay
# byte-for-byte on the regular SaFE submit path. The only differences vs the
# (now-paused) gt100 production cron are the candidates pool and the schedule.
#
# Cadence: fire ONCE at 2026-06-23 04:00 Beijing time (Asia/Shanghai, UTC+8).
# GitHub Actions cron runs in UTC and has NO year field, so the cron below fires
# every June-22 20:00 UTC; the date guard makes it a true one-shot (only the
# 2026-06-22 UTC occurrence actually dispatches). NOTE: scheduled workflows only
# run from the DEFAULT branch, so this file must be merged to main before the
# target time for the cron to fire.

on:
  # 2026-06-22 20:00 UTC == 2026-06-23 04:00 Asia/Shanghai.
  schedule:
    - cron: '0 20 22 6 *'
  workflow_dispatch:
    inputs:
      candidates_file:
        description: 'Override pool JSON (absolute /wekafs path).'
        required: false
        default: '/wekafs/weilei/claw-dev/ci-candidates-filtered/models_32b_80b_local.json'
      force:
        description: 'Bypass the one-shot date guard (manual runs proceed regardless of date).'
        type: boolean
        required: false
        default: true
      dry_run:
        description: 'Forward dry_run=true to SaFE Optimize Submit.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: optimize-32b-80b-dispatch
  cancel-in-progress: false

jobs:
  dispatch-submit:
    name: Dispatch 32B-80B one-shot submit
    runs-on: hyperloom-mh826
    timeout-minutes: 10
    env:
      # Off-repo pool on /wekafs (RO-mounted on the hyperloom runners);
      # generate_hf_matrix reads this absolute path as-is.
      CANDIDATES_FILE: ${{ github.event.inputs.candidates_file || '/wekafs/weilei/claw-dev/ci-candidates-filtered/models_32b_80b_local.json' }}
      # One-shot guard: the cron also fires in later years, so only proceed when
      # the UTC date matches. 2026-06-22 UTC == 2026-06-23 Beijing.
      ONESHOT_UTC_DATE: '2026-06-22'
      # Submit only to the hyperloom workspace.
      SUBMIT_WORKSPACES: 'core42-hyperloom'
    steps:
      - uses: actions/checkout@v6

      - name: One-shot date guard
        id: guard
        env:
          FORCE: ${{ github.event.inputs.force }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          # Manual dispatch with force=true always proceeds.
          if [ "${EVENT}" = "workflow_dispatch" ] && [ "${FORCE}" = "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch force=true -> proceeding (UTC today=${today})"
            exit 0
          fi
          if [ "${today}" = "${ONESHOT_UTC_DATE}" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "one-shot date matched (UTC ${today}) -> proceeding"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "UTC today=${today} != ${ONESHOT_UTC_DATE} -> skipping (cron fires yearly; this run is a one-shot)"
          fi

      - name: Verify pool exists
        if: steps.guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          if [ ! -f "${CANDIDATES_FILE}" ]; then
            echo "::error::candidates pool not found: ${CANDIDATES_FILE}"
            exit 1
          fi
          n=$(python3 -c "import json,sys;print(len(json.load(open('${CANDIDATES_FILE}')).get('candidates') or []))")
          echo "pool=${CANDIDATES_FILE} models=${n}"

      - name: Dispatch SaFE Optimize Submit
        if: steps.guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          echo "Dispatching optimize-submit.yml on ref=${ref}"
          echo "Pool: ${CANDIDATES_FILE}; whole pool (batch_size=0); submit_workspaces=${SUBMIT_WORKSPACES}"

          payload=$(python3 - <<'PY'
          import json
          import os

          payload = {
              "ref": os.environ["GITHUB_REF_NAME"],
              "inputs": {
                  "models": "",
                  "candidates_file": os.environ["CANDIDATES_FILE"],
                  # Whole pool, one batch — no rotation, no slicing.
                  "batch_index": "0",
                  "batch_size": "0",
                  # Force TP=1 for every task this dispatcher submits (overrides
                  # optimize_submit.py's params->tp auto-detect).
                  "tp": "1",
                  "exclude_leaderboard": "false",
                  "exclude_active_workflows": "false",
                  "max_parallel": "205",
                  "submit_workspaces": os.environ["SUBMIT_WORKSPACES"],
                  "task_timeout_min": "720",
                  "max_hours": "12",
                  "all_artifacts": "true",
                  "dry_run": os.environ.get("DRY_RUN") or "false",
              },
          }
          print(json.dumps(payload))
          PY
          )

          curl -fsS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/optimize-submit.yml/dispatches" \
            -d "$payload"
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
