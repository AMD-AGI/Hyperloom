name: Tests with Coverage

# Runs on push and pull_request for all branches. Skips when every changed file
# matches paths-ignore (documentation-only and repo-metadata edits).
#
# Pytest argv for CI lives in ``pyproject.toml`` → ``[tool.hyperloom.tests_coverage]``.
# This workflow reads that table with inline Python (no ``ci/coverage_summary.py``).
# Coverage per-tree summary reads ``[tool.coverage.run].source`` the same way.
# When ``OOB/`` is present, ``pip install -e \"./OOB\"`` enables ``agent_mcp_server``
# UTs; if absent, install is skipped (``importorskip`` in OOB tests).
# Two matrix legs (Python 3.10 + 3.11).
on:
  # PRs run via ``pull_request``; ``push`` is scoped to ``main`` so a same-repo
  # PR does not double-trigger (one run per event class).
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - "COPYRIGHT"
      - "CODEOWNERS"
      - ".gitattributes"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - "COPYRIGHT"
      - "CODEOWNERS"
      - ".gitattributes"

# Cancel superseded runs for the same ref (newest push/PR sync wins).
concurrency:
  group: tests-coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[test,ci]"
          if [ -f OOB/pyproject.toml ]; then
            pip install -e "./OOB"
          else
            echo "::notice::OOB/ not in checkout (no pyproject.toml); skipping editable OOB install."
          fi

      - name: Run tests with coverage
        id: pytest
        continue-on-error: true
        run: |
          set -euo pipefail
          readarray -t PARGS < <(python3 <<'PY'
          import pathlib
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib
          cfg = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          for a in cfg["tool"]["hyperloom"]["tests_coverage"]["pytest_ci_args"]:
              print(a)
          PY
          )
          RELAX="${COVERAGE_RELAX_FAIL_UNDER:-}"
          EXTRA=()
          if echo "$RELAX" | grep -qiE '^(1|true|yes|on)$'; then
            EXTRA=(--cov-fail-under=0)
            echo "::notice::COVERAGE_RELAX_FAIL_UNDER is set: fail_under not enforced by pytest-cov."
          fi
          pytest "${PARGS[@]}" "${EXTRA[@]}"

      - name: Coverage summary
        if: always()
        env:
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          python3 <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          import sys
          from pathlib import Path

          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib

          def load_cfg() -> dict:
              return tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))

          def extract_total(text: str) -> str:
              for line in text.splitlines():
                  if line.startswith("TOTAL "):
                      parts = line.split()
                      return parts[-1] if parts else "unknown"
              return "unknown"

          # Per-tree totals are computed by bucketing the rows of the full
          # ``coverage report`` (which already has run-time ``omit`` applied)
          # by a path segment for each source. This is robust to whatever path
          # form the data uses (e.g. OOB is editable-installed as
          # ``agent_mcp_server`` and may be recorded as ``OOB/`` or absolute),
          # and never double-counts (unlike ``--include`` glob unions).
          _SOURCE_SEGMENTS = {
              "inference_optimizer": ["/inference_optimizer/"],
              "robustness_agent": ["/robustness_agent/"],
              "critic-agent/runtime": ["/critic-agent/runtime/"],
              "framework-agent/src": ["/framework-agent/src/"],
              "kernel-agent/tools": ["/kernel-agent/tools/"],
              "quantization_agent": ["/quantization_agent/"],
              "OOB": ["/OOB/", "/agent_mcp_server/"],
              "ci": ["/ci/"],
          }

          def _row_path_stmts_miss(line: str):
              """Parse a coverage report row -> (path, stmts, miss) or None.

              Row layout is ``<path> <stmts> <miss> <cover%>``; stmts/miss are
              the 3rd/2nd-from-last whitespace tokens.
              """
              parts = line.split()
              if len(parts) < 4:
                  return None
              try:
                  stmts = int(parts[-3])
                  miss = int(parts[-2])
              except ValueError:
                  return None
              path = " ".join(parts[:-3])
              return path, stmts, miss

          def per_tree_totals(report_text: str) -> dict:
              """Aggregate (stmts, miss) per source from a full report body."""
              acc = {src: [0, 0] for src in _SOURCE_SEGMENTS}
              for line in report_text.splitlines():
                  if line.startswith(("Name", "TOTAL", "-")):
                      continue
                  parsed = _row_path_stmts_miss(line)
                  if parsed is None:
                      continue
                  path, stmts, miss = parsed
                  norm = "/" + path.lstrip("/")
                  for src, segs in _SOURCE_SEGMENTS.items():
                      if any(seg in norm for seg in segs):
                          acc[src][0] += stmts
                          acc[src][1] += miss
                          break
              out: dict[str, str] = {}
              for src, (stmts, miss) in acc.items():
                  out[src] = f"{(stmts - miss) / stmts * 100:.2f}%" if stmts else "n/a"
              return out

          cfg = load_cfg()
          sources = list(cfg["tool"]["coverage"]["run"]["source"])
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          outcome = os.environ.get("PYTEST_OUTCOME", "unknown")

          if not Path(".coverage").exists():
              lines = ["## Coverage (UT)", "", "No `.coverage` data."]
          else:
              full = subprocess.run(
                  ["coverage", "report", "--skip-empty"],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              full_txt = full.stdout or ""
              print("=== Full coverage report (step log) ===")
              print(full_txt, end="" if full_txt.endswith("\n") else full_txt + "\n")
              total = extract_total(full_txt)
              tree_totals = per_tree_totals(full_txt)
              rows = [
                  f"| `{src}` | {tree_totals.get(src, 'n/a')} |" for src in sources
              ]
              lines = [
                  "## Coverage (UT)",
                  "",
                  f"Python {sys.version_info.major}.{sys.version_info.minor}; "
                  "roots and CI pytest argv from `pyproject.toml`.",
                  "",
                  "### Combined measured source (all configured trees)",
                  f"**TOTAL (line): {total}**",
                  "",
                  "### Per-tree (narrow)",
                  "| Tree | Line coverage (TOTAL) |",
                  "|------|----------------------|",
                  *rows,
              ]
              if outcome != "success":
                  lines.extend([
                      "",
                      "> Tests did not all pass; coverage can be **partial or misleading**.",
                  ])

          block = "\n".join(lines) + "\n"
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write(block)
          else:
              print(block)
          PY

      - name: Enforce coverage fail_under (strict mode)
        if: always() && steps.pytest.outcome == 'success'
        run: |
          python3 <<'PY'
          import os
          import pathlib
          import subprocess
          import sys

          relax = (os.environ.get("COVERAGE_RELAX_FAIL_UNDER") or "").strip().lower()
          if relax in {"1", "true", "yes", "on"}:
              print("Relaxed mode: skip coverage fail_under enforcement.")
              sys.exit(0)
          if not pathlib.Path(".coverage").exists():
              print("::error::No .coverage for fail_under check.")
              sys.exit(1)
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib
          cfg = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          fu = int(cfg["tool"]["coverage"]["report"].get("fail_under", 0))
          subprocess.run(
              ["coverage", "report", f"--fail-under={fu}", "--skip-empty"],
              check=True,
          )
          PY

      - name: Enforce test success
        if: always() && steps.pytest.outcome == 'failure'
        run: |
          echo "::error::Tests failed (see the \"Run tests with coverage\" step log)."
          exit 1
