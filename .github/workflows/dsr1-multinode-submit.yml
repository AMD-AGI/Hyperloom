name: DSR1 Multi-Node Submit

# One-shot DeepSeek-R1 multi-node MoRI 1P1D submitter.
# Bypasses optimize-submit.yml's matrix/optimize_submit.py pipeline — sends
# a hand-crafted multi-node prompt directly to a fresh Claw session via
# ci/run_dsr1_multinode.py.
#
# Use this when:
#  - You need to test/iterate the multi-node MoRI 1P1D path on DSR1, or
#  - InferenceX doesn't have a baseline for the target (GPU, model) combo
#    and ci-config.yaml's matrix entry would resolve to a wrong reference.
#
# To migrate to another multi-node model (GLM-5, etc.), edit MODEL_CFG in
# ci/run_dsr1_multinode.py — this workflow is otherwise model-agnostic.

on:
  workflow_dispatch:
    inputs:
      session_name:
        description: 'Override Claw session name (default: auto-generated)'
        required: false
        default: ''
      dry_run:
        description: 'Render prompt to job summary; do not submit'
        type: boolean
        required: false
        default: false
      monitor:
        description: 'Stream SSE events until session ends (off = fire-and-forget)'
        type: boolean
        required: false
        default: false

jobs:
  submit:
    name: Submit DSR1 multi-node
    runs-on: hyperloom-mh826
    timeout-minutes: 600
    env:
      CLAW_API_KEY:       ${{ secrets.CLAW_API_KEY }}
      SAFE_BASE_URL:      ${{ secrets.SAFE_BASE_URL }}
      SANDBOX_WORKSPACE:  ${{ secrets.SAFE_OPTIMIZE_SUBMIT_WORKSPACE }}
      NFS_ROOT:           /wekafs
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: ci
        run: pip install --quiet requests sseclient-py

      - name: Render + submit (run_dsr1_multinode.py)
        working-directory: ci
        env:
          INPUT_SESSION_NAME: ${{ github.event.inputs.session_name }}
          INPUT_DRY_RUN:      ${{ github.event.inputs.dry_run }}
          INPUT_MONITOR:      ${{ github.event.inputs.monitor }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${INPUT_SESSION_NAME:-}" ]; then
            ARGS+=(--session-name "${INPUT_SESSION_NAME}")
          fi
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "${INPUT_MONITOR:-false}" = "true" ]; then
            ARGS+=(--monitor)
          fi
          # Tee stdout to a file so the next step can extract session id / URL.
          python3 run_dsr1_multinode.py "${ARGS[@]}" 2>&1 | tee "${{ github.workspace }}/dsr1_submit.log"

      - name: Render result to job summary
        if: always()
        run: |
          {
            echo "## DSR1 Multi-Node Submit"
            echo ""
            if [ -f "${{ github.workspace }}/dsr1_submit.log" ]; then
              echo '```'
              # Show the tail (last ~80 lines) — covers session id + chat URL
              # for normal runs, and full prompt for --dry-run (5.8KB ≈ 130 lines).
              tail -n 200 "${{ github.workspace }}/dsr1_submit.log"
              echo '```'
            else
              echo "_No log produced._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload submit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsr1-submit-log
          path: dsr1_submit.log
          retention-days: 45
          if-no-files-found: warn
