name: SaFE Optimize gte100 (filtered pool)

# Thin DISPATCHER (like optimize-tiny.yml): forwards a slice of the filtered
# gte100 pool at
#   $WEKAFS_CHENYI_DIR/ci-candidates/hf_gte100_after_session_and_size_filtered.json
# to `SaFE Optimize Submit` (optimize-submit.yml) so submission, waiting,
# artifact collection, summary, webhook and perf publishing all stay on the
# regular submit path.
#
# Batching: each run does ONE batch of 60 models (batch_size=60), all 60 run at
# once (max_parallel=60). The pool is ~900 models, so it takes ceil(900/60)=15
# batches, selected by the batch_index. On SCHEDULE the batch_index auto-rotates
# (each fire advances one batch, wrapping at the pool end); on manual dispatch
# the batch_index input is used.
#
# Cadence: twice a day at Beijing 00:00 / 12:00 (UTC 16:00 / 04:00), using
# minute :07 (not :00) because GitHub heavily delays cron at the top of the
# hour. max_hours=12 is the per-model optimizer budget. Scheduled runs only
# fire from the DEFAULT branch.

on:
  # Beijing 12:07 (UTC 04:07) and Beijing 00:07 (UTC 16:07) — twice a day.
  schedule:
    - cron: '7 4,16 * * *'
  workflow_dispatch:
    inputs:
      batch_index:
        description: '0-based batch (batch_size=60, all run at once). 0..14 covers the ~900-model pool.'
        required: false
        default: '0'
      candidates_file:
        description: 'Override pool JSON (absolute /wekafs path). Empty = the filtered gte100 pool.'
        required: false
        default: ''
      dry_run:
        description: 'Forward dry_run=true to SaFE Optimize Submit (plan only, no submit).'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: optimize-gte100-dispatch
  cancel-in-progress: false

jobs:
  dispatch-submit:
    name: Dispatch gte100 filtered submit
    runs-on: hyperloom-mh826
    timeout-minutes: 10
    env:
      # Off-repo pool on /wekafs (the /wekafs root lives in the WEKAFS_CHENYI_DIR
      # secret; RO-mounted on the hyperloom runners; generate_hf_matrix reads the
      # absolute path as-is).
      CANDIDATES_FILE: ${{ github.event.inputs.candidates_file || format('{0}/ci-candidates/hf_gte100_after_session_and_size_filtered.json', secrets.WEKAFS_CHENYI_DIR) }}
      # One batch = 60 models, all run concurrently (max_parallel=60).
      BATCH_SIZE: '60'
      MAX_PARALLEL: '60'
      MAX_HOURS: '12'
      SUBMIT_WORKSPACES: 'core42-hyperloom'
    steps:
      - uses: actions/checkout@v7

      - name: Verify pool + resolve batch
        id: pool
        env:
          INPUT_BATCH_INDEX: ${{ github.event.inputs.batch_index }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ ! -f "${CANDIDATES_FILE}" ]; then
            echo "::error::candidates pool not found: ${CANDIDATES_FILE}"
            exit 1
          fi
          # Pool size, then resolve the batch via ci/batch_rotate.py (unit-tested;
          # auto-rotates on schedule, uses the input index on manual dispatch).
          n=$(python3 -c "import json,os;print(len(json.load(open(os.environ['CANDIDATES_FILE'])).get('candidates') or []))")
          out=$(python3 ci/batch_rotate.py \
            --count "${n}" \
            --batch-size "${BATCH_SIZE}" \
            --batch-index "${INPUT_BATCH_INDEX:-}" \
            --event "${EVENT}")
          bi=$(echo "$out" | cut -f1); n=$(echo "$out" | cut -f2)
          batches=$(echo "$out" | cut -f3); start=$(echo "$out" | cut -f4); end=$(echo "$out" | cut -f5)
          echo "batch_index=${bi}" >> "$GITHUB_OUTPUT"
          echo "### gte100 filtered pool: ${n} models; batch ${bi}/${batches}; slice ${start}:${end}" >> "$GITHUB_STEP_SUMMARY"
          echo "resolved batch_index=${bi} (of ${batches} batches); slice ${start}:${end}"

      - name: Dispatch SaFE Optimize Submit
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          echo "Dispatching optimize-submit.yml on ref=${ref}"
          echo "Pool: ${CANDIDATES_FILE}; batch ${BATCH_INDEX} (size ${BATCH_SIZE}); max_parallel=${MAX_PARALLEL}; max_hours=${MAX_HOURS}; submit_workspaces=${SUBMIT_WORKSPACES}"

          payload=$(python3 - <<'PY'
          import json
          import os

          payload = {
              "ref": os.environ["GITHUB_REF_NAME"],
              "inputs": {
                  "models": "",
                  "candidates_file": os.environ["CANDIDATES_FILE"],
                  "batch_index": os.environ["BATCH_INDEX"],
                  "batch_size": os.environ["BATCH_SIZE"],
                  "exclude_leaderboard": "false",
                  "exclude_active_workflows": "false",
                  "max_parallel": os.environ["MAX_PARALLEL"],
                  "submit_workspaces": os.environ["SUBMIT_WORKSPACES"],
                  # max_hours=12h optimizer budget. optimize-submit derives the
                  # per-task wait timeout (12h+30m = 750m) and the GitHub job
                  # timeout (12h+60m = 780m) from max_hours in its prepare job,
                  # so no task_timeout_min/job_timeout_min inputs are sent (GitHub
                  # caps dispatch inputs at 25).
                  "max_hours": os.environ["MAX_HOURS"],
                  "all_artifacts": "true",
                  "dry_run": os.environ.get("DRY_RUN") or "false",
              },
          }
          print(json.dumps(payload))
          PY
          )

          curl -fsS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/optimize-submit.yml/dispatches" \
            -d "$payload"
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH_INDEX: ${{ steps.pool.outputs.batch_index }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
