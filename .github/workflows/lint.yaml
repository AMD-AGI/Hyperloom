name: Lint & Format

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    branches:
      - main
      - dev
      - "release/**"
    paths-ignore:
      - 'docs/**'
      - 'slides/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.cursor/**'
      - '.github/workflows/pytest.yaml'
      - '.github/workflows/pylint.yaml'
      - '.github/workflows/secret-scan.yaml'
  pull_request:
    branches:
      - main
      - dev
      - "release/**"
    paths-ignore:
      - 'docs/**'
      - 'slides/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.cursor/**'
      - '.github/workflows/pytest.yaml'
      - '.github/workflows/pylint.yaml'
      - '.github/workflows/secret-scan.yaml'

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install ruff
        run: uv pip install --system ruff

      # Lint the whole tree. Rule selection and per-file/dir ignores
      # (slides, _audit_artifacts, etc.) come from [tool.ruff] in pyproject.toml.
      # Advisory for now — the tree currently has ~547 findings (mostly E501).
      # Annotations still surface in the PR via --output-format=github.
      # Flip `continue-on-error` to false once the backlog is cleared.
      - name: Ruff check
        continue-on-error: true
        run: ruff check --output-format=github .

      # Format check is advisory for now — the existing tree is not yet
      # ruff-format clean. Flip `continue-on-error` to false once it is.
      - name: Ruff format check
        continue-on-error: true
        run: ruff format --check .
