name: CI E2E (single-GPU smoke run)

# A PR targeting `main` or `v1.0-dev` dispatches ONE single-GPU inference-optimizer
# run built from its branch only while it carries the `run-e2e` label: adding the
# label starts a run, and every new commit pushed while it stays starts another.
# Without the label nothing is dispatched. Only collaborators can label a PR, so the
# label is also the approval to spend the shared GPUs. The run is monitored and
# reported green (Succeeded) / red (Failed or timeout). Runs on a self-hosted runner
# that can reach the run API.
#
# Re-run WITHOUT a new commit (e.g. after a transient cluster fault): remove
# `run-e2e` and add it again.
#
# Run ONE PR on a different runner (for proving a replacement without moving everyone
# onto it): set `vars.CI_E2E_CANARY_RUNNER_LABEL` to that runner's label and add the
# `e2e-canary` label to the PR before `run-e2e`. Remove `e2e-canary` to go back.

on:
  pull_request:
    branches: [main, v1.0-dev]   # PRs whose BASE branch is main or v1.0-dev
    # labeled = `run-e2e` was just added; the other three run only while it is on.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      head_ref:
        description: "Branch to run (defaults to the caller ref)"
        required: false
      head_sha:
        description: "Exact commit SHA to run (defaults to the resolved head_ref)"
        required: false

# The workflow token writes the live commit status and the sticky PR report comment.
permissions:
  contents: read
  statuses: write
  pull-requests: write
  issues: write

jobs:
  # Cheap gate that resolves the PR metadata for every supported trigger
  # (pull_request carrying `run-e2e` / workflow_dispatch). The job-level `if` is the
  # whole decision for a PR: an unlabeled PR, or a label other than `run-e2e` being
  # added, never allocates a runner.
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       ((github.event.action == 'labeled' && github.event.label.name == 'run-e2e') ||
        (github.event.action != 'labeled' &&
         contains(github.event.pull_request.labels.*.name, 'run-e2e'))))
    # GitHub API + jq only. Keep Hyperloom-e2e-ci for the smoke job.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      runner_label: ${{ steps.decide.outputs.runner_label }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
      head_ref: ${{ steps.decide.outputs.head_ref }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      head_repo: ${{ steps.decide.outputs.head_repo }}
    steps:
      - name: Ensure jq
        run: command -v jq >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y jq)

      - name: Decide + resolve PR metadata
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          # The pool, and the runner a PR opts into with the `e2e-canary` label.
          # CANARY is empty unless somebody sets the variable, and an empty CANARY
          # makes the label inert -- so merging this changes nothing on its own.
          DEFAULT_RUNNER_LABEL: ${{ vars.CI_E2E_RUNNER_LABEL || 'Hyperloom-e2e-ci' }}
          CANARY_RUNNER_LABEL: ${{ vars.CI_E2E_CANARY_RUNNER_LABEL }}
          PR_NUMBER_EVT: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DISPATCH_HEAD_REF: ${{ inputs.head_ref }}
          DISPATCH_HEAD_SHA: ${{ inputs.head_sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          run=false; pr_number=""; head_ref=""; head_sha=""; head_repo=""
          # Never empty: a `runs-on` that evaluates to "" is not a job that fails, it
          # is a job that never schedules.
          runner_label="$DEFAULT_RUNNER_LABEL"
          labels_json='[]'
          emit() {
            {
              echo "run=$run"
              echo "runner_label=$runner_label"
              echo "pr_number=$pr_number"
              echo "head_ref=$head_ref"
              echo "head_sha=$head_sha"
              echo "head_repo=$head_repo"
            } >> "$GITHUB_OUTPUT"
          }
          case "$EVENT" in
            workflow_dispatch)
              run=true
              head_ref="${DISPATCH_HEAD_REF:-$REF_NAME}"
              head_sha="${DISPATCH_HEAD_SHA:-}"
              if [ -z "$head_sha" ]; then
                ref_uri="$(printf '%s' "$head_ref" | jq -sRr @uri)"
                commit_json="$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "$API_URL/repos/$REPO/commits/$ref_uri")"
                head_sha="$(printf '%s' "$commit_json" | jq -r '.sha // ""')"
              fi
              ;;
            pull_request)
              # The job's `if` already required `run-e2e`.
              labels_json="$PR_LABELS_JSON"
              run=true
              pr_number="$PR_NUMBER_EVT"; head_ref="$PR_HEAD_REF"
              head_sha="$PR_HEAD_SHA"; head_repo="$PR_HEAD_REPO"
              ;;
          esac
          # One decision for every trigger, rather than an expression on the job that
          # can only see the pull_request event's shape.
          #
          # Deliberately not `jq -e`: with no output values -- which is what jq does on
          # empty or unparseable input -- `jq -e` exits 0, and the guard would fail OPEN
          # onto the single canary runner. Comparing a printed boolean fails closed,
          # because anything other than the literal `true` is the pool.
          has_canary="$(printf '%s' "$labels_json" \
            | jq -r '[.[]? | select(. == "e2e-canary")] | length > 0' 2>/dev/null || true)"
          if [ -n "$CANARY_RUNNER_LABEL" ] && [ "$has_canary" = true ]; then
            runner_label="$CANARY_RUNNER_LABEL"
            echo "e2e-canary label present; running on $runner_label"
          fi

          if [ "$run" = true ] && [ -z "$head_sha" ]; then
            echo "failed to resolve head_sha for ref=$head_ref" >&2
            exit 1
          fi
          echo "decision: run=$run pr=$pr_number ref=$head_ref sha=$head_sha repo=$head_repo runner=$runner_label"
          emit

  e2e:
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    # Joined only once `resolve` has decided to run. At workflow level, every event on
    # the PR -- adding an unrelated label included -- would create a run in this group
    # and cancel the GPU run in flight. A newer commit still preempts the old run, and
    # the cleanup step below cancels its workload so no GPU is leaked. A dispatch has
    # no PR number, so it keys on head_sha: two dispatches of different commits do not
    # cancel each other.
    concurrency:
      group: ci-e2e-${{ needs.resolve.outputs.pr_number || needs.resolve.outputs.head_sha || needs.resolve.outputs.head_ref || github.ref }}
      cancel-in-progress: true
    # A self-hosted runner that can reach github.com + the run API. Which one is
    # decided in `resolve`, from the PR's labels.
    #
    # Defaults to the `Hyperloom-e2e-ci` pool. Two things move it, most specific first:
    #
    #   * `vars.CI_E2E_CANARY_RUNNER_LABEL` + the `e2e-canary` label on a PR moves
    #     THAT PR only. For proving a new runner: every other PR keeps the pool's
    #     eight runners and its concurrency. Unset variable => the label does nothing.
    #   * `vars.CI_E2E_RUNNER_LABEL` moves every PR that is not opted in above. For
    #     once a replacement is trusted and the whole pool should follow.
    runs-on: ${{ needs.resolve.outputs.runner_label }}
    # Covers the wait for a GPU (QUEUE_TIMEOUT_S, 4h) and the run once its sandbox is
    # ready (MAX_HOURS plus an hour of setup and close-out), with room for the rest.
    timeout-minutes: ${{ fromJSON(vars.CI_E2E_JOB_TIMEOUT_MIN || '510') }}
    steps:
      - name: Checkout (workflow scripts only)
        uses: actions/checkout@v7

      - name: Ensure jq
        run: command -v jq >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y jq)

      - name: Dispatch + monitor single-GPU smoke run
        id: run
        env:
          # Dispatron's compat facade, which speaks the same frozen
          # /api/v1/orchestration/workloads contract the retired backend did. No
          # ingress and unauthenticated because it is only reachable inside the
          # cluster -- which the runner carrying `dispatron-ci` is.
          DISPATRON_BASE_URL: ${{ vars.CI_E2E_DISPATRON_BASE_URL || 'http://dispatron-api.dispatron.svc.cluster.local:8080' }}
          DISPATCH_TOKEN: ${{ secrets.CI_E2E_API_KEY }}
          # Read by `dispatron-ci-cancel` in the cleanup step below, so a hard-killed
          # job still releases its GPUs.
          DISPATCH_UID_FILE: ${{ runner.temp }}/e2e_session_uid
          MODEL: ${{ secrets.CI_E2E_MODEL }}
          MODEL_CLASS: ${{ secrets.CI_E2E_MODEL_CLASS }}
          MODEL_BASE: ${{ secrets.CI_E2E_MODEL_BASE }}
          GPUS: ${{ secrets.CI_E2E_GPUS }}
          TP: ${{ secrets.CI_E2E_TP }}
          MAX_HOURS: ${{ secrets.CI_E2E_MAX_HOURS }}
          # Account identity the run dispatches under.
          CI_E2E_USER_NAME: ${{ secrets.CI_E2E_USER_NAME }}
          # Per-PR checkout base dir.
          CI_E2E_PR_CHECK_BASE: ${{ secrets.CI_E2E_PR_CHECK_BASE }}
          # The API endpoint may use a private CA; skip TLS verify unless a CA bundle is
          # provided. Set the CI_E2E_INSECURE secret to 0 once the runner trusts the CA.
          CI_E2E_INSECURE: ${{ secrets.CI_E2E_INSECURE || '1' }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          HEAD_REF: ${{ needs.resolve.outputs.head_ref }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          # Tokenized clone URLs so the run can clone this PR branch. github.token is
          # ephemeral (expires with the run) and can read same-repo PRs.
          HEAD_REPO_URL: ${{ needs.resolve.outputs.head_repo && format('https://x-access-token:{0}@github.com/{1}.git', github.token, needs.resolve.outputs.head_repo) || '' }}
          BASE_REPO_URL: ${{ format('https://x-access-token:{0}@github.com/{1}.git', github.token, github.repository) }}
          # Live commit status on the PR, refreshed every STATUS_INTERVAL_S.
          GH_STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_STATUS_REPO: ${{ github.repository }}
          GH_STATUS_SHA: ${{ needs.resolve.outputs.head_sha }}
          GH_STATUS_DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS_INTERVAL_S: "300"
          POLL_INTERVAL_S: "60"
          # How long to wait for a GPU. Counted separately from the run, so a busy
          # cluster ends the check as "no capacity" instead of spending the run's time.
          QUEUE_TIMEOUT_S: ${{ vars.CI_E2E_QUEUE_TIMEOUT_S || '14400' }}
        run: |
          chmod +x .github/scripts/ci-e2e-dispatch.sh
          .github/scripts/ci-e2e-dispatch.sh

      # The dispatch step posts the terminal status itself. A job that ends without
      # one -- cancelled, or killed mid-run -- would otherwise leave the check pending
      # on the commit for good.
      - name: Backstop terminal commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve.outputs.head_sha }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ -f "${RUNNER_TEMP}/ci_e2e_status_terminal" ]; then exit 0; fi
          uid="$(cat "${RUNNER_TEMP}/e2e_session_uid" 2>/dev/null || true)"
          case "$JOB_STATUS" in
            success) state=success; desc="CI E2E run passed; terminal status backfilled" ;;
            cancelled) state=error; desc="CI E2E cancelled before a terminal run state" ;;
            *) state=failure; desc="CI E2E job ${JOB_STATUS} before a terminal run state" ;;
          esac
          [ -n "$uid" ] && desc="${desc}; uid=${uid}"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL/repos/$REPO/statuses/$SHA" \
            -d "$(jq -n --arg s "$state" --arg d "${desc:0:139}" --arg u "$DETAILS_URL" \
              '{state:$s, description:$d, context:"ci-e2e/run", target_url:$u}')"

      # If the job is cancelled (manual stop, or a newer commit via concurrency
      # cancel-in-progress), GitHub still runs this step — cancel the workload so the
      # GPU run doesn't leak. Reliable even when the main step is hard-killed.
      - name: Cancel workload on job cancel
        if: cancelled()
        env:
          DISPATRON_BASE_URL: ${{ vars.CI_E2E_DISPATRON_BASE_URL || 'http://dispatron-api.dispatron.svc.cluster.local:8080' }}
          DISPATCH_TOKEN: ${{ secrets.CI_E2E_API_KEY }}
          DISPATCH_UID_FILE: ${{ runner.temp }}/e2e_session_uid
          CI_E2E_INSECURE: ${{ secrets.CI_E2E_INSECURE || '0' }}
        run: |
          command -v dispatron-ci-cancel >/dev/null 2>&1 || {
            echo "dispatron-ci-cancel is not on PATH; cannot cancel"; exit 0
          }
          insecure=""
          if [ "${CI_E2E_INSECURE:-0}" = "1" ]; then insecure="--insecure"; fi
          # Tells a recorded cancel (202) apart from a confirmed one, so a cancel that
          # did not stop the workload cannot read as "the GPUs are back".
          dispatron-ci-cancel --base-url "$DISPATRON_BASE_URL" $insecure

# --- docs: quick reference -------------------------------------------------
# Triggers:  `run-e2e` label on a PR (base main/v1.0-dev): when it is added, then on
#            every new commit while it stays · manual dispatch
# Re-run:    remove `run-e2e` and add it again.
# Runner:    `Hyperloom-e2e-ci` pool, unless `vars.CI_E2E_CANARY_RUNNER_LABEL` is set
#            and the PR carries `e2e-canary` (that PR only), or
#            `vars.CI_E2E_RUNNER_LABEL` is set (all PRs).
