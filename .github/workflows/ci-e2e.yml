name: CI E2E (single-GPU smoke run)

# Every PR targeting `main` or `v1.0-dev` dispatches ONE single-GPU inference-optimizer
# run built from the PR's branch, monitors it, and reports green (Succeeded) / red
# (Failed or timeout). Opt OUT by adding the `skip-e2e-test` label. Runs on a
# self-hosted runner that can reach the run API.
#
# Run ONE PR on a different runner (for proving a replacement without moving everyone
# onto it): set `vars.CI_E2E_CANARY_RUNNER_LABEL` to that runner's label and add the
# `e2e-canary` label to the PR. The label alone does not start a run -- add `retest`
# or comment `/retest` after it. Remove the label to go back.
#
# Re-run WITHOUT a new commit (e.g. after a transient cluster fault):
#   * add the `retest` label to the PR (auto-removed so it can be re-applied), or
#   * comment `/retest` (or `/retest-failed`) on the PR.
# NOTE: the comment path uses `issue_comment`, which GitHub always loads from the
# DEFAULT branch's workflow file. It only works once this workflow lives on the
# default branch. The `retest` label path works from the PR branch immediately.

on:
  pull_request:
    branches: [main, v1.0-dev]   # PRs whose BASE branch is main or v1.0-dev
    # opened/synchronize/reopened = run on create + new commits + reopen.
    # labeled/unlabeled = re-evaluate for `skip-e2e-test` / `retest`.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      head_ref:
        description: "Branch to run (defaults to the caller ref)"
        required: false
      head_sha:
        description: "Exact commit SHA to run (defaults to the resolved head_ref)"
        required: false

# A newer commit / retest on the same PR cancels the in-flight run; the cleanup step
# below cancels the workload so no GPU is leaked.
#
# A comment that is NOT a `/retest` command must stay OUT of that group. GitHub
# evaluates `concurrency` when the run is created -- before the `resolve` job's `if`
# below -- so an ordinary review comment on a PR would otherwise cancel that PR's
# in-flight run and then skip itself, losing a multi-hour GPU run to a comment. Such
# comments get a group of their own (keyed by comment id) so they cancel nothing. The
# `/retest` predicate is kept identical to the one in `resolve.if`, so exactly the
# comments that can start a run are the comments that can cancel one.
#
# workflow_dispatch has no pull_request.number / issue.number, so the group used
# to fall through to github.ref (refs/heads/main for every dispatch) and
# cancel-in-progress killed the previous GPU smoke. Key on inputs.head_sha
# (then head_ref) so two fork-PR dispatches can run without cancelling each other.
concurrency:
  group: >-
    ci-e2e-${{
      (github.event_name == 'issue_comment' && !contains(github.event.comment.body, '/retest'))
      && format('noop-comment-{0}', github.event.comment.id)
      || (github.event.pull_request.number || github.event.issue.number || inputs.head_sha || inputs.head_ref || github.ref)
    }}
  cancel-in-progress: true

# The workflow token writes the live commit status, the sticky PR report comment, and
# removes the consumed `retest` label.
permissions:
  contents: read
  statuses: write
  pull-requests: write
  issues: write

jobs:
  # Cheap gate that decides whether to run and resolves the PR metadata for every
  # supported trigger (pull_request / issue_comment `/retest` / workflow_dispatch).
  # The job-level `if` keeps unrelated comments and labels from allocating a runner.
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/retest')) ||
      (github.event_name == 'pull_request' &&
       (github.event.action != 'labeled' ||
        github.event.label.name == 'retest' ||
        github.event.label.name == 'skip-e2e-test') &&
       (github.event.action != 'unlabeled' || github.event.label.name == 'skip-e2e-test'))
    # GitHub API + jq only. Keep Hyperloom-e2e-ci for the smoke job.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      runner_label: ${{ steps.decide.outputs.runner_label }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
      head_ref: ${{ steps.decide.outputs.head_ref }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      head_repo: ${{ steps.decide.outputs.head_repo }}
    steps:
      - name: Ensure jq
        run: command -v jq >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y jq)

      - name: Decide + resolve PR metadata
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          # The pool, and the runner a PR opts into with the `e2e-canary` label.
          # CANARY is empty unless somebody sets the variable, and an empty CANARY
          # makes the label inert -- so merging this changes nothing on its own.
          DEFAULT_RUNNER_LABEL: ${{ vars.CI_E2E_RUNNER_LABEL || 'Hyperloom-e2e-ci' }}
          CANARY_RUNNER_LABEL: ${{ vars.CI_E2E_CANARY_RUNNER_LABEL }}
          PR_NUMBER_EVT: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request != null }}
          DISPATCH_HEAD_REF: ${{ inputs.head_ref }}
          DISPATCH_HEAD_SHA: ${{ inputs.head_sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          run=false; pr_number=""; head_ref=""; head_sha=""; head_repo=""
          # Never empty: a `runs-on` that evaluates to "" is not a job that fails, it
          # is a job that never schedules.
          runner_label="$DEFAULT_RUNNER_LABEL"
          labels_json='[]'
          emit() {
            {
              echo "run=$run"
              echo "runner_label=$runner_label"
              echo "pr_number=$pr_number"
              echo "head_ref=$head_ref"
              echo "head_sha=$head_sha"
              echo "head_repo=$head_repo"
            } >> "$GITHUB_OUTPUT"
          }
          case "$EVENT" in
            workflow_dispatch)
              run=true
              head_ref="${DISPATCH_HEAD_REF:-$REF_NAME}"
              head_sha="${DISPATCH_HEAD_SHA:-}"
              if [ -z "$head_sha" ]; then
                ref_uri="$(printf '%s' "$head_ref" | jq -sRr @uri)"
                commit_json="$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "$API_URL/repos/$REPO/commits/$ref_uri")"
                head_sha="$(printf '%s' "$commit_json" | jq -r '.sha // ""')"
              fi
              ;;
            pull_request)
              labels_json="$PR_LABELS_JSON"
              if echo "$PR_LABELS_JSON" | jq -e 'index("skip-e2e-test")' >/dev/null 2>&1; then
                echo "skip-e2e-test present; skipping"; emit; exit 0
              fi
              if [ "$ACTION" = "labeled" ] && [ "$LABEL" != "retest" ]; then
                echo "labeled '$LABEL' (not retest); skipping"; emit; exit 0
              fi
              if [ "$ACTION" = "unlabeled" ] && [ "$LABEL" != "skip-e2e-test" ]; then
                echo "unlabeled '$LABEL' (not skip-e2e-test); skipping"; emit; exit 0
              fi
              run=true
              pr_number="$PR_NUMBER_EVT"; head_ref="$PR_HEAD_REF"
              head_sha="$PR_HEAD_SHA"; head_repo="$PR_HEAD_REPO"
              ;;
            issue_comment)
              if [ "$IS_PR_COMMENT" != "true" ]; then
                echo "not a PR comment; skipping"; emit; exit 0
              fi
              body="$(printf '%s' "$COMMENT_BODY" | tr -d '\r')"
              if ! printf '%s' "$body" | grep -qiE '(^|[[:space:]])/retest(-failed)?([[:space:]]|$)'; then
                echo "no /retest command; skipping"; emit; exit 0
              fi
              pr_number="$ISSUE_NUMBER"
              pr_json="$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$API_URL/repos/$REPO/pulls/$pr_number")"
              head_ref="$(printf '%s' "$pr_json" | jq -r '.head.ref // ""')"
              head_sha="$(printf '%s' "$pr_json" | jq -r '.head.sha // ""')"
              head_repo="$(printf '%s' "$pr_json" | jq -r '.head.repo.full_name // ""')"
              # `github.event.pull_request` does not exist on an issue_comment, so the
              # labels have to come from the PR fetched above or `/retest` would always
              # land on the pool. `[]?` for the same reason the three lines above use
              # `// ""`: on an error body this must degrade to "no labels" and let the
              # head_sha check below report it, not abort the step with a jq trace.
              labels_json="$(printf '%s' "$pr_json" | jq -c '[.labels[]?.name]')"
              run=true
              ;;
          esac
          # One decision for every trigger, rather than an expression on the job that
          # can only see the pull_request event's shape.
          #
          # Deliberately not `jq -e`: with no output values -- which is what jq does on
          # empty or unparseable input -- `jq -e` exits 0, and the guard would fail OPEN
          # onto the single canary runner. Comparing a printed boolean fails closed,
          # because anything other than the literal `true` is the pool.
          has_canary="$(printf '%s' "$labels_json" \
            | jq -r '[.[]? | select(. == "e2e-canary")] | length > 0' 2>/dev/null || true)"
          if [ -n "$CANARY_RUNNER_LABEL" ] && [ "$has_canary" = true ]; then
            runner_label="$CANARY_RUNNER_LABEL"
            echo "e2e-canary label present; running on $runner_label"
          fi

          if [ "$run" = true ] && [ -z "$head_sha" ]; then
            echo "failed to resolve head_sha for ref=$head_ref" >&2
            exit 1
          fi
          echo "decision: run=$run pr=$pr_number ref=$head_ref sha=$head_sha repo=$head_repo runner=$runner_label"
          emit

  e2e:
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    # A self-hosted runner that can reach github.com + the run API. Which one is
    # decided in `resolve`, not in an expression here: the answer depends on the PR's
    # labels, and `github.event.pull_request` is null on an issue_comment, so an
    # expression on this line would silently send every `/retest` to the pool.
    #
    # Defaults to the `Hyperloom-e2e-ci` pool. Two things move it, most specific first:
    #
    #   * `vars.CI_E2E_CANARY_RUNNER_LABEL` + the `e2e-canary` label on a PR moves
    #     THAT PR only. For proving a new runner: every other PR keeps the pool's
    #     eight runners and its concurrency. Unset variable => the label does nothing.
    #   * `vars.CI_E2E_RUNNER_LABEL` moves every PR that is not opted in above. For
    #     once a replacement is trusted and the whole pool should follow.
    runs-on: ${{ needs.resolve.outputs.runner_label }}
    # Covers a full MAX_HOURS run + setup/baseline overhead.
    timeout-minutes: 240
    steps:
      - name: Consume retest label
        if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'retest'
        run: |
          curl -sS -X DELETE \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/issues/${{ needs.resolve.outputs.pr_number }}/labels/retest" \
            -o /dev/null -w 'remove-label HTTP=%{http_code}\n' || true

      - name: Checkout (workflow scripts only)
        uses: actions/checkout@v7

      - name: Ensure jq
        run: command -v jq >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y jq)

      - name: Dispatch + monitor single-GPU smoke run
        id: run
        env:
          # Dispatron's compat facade, which speaks the same frozen
          # /api/v1/orchestration/workloads contract the retired backend did. No
          # ingress and unauthenticated because it is only reachable inside the
          # cluster -- which the runner carrying `dispatron-ci` is.
          DISPATRON_BASE_URL: ${{ vars.CI_E2E_DISPATRON_BASE_URL || 'http://dispatron-api.dispatron.svc.cluster.local:8080' }}
          DISPATCH_TOKEN: ${{ secrets.CI_E2E_API_KEY }}
          # Read by `dispatron-ci-cancel` in the cleanup step below, so a hard-killed
          # job still releases its GPUs.
          DISPATCH_UID_FILE: ${{ runner.temp }}/e2e_session_uid
          MODEL: ${{ secrets.CI_E2E_MODEL }}
          MODEL_CLASS: ${{ secrets.CI_E2E_MODEL_CLASS }}
          MODEL_BASE: ${{ secrets.CI_E2E_MODEL_BASE }}
          GPUS: ${{ secrets.CI_E2E_GPUS }}
          TP: ${{ secrets.CI_E2E_TP }}
          MAX_HOURS: ${{ secrets.CI_E2E_MAX_HOURS }}
          # Account identity the run dispatches under.
          CI_E2E_USER_NAME: ${{ secrets.CI_E2E_USER_NAME }}
          # Per-PR checkout base dir.
          CI_E2E_PR_CHECK_BASE: ${{ secrets.CI_E2E_PR_CHECK_BASE }}
          # The API endpoint may use a private CA; skip TLS verify unless a CA bundle is
          # provided. Set the CI_E2E_INSECURE secret to 0 once the runner trusts the CA.
          CI_E2E_INSECURE: ${{ secrets.CI_E2E_INSECURE || '1' }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          HEAD_REF: ${{ needs.resolve.outputs.head_ref }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          # Tokenized clone URLs so the run can clone this PR branch. github.token is
          # ephemeral (expires with the run) and can read same-repo PRs.
          HEAD_REPO_URL: ${{ needs.resolve.outputs.head_repo && format('https://x-access-token:{0}@github.com/{1}.git', github.token, needs.resolve.outputs.head_repo) || '' }}
          BASE_REPO_URL: ${{ format('https://x-access-token:{0}@github.com/{1}.git', github.token, github.repository) }}
          # Live commit status on the PR, refreshed every STATUS_INTERVAL_S.
          GH_STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_STATUS_REPO: ${{ github.repository }}
          GH_STATUS_SHA: ${{ needs.resolve.outputs.head_sha }}
          GH_STATUS_DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS_INTERVAL_S: "300"
          # Poll long enough to cover the run budget.
          POLL_INTERVAL_S: "60"
          POLL_MAX: "220"
        run: |
          chmod +x .github/scripts/ci-e2e-dispatch.sh
          .github/scripts/ci-e2e-dispatch.sh

      # If the job is cancelled (manual stop, or a newer commit / retest via concurrency
      # cancel-in-progress), GitHub still runs this step — cancel the workload so the
      # GPU run doesn't leak. Reliable even when the main step is hard-killed.
      - name: Cancel workload on job cancel
        if: cancelled()
        env:
          DISPATRON_BASE_URL: ${{ vars.CI_E2E_DISPATRON_BASE_URL || 'http://dispatron-api.dispatron.svc.cluster.local:8080' }}
          DISPATCH_TOKEN: ${{ secrets.CI_E2E_API_KEY }}
          DISPATCH_UID_FILE: ${{ runner.temp }}/e2e_session_uid
          CI_E2E_INSECURE: ${{ secrets.CI_E2E_INSECURE || '0' }}
        run: |
          command -v dispatron-ci-cancel >/dev/null 2>&1 || {
            echo "dispatron-ci-cancel is not on PATH; cannot cancel"; exit 0
          }
          insecure=""
          if [ "${CI_E2E_INSECURE:-0}" = "1" ]; then insecure="--insecure"; fi
          # Tells a recorded cancel (202) apart from a confirmed one, so a cancel that
          # did not stop the workload cannot read as "the GPUs are back".
          dispatron-ci-cancel --base-url "$DISPATRON_BASE_URL" $insecure

# --- docs: quick reference -------------------------------------------------
# Triggers:  PR (base main/v1.0-dev) · `retest` label · `/retest` comment · manual dispatch
# Opt out:   add the `skip-e2e-test` label (PRs that don't touch runtime code).
# Runner:    `Hyperloom-e2e-ci` pool, unless `vars.CI_E2E_CANARY_RUNNER_LABEL` is set
#            and the PR carries `e2e-canary` (that PR only), or
#            `vars.CI_E2E_RUNNER_LABEL` is set (all PRs).
