# Copyright Advanced Micro Devices, Inc. All rights reserved.

name: "Inference A/B Test"

on:
  workflow_dispatch:
    inputs:
      plugin_id_a:
        description: 'A group: Claw plugin ID (e.g. 4 = current Hyperloom = wekafs inference_optimizer)'
        required: false
        default: '4'
      label_a:
        description: 'A group label (shown in comparison table)'
        required: false
        default: 'Plugin 4 (current)'
      plugin_id_b:
        description: 'B group: Claw plugin ID (override to compare a different plugin build)'
        required: false
        default: '4'
      label_b:
        description: 'B group label (shown in comparison table)'
        required: false
        default: 'Plugin 4 (control)'
      mode:
        description: 'ab = run both A and B, single = run B only (cheaper)'
        required: false
        default: 'ab'
        type: choice
        options:
          - ab
          - single
      models:
        description: 'Comma-separated model keys (empty = all from ci-config.yaml)'
        required: false
        default: ''

permissions:
  contents: read

env:
  SAFE_BASE_URL: ${{ secrets.SAFE_BASE_URL }}
  NFS_ROOT: ${{ secrets.NFS_ROOT }}
  HARBOR_PREFIX: ${{ secrets.HARBOR_PREFIX }}
  KERNEL_OPT_WORKSPACE: ${{ secrets.KERNEL_OPT_WORKSPACE }}
  CLAW_API_KEY: ${{ secrets.CLAW_API_KEY }}
  WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
  SANDBOX_WORKSPACE: ${{ secrets.SANDBOX_WORKSPACE }}
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

jobs:
  prepare:
    name: Prepare Model Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate matrix
        id: matrix
        working-directory: ci
        env:
          INPUT_MODELS: ${{ github.event.inputs.models }}
        run: |
          pip3 install -q pyyaml 2>/dev/null || pip install -q pyyaml
          python3 generate_matrix.py

  group-a:
    name: "A: ${{ matrix.key }}"
    needs: prepare
    if: github.event.inputs.mode != 'single'
    runs-on: hyperloom-mh826
    timeout-minutes: 510
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - name: Run optimization (Group A)
        working-directory: ci
        run: |
          python3 orchestrator.py \
            --trigger "ab-test-A" \
            --models "${{ matrix.key }}" \
            --plugin-id "${{ github.event.inputs.plugin_id_a }}" \
            --output-dir "${{ github.workspace }}/ci-output"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: A-${{ matrix.key }}
          path: |
            ci-output/ci_report.md
            ci-output/ci_summary.json
            ci-output/github_summary.md
            ci-output/*/optimization_report.md
          retention-days: 90

  group-b:
    name: "B: ${{ matrix.key }}"
    needs: prepare
    runs-on: hyperloom-mh826
    timeout-minutes: 510
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - name: Run optimization (Group B)
        working-directory: ci
        run: |
          python3 orchestrator.py \
            --trigger "ab-test-B" \
            --models "${{ matrix.key }}" \
            --plugin-id "${{ github.event.inputs.plugin_id_b }}" \
            --output-dir "${{ github.workspace }}/ci-output"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: B-${{ matrix.key }}
          path: |
            ci-output/ci_report.md
            ci-output/ci_summary.json
            ci-output/github_summary.md
            ci-output/*/optimization_report.md
          retention-days: 90

  compare:
    name: "Compare A vs B"
    needs: [group-a, group-b]
    if: always()
    runs-on: hyperloom-mh826
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Fetch last CI run as group A (single mode)
        if: github.event.inputs.mode == 'single'
        run: |
          pip3 install -q requests 2>/dev/null || true
          python3 - <<'FETCH_A'
          import requests, json, os, zipfile, io
          token = os.environ.get("GITHUB_TOKEN", "")
          api_key = os.environ.get("CLAW_API_KEY", "")
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
          runs = requests.get(
              "https://api.github.com/repos/AMD-AGI/Hyperloom/actions/workflows/inference-optimization-ci.yml/runs?per_page=10&status=completed",
              headers=headers).json()
          success_run = next((r for r in runs.get("workflow_runs", []) if r["conclusion"] == "success"), None)
          if not success_run:
              print("No successful CI run found, skipping A data")
              exit(0)
          print(f"Using CI run {success_run['id']} from {success_run['created_at']} as group A")
          artifacts = requests.get(
              f"https://api.github.com/repos/AMD-AGI/Hyperloom/actions/runs/{success_run['id']}/artifacts",
              headers=headers).json()
          for art in artifacts.get("artifacts", []):
              if not art["name"].startswith("report-"):
                  continue
              model_key = art["name"].replace("report-", "")
              out_dir = f"artifacts/A-{model_key}"
              os.makedirs(out_dir, exist_ok=True)
              dl = requests.get(
                  f"https://api.github.com/repos/AMD-AGI/Hyperloom/actions/artifacts/{art['id']}/zip",
                  headers=headers)
              with zipfile.ZipFile(io.BytesIO(dl.content)) as zf:
                  zf.extractall(out_dir)
              print(f"  Downloaded {art['name']} -> {out_dir}")
          FETCH_A
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate comparison
        run: |
          pip3 install -q requests 2>/dev/null || true
          python3 - <<'PYEOF'
          import json, os, glob

          def load_summary(prefix):
              results = {}
              for f in glob.glob(f"artifacts/{prefix}-*/ci_summary.json"):
                  data = json.load(open(f))
                  for m in data.get("models", []):
                      results[m["model"]] = m
              return results

          def build_config_diff(plugin_id_a, plugin_id_b):
              """Plugin-level diff: compare the two plugin IDs as opaque labels.

              Plugins encapsulate tools / mcp servers / prompt templates
              server-side, so the per-tool URL/skill expansion the old version
              did is now hidden behind the plugin abstraction. If you need a
              detailed breakdown, query GET /claw-api/v1/plugins/<id> manually
              and add the column you need here.
              """
              if plugin_id_a == plugin_id_b:
                  return (
                      [("Plugin", f"plugin {plugin_id_a}", f"plugin {plugin_id_b}", False)],
                      f"plugin {plugin_id_a} (control / reproducibility run)",
                  )
              return (
                  [("Plugin", f"plugin {plugin_id_a}", f"plugin {plugin_id_b}", True)],
                  f"plugin {plugin_id_a} vs plugin {plugin_id_b}",
              )

          a = load_summary("A")
          b = load_summary("B")
          models = sorted(set(list(a.keys()) + list(b.keys())))

          mode = "${{ github.event.inputs.mode }}" or "ab"
          label_a = "Last CI (baseline)" if mode == "single" else ("${{ github.event.inputs.label_a }}" or "A")
          label_b = "${{ github.event.inputs.label_b }}" or "B"
          plugin_id_a = "${{ github.event.inputs.plugin_id_a }}"
          plugin_id_b = "${{ github.event.inputs.plugin_id_b }}"

          config_diff, subtitle = build_config_diff(plugin_id_a, plugin_id_b)

          def fmt(v, suffix=""): return f"{v:.1f}{suffix}" if v is not None else "N/A"

          lines = []
          lines.append(f"## A/B Test: {label_a} vs {label_b}\n")
          if config_diff:
              lines.append("| Config | A | B |")
              lines.append("|--------|---|---|")
              for comp, va, vb, is_diff in config_diff:
                  marker = " **<--**" if is_diff else ""
                  lines.append(f"| {'**'+comp+'**' if is_diff else comp} | {va} | {vb} |{marker}")
              lines.append("")
          lines.append(f"| Model | A Optimized (Gain) | B Optimized (Gain) | Winner |")
          lines.append("|-------|--------------------|--------------------|--------|")
          for model in models:
              ra, rb = a.get(model, {}), b.get(model, {})
              a_opt, a_gain = ra.get("optimized_tok_per_gpu"), ra.get("gain_pct")
              b_opt, b_gain = rb.get("optimized_tok_per_gpu"), rb.get("gain_pct")
              if a_opt is not None and b_opt is not None:
                  winner = f"**A** (+{abs(a_opt-b_opt):.1f})" if a_opt > b_opt else f"**B** (+{abs(b_opt-a_opt):.1f})" if b_opt > a_opt else "Tie"
              else:
                  winner = "N/A"
              lines.append(f"| {model} | {fmt(a_opt)} ({fmt(a_gain, '%')}) | {fmt(b_opt)} ({fmt(b_gain, '%')}) | {winner} |")

          report = "\n".join(lines)
          print(report)
          os.makedirs("comparison", exist_ok=True)
          with open("comparison/ab_comparison.md", "w") as f:
              f.write(report)
          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_file:
              with open(summary_file, "a") as f:
                  f.write(report)

          webhook_url = os.environ.get("WEBHOOK_URL")
          if webhook_url:
              import requests as req
              def v(x, s=""): return f"{x:.1f}{s}" if x is not None else "N/A"
              def cell(text, **kw):
                  return {"type": "TableCell", "items": [{"type": "TextBlock", "text": text, **kw}]}
              def make_row(label, va, vb, bold=False, color=None):
                  sa, sb = {}, {}
                  if bold: sa["weight"] = sb["weight"] = "Bolder"
                  if color: sa["color"] = sb["color"] = color
                  return {"type": "TableRow", "cells": [cell(label), cell(str(va), **sa), cell(str(vb), **sb)]}

              config_card_rows = [{"type": "TableRow", "style": "accent", "cells": [
                  cell("Config", weight="Bolder"), cell("A", weight="Bolder"), cell("B", weight="Bolder")]}]
              for comp, va, vb, is_diff in config_diff:
                  if is_diff:
                      config_card_rows.append({"type": "TableRow", "cells": [
                          cell(comp, weight="Bolder"), cell(va, color="Accent"), cell(vb, color="Accent")]})
                  else:
                      config_card_rows.append({"type": "TableRow", "cells": [cell(comp), cell(va), cell(vb)]})

              body = [
                  {"type": "TextBlock", "weight": "Bolder", "size": "Large",
                   "text": f"A/B Test: {label_a} vs {label_b}"},
                  {"type": "Table", "columns": [{"width": 2}, {"width": 2}, {"width": 2}],
                   "rows": config_card_rows},
              ]

              a_wins = b_wins = ties = 0
              for model in models:
                  ra, rb = a.get(model, {}), b.get(model, {})
                  a_bl, a_opt, a_gain, a_vs = ra.get("baseline_tok_per_gpu"), ra.get("optimized_tok_per_gpu"), ra.get("gain_pct"), ra.get("vs_inferenceX_pct")
                  b_bl, b_opt, b_gain, b_vs = rb.get("baseline_tok_per_gpu"), rb.get("optimized_tok_per_gpu"), rb.get("gain_pct"), rb.get("vs_inferenceX_pct")
                  if a_opt is not None and b_opt is not None:
                      if a_opt > b_opt: winner = f"A (+{abs(a_opt-b_opt):.1f} tok/s)"; a_wins += 1
                      elif b_opt > a_opt: winner = f"B (+{abs(b_opt-a_opt):.1f} tok/s)"; b_wins += 1
                      else: winner = "Tie"; ties += 1
                  else:
                      winner = "N/A"
                  precision = ra.get("precision") or rb.get("precision") or ""
                  model_title = f"{model} ({precision})" if precision else model
                  body.append({"type": "TextBlock", "weight": "Bolder", "size": "Medium",
                               "text": model_title, "spacing": "Medium"})
                  body.append({"type": "Table", "columns": [{"width": 2}, {"width": 2}, {"width": 2}],
                      "rows": [
                          {"type": "TableRow", "style": "accent", "cells": [
                              cell("Metric", weight="Bolder"), cell(f"A: {label_a}", weight="Bolder"), cell(f"B: {label_b}", weight="Bolder")]},
                          make_row("Baseline (tok/s/GPU)", v(a_bl), v(b_bl)),
                          make_row("Optimized (tok/s/GPU)", v(a_opt), v(b_opt), bold=True),
                          make_row("Optimization Gain", v(a_gain, "%"), v(b_gain, "%"), color="Good"),
                          make_row("vs InferenceX", v(a_vs, "%"), v(b_vs, "%"), color="Good"),
                          {"type": "TableRow", "style": "accent", "cells": [
                              cell("Winner", weight="Bolder"),
                              cell(winner, weight="Bolder", color="Good" if winner != "N/A" else "Default", size="Medium"),
                              cell("")]},
                      ]})

              body.append({"type": "TextBlock", "spacing": "Medium", "weight": "Bolder",
                           "text": f"Overall: A wins {a_wins} | B wins {b_wins} | Tie {ties}"})

              card = {"type": "message", "attachments": [{"contentType": "application/vnd.microsoft.card.adaptive",
                  "content": {"$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      "type": "AdaptiveCard", "version": "1.4", "body": body}}]}
              try:
                  req.post(webhook_url, json=card, timeout=10, verify=False)
                  print("Webhook sent successfully")
              except Exception as e:
                  print(f"Webhook failed: {e}")
          PYEOF

      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ab-comparison
          path: comparison/
          retention-days: 90
