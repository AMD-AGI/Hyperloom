name: Inference A/B Test

on:
  workflow_dispatch:
    inputs:
      tools:
        description: 'Claw tool IDs (comma-separated, e.g. 22,23)'
        required: false
        default: '22,23'
      models:
        description: 'Comma-separated model keys (empty = all from ci-config.yaml)'
        required: false
        default: ''
      trigger_reason:
        description: 'Trigger reason'
        required: false
        default: 'ab-test'

env:
  HARBOR_PREFIX: ${{ secrets.HARBOR_PREFIX }}
  KERNEL_OPT_WORKSPACE: ${{ secrets.KERNEL_OPT_WORKSPACE }}
  CLAW_API_KEY: ${{ secrets.CLAW_API_KEY }}
  WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
  SANDBOX_WORKSPACE: ${{ secrets.SANDBOX_WORKSPACE }}
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

jobs:
  prepare:
    name: Prepare Model Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate matrix
        id: matrix
        working-directory: ci
        env:
          INPUT_MODELS: ${{ github.event.inputs.models }}
        run: |
          pip3 install -q pyyaml 2>/dev/null || pip install -q pyyaml
          python3 generate_matrix.py

  optimize:
    name: "${{ matrix.key }} (tools=${{ github.event.inputs.tools }})"
    needs: prepare
    runs-on: hyperloom-qn7cd
    timeout-minutes: 510
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Run optimization
        working-directory: ci
        run: |
          TRIGGER="${{ github.event.inputs.trigger_reason || 'ab-test' }}"
          python3 orchestrator.py \
            --trigger "$TRIGGER" \
            --models "${{ matrix.key }}" \
            --tools "${{ github.event.inputs.tools }}" \
            --output-dir "${{ github.workspace }}/ci-output"

      - name: Upload model report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-${{ github.event.inputs.tools }}-${{ matrix.key }}
          path: |
            ci-output/ci_report.md
            ci-output/ci_summary.json
            ci-output/github_summary.md
            ci-output/*/optimization_report.md
          retention-days: 90
