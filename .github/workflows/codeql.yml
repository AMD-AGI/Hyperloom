name: CodeQL

# PR/push on all branches: skip when all changes match paths-ignore (same as Tests
# with Coverage). Weekly schedule still runs on default branch for full analysis.
on:
  # PRs run via ``pull_request``; ``push`` is scoped to ``main`` so a same-repo
  # PR does not double-trigger. Weekly ``schedule`` still does a full analysis.
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - "COPYRIGHT"
      - "**/CODEOWNERS"
      - ".gitattributes"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - "COPYRIGHT"
      - "**/CODEOWNERS"
      - ".gitattributes"
  schedule:
    - cron: '0 6 * * 1'

# Cancel superseded runs for the same ref (does not affect scheduled runs,
# which use a distinct ref group).
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  # ``codeql-action/analyze`` reads the current workflow run via
  # ``GET /repos/.../actions/runs/{id}`` to attach run metadata to the
  # SARIF upload + send completion telemetry. Without ``actions: read``
  # both calls fail with ``Resource not accessible by integration``.
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
