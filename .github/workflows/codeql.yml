name: CodeQL

# PR/push on all branches: skip when all changes match paths-ignore (same as Tests
# with Coverage). Weekly schedule still runs on default branch for full analysis.
on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - "COPYRIGHT"
      - "CODEOWNERS"
      - ".gitattributes"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - "COPYRIGHT"
      - "CODEOWNERS"
      - ".gitattributes"
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  # ``codeql-action/analyze`` reads the current workflow run via
  # ``GET /repos/.../actions/runs/{id}`` to attach run metadata to the
  # SARIF upload + send completion telemetry. Without ``actions: read``
  # both calls fail with ``Resource not accessible by integration``.
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
