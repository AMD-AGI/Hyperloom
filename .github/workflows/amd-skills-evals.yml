name: AMD Skills Checks

# Runs the catalog's own harness against the skill amd/skills federates out of
# this repo, so a break is caught in the pull request that causes it rather
# than in the nightly import on the other side.
#
# ``skills`` names the exact folder rather than a glob, so moving or renaming
# it fails here too -- that path is what amd/skills declares in
# .github/federation.json, and the nightly importer raises on a path that is
# no longer there.
#
# ``paths`` covers the skill's parent directory, so a rename still triggers:
# git reports both the old and the new path as changed.
#
# Nothing outside that directory is read: skillscope is pinned below, and the
# skill links to nothing beyond itself. A relative link out would have to be
# listed here too, since structural resolves those and a missing target fails
# the run.
#
# The behavioral leg is absent rather than switched off: it drives the real
# optimizer, so it needs a GPU runner this repo's CI does not have, and on CPU
# it fails on the skill's own hardware preflight instead of on the skill.
on:
  # PRs run via ``pull_request``; ``push`` is scoped to ``main`` so a same-repo
  # PR does not double-trigger (one run per event class).
  push:
    branches: [main]
    paths:
      - "examples/skills/**"
      - ".github/workflows/amd-skills-evals.yml"
  pull_request:
    paths:
      - "examples/skills/**"
      - ".github/workflows/amd-skills-evals.yml"
  workflow_dispatch:
    inputs:
      structural:
        description: Structural Tests
        type: boolean
        default: true
      routing:
        description: Routing Tests
        type: boolean
        default: true

permissions:
  contents: read

# Cancel superseded runs for the same ref.
concurrency:
  group: amd-skills-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Free and offline, so it runs on a hosted runner and gates the paid leg
  # below: a malformed dataset should not be found halfway through a token run.
  structural:
    name: AMD Skills Checks
    # Pinned to the version amd/skills grades this skill with.
    uses: amd/skillscope/.github/workflows/reusable.yml@v0.1.3
    with:
      skills: examples/skills/hyperloom-workload-optimizer
      # Each step can be set to `required`, `optional`, or `off`. The two paid
      # legs are off here: this job runs on a hosted runner, which cannot reach
      # the LLM proxy. Routing is picked up by the job below instead.
      structural: ${{ github.event_name != 'workflow_dispatch' && 'required' || inputs.structural && 'required' || 'off' }}
      routing: "off"
      behavioral: "off"

  # Routing asks whether the skill fires on the prompts it owns and stays quiet
  # on its near misses. Deliberately not the reusable workflow: that one puts
  # every job on a single ``runner``, and its bookkeeping steps call ``python``
  # with no ``setup-python`` in front, which the label below does not have. The
  # composite action sets up its own Python, so it runs anywhere.
  routing:
    name: Routing Tests
    needs: structural
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.routing }}
    # The only label that can reach the LLM proxy; hosted runners time out.
    runs-on: ${{ vars.PR_REVIEW_RUNNER_LABEL }}
    timeout-minutes: 40
    env:
      ANTHROPIC_API_KEY: ${{ secrets.PR_REVIEW_ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ vars.PR_REVIEW_ANTHROPIC_BASE_URL }}
      # skillscope pins automated runs to the `opus` alias and takes no
      # override, so the alias is what has to point at a model the proxy
      # serves. The claude CLI resolves it from this variable.
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.PR_REVIEW_MODEL }}
      # The proxy presents a certificate without its intermediate, the same
      # reason pr-review.yml carries this switch.
      NODE_TLS_REJECT_UNAUTHORIZED: ${{ vars.PR_REVIEW_INSECURE == '1' && '0' || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run the routing eval
        uses: amd/skillscope@v0.1.3
        with:
          command: routing
          skills: examples/skills/hyperloom-workload-optimizer
          # One wrong routing decision fails the job, the same bar amd/skills
          # grades this skill against.
          args: >-
            --routing-room hyperloom-workload-optimizer
            --min-accuracy 1
            --output routing-report.json
            --keep-logs routing-logs
          install-claude: "true"

      - name: Upload the routing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-report
          path: |
            routing-report.json
            routing-logs/
          if-no-files-found: warn
