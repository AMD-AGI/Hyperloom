name: SaFE Optimize Submit

# Submits SaFE inference optimization tasks via the same API the SaFE script
# (Primus-SaFE/scripts/optimize_submit.py) uses, reusing CLAW_API_KEY.
# Independent of inference-optimization-ci.yml — no shared state.
#
# Three-stage pipeline:
#   1. prepare    (ubuntu-latest)  — pick model source by priority:
#                                    models > candidates_file (+ batch slice)
#                                    > hf_top (live HF API).
#                                    Emits matrix JSON for stage 2.
#   2. optimize   (matrix, hyperloom-4hhzn) — one model per parallel job.
#                                    Each job pre-pulls its own repo to
#                                    /wekafs/models BEFORE calling SaFE
#                                    register, so download is overlapped
#                                    with the rest of the batch (no serial
#                                    prewarm stage that blocks optimize).
#                                    schedule forces max_parallel=100 so the
#                                    whole 100-model batch dispatches at once
#                                    (dispatch default stays 60).
#   3. summarize  (hyperloom-4hhzn) — aggregate per-task artifacts into a
#                                    ranked ci_summary.{md,json} (sorted by
#                                    Gain% desc, with medals), publish the
#                                    normalized results to the Hyperloom
#                                    results service, and post the full
#                                    table to the Teams webhook.
#
# How to dispatch:
#   • Single/few models      : `-f models='Qwen/Qwen2.5-7B-Instruct ...'`
#   • Reproducible batch run : `-f candidates_file=ci/candidates/production_1000_from_hf_2026-05-25.json
#                              -f batch_index=0 -f batch_size=130`
#   • Quick HF top-N probe   : `-f hf_top=10 -f min_params=7`

on:
  # Rolling un-run pool: 100 models three times a day, firing at UTC
  # 04:00 / 12:00 / 20:00 (Beijing 12:00 / 20:00 / 04:00). Each run submits the
  # next 100 models from ci/candidates/unrun_excluding_manual_100.json that are
  # NOT yet on the leaderboard AND not already running (exclude_leaderboard +
  # exclude_active below), so the priority pool drains toward empty. Manual
  # workflow_dispatch is unaffected.
  schedule:
    - cron: '0 4,12,20 * * *'
  workflow_dispatch:
    inputs:
      # ── Model source (priority: models > candidates_file > hf_top) ──────
      models:
        description: 'Explicit HF repo IDs (space-separated). HIGHEST priority.'
        required: false
        default: ''
      candidates_file:
        description: 'Path to a candidates JSON built by ci/build_production_hf_pool.py (e.g. ci/candidates/production_1000_from_hf_2026-05-25.json). Used when models is empty.'
        required: false
        default: ''
      batch_index:
        description: 'Batch index (0-based) into candidates_file. Ignored if batch_size is 0.'
        required: false
        default: '0'
      batch_size:
        description: 'Slice size for candidates_file. 0 = take all rows.'
        required: false
        default: '0'
      exclude_leaderboard:
        description: 'Exclude models already present in model-leaderboard before selecting batch.'
        type: boolean
        required: false
        default: false
      exclude_active_workflows:
        description: 'Exclude models already queued/running in active optimize-submit workflow runs.'
        type: boolean
        required: false
        default: false
      hf_top:
        description: 'Live HuggingFace top-N (LEGACY fallback; used only if models AND candidates_file are empty)'
        required: false
        default: '20'
      min_params:
        description: 'Min parameter count in Billions (e.g. 7 for >=7B). 0 to skip filter.'
        required: false
        default: '7'
      max_parallel:
        description: 'Max parallel optimize jobs (dispatch default 60; schedule forces 100 to match the 100-model batch).'
        required: false
        default: '60'
      submit_jitter_sec:
        # Anti-thundering-herd. When the whole matrix fans out at once, every
        # job hits SaFE register/submit (Claw-session creation) in the same
        # instant and the backend sheds load with HTTP 500 'failed to create
        # Claw session' / 504. Each job instead sleeps random(0..N) seconds
        # before submitting, spreading the herd across an N-second window. The
        # optimize task runs for hours, so a worst-case N-second head start is
        # negligible. 0 = off.
        description: 'Per-job random pre-submit delay window in seconds (random(0..N)) to de-sync the matrix and avoid Claw-session HTTP 500/504 herds. 0=off.'
        required: false
        default: '600'
      submit_workspaces:
        # Comma-separated round-robin pool. Default spreads the batch across
        # hyperloom + sandbox instead of sending every task to sandbox. Set
        # empty explicitly only when you want to fall back to the single
        # SAFE_OPTIMIZE_SUBMIT_WORKSPACE secret.
        description: 'Round-robin submit workspaces (comma-separated). Default uses hyperloom+sandbox.'
        required: false
        default: 'core42-hyperloom,core42-sandbox'
      isl:
        description: 'Input sequence length'
        required: false
        default: '1024'
      osl:
        description: 'Output sequence length'
        required: false
        default: '1024'
      tp:
        # Optional override for tensor parallelism. Empty (default) keeps the
        # script's auto-detect (params -> tp). Set explicitly to spread a
        # model's weights + KV cache across more GPUs — e.g. tp=2 rescues the
        # 12B Mistral-Nemo merges that OOM at tp=1 because their ~1M native
        # context blows the KV cache to ~127 GiB on a single GPU.
        description: 'Tensor parallelism override (1/2/4/8/16/32). Leave empty to auto-detect from model size.'
        required: false
        default: ''
      mode:
        description: 'Execution mode forwarded to SaFE'
        required: false
        default: 'local'
        type: choice
        options: [local, claw]
      gpu_type:
        description: 'GPU type tag (overrides SaFE backend default MI355X). Leave empty to use script default (MI300X for core42).'
        required: false
        default: ''
      inferencex_path:
        description: 'Explicit InferenceX checkout path (dev override only). Leave empty (default) so install.sh clones a writable per-session copy instead of pinning a shared read-only mount.'
        required: false
        default: ''
      kernel_opt_backends:
        description: 'Kernel optimization backends forwarded to SaFE (GEAK first by default).'
        required: false
        default: 'geak,claude,codex'
      prompt_prefix:
        # Canonical prompt prefix lives in ci/prompt_prefix.txt (single
        # source of truth, used by ALL trigger sources: schedule, dispatch,
        # workflow_call, and direct CLI invocations of optimize_submit.py).
        #
        # We deliberately leave this input's `default:` empty because the
        # YAML `default:` is ONLY substituted on `workflow_dispatch` — on
        # `schedule` trigger `github.event.inputs.prompt_prefix` is always
        # the empty string, which previously dropped the prefix silently
        # and shipped tasks to SaFE with promptPrefix="" (root-causing
        # most "scheduled run produced no artifacts" failures).
        #
        # The Submit step reads ci/prompt_prefix.txt as the hard fallback
        # whenever this input is empty, and refuses to submit if neither
        # is set — so the SaFE promptPrefix field is GUARANTEED non-empty.
        # Override here only when you intentionally want different
        # instructions for a one-off dispatch.
        description: 'Override prompt prefix for this run. Leave empty to use ci/prompt_prefix.txt (recommended; same prefix for schedule + dispatch).'
        required: false
        default: ''
      target_gpu:
        description: 'Reference GPU for InferenceX comparison in the summary table'
        required: false
        default: 'mi300x'
        type: choice
        options: [mi300x, b200, h100, mi355x, mi325x]
      wait_for_completion:
        description: 'Wait for tasks to finish (default true). Uncheck for fire-and-forget.'
        type: boolean
        required: false
        default: true
      collect_artifacts:
        description: 'Download per-task artifacts (default true; needs wait_for_completion)'
        type: boolean
        required: false
        default: true
      task_timeout_min:
        description: 'Per-task wait timeout in minutes (default 720 = 12h)'
        required: false
        default: '720'
      max_hours:
        description: 'Per-task optimizer budget in hours (default 12)'
        required: false
        default: '12'
      all_artifacts:
        description: 'Download every artifact (default off — only optimization_report + ci_metrics)'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'Dry run (auto-detect and print plan only, do not submit)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

jobs:
  # ── Stage 1: build matrix ────────────────────────────────────────────────────
  prepare:
    name: Build matrix
    runs-on: hyperloom-mh826
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count:  ${{ steps.matrix.outputs.count }}
    env:
      HF_TOKEN:              ${{ secrets.HF_TOKEN }}
      INPUT_MODELS:          ${{ github.event.inputs.models }}
      # Rolling cron prioritizes the current not-on-leaderboard pool generated
      # by ci/build_rolling_pool.py. The full merged corpus lives in
      # ci/candidates/production_1000_from_hf_2026-05-25.json; the top-100 are
      # reserved in manual_100.json for operator-triggered dispatch.
      INPUT_CANDIDATES_FILE: ${{ github.event_name == 'schedule' && 'ci/candidates/unrun_excluding_manual_100.json' || github.event.inputs.candidates_file }}
      # Schedule pins batch_index=0: every cron pulls the FIRST 100 of the
      # (dynamically shrinking) un-run + not-active list, so rotation is driven
      # by the leaderboard/active exclusions instead of a clock slot.
      INPUT_BATCH_INDEX:     ${{ github.event_name == 'schedule' && '0' || github.event.inputs.batch_index }}
      INPUT_BATCH_SIZE:      ${{ github.event_name == 'schedule' && '100' || github.event.inputs.batch_size }}
      INPUT_HF_TOP:          ${{ github.event.inputs.hf_top }}
      INPUT_MIN_PARAMS:      ${{ github.event.inputs.min_params }}
      # Schedule EXCLUDES leaderboard-known models: the rolling cron only
      # submits models with no leaderboard data yet, so each run makes forward
      # progress and the pool drains to empty. We also exclude active workflows
      # so cron never double-submits a model already running — the two
      # exclusions together advance the "first 100" window every run.
      INPUT_EXCLUDE_LEADERBOARD:      ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.exclude_leaderboard }}
      INPUT_EXCLUDE_ACTIVE_WORKFLOWS: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.exclude_active_workflows }}
      GITHUB_TOKEN:          ${{ github.token }}
      GITHUB_RUN_NUMBER:     ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install requests
        run: pip install --quiet requests
      - name: Generate matrix
        id: matrix
        working-directory: ci
        run: python3 generate_hf_matrix.py

  # ── Stage 2: per-model optimization (parallel) ──────────────────────────────
  optimize:
    name: optimize-${{ matrix.key }}
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: hyperloom-4hhzn
    # 12h per-task wait timeout + buffer for register/wait/collect.
    timeout-minutes: 780
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(github.event_name == 'schedule' && '100' || github.event.inputs.max_parallel || '60') }}
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      CLAW_API_KEY:                     ${{ secrets.CLAW_API_KEY }}
      SAFE_BASE_URL:                    ${{ secrets.SAFE_BASE_URL }}
      HARBOR_PREFIX:                    ${{ secrets.HARBOR_PREFIX }}
      HF_TOKEN:                         ${{ secrets.HF_TOKEN }}
      SAFE_OPTIMIZE_REGISTER_WORKSPACE: ${{ secrets.SAFE_OPTIMIZE_REGISTER_WORKSPACE }}
      SAFE_OPTIMIZE_SUBMIT_WORKSPACE:   ${{ secrets.SAFE_OPTIMIZE_SUBMIT_WORKSPACE }}
      SAFE_OPTIMIZE_VOLUME:             ${{ secrets.SAFE_OPTIMIZE_VOLUME }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        working-directory: ci
        run: pip install --quiet requests PyYAML 'huggingface_hub>=0.24'

      - name: Prewarm /wekafs/models for this repo
        # Pre-pull the HF repo directly into /wekafs/models/<owner>-<repo>/
        # BEFORE invoking SaFE register, bypassing SaFE playground's slow
        # K8s-job-based download path. Same logic as optimize-batch.yml.
        # continue-on-error: any failure here (missing /wekafs mount, HF rate
        # limit, gated repo) just lets SaFE register handle the download
        # itself, slower but still correct.
        if: always()
        continue-on-error: true
        env:
          HF_TOKEN:   ${{ secrets.HF_TOKEN }}
          MODEL_REPO: ${{ matrix.model }}
        run: |
          set -euo pipefail
          if [ ! -d /wekafs/models ]; then
            echo "WARN: /wekafs/models not visible on this runner, skipping prewarm"
            echo "      (SaFE register will handle the download on its own)"
            exit 0
          fi
          if [ ! -w /wekafs/models ]; then
            echo "WARN: /wekafs/models not writable, skipping prewarm"
            ls -ld /wekafs/models || true
            exit 0
          fi
          python3 ci/prewarm_models.py \
            --repos        "${MODEL_REPO}" \
            --target-root  /wekafs/models \
            --concurrency  1 \
            --inner-workers 8 \
            --log          "${{ github.workspace }}/prewarm.log"

      - name: Submit + wait + collect (single model)
        working-directory: ci
        env:
          MODEL_REPO:             ${{ matrix.model }}
          INPUT_ISL:              ${{ github.event.inputs.isl }}
          INPUT_OSL:              ${{ github.event.inputs.osl }}
          INPUT_TP:               ${{ github.event.inputs.tp }}
          INPUT_SUBMIT_JITTER_SEC: ${{ github.event.inputs.submit_jitter_sec }}
          INPUT_MODE:             ${{ github.event.inputs.mode }}
          INPUT_GPU_TYPE:         ${{ github.event.inputs.gpu_type }}
          INPUT_KERNEL_OPT_BACKENDS: ${{ github.event.inputs.kernel_opt_backends }}
          INPUT_PROMPT_PREFIX:    ${{ github.event.inputs.prompt_prefix }}
          # Round-robin pool overrides single SAFE_OPTIMIZE_SUBMIT_WORKSPACE.
          SAFE_OPTIMIZE_SUBMIT_WORKSPACES: ${{ github.event.inputs.submit_workspaces || 'core42-hyperloom,core42-sandbox' }}
          INPUT_WAIT:             ${{ github.event.inputs.wait_for_completion }}
          INPUT_COLLECT:          ${{ github.event.inputs.collect_artifacts }}
          INPUT_TASK_TIMEOUT_MIN: ${{ github.event.inputs.task_timeout_min }}
          INPUT_MAX_HOURS:        ${{ github.event.inputs.max_hours }}
          # Cron rotates through the production pool — operators can't go
          # back and re-fetch sandbox state after the fact, so force
          # `--all-artifacts=true` on schedule. workflow_dispatch keeps
          # the user-provided value so manual runs can still pull only
          # the three contract files when they want a faster batch.
          INPUT_ALL_ARTIFACTS:    ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.all_artifacts }}
          INPUT_DRY_RUN:          ${{ github.event.inputs.dry_run }}
          MATRIX_POOL_ID:         ${{ matrix.pool_id }}
          MATRIX_POOL_INDEX:      ${{ matrix.pool_index }}
          MATRIX_BATCH_INDEX:     ${{ matrix.batch_index }}
          MATRIX_BATCH_SIZE:      ${{ matrix.batch_size }}
          MATRIX_SOURCE_TASK_ID:  ${{ matrix.task_id }}
          OUTPUT_DIR:             ${{ github.workspace }}/submit-output
          ARTIFACTS_DIR:          ${{ github.workspace }}/task-artifacts
          # GitHub-issued, repo-scoped, 7-day token. We embed it into the
          # HYPERLOOM_SOURCE_REPO URL handed to the sandbox so `git clone`
          # can authenticate against the private Hyperloom repo. Renamed
          # from GITHUB_TOKEN to avoid clobbering actions/checkout's env.
          HYPERLOOM_GIT_TOKEN:    ${{ github.token }}
        run: |
          set -euo pipefail
          ARGS=(--model "${MODEL_REPO}")
          ARGS+=(--isl "${INPUT_ISL:-1024}" --osl "${INPUT_OSL:-1024}")
          # Anti-herd: spread parallel submits across a random window so the
          # backend's Claw-session creation isn't hit by the whole matrix at
          # once. Schedule passes no input -> falls back to the 600s default.
          ARGS+=(--submit-jitter-sec "${INPUT_SUBMIT_JITTER_SEC:-600}")
          # Optional tp override — empty keeps the script's auto-detect.
          if [ -n "${INPUT_TP:-}" ]; then
            ARGS+=(--tp "${INPUT_TP}")
          fi
          ARGS+=(--mode "${INPUT_MODE:-local}")
          if [ -n "${INPUT_GPU_TYPE:-}" ]; then
            ARGS+=(--gpu-type "${INPUT_GPU_TYPE}")
          fi
          if [ -n "${INPUT_KERNEL_OPT_BACKENDS:-}" ]; then
            ARGS+=(--kernel-opt-backends "${INPUT_KERNEL_OPT_BACKENDS}")
          fi
          # Code-level contract: do not rely on natural-language prompt text
          # for these two critical values. SaFE consumes them and renders the
          # generated prompt tail consistently with the CI prefix.
          ARGS+=(--max-hours "${INPUT_MAX_HOURS:-12}")
          # Hard guarantee: SaFE promptPrefix MUST be non-empty. Workflow
          # input is only populated on workflow_dispatch — for schedule
          # trigger we fall back to ci/prompt_prefix.txt (single source of
          # truth). If both are missing the run aborts before submit so we
          # never ship a task with empty promptPrefix again.
          # (working-directory is `ci`, so the file is referenced directly.)
          PROMPT_PREFIX_VALUE="${INPUT_PROMPT_PREFIX:-}"
          if [ -z "$PROMPT_PREFIX_VALUE" ] && [ -f "prompt_prefix.txt" ]; then
            PROMPT_PREFIX_VALUE="$(cat prompt_prefix.txt)"
            echo "[prompt_prefix] loaded fallback from ci/prompt_prefix.txt ($(wc -c < prompt_prefix.txt) bytes)"
          fi
          if [ -z "$PROMPT_PREFIX_VALUE" ]; then
            echo "::error::prompt_prefix is empty and ci/prompt_prefix.txt is missing — refusing to submit to SaFE with empty promptPrefix"
            exit 1
          fi
          if [ -n "${GITHUB_SHA:-}" ]; then
            # The sandbox needs git credentials to clone the private Hyperloom
            # repo. We embed the workflow-scoped, 7-day `github.token` directly
            # into the clone URL (same pattern that actions/checkout uses
            # internally). This expands at submit time so the agent sees a
            # ready-to-use URL — it must NOT be echoed back into the GHA log.
            if [ -z "${HYPERLOOM_GIT_TOKEN:-}" ]; then
              echo "::error::HYPERLOOM_GIT_TOKEN not set; cannot pin sandbox checkout to a private repo"
              exit 1
            fi
            REPO_URL_AUTH="https://x-access-token:${HYPERLOOM_GIT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            PROMPT_PREFIX_VALUE="CI SOURCE PIN:"$'\n'"  export HYPERLOOM_SOURCE_REF=\"${GITHUB_SHA}\""$'\n'"  export HYPERLOOM_SOURCE_REPO=\"${REPO_URL_AUTH}\""$'\n\n'"${PROMPT_PREFIX_VALUE}"
            # Log the SHA only — never the URL (it contains the token).
            echo "[prompt_prefix] pinned sandbox Hyperloom checkout to ${GITHUB_SHA} (token-authenticated clone URL injected)"
          fi
          ARGS+=(--prompt-prefix "$PROMPT_PREFIX_VALUE")
          if [ "${INPUT_WAIT:-true}" = "false" ]; then
            ARGS+=(--no-wait-for-completion)
          fi
          if [ "${INPUT_COLLECT:-true}" = "false" ]; then
            ARGS+=(--no-collect-artifacts)
          fi
          if [ "${INPUT_ALL_ARTIFACTS:-false}" = "true" ]; then
            ARGS+=(--all-artifacts)
          fi
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "${MATRIX_POOL_ID:-}" ]; then
            ARGS+=(--pool-id "${MATRIX_POOL_ID}")
          fi
          if [ -n "${MATRIX_POOL_INDEX:-}" ]; then
            ARGS+=(--pool-index "${MATRIX_POOL_INDEX}")
          fi
          if [ -n "${MATRIX_BATCH_INDEX:-}" ]; then
            ARGS+=(--pool-batch-index "${MATRIX_BATCH_INDEX}")
          fi
          if [ -n "${MATRIX_BATCH_SIZE:-}" ]; then
            ARGS+=(--pool-batch-size "${MATRIX_BATCH_SIZE}")
          fi
          if [ -n "${MATRIX_SOURCE_TASK_ID:-}" ]; then
            ARGS+=(--pool-source-task-id "${MATRIX_SOURCE_TASK_ID}")
          fi
          ARGS+=(--task-timeout-min "${INPUT_TASK_TIMEOUT_MIN:-720}")
          ARGS+=(--output-dir "${OUTPUT_DIR}")
          ARGS+=(--artifacts-dir "${ARTIFACTS_DIR}")
          python3 optimize_submit.py "${ARGS[@]}"

      - name: Render per-model manifest to job summary
        if: always()
        run: |
          if [ -f "${{ github.workspace }}/submit-output/submission_manifest.md" ]; then
            cat "${{ github.workspace }}/submit-output/submission_manifest.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No manifest produced for ${{ matrix.model }}._" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ─── DISABLED 2026-05-25 ─────────────────────────────────────────
      # Per-model publish to model-leaderboard is disabled per user request.
      # Reason: we no longer want optimize-submit cron runs to push entries
      # into the live leaderboard (leaderboard data is now curated through
      # the manual production-pool refresh path).
      # The Teams completion webhook (below) is still active.
      # To re-enable: uncomment the whole `Publish per-model result …` step.
      # - name: Publish per-model result to model-leaderboard
      #   # Publish each matrix row as soon as it finishes so the leaderboard
      #   # updates continuously instead of waiting for the whole 60-model batch.
      #   # The final summary job still publishes the full batch as an idempotent
      #   # upsert by run_id/task_id, so this does not create duplicate rows.
      #   if: always() && github.event.inputs.dry_run != 'true'
      #   continue-on-error: true
      #   working-directory: ci
      #   env:
      #     HYPERLOOM_RESULTS_SERVICE_URL:   ${{ secrets.HYPERLOOM_RESULTS_SERVICE_URL }}
      #     HYPERLOOM_RESULTS_SERVICE_TOKEN: ${{ secrets.HYPERLOOM_RESULTS_SERVICE_TOKEN }}
      #     INPUT_TARGET_GPU: ${{ github.event.inputs.target_gpu }}
      #     INPUT_ISL:        ${{ github.event.inputs.isl }}
      #     INPUT_OSL:        ${{ github.event.inputs.osl }}
      #   run: |
      #     set -euo pipefail
      #     if [ ! -f "${{ github.workspace }}/submit-output/submission_manifest.json" ]; then
      #       echo "No submission_manifest.json for ${{ matrix.model }}; skipping per-model publish"
      #       exit 0
      #     fi
      #     mkdir -p "${{ github.workspace }}/single-summary"
      #     python3 build_summary.py \
      #       --artifacts-dir "${{ github.workspace }}/task-artifacts" \
      #       --manifests-dir "${{ github.workspace }}/submit-output" \
      #       --target-gpu    "${INPUT_TARGET_GPU:-mi300x}" \
      #       --isl           "${INPUT_ISL:-1024}" \
      #       --osl           "${INPUT_OSL:-1024}" \
      #       --out-dir       "${{ github.workspace }}/single-summary"
      #     if [ ! -f "${{ github.workspace }}/single-summary/normalized_results.json" ]; then
      #       echo "normalized_results.json not produced for ${{ matrix.model }}; skipping publish"
      #       exit 0
      #     fi
      #     python3 publish_results.py --input "${{ github.workspace }}/single-summary/normalized_results.json"

      # Per-model perf-leaderboard publish. Fires AS SOON AS this matrix job
      # finishes its single model, so the dashboard updates continuously
      # instead of waiting for the whole 60-model batch to settle. The
      # post_perf_runs.py script idempotently upserts by unique_key, so a
      # re-dispatched model just refreshes its row instead of creating a dup.
      #
      # Schema-aware: post_perf_runs.py auto-detects V2 (with phase_timeline),
      # V1-flat, and universal schemas via import_session_breakdown's
      # `looks_like_*` predicates and transforms them with
      # transform_to_session_summary_v2 before POSTing.
      #
      # Endpoint default = dev (perf-leaderboard-dev). Override at the
      # workflow / org level with the PERF_API_ENDPOINT secret for prod.
      # The dev token is baked into the script's DEFAULT_TOKEN; override
      # with PERF_API_TOKEN secret for prod.
      #
      # `continue-on-error` so a flaky upstream never blocks the rest of
      # the per-model contract (artifact upload, prewarm log, etc).
      - name: Publish session breakdown to perf-leaderboard
        if: always() && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          EXPECTED_MODEL: ${{ matrix.model }}
        run: |
          set -euo pipefail
          mkdir -p task-artifacts
          # ALWAYS-PUBLISH policy: we deliberately DO NOT gate on
          # final_status==Succeeded / ci_success / ci_status==Delivered here.
          # Any session_breakdown that was collected — even for Timeout / Failed
          # / Interrupted sessions — is pushed to the sbd-ingester so pulse never
          # leaves a model stuck in `awaiting_collector`. The ingester still
          # decides show_on_leaderboard from data quality (no-gain / non-final
          # snapshots stay hidden), so this never pollutes the leaderboard.
          # The only remaining natural guard is "a breakdown file must exist":
          # the selection step below exits cleanly when there is nothing to send.
          # Select only within this matrix job's collected task directory. The
          # flat task-artifacts/<task_id>/ci_metrics.json is backfilled by
          # optimize_submit.py with current task/model metadata; nested
          # session/ci_metrics.json files may be raw sandbox copies and can be
          # missing claw_session_id. Model equality is the primary guard; when
          # both sides have claw_session_id, it must match as an extra guard.
          python3 <<'PY' > task-artifacts/sbd_publish_selection.json
          import json
          import os
          import re
          from pathlib import Path

          root = Path("task-artifacts")
          expected_model = os.environ.get("EXPECTED_MODEL", "")

          def load_json(path):
              try:
                  with open(path, encoding="utf-8") as f:
                      data = json.load(f)
                  return data if isinstance(data, dict) else {}
              except Exception as exc:
                  return {"_error": f"{type(exc).__name__}: {exc}"}

          def norm_token(value):
              return re.sub(r"[^a-z0-9]+", "", str(value or "").lower())

          def norm_model(value):
              raw = str(value or "").strip().rstrip("/\\")
              if not raw:
                  return ""
              base = re.split(r"[\\/]", raw)[-1]
              return norm_token(base)

          def model_matches(expected, observed):
              """Accept repo basename/org+basename plus known config suffixes.

              Examples accepted:
                openai/gpt-oss-20b == openai-gpt-oss-20b
                deepseek-ai/DeepSeek-V3.2 == deepseek-v3.2-fp8-sglang-mi300x

              Examples rejected:
                Qwen/Qwen3-32B != squaredcuber-Cybus-Qwen3-32B-v2-agentic
                nvidia/Nemotron... != trohrbaugh-NVIDIA-Nemotron...-heretic-v2
              """
              exp_base = norm_model(expected)
              exp_full = norm_token(str(expected or "").replace("/", "-"))
              obs = norm_token(observed)
              if not exp_base or not obs:
                  return True
              for prefix in (exp_base, exp_full):
                  if not prefix:
                      continue
                  if obs == prefix:
                      return True
                  if obs.startswith(prefix):
                      suffix = obs[len(prefix):]
                      # Only allow our runtime/config suffixes after the model
                      # identity. This prevents accepting third-party variants
                      # with arbitrary prefixes/suffixes as the same model.
                      if suffix.startswith((
                          "fp8", "fp4", "bf16", "fp16", "int8", "int4",
                          "sglang", "vllm", "mi300x", "mi325x", "mi355x",
                          "tp", "ep",
                      )):
                          return True
              return False

          def has_any_number(value):
              if isinstance(value, bool):
                  return False
              if isinstance(value, (int, float)):
                  return True
              if isinstance(value, dict):
                  return any(has_any_number(v) for v in value.values())
              if isinstance(value, list):
                  return any(has_any_number(v) for v in value[:100])
              return False

          def has_breakdown_data(data):
              if not isinstance(data, dict):
                  return False
              keys = (
                  "baseline", "best", "final", "optimized", "steps", "actions",
                  "phases", "session", "session_meta", "workload",
                  "baseline_throughput", "optimized_throughput",
                  "tok_per_gpu_baseline", "tok_per_gpu_optimized", "gain_pct",
                  "cumulative_gain_pct",
              )
              return (
                  any(data.get(k) not in (None, {}, [], "") for k in keys)
                  or has_any_number(data)
              )

          def first(*values):
              for value in values:
                  if value not in (None, ""):
                      return str(value)
              return ""

          def breakdown_fields(data):
              workload = data.get("workload") if isinstance(data.get("workload"), dict) else {}
              session = data.get("session") if isinstance(data.get("session"), dict) else {}
              meta = data.get("session_meta") if isinstance(data.get("session_meta"), dict) else {}
              return {
                  "model": first(
                      workload.get("model_name"),
                      workload.get("model"),
                      data.get("model_name"),
                      data.get("model"),
                      session.get("model"),
                      meta.get("model"),
                  ),
                  "claw_session_id": first(
                      session.get("claw_session_id"),
                      meta.get("claw_session_id"),
                      data.get("claw_session_id"),
                  ),
                  "session_id": first(session.get("session_id"), meta.get("session_id")),
                  "schema_version": first(data.get("schema_version")),
              }

          def ci_fields(task_dir):
              ci_path = task_dir / "ci_metrics.json"
              ci = load_json(ci_path) if ci_path.is_file() else {}
              return ci_path, ci, first(ci.get("model"), ci.get("model_name")), first(ci.get("claw_session_id")), first(ci.get("image"))

          def source_local_path(entry):
              raw = str(entry.get("local_path") or "")
              if not raw:
                  return None
              p = Path(raw)
              if p.is_file():
                  return p
              # Older manifests may store paths relative to the task dir.
              alt = root / raw
              return alt if alt.is_file() else None

          expected_norm = norm_model(expected_model)
          for meta_path in sorted(root.glob("*/artifact_sources.json"), key=lambda p: p.stat().st_mtime, reverse=True):
              meta = load_json(meta_path)
              task_dir = meta_path.parent
              ci_path, ci, ci_model, ci_claw, ci_image = ci_fields(task_dir)
              ci_norm = norm_model(ci_model)
              if expected_norm and ci_norm and ci_norm != expected_norm:
                  continue
              files = meta.get("files") if isinstance(meta.get("files"), list) else []
              candidates = []
              for entry in files:
                  if not isinstance(entry, dict):
                      continue
                  p = source_local_path(entry)
                  if p and p.name.startswith("session_breakdown") and p.suffix == ".json":
                      candidates.append((0, p, entry))
              for p in sorted(task_dir.glob("**/session_breakdown*.json")):
                  if p.is_file() and all(p != c[1] for c in candidates):
                      candidates.append((1, p, {"source_type": "task_dir_scan"}))

              for nesting, bd_path, source in candidates:
                  bd = load_json(bd_path)
                  if "_error" in bd:
                      notes = [f"skip {bd_path}: {bd['_error']}"]
                      continue
                  bf = breakdown_fields(bd)
                  if not has_breakdown_data(bd):
                      notes = [f"skip {bd_path}: no structured session_breakdown data"]
                      continue
                  if ci_claw and bf["claw_session_id"] and ci_claw != bf["claw_session_id"]:
                      notes = [f"skip {bd_path}: claw_session_id={bf['claw_session_id']!r} expected={ci_claw!r}"]
                      continue
                  print(json.dumps({
                      "bd": str(bd_path),
                      "ci": str(ci_path) if ci_path.is_file() else "",
                      "task_dir": str(task_dir),
                      "task_id": first(meta.get("task_id"), ci.get("task_id"), task_dir.name),
                      "ci_model": ci_model,
                      "expected_model": expected_model,
                      "ci_claw_session_id": first(meta.get("claw_session_id"), ci_claw),
                      "ci_image": ci_image,
                      "source_type": source.get("source_type", ""),
                      "source_path": source.get("source_path", ""),
                      "remote_path": source.get("remote_path", ""),
                      **bf,
                      "score": 200 - nesting,
                      "notes": [],
                  }, indent=2))
                  raise SystemExit(0)

          ci_paths = sorted(
              [p for p in root.glob("*/ci_metrics.json") if p.is_file()],
              key=lambda p: p.stat().st_mtime,
              reverse=True,
          )
          notes = []
          best = None

          for ci_path in ci_paths:
              ci = load_json(ci_path)
              ci_model = first(ci.get("model"), ci.get("model_name"))
              ci_norm = norm_model(ci_model)
              if expected_norm and ci_norm and ci_norm != expected_norm:
                  notes.append(f"skip ci {ci_path}: model={ci_model!r} expected={expected_model!r}")
                  continue

              task_dir = ci_path.parent
              task_id = first(ci.get("task_id"), task_dir.name)
              ci_claw = first(ci.get("claw_session_id"))
              ci_image = first(ci.get("image"))
              candidates = []
              for name in ("session_breakdown.json", "session_breakdown_v2.json"):
                  p = task_dir / name
                  if p.is_file():
                      candidates.append((0, p))
              for p in sorted(task_dir.glob("*/session_breakdown*.json")):
                  if p.is_file():
                      candidates.append((1, p))

              if not candidates:
                  notes.append(f"skip task {task_dir}: no session_breakdown*.json")
                  continue

              for nesting, bd_path in candidates:
                  bd = load_json(bd_path)
                  if "_error" in bd:
                      notes.append(f"skip {bd_path}: {bd['_error']}")
                      continue
                  bf = breakdown_fields(bd)
                  # If the breakdown names a model, require identity match with
                  # only known runtime suffixes allowed.
                  if bf["model"] and ci_model and not model_matches(ci_model, bf["model"]):
                      notes.append(
                          f"skip {bd_path}: model={bf['model']!r} expected={ci_model!r}"
                      )
                      continue
                  if not has_breakdown_data(bd):
                      notes.append(f"skip {bd_path}: no structured session_breakdown data")
                      continue
                  if ci_claw and bf["claw_session_id"] and ci_claw != bf["claw_session_id"]:
                      notes.append(
                          f"skip {bd_path}: claw_session_id={bf['claw_session_id']!r} "
                          f"expected={ci_claw!r}"
                      )
                      continue
                  score = 100 - nesting
                  if bf["claw_session_id"] and ci_claw == bf["claw_session_id"]:
                      score += 20
                  if bf["model"] and ci_model and model_matches(ci_model, bf["model"]):
                      score += 10
                  row = {
                      "bd": str(bd_path),
                      "ci": str(ci_path),
                      "task_dir": str(task_dir),
                      "task_id": task_id,
                      "ci_model": ci_model,
                      "expected_model": expected_model,
                      "ci_claw_session_id": ci_claw,
                      "ci_image": ci_image,
                      **bf,
                      "score": score,
                      "notes": notes[-20:],
                  }
                  if best is None or row["score"] > best["score"]:
                      best = row

          if best is None:
              best = {
                  "bd": "",
                  "reason": "no matching session_breakdown for current task/model",
                  "expected_model": expected_model,
                  "notes": notes[-50:],
              }
          print(json.dumps(best, indent=2))
          PY
          cat task-artifacts/sbd_publish_selection.json
          BD=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('bd') or '')" task-artifacts/sbd_publish_selection.json)
          if [ -z "$BD" ] || [ ! -f "$BD" ]; then
            REASON=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('reason') or 'no matching session_breakdown')" task-artifacts/sbd_publish_selection.json)
            echo "::warning::$REASON; skipping sbd-ingester publish"
            echo "SKIP $REASON" > task-artifacts/perf_publish_marker.txt 2>/dev/null || true
            exit 0
          fi
          CS_CIM=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('ci_claw_session_id') or '')" task-artifacts/sbd_publish_selection.json)
          echo "[sbd-ingester] selected session_breakdown: $BD (ci_claw_session_id='${CS_CIM:-}')"
          BD_SIZE=$(stat -c %s "$BD")
          # Publish to sbd-ingester instead of posting straight to perf_runs_dev.
          # The ingester cleans fields, upserts into the dev table, and reports
          # missing/warning fields. Its schema allowlist currently accepts only
          # v1.1, so we relabel schema_version -> v1.1 before sending (the v2
          # payload is structurally compatible — verified). Once the service
          # adds v2 to its allowlist, drop the relabel line below.
          SBD_SEND="${BD%.json}.sbd.json"
          PERF_DIR=$(dirname "$BD")
          set +e
          python3 - "$BD" "$SBD_SEND" task-artifacts/sbd_publish_selection.json <<'PY'
          import json
          import sys

          src, dst, selection_path = sys.argv[1:4]
          with open(src, encoding="utf-8") as f:
              data = json.load(f)
          with open(selection_path, encoding="utf-8") as f:
              selection = json.load(f)

          sys.path.insert(0, "ci")
          try:
              import import_session_breakdown as isb
          except Exception:
              isb = None

          if isb is not None:
              if isb.looks_like_v1_flat_schema(data):
                  data = isb.migrate_v1_to_v2(data)
              elif isb.looks_like_universal_schema(data) and not (
                  isinstance(data.get("workload"), dict)
                  and isinstance(data.get("baseline"), dict)
                  and isinstance(data.get("final"), dict)
              ):
                  migrated = isb.migrate_universal_to_v2(data)
                  if migrated:
                      data = migrated

          data["schema_version"] = "hyperloom.session_breakdown.v1.1"
          task_id = selection.get("task_id") or ""
          claw_session_id = selection.get("ci_claw_session_id") or ""
          image = selection.get("ci_image") or ""

          session_meta = data.setdefault("session_meta", {})
          session = data.setdefault("session", {})
          for obj in (data, session_meta, session):
              if task_id:
                  obj.setdefault("task_id", task_id)
              if claw_session_id:
                  obj.setdefault("claw_session_id", claw_session_id)
              if image:
                  obj.setdefault("image", image)
          if claw_session_id:
              session.setdefault("session_id", claw_session_id)
              session_meta.setdefault("session_id", claw_session_id)

          with open(dst, "w", encoding="utf-8") as f:
              json.dump(data, f)
          PY
          RELABEL_RC=$?
          set -e
          if [ "$RELABEL_RC" -ne 0 ] || [ ! -s "$SBD_SEND" ]; then
            echo "::warning::failed to relabel session_breakdown schema_version for sbd-ingester (rc=$RELABEL_RC); skipping publish"
            echo "FAIL relabel rc=$RELABEL_RC" > "$PERF_DIR/perf_publish_marker.txt"
            rm -f "$SBD_SEND"
            exit 0
          fi
          # Endpoint + token: prefer GitHub secrets; fall back to the dev
          # endpoint/token so the pipeline runs out-of-the-box. SET
          # SBD_INGESTER_TOKEN as a secret for prod and rotate the dev token.
          SBD_EP='${{ secrets.SBD_INGESTER_ENDPOINT }}'
          SBD_TK='${{ secrets.SBD_INGESTER_TOKEN }}'
          [ -n "$SBD_EP" ] || SBD_EP='https://core42.example-internal-host.invalid/sbd-ingester/api/v1/session-breakdowns'
          if [ -z "$SBD_TK" ]; then
            echo "::warning::SBD_INGESTER_TOKEN secret not set — skipping sbd-ingester publish (add it under repo Settings > Secrets and variables > Actions)"
            echo "SKIP no-token" > "$(dirname "$BD")/perf_publish_marker.txt"
            exit 0
          fi
          echo "publishing $BD (${BD_SIZE} bytes, relabeled->v1.1) -> sbd-ingester"
          set +e
          SBD_RESP=$(curl -sS -k -m 90 -w $'\n%{http_code}' -X POST "$SBD_EP" -H "Authorization: Bearer $SBD_TK" -H 'Content-Type: application/json' --data-binary @"$SBD_SEND" 2>&1)
          CURL_RC=$?
          SBD_CODE=$(printf '%s' "$SBD_RESP" | tail -n1)
          echo "[sbd-ingester] curl_rc=$CURL_RC http=$SBD_CODE"
          printf '%s\n' "$SBD_RESP" | head -5
          if [ "$CURL_RC" -eq 0 ] && printf '%s' "$SBD_CODE" | grep -q '^2'; then PERF_RC=0; else PERF_RC=1; fi
          rm -f "$SBD_SEND"
          set -e
          # Marker file the summarize job globs to count "X/N sent to
          # perf-leaderboard" for the Teams webhook footer.
          if [ "$PERF_RC" -eq 0 ]; then
            echo OK > "$PERF_DIR/perf_publish_marker.txt"
            echo "[perf-publish] OK"
          else
            echo "FAIL rc=$PERF_RC" > "$PERF_DIR/perf_publish_marker.txt"
            echo "[perf-publish] FAIL (rc=$PERF_RC) — continue-on-error keeps the matrix job green"
          fi

      - name: Upload per-model manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: submission-manifest-${{ matrix.key }}
          path: submit-output/
          retention-days: 45
          if-no-files-found: warn

      - name: Upload per-model task artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task-artifacts-${{ matrix.key }}
          path: task-artifacts/
          retention-days: 45
          if-no-files-found: ignore

      - name: Upload prewarm log
        # Per-model prewarm log lets us diagnose "why was this model slow on
        # first encounter" reports.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prewarm-log-${{ matrix.key }}
          path: prewarm.log
          retention-days: 30
          if-no-files-found: ignore

  # ── Stage 3: aggregate summary ───────────────────────────────────────────────
  summarize:
    name: Build summary
    needs: optimize
    if: always() && needs.prepare.outputs.count != '0' && github.event.inputs.dry_run != 'true'
    # Run on the self-hosted hyperloom-4hhzn runner (a K8s pod in the
    # core42-hyperloom namespace) so the Publish step can reach the
    # hyperloom-results-service ingress at core42.example-internal-host.invalid.
    # hyperloom-4hhzn mounts /wekafs as RW (vs. hyperloom-mh826 which was RO),
    # which is what the optimize stage needs for prewarm to actually write
    # models into /wekafs/models/. Keeping the summary on the same pool
    # avoids one-cluster-vs-another pitfalls.
    runs-on: hyperloom-4hhzn
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        # No setup-python on the self-hosted runner — it has system python3
        # already (we use it for the optimize stage too); the pip on this
        # runner image is older and doesn't accept --break-system-packages,
        # but it has no PEP 668 marker either so a plain install works.
        run: pip install --quiet requests pyyaml

      - name: Download all submission manifests
        uses: actions/download-artifact@v8
        with:
          path: ${{ github.workspace }}/manifests
          pattern: submission-manifest-*
          merge-multiple: false

      - name: Download all task artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ github.workspace }}/task-artifacts-merged
          pattern: task-artifacts-*
          # merge-multiple flattens all <task_id>/ subdirs into one root,
          # which is exactly what build_summary.py expects.
          merge-multiple: true

      - name: Build summary table
        working-directory: ci
        env:
          INPUT_TARGET_GPU: ${{ github.event.inputs.target_gpu }}
          INPUT_ISL:        ${{ github.event.inputs.isl }}
          INPUT_OSL:        ${{ github.event.inputs.osl }}
        run: |
          python3 build_summary.py \
            --artifacts-dir "${{ github.workspace }}/task-artifacts-merged" \
            --manifests-dir "${{ github.workspace }}/manifests" \
            --target-gpu    "${INPUT_TARGET_GPU:-mi300x}" \
            --isl           "${INPUT_ISL:-1024}" \
            --osl           "${INPUT_OSL:-1024}" \
            --out-dir       "${{ github.workspace }}/summary-out"

      # ─── DISABLED 2026-05-25 ─────────────────────────────────────────
      # Final batch publish to model-leaderboard is disabled per user request
      # (paired with the per-model publish step in the optimize matrix).
      # Reason: cron runs should no longer push results into the live
      # leaderboard; the Teams completion webhook below stays on for batch
      # completion notification, and ci_summary / normalized_results.json
      # are still uploaded as artifacts so a manual republish via
      # .harvest/republish_from_artifact.py is always possible.
      # To re-enable: uncomment the whole `Publish results to model-leaderboard` step.
      # - name: Publish results to model-leaderboard
      #   # POST normalized_results.json to {HYPERLOOM_RESULTS_SERVICE_URL}/api/import.
      #   # publish_results.py exits 0 with a log line if the URL env is unset,
      #   # so this step is a no-op for runs that don't have the secret configured.
      #   # Mirrors the same step in optimize-batch.yml so both workflows feed the
      #   # results dashboard the same way.
      #   #
      #   # continue-on-error: the publish endpoint has known intermittent 500s
      #   # when its postgres pod crashloops (luochen has been pinged). Even
      #   # with the in-script retry loop, persistent service downtime should
      #   # not block the webhook from being sent — that is the user's main
      #   # signal that a batch finished. The summary artifact + GHA logs still
      #   # carry the full data for re-publish later.
      #   if: always()
      #   continue-on-error: true
      #   working-directory: ci
      #   env:
      #     HYPERLOOM_RESULTS_SERVICE_URL:   ${{ secrets.HYPERLOOM_RESULTS_SERVICE_URL }}
      #     HYPERLOOM_RESULTS_SERVICE_TOKEN: ${{ secrets.HYPERLOOM_RESULTS_SERVICE_TOKEN }}
      #   run: |
      #     INPUT="${{ github.workspace }}/summary-out/normalized_results.json"
      #     if [ ! -f "$INPUT" ]; then
      #       echo "normalized_results.json not produced — skipping publish"
      #       exit 0
      #     fi
      #     python3 publish_results.py --input "$INPUT"

      - name: Render summary to job summary
        if: always()
        run: |
          if [ -f "${{ github.workspace }}/summary-out/ci_summary.md" ]; then
            cat "${{ github.workspace }}/summary-out/ci_summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No summary produced._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload final summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-summary
          path: summary-out/
          retention-days: 45
          if-no-files-found: warn

      - name: Count perf-leaderboard publish status
        # Walk the merged task-artifacts/ tree for the per-matrix-job
        # `perf_publish_marker.txt` files written by the publish step.
        # Each marker is exactly one line: "OK" on success or "FAIL rc=<n>"
        # otherwise. Counts feed the Teams webhook footer so reviewers can
        # see at a glance how many models made it into perf-leaderboard
        # without digging into individual matrix job logs.
        if: always()
        id: perf_publish_count
        run: |
          set -euo pipefail
          ROOT="${{ github.workspace }}/task-artifacts-merged"
          if [ ! -d "$ROOT" ]; then
            echo "no merged task-artifacts/ dir; skip count"
            echo "ok=0"    >> "$GITHUB_OUTPUT"
            echo "total=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # find returns the absolute paths of every marker; -size +0c filters
          # out the rare zero-byte file (would happen if cat into the file failed).
          mapfile -t MARKERS < <(find "$ROOT" -name perf_publish_marker.txt -size +0c 2>/dev/null)
          TOTAL=${#MARKERS[@]}
          OK=0
          for m in "${MARKERS[@]:-}"; do
            [ -z "$m" ] && continue
            if [ "$(head -c 2 "$m")" = "OK" ]; then OK=$((OK+1)); fi
          done
          echo "perf-publish markers found: ok=$OK total=$TOTAL"
          echo "ok=$OK"        >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL"  >> "$GITHUB_OUTPUT"

      - name: Send webhook (completion notification)
        # Push the ranked summary into the Teams webhook. Format MUST be a
        # Power Automate Workflows Adaptive Card payload — the legacy Teams
        # Incoming Webhook ``{"text": ...}`` schema was retired Jan 2025 and
        # Workflows endpoints silently HTTP 202 those requests but the flow
        # run fails with ``The message must include either an adaptive card
        # or message card formatted payload``. See
        # .harvest/_webhook_2026_05_13.py for the same builder we use for
        # manual sends.
        if: always() && env.WEBHOOK_URL != ''
        env:
          WEBHOOK_URL:    ${{ secrets.WEBHOOK_URL }}
          DASHBOARD_URL:  ${{ secrets.HYPERLOOM_DASHBOARD_URL }}
          INPUT_MODELS:   ${{ github.event.inputs.models }}
          INPUT_HF_TOP:   ${{ github.event.inputs.hf_top }}
          # Perf-leaderboard publish counts (from the previous step) so
          # send_webhook.py can render "X/N sent to perf-leaderboard" in
          # the card footer.
          PERF_PUBLISH_OK:    ${{ steps.perf_publish_count.outputs.ok }}
          PERF_PUBLISH_TOTAL: ${{ steps.perf_publish_count.outputs.total }}
        run: |
          # Power Automate / Teams reliably renders Adaptive Card Table when
          # each card is small. send_webhook.py splits the summary into
          # 10-model chunks (bordered 6-column table, msteams.width=Full).
          python3 ci/send_webhook.py \
            --summary "${{ github.workspace }}/summary-out/ci_summary.json" \
            --rows-per-card 10
          exit 0

          python3 - <<'PYEOF'
          import json, os
          import requests, urllib3
          urllib3.disable_warnings()

          WORKSPACE = os.environ.get("GITHUB_WORKSPACE", ".")
          webhook_url   = os.environ["WEBHOOK_URL"]
          dashboard_url = os.environ.get("DASHBOARD_URL", "")
          models_input  = os.environ.get("INPUT_MODELS", "").strip()
          hf_top        = os.environ.get("INPUT_HF_TOP", "").strip()
          batch_tag = (models_input.replace(" ", ",")
                       if models_input else f"hf-top-{hf_top or '?'}")
          if len(batch_tag) > 50:
              batch_tag = batch_tag[:47] + "..."

          json_path = os.path.join(WORKSPACE, "summary-out", "ci_summary.json")

          rows = []
          if os.path.exists(json_path):
              summary = json.loads(open(json_path).read())
              rows = summary.get("rows") or summary.get("models") or []
          n = len(rows)
          succeeded = sum(1 for r in rows if r.get("final_status") == "Succeeded")
          with_gain = sum(1 for r in rows
                          if (r.get("gain_pct") or 0) > 0
                          and r.get("baseline_tok_per_gpu")
                          and r.get("optimized_tok_per_gpu"))
          beat_ifx = sum(1 for r in rows
                         if (r.get("vs_inferenceX_pct") or 0) > 0)

          run_url = (f"https://github.com/{os.environ.get('GITHUB_REPOSITORY','?')}"
                     f"/actions/runs/{os.environ.get('GITHUB_RUN_ID','?')}")

          # Sort: rows with gain (desc) first, failures last.
          def sort_key(r):
              g = r.get("gain_pct")
              return (0, -(g if g is not None else 0)) if g is not None else (1, 0.0)
          rows = sorted(rows, key=sort_key)

          def fmt_num(v):
              if v is None:
                  return "—"
              return f"{v:.2f}" if isinstance(v, float) else str(v)

          def fmt_pct(p):
              return f"{p:+.2f}%" if p is not None else "—"

          def gain_medal(g):
              if g is None:
                  return ""
              if g >= 50:  return "🥇🥇🥇🥇"
              if g >= 20:  return "🥇🥇🥇"
              if g >= 5:   return "🥇🥇"
              if g >= 1:   return "🥇"
              if g > 0:    return "🟢"
              if g == 0:   return "➖"
              return ""

          def gain_color(g):
              if g is None: return "Default"
              if g >= 5:    return "Good"
              if g > 0:     return "Accent"
              if g == 0:    return "Warning"
              return "Attention"

          def status_icon(fs, bl, op):
              if fs == "Succeeded" and bl and op:
                  return "✅"
              if fs == "Failed":
                  return "❌"
              return "🟡"

          def short_name(m):
              return (m or "?").split("/")[-1]

          def params_str(m):
              # We don't carry params_b through ci_summary.json; leave a dash.
              # build_summary.derive_params() returns a string like "14.8B"
              # for HF-known repos — same logic re-implemented inline here.
              # Skipped for now to keep this step self-contained.
              return "—"

          def cell(text, weight=None, color=None):
              tb = {"type": "TextBlock", "text": str(text), "wrap": True}
              if weight: tb["weight"] = weight
              if color:  tb["color"]  = color
              return {"type": "TableCell", "items": [tb]}

          header_blocks = [
              {"type": "TextBlock",
               "text": f"**Hyperloom optimize-submit [{batch_tag}] done**",
               "size": "Medium", "weight": "Bolder", "wrap": True},
              {"type": "TextBlock",
               "text": f"{succeeded}/{n} succeeded · {with_gain} with gain · "
                       f"{beat_ifx} compare against the baseline",
               "wrap": True, "isSubtle": True},
              {"type": "TextBlock",
               "text": (f"GHA: [{os.environ.get('GITHUB_RUN_ID','?')}]({run_url})"
                        + (f"  ·  [Dashboard]({dashboard_url})" if dashboard_url else "")),
               "wrap": True},
          ]

          # 6-column table — Model wide, Stack/Params/Baseline/Optimized/Gain
          # share the rest. Relative widths so Teams scales them to whatever
          # render width msteams.width=Full grants us (~1200px desktop).
          FULL_COLUMNS = [
              {"width": 6},  # Model
              {"width": 3},  # Stack
              {"width": 2},  # Params
              {"width": 3},  # Baseline tok/s/GPU
              {"width": 3},  # Optimized tok/s/GPU
              {"width": 3},  # Gain
          ]
          COMPACT_COLUMNS = [
              {"width": 5},  # Model
              {"width": 2},  # Stack (frm prec tp combined)
              {"width": 2},  # Gain
          ]

          def build_full_row(r):
              fs = r.get("final_status")
              bl = r.get("baseline_tok_per_gpu")
              op = r.get("optimized_tok_per_gpu")
              gp = r.get("gain_pct")
              icon = status_icon(fs, bl, op)
              stack_s = (f"{r.get('framework') or '—'} "
                         f"{r.get('precision') or '—'} "
                         f"TP={r.get('tp') or '—'}")
              medal = gain_medal(gp)
              if gp is None:
                  gain_text = "—"
              elif gp == 0:
                  gain_text = f"{medal} 0%".strip()
              else:
                  gain_text = f"{medal} {fmt_pct(gp)}".strip()
              return {
                  "type": "TableRow",
                  "cells": [
                      cell(f"{short_name(r.get('model'))} {icon}"),
                      cell(stack_s),
                      cell(params_str(r.get('model'))),
                      cell(fmt_num(bl)),
                      cell(fmt_num(op)),
                      cell(gain_text, color=gain_color(gp)),
                  ],
              }

          def build_compact_row(r):
              fs = r.get("final_status")
              bl = r.get("baseline_tok_per_gpu")
              op = r.get("optimized_tok_per_gpu")
              gp = r.get("gain_pct")
              icon = status_icon(fs, bl, op)
              stack_s = (f"{(r.get('framework') or '—')}/"
                         f"{(r.get('precision') or '—')}/"
                         f"TP{r.get('tp') or '?'}")
              medal = gain_medal(gp)
              if gp is None:
                  gain_text = "—"
              elif gp == 0:
                  gain_text = f"{medal} 0%".strip()
              else:
                  gain_text = f"{medal} {fmt_pct(gp)}".strip()
              return {
                  "type": "TableRow",
                  "cells": [
                      cell(f"{short_name(r.get('model'))} {icon}"),
                      cell(stack_s),
                      cell(gain_text, color=gain_color(gp)),
                  ],
              }

          # First pass: build full-format rows. Power Automate Workflows
          # rejects payloads >256KB, and Teams renders ~200KB cleanly.
          # If full-format exceeds that, fall back to compact (3 col / row)
          # which is roughly 3x smaller per row.
          MAX_ROWS = 200
          MAX_PAYLOAD_BYTES = 200_000
          full_header_row = {
              "type": "TableRow", "style": "accent",
              "cells": [cell("Model","Bolder"),
                        cell("Stack","Bolder"),
                        cell("Params","Bolder"),
                        cell("Baseline tok/s/GPU","Bolder"),
                        cell("Optimized tok/s/GPU","Bolder"),
                        cell("Gain","Bolder")],
          }
          compact_header_row = {
              "type": "TableRow", "style": "accent",
              "cells": [cell("Model","Bolder"),
                        cell("Stack","Bolder"),
                        cell("Gain","Bolder")],
          }

          def assemble_card(table_columns, table_rows, truncated, compact_mode):
              body = list(header_blocks)
              body.append({
                  "type": "Table",
                  "firstRowAsHeader": True,
                  "showGridLines": True,
                  "columns": table_columns,
                  "rows": table_rows,
              })
              suffix = []
              if truncated:
                  suffix.append(f"Showing first {len(table_rows)-1} of "
                                f"{len(rows)} rows")
              if compact_mode:
                  suffix.append("compact view (full table > 200 KB Teams cap)")
              if suffix:
                  body.append({
                      "type": "TextBlock",
                      "text": f"_{' · '.join(suffix)} — see GHA / Dashboard for "
                              f"the full set._",
                      "wrap": True, "isSubtle": True,
                  })
              return {
                  "type": "message",
                  "attachments": [{
                      "contentType": "application/vnd.microsoft.card.adaptive",
                      "content": {
                          "type": "AdaptiveCard",
                          "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                          "version": "1.5",
                          "msteams": {"width": "Full"},
                          "body": body,
                      },
                  }],
              }

          # Try full format first.
          full_rows = [full_header_row] + [build_full_row(r) for r in rows[:MAX_ROWS]]
          truncated = len(rows) > MAX_ROWS
          payload = assemble_card(FULL_COLUMNS, full_rows, truncated, False)
          payload_bytes = json.dumps(payload).encode("utf-8")
          compact_mode = False
          if len(payload_bytes) > MAX_PAYLOAD_BYTES:
              compact_rows = [compact_header_row] + [build_compact_row(r) for r in rows[:MAX_ROWS]]
              payload = assemble_card(COMPACT_COLUMNS, compact_rows, truncated, True)
              payload_bytes = json.dumps(payload).encode("utf-8")
              compact_mode = True
          print(f"Webhook payload: {len(payload_bytes)} bytes, "
                f"{len(rows[:MAX_ROWS])} data rows"
                f"{' (compact mode)' if compact_mode else ''}"
                f"{f' truncated from {len(rows)}' if truncated else ''}")

          try:
              resp = requests.post(
                  webhook_url, json=payload,
                  timeout=10, verify=False)
              print(f"Webhook: HTTP {resp.status_code}")
              if resp.status_code >= 300:
                  print(f"Response: {resp.text[:300]}")
          except Exception as e:
              print(f"Webhook failed: {e}")
          PYEOF
