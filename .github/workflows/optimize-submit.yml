name: SaFE Optimize Submit

# Submits SaFE inference optimization tasks via the same API the SaFE script
# (Primus-SaFE/scripts/optimize_submit.py) uses, reusing CLAW_API_KEY.
# Independent of inference-optimization-ci.yml — no shared state.
#
# Three-stage pipeline:
#   1. prepare    (ubuntu-latest)  — HF top-N or explicit list -> matrix JSON
#   2. optimize   (matrix, hyperloom-mh826) — one model per parallel job
#   3. summarize  (ubuntu-latest)  — collect ci_metrics.json + InferenceX ref
#                                    -> ci_summary.{md,json}

on:
  workflow_dispatch:
    inputs:
      hf_top:
        description: 'HuggingFace top-N (leave empty if specifying "models" below)'
        required: false
        default: '20'
      min_params:
        description: 'Min parameter count in Billions (e.g. 7 for >=7B). 0 to skip filter.'
        required: false
        default: '7'
      models:
        description: 'Explicit HF repo IDs, space-separated. Overrides hf_top when set.'
        required: false
        default: ''
      isl:
        description: 'Input sequence length'
        required: false
        default: '1024'
      osl:
        description: 'Output sequence length'
        required: false
        default: '1024'
      mode:
        description: 'Execution mode forwarded to SaFE'
        required: false
        default: 'local'
        type: choice
        options: [local, claw]
      gpu_type:
        description: 'GPU type tag (overrides SaFE backend default MI355X). Leave empty to use script default (MI300X for core42).'
        required: false
        default: ''
      inferencex_path:
        description: 'InferenceX checkout path inside the sandbox. Leave empty to use script default (/wekafs/InferenceX for core42).'
        required: false
        default: ''
      target_gpu:
        description: 'Reference GPU for InferenceX comparison in the summary table'
        required: false
        default: 'mi300x'
        type: choice
        options: [mi300x, b200, h100, mi355x, mi325x]
      wait_for_completion:
        description: 'Wait for tasks to finish (default true). Uncheck for fire-and-forget.'
        type: boolean
        required: false
        default: true
      collect_artifacts:
        description: 'Download per-task artifacts (default true; needs wait_for_completion)'
        type: boolean
        required: false
        default: true
      task_timeout_min:
        description: 'Per-task wait timeout in minutes (default 480 = 8h)'
        required: false
        default: '480'
      all_artifacts:
        description: 'Download every artifact (default off — only optimization_report + ci_metrics)'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'Dry run (auto-detect and print plan only, do not submit)'
        type: boolean
        required: false
        default: false

jobs:
  # ── Stage 1: build matrix ────────────────────────────────────────────────────
  prepare:
    name: Build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count:  ${{ steps.matrix.outputs.count }}
    env:
      HF_TOKEN:        ${{ secrets.HF_TOKEN }}
      INPUT_HF_TOP:    ${{ github.event.inputs.hf_top }}
      INPUT_MIN_PARAMS: ${{ github.event.inputs.min_params }}
      INPUT_MODELS:    ${{ github.event.inputs.models }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: pip install --quiet requests
      - name: Generate matrix
        id: matrix
        working-directory: ci
        run: python3 generate_hf_matrix.py

  # ── Stage 2: per-model optimization (parallel) ──────────────────────────────
  optimize:
    name: optimize-${{ matrix.key }}
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: hyperloom-mh826
    # 8h per-task timeout + buffer for register/wait/collect.
    timeout-minutes: 600
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      CLAW_API_KEY:                     ${{ secrets.CLAW_API_KEY }}
      SAFE_BASE_URL:                    ${{ secrets.SAFE_BASE_URL }}
      HARBOR_PREFIX:                    ${{ secrets.HARBOR_PREFIX }}
      HF_TOKEN:                         ${{ secrets.HF_TOKEN }}
      SAFE_OPTIMIZE_REGISTER_WORKSPACE: ${{ secrets.SAFE_OPTIMIZE_REGISTER_WORKSPACE }}
      SAFE_OPTIMIZE_SUBMIT_WORKSPACE:   ${{ secrets.SAFE_OPTIMIZE_SUBMIT_WORKSPACE }}
      SAFE_OPTIMIZE_VOLUME:             ${{ secrets.SAFE_OPTIMIZE_VOLUME }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: ci
        run: pip install --quiet requests 'huggingface_hub>=0.24'

      - name: Prewarm /wekafs/models for this repo
        # Pre-pull the HF repo directly into /wekafs/models/<owner>-<repo>/
        # BEFORE invoking SaFE register, bypassing SaFE playground's slow
        # K8s-job-based download path. Same logic as optimize-batch.yml.
        # continue-on-error: any failure here (missing /wekafs mount, HF rate
        # limit, gated repo) just lets SaFE register handle the download
        # itself, slower but still correct.
        if: always()
        continue-on-error: true
        env:
          HF_TOKEN:   ${{ secrets.HF_TOKEN }}
          MODEL_REPO: ${{ matrix.model }}
        run: |
          set -euo pipefail
          if [ ! -d /wekafs/models ]; then
            echo "WARN: /wekafs/models not visible on this runner, skipping prewarm"
            echo "      (SaFE register will handle the download on its own)"
            exit 0
          fi
          if [ ! -w /wekafs/models ]; then
            echo "WARN: /wekafs/models not writable, skipping prewarm"
            ls -ld /wekafs/models || true
            exit 0
          fi
          python3 ci/prewarm_models.py \
            --repos        "${MODEL_REPO}" \
            --target-root  /wekafs/models \
            --concurrency  1 \
            --inner-workers 8 \
            --log          "${{ github.workspace }}/prewarm.log"

      - name: Submit + wait + collect (single model)
        working-directory: ci
        env:
          MODEL_REPO:             ${{ matrix.model }}
          INPUT_ISL:              ${{ github.event.inputs.isl }}
          INPUT_OSL:              ${{ github.event.inputs.osl }}
          INPUT_MODE:             ${{ github.event.inputs.mode }}
          INPUT_GPU_TYPE:         ${{ github.event.inputs.gpu_type }}
          INPUT_INFERENCEX_PATH:  ${{ github.event.inputs.inferencex_path }}
          INPUT_WAIT:             ${{ github.event.inputs.wait_for_completion }}
          INPUT_COLLECT:          ${{ github.event.inputs.collect_artifacts }}
          INPUT_TASK_TIMEOUT_MIN: ${{ github.event.inputs.task_timeout_min }}
          INPUT_ALL_ARTIFACTS:    ${{ github.event.inputs.all_artifacts }}
          INPUT_DRY_RUN:          ${{ github.event.inputs.dry_run }}
          OUTPUT_DIR:             ${{ github.workspace }}/submit-output
          ARTIFACTS_DIR:          ${{ github.workspace }}/task-artifacts
        run: |
          set -euo pipefail
          ARGS=(--model "${MODEL_REPO}")
          ARGS+=(--isl "${INPUT_ISL:-1024}" --osl "${INPUT_OSL:-1024}")
          ARGS+=(--mode "${INPUT_MODE:-local}")
          if [ -n "${INPUT_GPU_TYPE:-}" ]; then
            ARGS+=(--gpu-type "${INPUT_GPU_TYPE}")
          fi
          if [ -n "${INPUT_INFERENCEX_PATH:-}" ]; then
            ARGS+=(--inferencex-path "${INPUT_INFERENCEX_PATH}")
          fi
          if [ "${INPUT_WAIT:-true}" = "false" ]; then
            ARGS+=(--no-wait-for-completion)
          fi
          if [ "${INPUT_COLLECT:-true}" = "false" ]; then
            ARGS+=(--no-collect-artifacts)
          fi
          if [ "${INPUT_ALL_ARTIFACTS:-false}" = "true" ]; then
            ARGS+=(--all-artifacts)
          fi
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          ARGS+=(--task-timeout-min "${INPUT_TASK_TIMEOUT_MIN:-480}")
          ARGS+=(--output-dir "${OUTPUT_DIR}")
          ARGS+=(--artifacts-dir "${ARTIFACTS_DIR}")
          python3 optimize_submit.py "${ARGS[@]}"

      - name: Render per-model manifest to job summary
        if: always()
        run: |
          if [ -f "${{ github.workspace }}/submit-output/submission_manifest.md" ]; then
            cat "${{ github.workspace }}/submit-output/submission_manifest.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No manifest produced for ${{ matrix.model }}._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload per-model manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-manifest-${{ matrix.key }}
          path: submit-output/
          retention-days: 45
          if-no-files-found: warn

      - name: Upload per-model task artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-artifacts-${{ matrix.key }}
          path: task-artifacts/
          retention-days: 45
          if-no-files-found: ignore

      - name: Upload prewarm log
        # Per-model prewarm log lets us diagnose "why was this model slow on
        # first encounter" reports.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prewarm-log-${{ matrix.key }}
          path: prewarm.log
          retention-days: 30
          if-no-files-found: ignore

  # ── Stage 3: aggregate summary ───────────────────────────────────────────────
  summarize:
    name: Build summary
    needs: optimize
    if: always() && needs.prepare.outputs.count != '0' && github.event.inputs.dry_run != 'true'
    # Run on the self-hosted hyperloom-mh826 runner (a K8s pod in the
    # core42-sandbox namespace) so the Publish step can reach the
    # hyperloom-results-service ingress at core42.primus-safe.amd.com.
    # ubuntu-latest works for ingress URL too (it's public), but using the
    # self-hosted runner future-proofs against the URL being moved internal-only
    # and keeps every stage on the same runner pool.
    runs-on: hyperloom-mh826
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # No setup-python on the self-hosted runner — it has system python3
        # already (we use it for the optimize stage too); the pip on this
        # runner image is older and doesn't accept --break-system-packages,
        # but it has no PEP 668 marker either so a plain install works.
        run: pip install --quiet requests pyyaml

      - name: Download all submission manifests
        uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/manifests
          pattern: submission-manifest-*
          merge-multiple: false

      - name: Download all task artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/task-artifacts-merged
          pattern: task-artifacts-*
          # merge-multiple flattens all <task_id>/ subdirs into one root,
          # which is exactly what build_summary.py expects.
          merge-multiple: true

      - name: Build summary table
        working-directory: ci
        env:
          INPUT_TARGET_GPU: ${{ github.event.inputs.target_gpu }}
          INPUT_ISL:        ${{ github.event.inputs.isl }}
          INPUT_OSL:        ${{ github.event.inputs.osl }}
        run: |
          python3 build_summary.py \
            --artifacts-dir "${{ github.workspace }}/task-artifacts-merged" \
            --manifests-dir "${{ github.workspace }}/manifests" \
            --target-gpu    "${INPUT_TARGET_GPU:-mi300x}" \
            --isl           "${INPUT_ISL:-1024}" \
            --osl           "${INPUT_OSL:-1024}" \
            --out-dir       "${{ github.workspace }}/summary-out"

      - name: Publish results to hyperloom-results-service
        # POST normalized_results.json to {HYPERLOOM_RESULTS_SERVICE_URL}/api/import.
        # publish_results.py exits 0 with a log line if the URL env is unset,
        # so this step is a no-op for runs that don't have the secret configured.
        # Mirrors the same step in optimize-batch.yml so both workflows feed the
        # results dashboard the same way.
        if: always()
        working-directory: ci
        env:
          HYPERLOOM_RESULTS_SERVICE_URL:   ${{ secrets.HYPERLOOM_RESULTS_SERVICE_URL }}
          HYPERLOOM_RESULTS_SERVICE_TOKEN: ${{ secrets.HYPERLOOM_RESULTS_SERVICE_TOKEN }}
        run: |
          INPUT="${{ github.workspace }}/summary-out/normalized_results.json"
          if [ ! -f "$INPUT" ]; then
            echo "normalized_results.json not produced — skipping publish"
            exit 0
          fi
          python3 publish_results.py --input "$INPUT"

      - name: Render summary to job summary
        if: always()
        run: |
          if [ -f "${{ github.workspace }}/summary-out/ci_summary.md" ]; then
            cat "${{ github.workspace }}/summary-out/ci_summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No summary produced._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload final summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary
          path: summary-out/
          retention-days: 45
          if-no-files-found: warn

      - name: Send webhook (completion notification)
        # Push the full ranked ci_summary.md (sorted by Gain% desc, with medal
        # decorations) into the Teams webhook. The same data lives in the
        # results service for long-term querying; this notification is for
        # the executive group chat to glance at without clicking through.
        if: always() && env.WEBHOOK_URL != ''
        env:
          WEBHOOK_URL:    ${{ secrets.WEBHOOK_URL }}
          DASHBOARD_URL:  ${{ secrets.HYPERLOOM_DASHBOARD_URL }}
          INPUT_MODELS:   ${{ github.event.inputs.models }}
          INPUT_HF_TOP:   ${{ github.event.inputs.hf_top }}
        run: |
          python3 - <<'PYEOF'
          import json, os
          import requests, urllib3
          urllib3.disable_warnings()

          WORKSPACE = os.environ.get("GITHUB_WORKSPACE", ".")
          webhook_url   = os.environ["WEBHOOK_URL"]
          dashboard_url = os.environ.get("DASHBOARD_URL", "")
          models_input  = os.environ.get("INPUT_MODELS", "").strip()
          hf_top        = os.environ.get("INPUT_HF_TOP", "").strip()
          batch_tag = (models_input.replace(" ", ",")
                       if models_input else f"hf-top-{hf_top or '?'}")

          md_path   = os.path.join(WORKSPACE, "summary-out", "ci_summary.md")
          json_path = os.path.join(WORKSPACE, "summary-out", "ci_summary.json")

          n = succeeded = with_gain = beat_ifx = 0
          if os.path.exists(json_path):
              summary = json.loads(open(json_path).read())
              rows = summary.get("rows") or summary.get("models") or []
              n = len(rows)
              succeeded = sum(1 for r in rows if r.get("final_status") == "Succeeded")
              with_gain = sum(1 for r in rows
                              if (r.get("gain_pct") or 0) > 0
                              and r.get("baseline_tok_per_gpu")
                              and r.get("optimized_tok_per_gpu"))
              beat_ifx = sum(1 for r in rows
                             if (r.get("vs_inferenceX_pct") or 0) > 0)

          run_url = (f"https://github.com/{os.environ.get('GITHUB_REPOSITORY','?')}"
                     f"/actions/runs/{os.environ.get('GITHUB_RUN_ID','?')}")

          # Header lines + the rendered markdown table (sorted by Gain%).
          # Teams incoming webhooks render markdown tables in a monospace
          # block, so we send the body as-is. Length budget is ~28KB; 130
          # rows ≈ 16KB so we are safely inside the limit.
          header = (
              f"**Hyperloom optimize-submit [{batch_tag}] done**  \n"
              f"{succeeded}/{n} succeeded · {with_gain} with gain · "
              f"{beat_ifx} compare against the baseline  \n"
              f"GHA: {run_url}"
          )
          if dashboard_url:
              header += f"  \nDashboard: {dashboard_url}"

          body_md = ""
          if os.path.exists(md_path):
              body_md = open(md_path, encoding="utf-8").read()
          else:
              body_md = "_(no ci_summary.md produced)_"

          # 24KB safety cap (Teams trims silently around 28KB for the whole
          # payload). If we ever blow the cap, fall back to header + counts
          # and let the recipient click through to GHA / dashboard.
          MAX_BYTES = 24_000
          payload_md = f"{header}\n\n{body_md}"
          if len(payload_md.encode("utf-8")) > MAX_BYTES:
              payload_md = (
                  header
                  + "\n\n_Table too large to embed; see GHA / Dashboard._"
              )

          try:
              resp = requests.post(
                  webhook_url, json={"text": payload_md},
                  timeout=10, verify=False)
              print(f"Webhook: HTTP {resp.status_code}")
              if resp.status_code >= 300:
                  print(f"Response: {resp.text[:300]}")
          except Exception as e:
              print(f"Webhook failed: {e}")
          PYEOF
