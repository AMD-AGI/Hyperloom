name: SaFE Optimize Submit

# Submits SaFE inference optimization tasks via the same API the SaFE script
# (Primus-SaFE/scripts/optimize_submit.py) uses, reusing CLAW_API_KEY.
# Independent of inference-optimization-ci.yml — no shared state.
#
# Three-stage pipeline:
#   1. prepare    (ubuntu-latest)  — pick model source by priority:
#                                    models > candidates_file (+ batch slice)
#                                    > hf_top (live HF API).
#                                    Emits matrix JSON for stage 2.
#   2. optimize   (matrix, hyperloom-4hhzn) — one model per parallel job.
#                                    Each job pre-pulls its own repo to
#                                    /wekafs/models BEFORE calling SaFE
#                                    register, so download is overlapped
#                                    with the rest of the batch (no serial
#                                    prewarm stage that blocks optimize).
#                                    max-parallel capped by `max_parallel`
#                                    input (sandbox has 128 GPU available).
#   3. summarize  (hyperloom-4hhzn) — aggregate per-task artifacts into a
#                                    ranked ci_summary.{md,json} (sorted by
#                                    Gain% desc, with medals), publish the
#                                    normalized results to the Hyperloom
#                                    results service, and post the full
#                                    table to the Teams webhook.
#
# How to dispatch:
#   • Single/few models      : `-f models='Qwen/Qwen2.5-7B-Instruct ...'`
#   • Reproducible batch run : `-f candidates_file=ci/candidates/top600_2026-05-12.json
#                              -f batch_index=0 -f batch_size=130`
#   • Quick HF top-N probe   : `-f hf_top=10 -f min_params=7`

on:
  workflow_dispatch:
    inputs:
      # ── Model source (priority: models > candidates_file > hf_top) ──────
      models:
        description: 'Explicit HF repo IDs (space-separated). HIGHEST priority.'
        required: false
        default: ''
      candidates_file:
        description: 'Path to a build_candidates.py JSON (e.g. ci/candidates/top600_2026-05-12.json). Used when models is empty.'
        required: false
        default: ''
      batch_index:
        description: 'Batch index (0-based) into candidates_file. Ignored if batch_size is 0.'
        required: false
        default: '0'
      batch_size:
        description: 'Slice size for candidates_file. 0 = take all rows.'
        required: false
        default: '0'
      hf_top:
        description: 'Live HuggingFace top-N (LEGACY fallback; used only if models AND candidates_file are empty)'
        required: false
        default: '20'
      min_params:
        description: 'Min parameter count in Billions (e.g. 7 for >=7B). 0 to skip filter.'
        required: false
        default: '7'
      max_parallel:
        description: 'Max parallel optimize jobs (sandbox has 128 GPU; safe ceiling is ~128)'
        required: false
        default: '20'
      isl:
        description: 'Input sequence length'
        required: false
        default: '1024'
      osl:
        description: 'Output sequence length'
        required: false
        default: '1024'
      mode:
        description: 'Execution mode forwarded to SaFE'
        required: false
        default: 'local'
        type: choice
        options: [local, claw]
      gpu_type:
        description: 'GPU type tag (overrides SaFE backend default MI355X). Leave empty to use script default (MI300X for core42).'
        required: false
        default: ''
      inferencex_path:
        description: 'InferenceX checkout path inside the sandbox. Leave empty to use script default (/wekafs/InferenceX for core42).'
        required: false
        default: ''
      prompt_prefix:
        # Prepended verbatim to the SaFE-generated Hyperloom prompt
        # (PromptPrefix field on CreateTaskRequest, added in
        # apiserver/pkg/handlers/optimization/types.go).
        #
        # Default carries the entire "always do / never do" preamble we
        # want the agent to see *before* the auto-generated Configuration
        # block. The contents mirror the preventive instructions in
        # /wekafs/HyperloomV2/ci/prompt_template.md, which we
        # cannot inline directly because that file lives in a peer repo
        # the SaFE backend does not read. Keeping the rules here means
        # one place to update when a new failure mode shows up in the
        # batch reports.
        #
        # Critical rules below address the failure modes we hit in
        # batch=10 (2026-05-12) — partial-report-on-abort, vLLM
        # forbidden flags, RESULT_DIR-not-exported writes-silently,
        # find / hangs.
        description: 'Free-form prompt prefix prepended to the SaFE-generated Hyperloom prompt. Default carries HyperloomV2 skill pointer + partial-report-on-abort + vLLM forbidden flags + safety rules.'
        required: false
        default: |
          Use the skill at /wekafs/HyperloomV2/inference_optimizer/SKILL.md to optimize this model.
          Working directory: cd /wekafs/HyperloomV2 before running any skill commands.

          CRITICAL — Required Artifacts (the canonical SaFE success contract):
          At the end of the run, ALWAYS write both files to $RESULT_DIR (defaults to /workspace/hyperloom/).
          If these files are missing, SaFE marks the task Failed regardless of whether the skill made real progress.

            $RESULT_DIR/optimization_report.md
            $RESULT_DIR/ci_metrics.json
              {"baseline_throughput": <float>, "optimized_throughput": <float>, "gain_pct": <float>, "tok_per_gpu_baseline": <float>, "tok_per_gpu_optimized": <float>, "actions_taken": ["..."]}

          If the pipeline aborts (kernel apply failed / server failed to start / optimization tooling crash):
          - Set optimized_throughput = baseline_throughput, gain_pct = 0.0.
          - Set actions_taken = ["aborted: <one-line reason>"].
          - Still emit BOTH files. A partial report with baseline-only numbers is far more useful than no report at all.

          CRITICAL — vLLM Forbidden Flags (server will crash with "unrecognized arguments"):
          - --num-scheduler-steps   (removed in vLLM v0.4.0)
          - --chunked-prefill-size  (SGLang-only, NOT vLLM)
          - --enable-chunked-prefill (only safe on vLLM >= 0.6.0; check version first)

          CRITICAL — Result Directory:
          Before running any skill script (run_baseline.sh, run_sweep.sh, etc.), export:
            export NFS_ROOT=/wekafs
            export RESULT_DIR=/workspace/hyperloom/
          Otherwise baseline/sweep writes fail silently and the job will hang.

          CRITICAL — POST-PIPELINE COPY (the most common reason a successful run shows up Failed):
          The HyperloomV2 orchestrator writes its outputs under its own session
          directory under /wekafs/users/<safe-user-uuid>/<session-name>/ — the
          UUID is a 32-char hex (e.g. 697f4f8340e397169e72840c6ea51cc4), NOT
          the numeric Unix uid. SaFE only inspects $RESULT_DIR (=/workspace/hyperloom/)
          when deciding whether the task succeeded, and CI only collects $RESULT_DIR
          contents. So after phase 10 finishes you MUST physically copy the canonical
          artifacts. The snippet below finds the freshest ci_metrics.json across all
          common layouts (root / phase10_report / results) and copies it + the
          matching optimization_report.md without depending on the numeric uid:

            mkdir -p $RESULT_DIR
            CI=$(ls -t /wekafs/users/*/*/ci_metrics.json \
                       /wekafs/users/*/*/phase10_report/ci_metrics.json \
                       /wekafs/users/*/*/results/ci_metrics.json \
                       2>/dev/null | head -1)
            REPORT=$(ls -t /wekafs/users/*/*/optimization_report.md \
                           /wekafs/users/*/*/phase10_report/optimization_report.md \
                           /wekafs/users/*/*/reports/final.md \
                           2>/dev/null | head -1)
            echo "[POST-COPY] ci_metrics src = $CI"
            echo "[POST-COPY] report     src = $REPORT"
            if [ -n "$CI" ]; then
              cp -f "$CI" $RESULT_DIR/ci_metrics.json
            else
              echo "[ERR] no ci_metrics.json under /wekafs/users/ — write one yourself before exiting"
            fi
            if [ -n "$REPORT" ]; then
              cp -f "$REPORT" $RESULT_DIR/optimization_report.md
            else
              echo "[ERR] no optimization_report.md under /wekafs/users/ — write one yourself before exiting"
            fi
            ls -la $RESULT_DIR/

          The ci_metrics.json values you write here MUST match what the V2
          orchestrator actually measured (proper baseline from phase 1 / best
          from phase 6-8) — do NOT recompute gain_pct from a partial-run
          eager-mode baseline that the orchestrator did not endorse. The two
          numbers must agree with the source ci_metrics.json byte-for-byte.

          SAFETY:
          - NEVER `find /` or `find /wekafs` without `-maxdepth 4`. Prefer which/ls/$PATH lookups.
          - NEVER run `kill -9 $(ps aux | grep ...)` — this kills the sandbox executor itself.
          - Per-bash timeouts must be <= 120s; use short polling loops rather than one long blocking call.
      target_gpu:
        description: 'Reference GPU for InferenceX comparison in the summary table'
        required: false
        default: 'mi300x'
        type: choice
        options: [mi300x, b200, h100, mi355x, mi325x]
      wait_for_completion:
        description: 'Wait for tasks to finish (default true). Uncheck for fire-and-forget.'
        type: boolean
        required: false
        default: true
      collect_artifacts:
        description: 'Download per-task artifacts (default true; needs wait_for_completion)'
        type: boolean
        required: false
        default: true
      task_timeout_min:
        description: 'Per-task wait timeout in minutes (default 480 = 8h)'
        required: false
        default: '480'
      all_artifacts:
        description: 'Download every artifact (default off — only optimization_report + ci_metrics)'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'Dry run (auto-detect and print plan only, do not submit)'
        type: boolean
        required: false
        default: false

jobs:
  # ── Stage 1: build matrix ────────────────────────────────────────────────────
  prepare:
    name: Build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count:  ${{ steps.matrix.outputs.count }}
    env:
      HF_TOKEN:              ${{ secrets.HF_TOKEN }}
      INPUT_MODELS:          ${{ github.event.inputs.models }}
      INPUT_CANDIDATES_FILE: ${{ github.event.inputs.candidates_file }}
      INPUT_BATCH_INDEX:     ${{ github.event.inputs.batch_index }}
      INPUT_BATCH_SIZE:      ${{ github.event.inputs.batch_size }}
      INPUT_HF_TOP:          ${{ github.event.inputs.hf_top }}
      INPUT_MIN_PARAMS:      ${{ github.event.inputs.min_params }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: pip install --quiet requests
      - name: Generate matrix
        id: matrix
        working-directory: ci
        run: python3 generate_hf_matrix.py

  # ── Stage 2: per-model optimization (parallel) ──────────────────────────────
  optimize:
    name: optimize-${{ matrix.key }}
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: hyperloom-4hhzn
    # 8h per-task timeout + buffer for register/wait/collect.
    timeout-minutes: 600
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(github.event.inputs.max_parallel || '20') }}
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      CLAW_API_KEY:                     ${{ secrets.CLAW_API_KEY }}
      SAFE_BASE_URL:                    ${{ secrets.SAFE_BASE_URL }}
      HARBOR_PREFIX:                    ${{ secrets.HARBOR_PREFIX }}
      HF_TOKEN:                         ${{ secrets.HF_TOKEN }}
      SAFE_OPTIMIZE_REGISTER_WORKSPACE: ${{ secrets.SAFE_OPTIMIZE_REGISTER_WORKSPACE }}
      SAFE_OPTIMIZE_SUBMIT_WORKSPACE:   ${{ secrets.SAFE_OPTIMIZE_SUBMIT_WORKSPACE }}
      SAFE_OPTIMIZE_VOLUME:             ${{ secrets.SAFE_OPTIMIZE_VOLUME }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: ci
        run: pip install --quiet requests 'huggingface_hub>=0.24'

      - name: Prewarm /wekafs/models for this repo
        # Pre-pull the HF repo directly into /wekafs/models/<owner>-<repo>/
        # BEFORE invoking SaFE register, bypassing SaFE playground's slow
        # K8s-job-based download path. Same logic as optimize-batch.yml.
        # continue-on-error: any failure here (missing /wekafs mount, HF rate
        # limit, gated repo) just lets SaFE register handle the download
        # itself, slower but still correct.
        if: always()
        continue-on-error: true
        env:
          HF_TOKEN:   ${{ secrets.HF_TOKEN }}
          MODEL_REPO: ${{ matrix.model }}
        run: |
          set -euo pipefail
          if [ ! -d /wekafs/models ]; then
            echo "WARN: /wekafs/models not visible on this runner, skipping prewarm"
            echo "      (SaFE register will handle the download on its own)"
            exit 0
          fi
          if [ ! -w /wekafs/models ]; then
            echo "WARN: /wekafs/models not writable, skipping prewarm"
            ls -ld /wekafs/models || true
            exit 0
          fi
          python3 ci/prewarm_models.py \
            --repos        "${MODEL_REPO}" \
            --target-root  /wekafs/models \
            --concurrency  1 \
            --inner-workers 8 \
            --log          "${{ github.workspace }}/prewarm.log"

      - name: Submit + wait + collect (single model)
        working-directory: ci
        env:
          MODEL_REPO:             ${{ matrix.model }}
          INPUT_ISL:              ${{ github.event.inputs.isl }}
          INPUT_OSL:              ${{ github.event.inputs.osl }}
          INPUT_MODE:             ${{ github.event.inputs.mode }}
          INPUT_GPU_TYPE:         ${{ github.event.inputs.gpu_type }}
          INPUT_INFERENCEX_PATH:  ${{ github.event.inputs.inferencex_path }}
          INPUT_PROMPT_PREFIX:    ${{ github.event.inputs.prompt_prefix }}
          INPUT_WAIT:             ${{ github.event.inputs.wait_for_completion }}
          INPUT_COLLECT:          ${{ github.event.inputs.collect_artifacts }}
          INPUT_TASK_TIMEOUT_MIN: ${{ github.event.inputs.task_timeout_min }}
          INPUT_ALL_ARTIFACTS:    ${{ github.event.inputs.all_artifacts }}
          INPUT_DRY_RUN:          ${{ github.event.inputs.dry_run }}
          OUTPUT_DIR:             ${{ github.workspace }}/submit-output
          ARTIFACTS_DIR:          ${{ github.workspace }}/task-artifacts
        run: |
          set -euo pipefail
          ARGS=(--model "${MODEL_REPO}")
          ARGS+=(--isl "${INPUT_ISL:-1024}" --osl "${INPUT_OSL:-1024}")
          ARGS+=(--mode "${INPUT_MODE:-local}")
          if [ -n "${INPUT_GPU_TYPE:-}" ]; then
            ARGS+=(--gpu-type "${INPUT_GPU_TYPE}")
          fi
          if [ -n "${INPUT_INFERENCEX_PATH:-}" ]; then
            ARGS+=(--inferencex-path "${INPUT_INFERENCEX_PATH}")
          fi
          if [ -n "${INPUT_PROMPT_PREFIX:-}" ]; then
            ARGS+=(--prompt-prefix "${INPUT_PROMPT_PREFIX}")
          fi
          if [ "${INPUT_WAIT:-true}" = "false" ]; then
            ARGS+=(--no-wait-for-completion)
          fi
          if [ "${INPUT_COLLECT:-true}" = "false" ]; then
            ARGS+=(--no-collect-artifacts)
          fi
          if [ "${INPUT_ALL_ARTIFACTS:-false}" = "true" ]; then
            ARGS+=(--all-artifacts)
          fi
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          ARGS+=(--task-timeout-min "${INPUT_TASK_TIMEOUT_MIN:-480}")
          ARGS+=(--output-dir "${OUTPUT_DIR}")
          ARGS+=(--artifacts-dir "${ARTIFACTS_DIR}")
          python3 optimize_submit.py "${ARGS[@]}"

      - name: Render per-model manifest to job summary
        if: always()
        run: |
          if [ -f "${{ github.workspace }}/submit-output/submission_manifest.md" ]; then
            cat "${{ github.workspace }}/submit-output/submission_manifest.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No manifest produced for ${{ matrix.model }}._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload per-model manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-manifest-${{ matrix.key }}
          path: submit-output/
          retention-days: 45
          if-no-files-found: warn

      - name: Upload per-model task artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-artifacts-${{ matrix.key }}
          path: task-artifacts/
          retention-days: 45
          if-no-files-found: ignore

      - name: Upload prewarm log
        # Per-model prewarm log lets us diagnose "why was this model slow on
        # first encounter" reports.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prewarm-log-${{ matrix.key }}
          path: prewarm.log
          retention-days: 30
          if-no-files-found: ignore

  # ── Stage 3: aggregate summary ───────────────────────────────────────────────
  summarize:
    name: Build summary
    needs: optimize
    if: always() && needs.prepare.outputs.count != '0' && github.event.inputs.dry_run != 'true'
    # Run on the self-hosted hyperloom-4hhzn runner (a K8s pod in the
    # core42-hyperloom namespace) so the Publish step can reach the
    # hyperloom-results-service ingress at core42.example-internal-host.invalid.
    # hyperloom-4hhzn mounts /wekafs as RW (vs. hyperloom-mh826 which was RO),
    # which is what the optimize stage needs for prewarm to actually write
    # models into /wekafs/models/. Keeping the summary on the same pool
    # avoids one-cluster-vs-another pitfalls.
    runs-on: hyperloom-4hhzn
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # No setup-python on the self-hosted runner — it has system python3
        # already (we use it for the optimize stage too); the pip on this
        # runner image is older and doesn't accept --break-system-packages,
        # but it has no PEP 668 marker either so a plain install works.
        run: pip install --quiet requests pyyaml

      - name: Download all submission manifests
        uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/manifests
          pattern: submission-manifest-*
          merge-multiple: false

      - name: Download all task artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/task-artifacts-merged
          pattern: task-artifacts-*
          # merge-multiple flattens all <task_id>/ subdirs into one root,
          # which is exactly what build_summary.py expects.
          merge-multiple: true

      - name: Build summary table
        working-directory: ci
        env:
          INPUT_TARGET_GPU: ${{ github.event.inputs.target_gpu }}
          INPUT_ISL:        ${{ github.event.inputs.isl }}
          INPUT_OSL:        ${{ github.event.inputs.osl }}
        run: |
          python3 build_summary.py \
            --artifacts-dir "${{ github.workspace }}/task-artifacts-merged" \
            --manifests-dir "${{ github.workspace }}/manifests" \
            --target-gpu    "${INPUT_TARGET_GPU:-mi300x}" \
            --isl           "${INPUT_ISL:-1024}" \
            --osl           "${INPUT_OSL:-1024}" \
            --out-dir       "${{ github.workspace }}/summary-out"

      - name: Publish results to hyperloom-results-service
        # POST normalized_results.json to {HYPERLOOM_RESULTS_SERVICE_URL}/api/import.
        # publish_results.py exits 0 with a log line if the URL env is unset,
        # so this step is a no-op for runs that don't have the secret configured.
        # Mirrors the same step in optimize-batch.yml so both workflows feed the
        # results dashboard the same way.
        #
        # continue-on-error: the publish endpoint has known intermittent 500s
        # when its postgres pod crashloops (luochen has been pinged). Even
        # with the in-script retry loop, persistent service downtime should
        # not block the webhook from being sent — that is the user's main
        # signal that a batch finished. The summary artifact + GHA logs still
        # carry the full data for re-publish later.
        if: always()
        continue-on-error: true
        working-directory: ci
        env:
          HYPERLOOM_RESULTS_SERVICE_URL:   ${{ secrets.HYPERLOOM_RESULTS_SERVICE_URL }}
          HYPERLOOM_RESULTS_SERVICE_TOKEN: ${{ secrets.HYPERLOOM_RESULTS_SERVICE_TOKEN }}
        run: |
          INPUT="${{ github.workspace }}/summary-out/normalized_results.json"
          if [ ! -f "$INPUT" ]; then
            echo "normalized_results.json not produced — skipping publish"
            exit 0
          fi
          python3 publish_results.py --input "$INPUT"

      - name: Render summary to job summary
        if: always()
        run: |
          if [ -f "${{ github.workspace }}/summary-out/ci_summary.md" ]; then
            cat "${{ github.workspace }}/summary-out/ci_summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No summary produced._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload final summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary
          path: summary-out/
          retention-days: 45
          if-no-files-found: warn

      - name: Send webhook (completion notification)
        # Push the full ranked ci_summary.md (sorted by Gain% desc, with medal
        # decorations) into the Teams webhook. The same data lives in the
        # results service for long-term querying; this notification is for
        # the executive group chat to glance at without clicking through.
        if: always() && env.WEBHOOK_URL != ''
        env:
          WEBHOOK_URL:    ${{ secrets.WEBHOOK_URL }}
          DASHBOARD_URL:  ${{ secrets.HYPERLOOM_DASHBOARD_URL }}
          INPUT_MODELS:   ${{ github.event.inputs.models }}
          INPUT_HF_TOP:   ${{ github.event.inputs.hf_top }}
        run: |
          python3 - <<'PYEOF'
          import json, os
          import requests, urllib3
          urllib3.disable_warnings()

          WORKSPACE = os.environ.get("GITHUB_WORKSPACE", ".")
          webhook_url   = os.environ["WEBHOOK_URL"]
          dashboard_url = os.environ.get("DASHBOARD_URL", "")
          models_input  = os.environ.get("INPUT_MODELS", "").strip()
          hf_top        = os.environ.get("INPUT_HF_TOP", "").strip()
          batch_tag = (models_input.replace(" ", ",")
                       if models_input else f"hf-top-{hf_top or '?'}")

          md_path   = os.path.join(WORKSPACE, "summary-out", "ci_summary.md")
          json_path = os.path.join(WORKSPACE, "summary-out", "ci_summary.json")

          n = succeeded = with_gain = beat_ifx = 0
          if os.path.exists(json_path):
              summary = json.loads(open(json_path).read())
              rows = summary.get("rows") or summary.get("models") or []
              n = len(rows)
              succeeded = sum(1 for r in rows if r.get("final_status") == "Succeeded")
              with_gain = sum(1 for r in rows
                              if (r.get("gain_pct") or 0) > 0
                              and r.get("baseline_tok_per_gpu")
                              and r.get("optimized_tok_per_gpu"))
              beat_ifx = sum(1 for r in rows
                             if (r.get("vs_inferenceX_pct") or 0) > 0)

          run_url = (f"https://github.com/{os.environ.get('GITHUB_REPOSITORY','?')}"
                     f"/actions/runs/{os.environ.get('GITHUB_RUN_ID','?')}")

          # Header lines + the rendered markdown table (sorted by Gain%).
          # Teams incoming webhooks render markdown tables in a monospace
          # block, so we send the body as-is. Length budget is ~28KB; 130
          # rows ≈ 16KB so we are safely inside the limit.
          header = (
              f"**Hyperloom optimize-submit [{batch_tag}] done**  \n"
              f"{succeeded}/{n} succeeded · {with_gain} with gain · "
              f"{beat_ifx} compare against the baseline  \n"
              f"GHA: {run_url}"
          )
          if dashboard_url:
              header += f"  \nDashboard: {dashboard_url}"

          body_md = ""
          if os.path.exists(md_path):
              body_md = open(md_path, encoding="utf-8").read()
          else:
              body_md = "_(no ci_summary.md produced)_"

          # 24KB safety cap (Teams trims silently around 28KB for the whole
          # payload). If we ever blow the cap, fall back to header + counts
          # and let the recipient click through to GHA / dashboard.
          MAX_BYTES = 24_000
          payload_md = f"{header}\n\n{body_md}"
          if len(payload_md.encode("utf-8")) > MAX_BYTES:
              payload_md = (
                  header
                  + "\n\n_Table too large to embed; see GHA / Dashboard._"
              )

          try:
              resp = requests.post(
                  webhook_url, json={"text": payload_md},
                  timeout=10, verify=False)
              print(f"Webhook: HTTP {resp.status_code}")
              if resp.status_code >= 300:
                  print(f"Response: {resp.text[:300]}")
          except Exception as e:
              print(f"Webhook failed: {e}")
          PYEOF
