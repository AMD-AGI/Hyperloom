name: "Feature Request"
description: "Suggest a new capability or improvement to Hyperloom"
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please check [existing issues](../../issues) first to avoid duplicates.

  - type: dropdown
    id: target_release
    attributes:
      label: Target release
      options:
        - v0.2
        - v0.3
        - v0.4
        - Unsure
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Optimization domain
      options:
        - Inference
        - Training
        - Both
        - N/A
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What limitation or gap are you hitting today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Hyperloom to do differently?
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Expected impact
      description: What improvement in throughput, usability, or coverage do you expect?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you've tried or other approaches?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, profiler traces, prior optimization runs, or related issues
    validations:
      required: false
