name: "Bug Report"
description: "Report a bug, failed run, hang, performance regression, or system issue"
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this issue. Please check [existing issues](../../issues) first to avoid duplicates.
        For usage questions or support, use our Teams channel instead.

  - type: dropdown
    id: target_release
    attributes:
      label: Target release
      options:
        - v0.2
        - v0.3
        - v0.4
        - Unsure
    validations:
      required: true

  - type: dropdown
    id: entry_point
    attributes:
      label: How were you running Hyperloom?
      options:
        - Hyperloom UI (PrimusClaw)
        - Local
    validations:
      required: true

  - type: dropdown
    id: optimization_domain
    attributes:
      label: Optimization domain
      options:
        - Inference
        - Training
        - Both
        - N/A
    validations:
      required: true

  - type: dropdown
    id: issue_type
    attributes:
      label: Issue type
      options:
        - Crash / failure
        - Hang / no progress
        - Wrong result or regression
        - MCP tool failure
        - Environment / setup
        - UI issue
        - Other
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: Which phase failed?
      options:
        - Setup / baseline
        - Profiling / analysis
        - Optimization loop
        - Report / delivery
        - Other
    validations:
      required: true

  - type: input
    id: summary
    attributes:
      label: Short Summary
      description: One-sentence description of the issue
      placeholder: "Example: Agent hangs after TraceLens analysis on MI355X with Qwen3-30B-A3B"
    validations:
      required: true

  - type: input
    id: job_id
    attributes:
      label: Job ID (UI / PrimusClaw runs only)
      description: Required for log lookup in the hosted UI. Leave blank for local runs.
      placeholder: "Example: 12345678"
    validations:
      required: false

  - type: textarea
    id: command
    attributes:
      label: Command / prompt submitted
      description: Full command, config path, or agent prompt used to start the run
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      placeholder: "What should have happened?"
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
      placeholder: "What actually happened? Include exact error messages or agent output."
    validations:
      required: true

  - type: textarea
    id: repro_steps
    attributes:
      label: Steps to reproduce
      description: Leave blank if not consistently reproducible.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Most relevant logs, stack traces, agent output, or MCP tool errors
      placeholder: "Paste logs here"
      render: shell
    validations:
      required: false

  - type: textarea
    id: artifacts
    attributes:
      label: Additional artifacts / links
      placeholder: |
        - results.tsv:
        - Profiler trace (.pt.trace.json):
        - TraceLens trace:
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Data handling
      options:
        - label: I confirmed the attached logs/artifacts contain no sensitive information
          required: true
