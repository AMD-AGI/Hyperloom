version = 1

# Default for everything Hyperloom and KernelForge wrote.
#
# ``aggregate`` means a file's own notice is added to this one rather than
# replacing it, which is right for AMD-authored files and wrong for anything
# third-party: it would assert AMD copyright over someone else's work. Files
# with an upstream notice are therefore listed below with ``override``, which
# makes their real licence the only one REUSE reports.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Advanced Micro Devices, Inc."
SPDX-License-Identifier = "MIT"

# Reference kernels copied from the FlyDSL project, carried in forge's
# knowledge base so the agent can read working examples of the language. They
# keep their own headers; this stops the blanket entry above from adding an AMD
# claim on top.
[[annotations]]
path = [
    "src/kernelforge/examples/flydsl-softmax-forge-loop/softmax_kernel.py",
    "src/kernelforge/knowledge/local_wiki/resources/languages/flydsl/API_docs/examples/01-vectorAdd.py",
    "src/kernelforge/knowledge/local_wiki/resources/languages/flydsl/API_docs/examples/02-tiledCopy.py",
    "src/kernelforge/knowledge/local_wiki/resources/languages/flydsl/API_docs/examples/03-tiledMma.py",
    "src/kernelforge/knowledge/local_wiki/resources/languages/flydsl/API_docs/examples/04-preshuffle_gemm.py",
]
precedence = "override"
SPDX-FileCopyrightText = "FlyDSL Project Contributors"
SPDX-License-Identifier = "Apache-2.0"

# Triton oracle for the mxfp8 grouped-GEMM rewrite example, extracted from
# SGLang's ``kernels/ops/moe/mxfp8_moe_amd_gfx95.py``. The rewrite pipeline
# treats it as read-only input; the FlyDSL port it produces is AMD's.
[[annotations]]
path = "src/kernelforge/examples/triton2flydsl-mxfp8-grouped-gemm/mxfp8_grouped_gemm.py"
precedence = "override"
SPDX-FileCopyrightText = "SGLang Team and contributors"
SPDX-License-Identifier = "Apache-2.0"

# Snapshots recorded from InferenceX (configs, recipes and golden curves, and what its code answered for them), which
# the InferenceX recipe source is tested against.
[[annotations]]
path = "src/inference_suite/tests/fixtures/inferencex/**"
precedence = "override"
SPDX-FileCopyrightText = "2025 SemiAnalysis LLC, Advanced Micro Devices, NVIDIA CORPORATION"
SPDX-License-Identifier = "Apache-2.0"

# A snapshot of the sglang cookbook (deployment configs, AgentX launches and pages), which the sglang cookbook recipe
# source is tested against.
[[annotations]]
path = "src/inference_suite/tests/fixtures/sglang/**"
precedence = "override"
SPDX-FileCopyrightText = "2023-2026 SGLang Team"
SPDX-License-Identifier = "Apache-2.0"

# Responses of the vLLM recipes site (recipes.vllm.ai), which the vLLM recipes source is tested against.
[[annotations]]
path = "src/inference_suite/tests/fixtures/vllm_recipes/**"
precedence = "override"
SPDX-FileCopyrightText = "2025-2026 vLLM Team"
SPDX-License-Identifier = "Apache-2.0"

# A snapshot of ATOM (benchmark catalogs and recipe pages), which the ATOM recipe source is tested against.
[[annotations]]
path = "src/inference_suite/tests/fixtures/atom/**"
precedence = "override"
SPDX-FileCopyrightText = "Advanced Micro Devices, Inc."
SPDX-License-Identifier = "MIT"

# The --help text of llama-server 1.0.0-dev (build 12439), which the native server flag check is tested against.
[[annotations]]
path = "src/inference_suite/tests/fixtures/llamacpp/**"
precedence = "override"
SPDX-FileCopyrightText = "2023-2026 The ggml authors"
SPDX-License-Identifier = "MIT"

# The Inspector's modern UI, compiled by Vite from frontend/inspector (gitignored in the tree). The
# bundle mixes AMD's code with the npm packages listed, licence text included, in the THIRD_PARTY_LICENSES.txt the
# build writes next to it. Svelte and xyflow are MIT, most d3 modules (the graph's force layout, and xyflow's pan
# and zoom) are ISC, and d3-ease is BSD-3-Clause; a new licence type changes this expression. The ISC and BSD
# texts ship in THIRD_PARTY_LICENSES.txt, not LICENSES/: `reuse lint` skips gitignored files, so it would report
# them unused.
[[annotations]]
path = "src/hyperloom/inspector/static/modern/**"
precedence = "override"
SPDX-FileCopyrightText = [
    "2026 Advanced Micro Devices, Inc.",
    "Authors of the npm packages listed in static/modern/THIRD_PARTY_LICENSES.txt",
]
SPDX-License-Identifier = "MIT AND ISC AND BSD-3-Clause"
