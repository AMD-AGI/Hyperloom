version = 1

# Default for everything Hyperloom and KernelForge wrote.
#
# ``aggregate`` means a file's own notice is added to this one rather than
# replacing it, which is right for AMD-authored files and wrong for anything
# third-party: it would assert AMD copyright over someone else's work. Files
# with an upstream notice are therefore listed below with ``override``, which
# makes their real licence the only one REUSE reports.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Advanced Micro Devices, Inc."
SPDX-License-Identifier = "MIT"

# Reference kernels copied from the FlyDSL project, carried in forge's
# knowledge base so the agent can read working examples of the language. They
# keep their own headers; this stops the blanket entry above from adding an AMD
# claim on top.
[[annotations]]
path = [
    "src/kernelforge/examples/flydsl-softmax-forge-loop/softmax_kernel.py",
    "src/kernelforge/knowledge/local_wiki/resources/languages/flydsl/API_docs/examples/01-vectorAdd.py",
    "src/kernelforge/knowledge/local_wiki/resources/languages/flydsl/API_docs/examples/02-tiledCopy.py",
    "src/kernelforge/knowledge/local_wiki/resources/languages/flydsl/API_docs/examples/03-tiledMma.py",
    "src/kernelforge/knowledge/local_wiki/resources/languages/flydsl/API_docs/examples/04-preshuffle_gemm.py",
]
precedence = "override"
SPDX-FileCopyrightText = "FlyDSL Project Contributors"
SPDX-License-Identifier = "Apache-2.0"

# Triton oracle for the mxfp8 grouped-GEMM rewrite example, extracted from
# SGLang's ``kernels/ops/moe/mxfp8_moe_amd_gfx95.py``. The rewrite pipeline
# treats it as read-only input; the FlyDSL port it produces is AMD's.
[[annotations]]
path = "src/kernelforge/examples/triton2flydsl-mxfp8-grouped-gemm/mxfp8_grouped_gemm.py"
precedence = "override"
SPDX-FileCopyrightText = "SGLang Team and contributors"
SPDX-License-Identifier = "Apache-2.0"

# Arbor, vendored at a release tag (src/hyperloom_arbor/VENDOR.md). It is AMD's, under its own
# Apache-2.0 licence (src/hyperloom_arbor/LICENSE), not this repository's MIT; the entries after
# this one name what it carries from elsewhere.
[[annotations]]
path = "src/hyperloom_arbor/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Advanced Micro Devices, Inc."
SPDX-License-Identifier = "Apache-2.0"

# KernelForge's pages that Arbor's kernels and hardware skills carry: MIT, as src/kernelforge.
[[annotations]]
path = [
    "src/hyperloom_arbor/.claude/skills/kernels/reference/**",
    "src/hyperloom_arbor/.claude/skills/hardware/reference/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Advanced Micro Devices, Inc."
SPDX-License-Identifier = "MIT"

# The FlyDSL reference kernel among those pages, as src/kernelforge annotates its own copy.
[[annotations]]
path = "src/hyperloom_arbor/.claude/skills/kernels/reference/examples/flydsl-softmax-forge-loop/softmax_kernel.py"
precedence = "override"
SPDX-FileCopyrightText = "FlyDSL Project Contributors"
SPDX-License-Identifier = "Apache-2.0"

# NCCL's profiler-plugin headers, which the ruppell tracer in Arbor's profiler skill builds
# against; their licence is beside them (LICENSE.txt).
[[annotations]]
path = "src/hyperloom_arbor/.claude/skills/profiler/ruppell/runtime/third_party/nccl_profiler/**"
precedence = "override"
SPDX-FileCopyrightText = "2015-2024 NVIDIA CORPORATION"
SPDX-License-Identifier = "BSD-3-Clause"
