[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperloom-inference_optimizer"
version = "0.8.0"
description = "Inference Optimizer — single-mode 4-agent (Orchestration/Kernel/Critic/Robustness) autonomous LLM inference optimization runtime for AMD GPU platforms."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Intentionally empty: the bare wheel carries no third-party runtime deps so a
# ``pip install --target`` workspace stays clean. Runtime deps are installed by
# the packaged install.sh (see the ``runtime`` extra below and the packaged
# branch of inference_optimizer/assets/install.sh); ``setup.py`` starts with
# stdlib-only imports so ``python -m hyperloom.inference_optimizer.setup`` runs
# before any dep is installed.
dependencies = []

[project.urls]
Homepage = "https://github.com/AMD-AGI/Hyperloom"
Source = "https://github.com/AMD-AGI/Hyperloom"
Issues = "https://github.com/AMD-AGI/Hyperloom/issues"
Changelog = "https://github.com/AMD-AGI/Hyperloom/blob/main/CHANGELOG.md"
Security = "https://github.com/AMD-AGI/Hyperloom/security/policy"

[project.optional-dependencies]
# LLM backend SDKs — lazy-imported by the Claude/Codex/critic/scorer roles and
# backfilled at runtime by preflight ``_ensure_python_sdks``. httpx also has a
# few top-level imports in robustness/multi_node internals (not on the CLI
# startup path).
llm = [
    "claude-agent-sdk>=0.2.110",
    "openai>=1.50",
    "httpx>=0.27",
]
# Critic-agent web tools (web_search / web_fetch). ``web_tools`` imports these
# at module load time even when CRITIC_WEB_TOOLS_ENABLED=false, but that module
# is only imported lazily by the critic backend, so they stay out of base.
web = [
    "markdownify>=0.11",
    "cachetools>=5.3",
]
# Full runtime dependency set installed by the packaged install.sh. PyYAML is
# a hard import-time dep of the CLI startup path (executors/baseline.py); the
# rest come from the llm/web extras above.
runtime = [
    "PyYAML>=6.0",
    "hyperloom-inference_optimizer[llm,web]",
]
test = [
    "hyperloom-inference_optimizer[runtime]",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "respx>=0.21",
    "requests>=2.28",
    # Exercises the optional psutil-based live-compiler probe in _aiter_jit
    # (psutil stays an optional runtime dep — the probe degrades to None when
    # it is absent — but the test suite needs it to cover that path).
    "psutil>=5.9",
    # tree-reform.MD P2.5: framework-agent's own ``test`` extra listed these
    # so its ``ast``-extra code paths (patch-authoring / isolation) are
    # exercised by the shared test suite too.
    "libcst>=1.0",
    "patch-ng>=1.18",
]
# CI / local mirror of the coverage job: ``pip install -e ".[test,ci]"``.
# ``tomli`` is only required on Python <3.11 when inline scripts read
# ``pyproject.toml`` with the same loader as Actions.
ci = [
    "pytest-cov>=5.0",
    "coverage>=7.0",
    # Parallel test execution for the coverage job (``-n auto`` in
    # ``pytest_ci_args``). pytest-cov merges the per-worker coverage data, so
    # the reported total is identical to a serial run.
    "pytest-xdist>=3.5",
    "tomli>=2.0.1; python_version < '3.11'",
]
# Optional live-Langfuse trace push (HYPERLOOM_LANGFUSE_ENABLE=1). The local
# reports/trace/*.jsonl ledger never needs this; only the opt-in Langfuse
# sink imports the SDK (lazily, with a friendly no-op when absent).
trace = [
    "langfuse>=2.0",
]
# tree-reform.MD P2.5: framework-agent's own optional extras, merged in
# verbatim after its promotion into hyperloom.agents.framework. ``ast`` is
# used by the (currently GPU-node-only) patch-authoring/isolation path;
# ``claude`` is the optional ``synthesize --with-llm`` KB-distillation backend.
ast = [
    "libcst>=1.0",
    "patch-ng>=1.18",
]
claude = [
    "claude-agent-sdk>=0.2.110",
]

[project.scripts]
inference_optimizer = "hyperloom.inference_optimizer.cli:main"
hyperloom = "hyperloom.inference_optimizer.setup:main"
# tree-reform.MD P2.5: framework-agent's own ``[project.scripts]`` entries
# (``framework-agent`` / ``fa``), preserved verbatim so the console scripts
# keep resolving after promotion into the single ``hyperloom`` distribution.
# The orchestrator's ``framework/client.py._resolve_fa_binary()`` looks up
# ``fa`` on PATH first (``shutil.which("fa")``), which these provide.
framework-agent = "hyperloom.agents.framework.runtime.cli:main"
fa = "hyperloom.agents.framework.runtime.cli:main"
# tree-reform.MD P2.5: robustness-agent's own ``[project.scripts]`` entry,
# preserved verbatim (standalone reactor CLI wrapper; the orchestrator itself
# always shells out to ``python -m hyperloom.agents.robustness.runtime.cli``
# directly, not via this console script).
robustness-agent = "hyperloom.agents.robustness.main:main"
# tree-reform.MD P2.5: quantization_agent previously had no console-script
# entry point (only ``python -m quantization_agent.cli``); this is a new
# convenience entry added during its promotion into hyperloom.agents.
quantization-agent = "hyperloom.agents.quantization.cli:main"

# tree-reform.MD P2.8: package discovery is fully declarative now that the
# whole ``hyperloom`` distribution lives under a single src-layout namespace
# (setup.py used to carry find_packages(where="src") + an explicit
# package_dir mapping; both are now expressed here and setup.py is deleted).
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
# Install the setup skill under every agent's discovery dir so /hyperloom-setup
# is visible in Claude Code (.claude), Cursor (.cursor/.agents) and Codex.
".agents/skills/hyperloom-setup" = [
    "src/hyperloom/skills/hyperloom-setup/SKILL.md",
]
".claude/skills/hyperloom-setup" = [
    "src/hyperloom/skills/hyperloom-setup/SKILL.md",
]
".cursor/skills/hyperloom-setup" = [
    "src/hyperloom/skills/hyperloom-setup/SKILL.md",
]
# Demo run skills chained from /hyperloom-setup; installed under every agent's
# discovery dir so the local demo skills are visible after install.
".agents/skills/hyperloom-qwen3-8b-3h" = ["examples/hyperloom-qwen3-8b-3h/SKILL.md"]
".claude/skills/hyperloom-qwen3-8b-3h" = ["examples/hyperloom-qwen3-8b-3h/SKILL.md"]
".cursor/skills/hyperloom-qwen3-8b-3h" = ["examples/hyperloom-qwen3-8b-3h/SKILL.md"]
".agents/skills/hyperloom-qwen3-14b-fp8-8h" = ["examples/hyperloom-qwen3-14b-fp8-8h/SKILL.md"]
".claude/skills/hyperloom-qwen3-14b-fp8-8h" = ["examples/hyperloom-qwen3-14b-fp8-8h/SKILL.md"]
".cursor/skills/hyperloom-qwen3-14b-fp8-8h" = ["examples/hyperloom-qwen3-14b-fp8-8h/SKILL.md"]
".agents/skills/hyperloom-gpt-oss-120b-24h" = ["examples/hyperloom-gpt-oss-120b-24h/SKILL.md"]
".claude/skills/hyperloom-gpt-oss-120b-24h" = ["examples/hyperloom-gpt-oss-120b-24h/SKILL.md"]
".cursor/skills/hyperloom-gpt-oss-120b-24h" = ["examples/hyperloom-gpt-oss-120b-24h/SKILL.md"]

[tool.setuptools.package-data]
# tree-reform.MD P2.3: orchestrator/prompts/*.md moved with the
# orchestrator -> src/hyperloom/orchestrator promotion (stage A) and further
# into orchestrator/prompts/ during the internal subpackage split (stage B).
# tree-reform.MD P2.4: inference_optimizer.* entries moved here (from the
# top-level ``inference_optimizer`` key) after inference_optimizer was
# promoted from a repo-root flat-layout package to
# src/hyperloom/inference_optimizer.
hyperloom = [
    "orchestrator/prompts/*.md",
]
"hyperloom.inference_optimizer" = [
    "SKILL.md",
    "README.md",
    "actions/*.md",
    "actions/_meta/*.yaml",
    # tree-reform.MD P2.4: scripts/ split three ways -- assets/ (release-
    # contract shell installers + configs), tools/ (operator CLIs, .py so not
    # package-data), experiments/ (A/B scripts, likewise not package-data).
    "assets/*.sh",
    "assets/*.example",
    "assets/configs/*.yaml",
    # Slurm submission bundle (batch-scheduler counterpart to the k8s layout;
    # see docs/install/slurm.md). Shipped so wheel installs get the scripts.
    "assets/slurm/*.sh",
    "assets/slurm/*.sbatch",
    "assets/slurm/*.tsv",
    "assets/slurm/*.template",
    "references/*.md",
    "tools/*.sh.example",
]
# tree-reform.MD P2.5: critic-agent's LLM skill assets (mounted by the A2A /
# Codex chat server host, not imported as Python) promoted alongside its
# ``runtime`` package.
"hyperloom.agents.critic" = [
    "SKILL.md",
    "AGENTS.md",
    "actions/*.md",
    "references/*.md",
    "kb_contributions/*.json",
]
# tree-reform.MD P2.5: robustness-agent's SKILL.md, promoted alongside its
# package (near-verbatim move; already good src-layout per tree-reform.MD).
"hyperloom.agents.robustness" = [
    "SKILL.md",
]
# tree-reform.MD P2.5: framework-agent's LLM skill assets (SKILL.md/AGENTS.md/
# README.md, LLM prompt templates, protocol/schema references, and the
# example request payloads used by its own tests), promoted alongside its
# package. ``scripts/install.sh`` stays package-data too (chained from
# ``src/hyperloom/inference_optimizer/assets/install.sh``).
"hyperloom.agents.framework" = [
    "SKILL.md",
    "AGENTS.md",
    "README.md",
    "prompts/*.md",
    "references/*.md",
    "examples/*.json",
    "examples/*.py",
    "kb/framework_optimization/*.jsonl",
    "scripts/*.sh",
]
# tree-reform.MD P2.5: quantization_agent's skill assets, promoted alongside
# its package (near-verbatim move; the package itself already used relative
# imports throughout).
"hyperloom.agents.quantization" = [
    "SKILL.md",
    "README.md",
]
# tree-reform.MD P2.5: kernel-agent's skill assets + release-contract
# installer, promoted alongside its package. ``tools/`` and
# ``skills/unittest/`` are not listed here for .py sources (they're regular
# package modules picked up by ``find_packages``); ``tools/data/`` is the one
# non-Python data file the tools read at runtime.
"hyperloom.agents.kernel" = [
    "SKILL.md",
    "scripts/*.sh",
    "skills/unittest/SKILL.md",
]
"hyperloom.agents.kernel.tools" = [
    "data/*.json",
]
"hyperloom.inference_optimizer.multi_node" = [
    "SKILL.md",
]
"hyperloom.inference_optimizer.multi_node.scripts" = [
    "*.sh",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# tree-reform.MD P2.7: the six "src/hyperloom/**/tests" entries that used to
# be listed individually here (inference_optimizer/tests,
# agents/{robustness,critic/runtime,framework,quantization,kernel}/tests)
# are collapsed into one recursive glob (pytest supports ``**`` glob
# expansion in testpaths); ``ci`` stays a separate entry since it is not
# under src/hyperloom (P2.6 "ci/ 拆库" has not been done). Collecting all of
# kernel-agent's 40 test files here was itself a real fix landed in P2.5:
# previously only 7 of the 33 files co-located with their source under
# tools/ were explicitly listed, so 26 were "orphaned" and only ran when
# pytest was pointed directly at them. ci/'s genuine unit tests
# (test_submit_body.py + the test_ci_*.py suites) were never collected
# before ci/ was added here.
testpaths = [
    "src/hyperloom/**/tests",
    "ci",
]
# ``ci`` is on the import path and is now both collected for tests (see
# ``testpaths``) and measured for coverage (see ``[tool.coverage.run].source``).
# Tree-reform transition (tree-reform.MD P2.0): ``src`` (new ``hyperloom.*``
# namespace) is added alongside the legacy import roots so both resolve during
# the migration window (dual-importable). Legacy roots are removed only in
# P2.7. ``.`` is still required for the still-flat ``ci`` package
# (tree-reform.MD P2.4 only promoted ``inference_optimizer``; ci src-layout
# promotion is a later phase). tree-reform.MD P2.5: critic-agent,
# robustness-agent, framework-agent, and quantization_agent were all promoted
# into ``src/hyperloom/agents/{critic,robustness,framework,quantization}``
# (bare/sibling module names -> package-qualified ``hyperloom.agents.*``), so
# their standalone ``critic-agent`` / ``robustness-agent/src`` /
# ``framework-agent/src`` / ``.`` (for bare ``quantization_agent``) pythonpath
# entries are dropped here (all resolve via the single ``src`` entry now).
# kernel-agent was also promoted into ``src/hyperloom/agents/kernel`` in the
# same step, but it was never on ``pythonpath`` to begin with -- its tools/
# modules import each other via ``sys.path.insert(0, str(Path(__file__)...))``
# self-location hacks (so they keep working both as package members and as
# directly-executed CLI scripts), not via a package-relative or pythonpath
# import, so no pythonpath entry is added or removed for it here.
pythonpath = ["src", ".", "ci"]
markers = [
    "critic_agent_e2e: end-to-end tests that shell out to the real critic-agent runtime; skip with '-m \"not critic_agent_e2e\"' if critic-agent is not on disk.",
    "robustness_agent_e2e: end-to-end tests that shell out to the real robustness-agent runtime; skip with '-m \"not robustness_agent_e2e\"' if robustness-agent is not on disk.",
]

# Coverage configuration: limit coverage measurement to first-party
# ``source`` trees. The ``ci/`` benchmark pipeline is now collected for tests
# (see ``testpaths``) and measured for coverage (listed in ``source``), so it
# DOES count toward the ``fail_under`` (90%) settlement. ``OOB/`` is included
# and measured as well.
#
# omit patterns exclude:
#   * tests / __init__.py / __main__.py — non-source
#   * CLI driver scripts whose body is subprocess plumbing (hard to
#     unit-test without re-implementing the subprocess; covered by
#     end-to-end flows instead)
#   * subprocess wrappers (`run_with_session_kill`, GEAK/OOB submit,
#     Ray dashboard polling) — same reasoning
#   * standalone robustness-agent reactor CLI wrapper
#   * standalone kernel-agent tools (kernel_optimization, tracelens_*,
#     apply_kernel_patch, geak_prompt_patcher) — these are CLI tools
#     consumed by the runtime, not import-level libraries
[tool.coverage.run]
branch = false
source = [
    # tree-reform.MD P2.3: orchestrator moved under src/hyperloom. tree-reform.MD
    # P2.4: inference_optimizer moved under src/hyperloom too (both were
    # previously counted under a standalone "inference_optimizer" entry).
    # tree-reform.MD P2.5: critic-agent's ``runtime`` package, robustness-agent,
    # framework-agent, quantization_agent, and kernel-agent's tools/ were all
    # promoted into src/hyperloom/agents/{critic,robustness,framework,
    # quantization,kernel} (so they're now measured as part of the
    # "src/hyperloom" tree instead of standalone "critic-agent/runtime" /
    # "robustness_agent" / "framework-agent/src" / "quantization_agent" /
    # "kernel-agent/tools" entries).
    "src/hyperloom",
    "OOB",  # optional component; not always present in a clone (see CLAUDE.md)
    "ci",
]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/__main__.py",
    # CLI driver scripts (subprocess plumbing dominated).
    "src/hyperloom/inference_optimizer/cli/__init__.py",
    "src/hyperloom/inference_optimizer/multi_node/cli.py",
    "src/hyperloom/inference_optimizer/multi_node/scripts/*",
    "src/hyperloom/inference_optimizer/multi_node/_internal/*",
    # Subprocess wrappers + multi-node server lifecycle.
    "src/hyperloom/orchestrator/actions/executors/_subprocess_kill.py",
    "src/hyperloom/orchestrator/actions/executors/_multi_node_server_lifecycle.py",
    "src/hyperloom/orchestrator/actions/executors/_multi_node_env.py",
    # Breakdown LLM HTTP client.
    "src/hyperloom/inference_optimizer/breakdown/reporters/llm_client.py",
    # Robustness-agent standalone reactor CLI wrapper.
    "src/hyperloom/agents/robustness/main.py",
    # Stand-alone kernel-agent CLI tools (tree-reform.MD P2.5: promoted from
    # the pre-src-layout repo-root kernel-agent tools into src/hyperloom/agents/kernel/tools/;
    # test_*.py were moved out to the sibling tests/ dir and are now covered
    # by the generic "*/tests/*" omit rule above, so that line is dropped).
    "src/hyperloom/agents/kernel/tools/kernel_optimization.py",
    "src/hyperloom/agents/kernel/tools/tracelens_analysis.py",
    "src/hyperloom/agents/kernel/tools/tracelens_skill_runner.py",
    "src/hyperloom/agents/kernel/tools/parallel_e2e_runner.py",
    "src/hyperloom/agents/kernel/tools/apply_kernel_patch.py",
    "src/hyperloom/agents/kernel/tools/geak_prompt_patcher.py",
    # Serve/bench/apply CLI primitives — subprocess + live-serving plumbing that
    # can't be unit-tested without reimplementing a server; same class as the
    # apply_kernel_patch / parallel_e2e_runner tools above. Their pure helpers
    # (e.g. _diff_unsupported_ops, _spread) ARE covered by test_apply_and_bench.py.
    "src/hyperloom/agents/kernel/tools/apply_and_bench.py",
    # Backends within kernel-agent tools (subprocess submit).
    "src/hyperloom/agents/kernel/tools/backends/*",
    "src/hyperloom/agents/kernel/tools/_collective_names.py",
    # kernel-agent skill harness validator — standalone operator script.
    "src/hyperloom/agents/kernel/skills/unittest/validate_harness.py",
    # quantization_agent CLI driver (argparse entrypoint).
    "src/hyperloom/agents/quantization/cli.py",
    # OOB agent_mcp_server entrypoints / server-side runtime: CLI, HTTP
    # server, scheduler, auth proxy, and the subprocess agent backends are
    # network / long-running services exercised end-to-end, not by unit
    # tests. The unit-testable OOB logic (config, database, convergence_check,
    # tools/agent_tools, tools/benchmark_tools, task_manager) stays measured
    # and is covered by
    # ``src/hyperloom/inference_optimizer/tests/test_oob_units.py``.
    # OOB is an optional component (not always present in a clone -- see
    # CLAUDE.md); coverage silently ignores omit entries under a missing
    # source tree, so these are harmless no-ops when OOB/ is absent.
    "OOB/cli.py",
    "OOB/server.py",
    "OOB/scheduler.py",
    "OOB/auth_proxy.py",
    "OOB/backends/*",
    # Local-host metrics probes — wrap ``rocm-smi`` / ``nvidia-smi`` /
    # ``ps`` / ``df`` / ``ray status``. Each shell-out has a unit test
    # through the provider/factory layers; the local_probe glue itself
    # is integration-only.
    "src/hyperloom/agents/robustness/sources/local_probe.py",
    # InferenceX shell-script patcher — fcntl-based file locking and
    # benchmark_lib.sh rewriting that already has dedicated integration
    # coverage; the per-call IO error branches are not unit-testable
    # without monkeypatching open()/fcntl wholesale.
    "src/hyperloom/orchestrator/actions/executors/_inferencex_patcher.py",
    # TraceLens server patcher — large subprocess pipeline (`git apply`
    # / `patch --fuzz=2` fallback) covered by integration tests.
    "src/hyperloom/orchestrator/actions/executors/_server_patcher.py",
    # breakdown/collectors/ (P2.2 split the former 6k-line collectors.py
    # into this subpackage) is exercised end-to-end by the breakdown
    # reporter tests. Direct unit-testing every leaf path doubles the
    # test surface for marginal value.
    "src/hyperloom/inference_optimizer/breakdown/collectors/*",
    # Verification scripts — operator scripts, not library code.
    # tree-reform.MD P2.4: scripts/ split three ways: tools/ (operator CLIs),
    # experiments/ (A/B scripts), assets/ (shell installers + configs, not
    # Python so not coverage-relevant anyway).
    "src/hyperloom/inference_optimizer/tools/*",
    "src/hyperloom/inference_optimizer/experiments/*",
    # Subprocess transport for the robustness-agent runtime CLI; the
    # in-process role contract is covered by the role/runtime/cli tests
    # plus the e2e harness in
    # src/hyperloom/inference_optimizer/tests/test_p2_robustness_agent_e2e.
    "src/hyperloom/orchestrator/roles/robustness_agent.py",
    # Critic agent backend talks to the critic-agent runtime via a real
    # subprocess transport; exercised end-to-end by the critic_agent_e2e
    # marker tests.
    "src/hyperloom/orchestrator/roles/critic_agent.py",
    # Profile / baseline executors are subprocess-heavy benchmark drivers
    # covered by the dedicated profile/baseline parametric test suites.
    "src/hyperloom/orchestrator/actions/executors/profile.py",
    "src/hyperloom/orchestrator/actions/executors/baseline.py",
    # NOTE: the legacy robustness-agent monitors/providers/conductor.py
    # modules these paths used to point at (superseded by the M1 reactor)
    # were already deleted from disk before tree-reform.MD P2.5; the ghost
    # omit entries were dropped in this same step rather than rewritten.
    # ── ci/ inference-optimization pipeline ──
    # The measured ci/ set is the library-shaped logic modules
    # (generate_hf_matrix, generate_matrix,
    # inferenceX_parser, artifact_normalizer, transform_to_session_summary_v2,
    # build_summary, report_generator). Everything below is a SaFE/Claw/HF/
    # GitHub network client or a subprocess-driven CLI driver — the same
    # "subprocess plumbing dominated" reasoning that omits inference_optimizer
    # cli.py and the kernel-agent tool CLIs. Each is exercised end-to-end by
    # the live optimize-submit workflow, not unit tests.
    "ci/optimize_submit.py",
    "ci/optimize_submit_lib/*.py",
    "ci/orchestrator.py",
    "ci/claw_client.py",
    "ci/prewarm_models.py",
    "ci/send_webhook.py",
    "ci/publish_results.py",
    "ci/publish_artifacts.py",
    "ci/build_candidates.py",
    "ci/build_production_hf_pool.py",
    # In-tree test support / CLI test scripts / live smoke scripts.
    "ci/conftest.py",
    "ci/test_*.py",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@overload",
]
skip_empty = true
precision = 2
# Tolerate transient CI-generated source files (e.g. a ``*_bundle.py`` a
# subprocess writes to the repo root, coverage traces, then cleans up) that
# leave a dangling entry in ``.coverage``. Without this the standalone
# ``coverage report`` hardening step in tests-coverage.yml turns coverage.py's
# ``couldnt-parse`` WARNING into a fatal ``NoSource`` error (exit 1), even
# though pytest-cov's own report already skips it. fail_under stays enforced
# over the parseable source tree.
ignore_errors = true
# Line coverage across all ``[tool.coverage.run].source`` trees (UT run in CI).
fail_under = 90

# GitHub Actions ``tests-coverage.yml`` reads ``pytest_ci_args`` from this table
# using inline Python (no separate helper script under ``ci/``).
[tool.hyperloom.tests_coverage]
# Full trailing argv for ``pytest`` in ``tests-coverage.yml`` (marker filter + cov).
pytest_ci_args = [
    "-m", "not critic_agent_e2e and not robustness_agent_e2e",
    # Parallel workers (pytest-xdist). Coverage is merged across workers, so the
    # total matches a serial run; cuts wall-clock roughly in half.
    "-n", "auto",
    "--cov=.", "--cov-report=xml", "--cov-report=term",
]
# Repository variable name: when set to 1/true/yes/on, CI skips fail_under
# enforcement (``--cov-fail-under=0`` + no ``coverage report --fail-under`` gate).
relax_fail_under_repo_var = "COVERAGE_RELAX_FAIL_UNDER"

# Bandit security linter. ``B101`` (assert_used) is skipped repo-wide: the vast
# majority of hits are test assertions and intentional runtime invariants, not
# security defects. Test trees are excluded so bandit reports only first-party
# source findings. Genuine findings (weak hash B324, string-built SQL B608,
# hardcoded-credential B105/B106) are reviewed and annotated with ``# nosec``
# plus a reason where legitimate. CI gating on medium+ severity is added in a
# follow-up ratchet, not here.
[tool.bandit]
skips = ["B101"]
exclude_dirs = ["*/tests/*", "*/test/*", "build", ".venv"]

# Pylint: minimal defaults for local runs; CI passes ``--errors-only`` so only
# fatal/error-severity messages are reported there (see ``lint.yml``).
[tool.pylint.main]
jobs = 1

# Ruff configuration. Pins the rule set that the BRAIN audit ran with
# (default ``E`` + ``F``, plus ``W`` for explicitness) so future
# ``ruff check`` invocations are stable, and codifies the per-file
# ignores that match Hyperloom's structure. See
# ``Hyperloom_Ruff_Remediation.md`` in the 2026-05-27 audit run for the
# rationale behind each ignore.
[tool.ruff]
target-version = "py310"
line-length = 120
# Exclude generated/vendored trees: audit artifacts, build output,
# virtualenvs, and the vendored sub-repos (TraceLens-internal /
# InferenceX) that ship their own linting and are not part of this repo's
# tracked sources.
extend-exclude = [
    "_audit_artifacts",
    "build",
    ".venv",
    "TraceLens-internal",
    "InferenceX",
]

[tool.ruff.lint]
# Default Ruff selection (what the audit ran with) -- pin it explicitly.
select = ["E", "F", "W"]

# E501 (line-too-long) is owned by ``ruff format``: it reflows code to
# ``line-length``; the only residual long lines are strings / comments / URLs
# the formatter intentionally does not wrap. Linting them adds noise, so E501
# is disabled here (standard practice when a formatter is in use).
#
# E741 (ambiguous variable name, e.g. ``l``) is a stylistic check already
# tolerated in tests; disabled repo-wide to avoid churn-only renames in math
# / parsing helpers where single-letter locals are idiomatic.
ignore = ["E501", "E741"]

# Future-proofing -- uncomment once the current findings are at zero.
# extend-select = ["B", "I", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests routinely re-import inside function bodies (E402), redefine fixtures
# (F811), and bind setup values they assert on indirectly (F841).
"**/tests/**/*.py" = ["F811", "E402", "F841"]
# Modules that intentionally place imports after a module docstring + early
# constants / conditional setup (lazy or ordering-sensitive imports).
# tree-reform.MD P2.3 stage B: path updated for the loop/ subpackage move.
"src/hyperloom/orchestrator/loop/coordinator.py" = ["E402"]
# tree-reform.MD P2.2: SharedState mixins are imported after the module-level
# helpers/constants they close over (cycle-safe ordering), so the mixin import
# sits below the top import block. P2.3 stage B: path updated for state/.
"src/hyperloom/orchestrator/state/shared_state.py" = ["E402"]
# tree-reform.MD P2.4 follow-up: cli/__init__.py re-exports parser.py's
# _build_parser cluster after the module docstring + logging setup it closes
# over (cycle-safe ordering), so the import sits below the top import block.
"src/hyperloom/inference_optimizer/cli/__init__.py" = ["E402"]
# tree-reform.MD P2.2: multi_node/cli.py re-exports commands/{rayjob,dynamo}.py
# after the base helpers/constants they import back are already defined
# (cycle-safe ordering), so the import sits below the top import block.
"src/hyperloom/inference_optimizer/multi_node/cli.py" = ["E402"]
"src/hyperloom/inference_optimizer/multi_node/commands/rayjob.py" = ["E402"]
"src/hyperloom/inference_optimizer/multi_node/commands/dynamo.py" = ["E402"]
"src/hyperloom/inference_optimizer/multi_node/commands/infera.py" = ["E402"]
# tree-reform.MD P2.3 stage B: paths updated for the specialists/, kernel/,
# and prompts/ subpackage moves.
"src/hyperloom/orchestrator/specialists/runner.py" = ["E402"]
"src/hyperloom/orchestrator/kernel/roofline_ceiling.py" = ["E402"]
"src/hyperloom/orchestrator/prompts/specialist_prompt_builder.py" = ["E402"]
"src/hyperloom/agents/critic/runtime/decision_reviewer.py" = ["E402"]
# optimize_submit keeps a dynamic facade for legacy tests and monkeypatch-based
# CI adapters. The imported helper modules intentionally re-export symbols via
# globals().update(), which Ruff cannot statically resolve without a larger
# compatibility-breaking refactor.
"ci/optimize_submit.py" = ["F821"]
"ci/optimize_submit_lib/*.py" = ["F401", "F811", "F821", "E402"]
