[build-system]
# setuptools>=77 is the floor for the PEP 639 ``license``/``license-files``
# form used below (the deprecated TOML-table form breaks on 2027-Feb-18).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperloom-inference_optimizer"
version = "1.0.0b1"
description = "Inference Optimizer — three-role (Orchestration/Critic/Robustness) autonomous LLM inference optimization runtime for AMD GPU platforms. Kernel optimization is handled by programmatic Python handlers."
readme = "README.md"
requires-python = ">=3.10"
# PEP 639 SPDX expression. The former ``{ text = "MIT" }`` table is deprecated
# by setuptools and slated to become a hard error on 2027-Feb-18.
license = "MIT"
license-files = ["LICENSE"]
# Intentionally empty: the bare wheel carries no third-party runtime deps, so a
# ``pip install --target`` workspace stays clean. Runtime deps come from the
# ``runtime`` extra, installed by the packaged install.sh.
dependencies = []

[project.urls]
Homepage = "https://github.com/AMD-AGI/Hyperloom"
Source = "https://github.com/AMD-AGI/Hyperloom"
Issues = "https://github.com/AMD-AGI/Hyperloom/issues"
Changelog = "https://github.com/AMD-AGI/Hyperloom/blob/main/CHANGELOG.md"
Security = "https://github.com/AMD-AGI/Hyperloom/security/policy"

[project.optional-dependencies]
# LLM backend SDKs, lazy-imported by the Claude/Codex/critic/scorer roles.
# ``openai-codex`` is the agent runtime for the OpenAI side: Hyperloom makes no
# bare LLM API calls, so an OpenAI-only deployment needs it to run at all.
llm = [
    "claude-agent-sdk>=0.2.110",
    "openai-codex>=0.144",
    "openai>=1.50",
    "httpx>=0.27",
]
# Critic-agent web tools (web_search / web_fetch).
web = [
    "markdownify>=0.11",
    "cachetools>=5.3",
]
# Full runtime dependency set installed by the packaged install.sh.
runtime = [
    "PyYAML>=6.0",
    "hyperloom-inference_optimizer[llm,web]",
]
test = [
    "hyperloom-inference_optimizer[runtime]",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "respx>=0.21",
    "requests>=2.28",
    # psutil-based live-compiler probe in _aiter_jit.
    "psutil>=5.9",
    # framework-agent patch-authoring / isolation paths.
    "libcst>=1.0",
    "patch-ng>=1.18",
]
# Coverage job deps: ``pip install -e ".[test,ci]"``.
ci = [
    "pytest-cov>=5.0",
    "coverage>=7.0",
    # In-runner parallelism (``-n`` in ``pytest_ci_args``).
    "pytest-xdist>=3.5",
    # Cross-job sharding for the coverage matrix (``--splits``/``--group``).
    "pytest-split>=0.8",
    "tomli>=2.0.1; python_version < '3.11'",
]
# Opt-in Langfuse trace sink (HYPERLOOM_LANGFUSE_ENABLE=1).
trace = [
    "langfuse>=2.0",
]
# framework-agent patch-authoring / isolation path.
ast = [
    "libcst>=1.0",
    "patch-ng>=1.18",
]
# Optional ``synthesize --with-llm`` KB-distillation backend.
claude = [
    "claude-agent-sdk>=0.2.110",
]

[project.scripts]
inference_optimizer = "hyperloom.inference_optimizer.cli:main"
hyperloom = "hyperloom.inference_optimizer.setup:main"
# Console scripts for interactive / manual use; the orchestrator invokes the
# ``python -m hyperloom.agents.*`` module paths directly instead.
framework-agent = "hyperloom.agents.framework.runtime.cli:main"
fa = "hyperloom.agents.framework.runtime.cli:main"
robustness-agent = "hyperloom.agents.robustness.main:main"
quantization-agent = "hyperloom.agents.quantization.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
# Test trees are not part of the distribution: their fixture data is not
# package-data, so a shipped copy could never run. Singular/gerund spellings
# are covered too; test_packaging_lint.py fails if a new one escapes.
exclude = [
    "*.tests",
    "*.tests.*",
    "tests",
    "tests.*",
    "*.test",
    "*.test.*",
    "test",
    "test.*",
    "*.testing",
    "*.testing.*",
    "testing",
    "testing.*",
]

[tool.setuptools.data-files]
# Install the setup skill under every agent's discovery dir so /hyperloom-setup
# is visible in Claude Code (.claude), Cursor (.cursor/.agents) and Codex.
".agents/skills/hyperloom-setup" = [
    "src/hyperloom/skills/hyperloom-setup/SKILL.md",
]
".claude/skills/hyperloom-setup" = [
    "src/hyperloom/skills/hyperloom-setup/SKILL.md",
]
".cursor/skills/hyperloom-setup" = [
    "src/hyperloom/skills/hyperloom-setup/SKILL.md",
]
# Demo run skills chained from /hyperloom-setup.
".agents/skills/hyperloom-qwen3-8b-3h" = ["examples/hyperloom-qwen3-8b-3h/SKILL.md"]
".claude/skills/hyperloom-qwen3-8b-3h" = ["examples/hyperloom-qwen3-8b-3h/SKILL.md"]
".cursor/skills/hyperloom-qwen3-8b-3h" = ["examples/hyperloom-qwen3-8b-3h/SKILL.md"]
".agents/skills/hyperloom-qwen3-14b-fp8-12h" = ["examples/hyperloom-qwen3-14b-fp8-12h/SKILL.md"]
".claude/skills/hyperloom-qwen3-14b-fp8-12h" = ["examples/hyperloom-qwen3-14b-fp8-12h/SKILL.md"]
".cursor/skills/hyperloom-qwen3-14b-fp8-12h" = ["examples/hyperloom-qwen3-14b-fp8-12h/SKILL.md"]
".agents/skills/hyperloom-custom-advanced" = ["examples/hyperloom-custom-advanced/SKILL.md"]
".claude/skills/hyperloom-custom-advanced" = ["examples/hyperloom-custom-advanced/SKILL.md"]
".cursor/skills/hyperloom-custom-advanced" = ["examples/hyperloom-custom-advanced/SKILL.md"]

[tool.setuptools.package-data]
hyperloom = [
    "orchestrator/prompts/*.md",
    "orchestrator/prompts/references/*.md",
]
"hyperloom.inference_optimizer" = [
    "SKILL.md",
    "README.md",
    "actions/*.md",
    # Release-contract shell installers + configs.
    "assets/*.sh",
    "assets/*.example",
    "assets/configs/*.yaml",
    # Host-side evidence probe, injected into the benchmark process via a
    # PYTHONPATH prefix (see _framework_rewrite_evidence). Shipped so wheel
    # installs can arm it.
    "assets/host_probe/*.py",
    # Slurm submission bundle (see docs/install/slurm.md).
    "assets/slurm/*.sh",
    "assets/slurm/*.sbatch",
    "assets/slurm/*.tsv",
    "assets/slurm/*.template",
    # run_hyperloom.sbatch copies this template into the container at launch,
    # so it has to ship alongside the .sbatch that references it.
    "assets/slurm/*.sh.in",
    "references/*.md",
    "tools/*.sh.example",
]
# Critic LLM skill assets, mounted by the A2A / Codex chat server host.
"hyperloom.agents.critic" = [
    "SKILL.md",
    "README.md",
    "actions/*.md",
    "references/*.md",
]
"hyperloom.agents.robustness" = [
    "SKILL.md",
    "prompts/*.md",
]
"hyperloom.agents.framework" = [
    "SKILL.md",
    "README.md",
    "examples/*.json",
    "examples/*.py",
    "kb/framework_optimization/*.jsonl",
]
"hyperloom.agents.quantization" = [
    "SKILL.md",
    "README.md",
]
# No top-level SKILL.md: kernel work is dispatched programmatically, so the
# former agent skill file was replaced by docs/conceptual/kernel-execution-path.md.
"hyperloom.agents.kernel" = [
    "scripts/*.sh",
]
# ``agentx/deploy.py`` copies these into InferenceX ``benchmarks/`` at runtime
# and raises FileNotFoundError when they are absent from the install.
"hyperloom.inference_optimizer.assets.agentx" = [
    "*.sh",
]
# Breakdown skill assets; the only SKILL.md under src/ that did not ship.
"hyperloom.inference_optimizer.breakdown" = [
    "*.md",
]
"hyperloom.inference_optimizer.multi_node" = [
    "SKILL.md",
]
"hyperloom.inference_optimizer.multi_node.scripts" = [
    "*.sh",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One recursive glob covers every per-package tests/ dir under src/hyperloom.
# ``scripts/tests`` is listed separately because the operator scripts sit
# outside the package on purpose -- they have to run on hosts with no Hyperloom
# install -- so the glob above cannot reach them, and without this line their
# tests are collected by nobody and fail in silence.
testpaths = [
    "src/hyperloom/**/tests",
    "scripts/tests",
]
pythonpath = ["src", "."]
markers = [
    "critic_agent_e2e: end-to-end tests that shell out to the real critic-agent runtime; skip with '-m \"not critic_agent_e2e\"' if critic-agent is not on disk.",
    "robustness_agent_e2e: end-to-end tests that shell out to the real robustness-agent runtime; skip with '-m \"not robustness_agent_e2e\"' if robustness-agent is not on disk.",
    "targeted_build_e2e: end-to-end tests that run a real AITER compile on a ROCm host; skip with '-m \"not targeted_build_e2e\"' in CI.",
]

[tool.coverage.run]
branch = false
# Relative paths so per-shard ``.coverage.*`` files from different CI runners
# combine into consistent totals.
relative_files = true
source = [
    "src/hyperloom",
    "OOB",  # optional component; not always present in a clone (see CLAUDE.md)
]
# Omitted: tests / package boilerplate, CLI drivers, subprocess wrappers, and
# live-serving plumbing that is covered end-to-end rather than by unit tests.
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/__main__.py",
    # Operator scripts that ship outside the package. They exist to run on
    # hosts with no Hyperloom install, so most of each one is argv handling,
    # terminal rendering and hardware probing that only a real EPYC node
    # exercises -- the same reason the CLI drivers below are omitted. Their
    # tests do run (``scripts/tests`` is in ``testpaths``); it is the measured
    # denominator they stay out of, not the suite.
    "scripts/*",
    # Byte-identical upstream KB Store SDK; guarded by a blob checksum test.
    "src/hyperloom/orchestrator/knowledge/remote_recipe/_vendor/*",
    # CLI drivers.
    "src/hyperloom/inference_optimizer/cli/__init__.py",
    "src/hyperloom/inference_optimizer/multi_node/cli.py",
    "src/hyperloom/inference_optimizer/multi_node/scripts/*",
    # Multi-node internals (SSH, probes, Ray dashboard, state hand-off).
    "src/hyperloom/inference_optimizer/multi_node/_internal/*",
    # Subprocess wrappers + multi-node server lifecycle.
    "src/hyperloom/orchestrator/actions/executors/_subprocess_kill.py",
    "src/hyperloom/orchestrator/actions/executors/_multi_node_server_lifecycle.py",
    "src/hyperloom/orchestrator/actions/executors/_multi_node_env.py",
    # Breakdown LLM HTTP client.
    "src/hyperloom/inference_optimizer/breakdown/reporters/llm_client.py",
    # Robustness-agent standalone reactor CLI wrapper.
    "src/hyperloom/agents/robustness/main.py",
    # Stand-alone kernel-agent CLI tools.
    "src/hyperloom/agents/kernel/tools/kernel_optimization.py",
    "src/hyperloom/agents/kernel/tools/tracelens_analysis.py",
    "src/hyperloom/agents/kernel/tools/tracelens_skill_runner.py",
    "src/hyperloom/agents/kernel/tools/apply_kernel_patch.py",
    "src/hyperloom/agents/kernel/tools/geak_prompt_patcher.py",
    # Kernel-agent tool backends (subprocess submit).
    "src/hyperloom/agents/kernel/tools/backends/*",
    "src/hyperloom/agents/kernel/tools/_collective_names.py",
    # quantization_agent CLI driver (argparse entrypoint).
    "src/hyperloom/agents/quantization/cli.py",
    # OOB server-side runtime (CLI, HTTP server, scheduler, auth proxy, agent
    # backends). The unit-testable OOB logic stays measured.
    "OOB/cli.py",
    "OOB/server.py",
    "OOB/scheduler.py",
    "OOB/auth_proxy.py",
    "OOB/backends/*",
    # Local-host metrics probes (rocm-smi / nvidia-smi / ps / df / ray status).
    "src/hyperloom/agents/robustness/sources/local_probe.py",
    # InferenceX shell-script patcher (fcntl locking + benchmark_lib.sh rewrite).
    "src/hyperloom/orchestrator/actions/executors/_inferencex_patcher.py",
    # TraceLens server patcher (git apply / patch --fuzz subprocess pipeline).
    "src/hyperloom/orchestrator/actions/executors/_server_patcher.py",
    # Breakdown collectors — exercised end-to-end by the reporter tests.
    "src/hyperloom/inference_optimizer/breakdown/collectors/*",
    # Operator CLIs, not library code.
    "src/hyperloom/inference_optimizer/tools/*",
    # Subprocess transports for the robustness / critic sub-agent runtimes.
    "src/hyperloom/orchestrator/roles/robustness_agent.py",
    "src/hyperloom/orchestrator/roles/critic_agent.py",
    # Subprocess-heavy benchmark drivers.
    "src/hyperloom/orchestrator/actions/executors/profile.py",
    "src/hyperloom/orchestrator/actions/executors/baseline.py",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@overload",
]
skip_empty = true
precision = 2
# Tolerate dangling ``.coverage`` entries for transient CI-generated files so
# the standalone ``coverage report`` step does not fail on NoSource.
ignore_errors = true
# Line coverage across all ``[tool.coverage.run].source`` trees.
fail_under = 90

# GitHub Actions ``tests-coverage.yml`` reads this table with inline Python.
[tool.hyperloom.tests_coverage]
# Base trailing argv for ``pytest`` in CI; the workflow appends sharding
# (``--splits``/``--group``) and ``-n`` from the values below.
pytest_ci_args = [
    "-m", "not critic_agent_e2e and not robustness_agent_e2e and not targeted_build_e2e",
    "--cov=.", "--cov-report=term",
]
# In-runner pytest-xdist workers per shard job (``-n auto`` yields 1 on the
# 2-vCPU GitHub runner, so pin it).
xdist_workers = 2
# GitHub matrix shards the suite is split across (pytest-split).
total_shards = 4
# Repository variable name: when truthy, CI skips fail_under enforcement.
relax_fail_under_repo_var = "COVERAGE_RELAX_FAIL_UNDER"

# Bandit security linter. ``B101`` (assert_used) is skipped repo-wide because
# nearly all hits are test assertions and runtime invariants.
[tool.bandit]
skips = ["B101"]
exclude_dirs = ["*/tests/*", "*/test/*", "build", ".venv"]

# Pylint: minimal defaults for local runs; CI passes ``--errors-only``.
[tool.pylint.main]
jobs = 1

[tool.ruff]
target-version = "py310"
line-length = 120
# Generated / vendored trees that ship their own linting.
extend-exclude = [
    "_audit_artifacts",
    "build",
    ".venv",
    "TraceLens-internal",
    "InferenceX",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
# E501 is owned by ``ruff format``; E741 would only cause churn-only renames in
# math / parsing helpers where single-letter locals are idiomatic.
ignore = ["E501", "E741"]

# Future-proofing -- uncomment once the current findings are at zero.
# extend-select = ["B", "I", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests re-import inside function bodies (E402), redefine fixtures (F811), and
# bind setup values they assert on indirectly (F841).
"**/tests/**/*.py" = ["F811", "E402", "F841"]
# Modules whose imports sit below the module-level constants / helpers they
# close over (cycle-safe or lazy ordering).
"src/hyperloom/orchestrator/loop/coordinator.py" = ["E402"]
"src/hyperloom/orchestrator/state/shared_state.py" = ["E402"]
"src/hyperloom/inference_optimizer/cli/__init__.py" = ["E402"]
"src/hyperloom/inference_optimizer/multi_node/cli.py" = ["E402"]
"src/hyperloom/inference_optimizer/multi_node/commands/infera.py" = ["E402"]
"src/hyperloom/orchestrator/specialists/runner.py" = ["E402"]
"src/hyperloom/orchestrator/kernel/roofline_ceiling.py" = ["E402"]
"src/hyperloom/orchestrator/prompts/specialist_prompt_builder.py" = ["E402"]
"src/hyperloom/agents/critic/runtime/decision_reviewer.py" = ["E402"]
