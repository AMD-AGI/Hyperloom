[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperloom"
version = "1.0.0"
description = "Hyperloom — modular LLM inference optimization framework for AMD GPUs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "click>=8.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]
cluster = [
    "ray>=2.0",
]
agents = [
    "httpx>=0.24",
    "cachetools>=5.0",
    "markdownify>=0.11",
]
full = [
    "claude-agent-sdk>=0.1.65",
    "ray>=2.0",
    "httpx>=0.24",
    "cachetools>=5.0",
    "markdownify>=0.11",
]

[project.scripts]
hyperloom = "hyperloom.cli:main"

[project.urls]
Homepage = "https://github.com/AMD-AGI/Hyperloom"
Source = "https://github.com/AMD-AGI/Hyperloom"
Issues = "https://github.com/AMD-AGI/Hyperloom/issues"

[tool.setuptools.packages.find]
include = ["hyperloom", "hyperloom.*"]

[tool.setuptools.package-data]
hyperloom = [
    "skills/*.md",
    "kb/**/*.md",
    "agents/*/SKILL.md",
    "agents/*/AGENTS.md",
    "agents/*/actions/*.md",
    "agents/*/actions/**/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["hyperloom/tests", "hyperloom/agents"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
