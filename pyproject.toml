[build-system]
# setuptools>=77 is the floor for the PEP 639 ``license``/``license-files``
# form used below (the deprecated TOML-table form breaks on 2027-Feb-18).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperloom-inference_optimizer"
version = "1.1.5"
description = "Inference Optimizer — two-role (Orchestration/Critic) autonomous LLM inference optimization runtime for AMD GPU platforms. Kernel optimization is handled by programmatic Python handlers."
readme = "README.md"
requires-python = ">=3.10"
# PEP 639 SPDX expression. The former ``{ text = "MIT" }`` table is deprecated
# by setuptools and slated to become a hard error on 2027-Feb-18.
license = "MIT"
license-files = ["LICENSE"]
# Intentionally empty: the bare wheel carries no third-party runtime deps, so a
# ``pip install --target`` workspace stays clean. Runtime deps come from the
# ``runtime`` extra, installed by the packaged install.sh.
dependencies = []

[project.urls]
Homepage = "https://github.com/AMD-AGI/Hyperloom"
Source = "https://github.com/AMD-AGI/Hyperloom"
Issues = "https://github.com/AMD-AGI/Hyperloom/issues"
Changelog = "https://github.com/AMD-AGI/Hyperloom/releases"
Security = "https://github.com/AMD-AGI/Hyperloom/security/policy"

[project.optional-dependencies]
# LLM backend SDKs, lazy-imported by the Claude/Codex/critic/scorer roles.
# ``openai-codex`` is the agent runtime for the OpenAI side: Hyperloom makes no
# bare LLM API calls, so an OpenAI-only deployment needs it to run at all.
llm = [
    "claude-agent-sdk>=0.2.110",
    "openai-codex>=0.144",
    "openai>=1.50",
    "httpx>=0.27",
]
# The DeepSeek Harness agent runtime, lazy-imported by the harness role. Kept
# out of ``llm`` because no role selects it on credentials alone: it is reachable
# only by naming it, so a deployment that does not is not made to carry it.
deepseek = [
    "deepseek-harness-sdk>=0.1.5rc1",
]
# Critic-agent web tools (web_search / web_fetch).
web = [
    "markdownify>=0.11",
    "cachetools>=5.3",
]
# The Experience KB service on a PostgreSQL server (``HYPERLOOM_KB_DATABASE_URL``), as a global KB runs; a workspace's
# service keeps its database in SQLite and needs none of this. The connection pool checks each connection it hands
# out, which needs psycopg-pool 3.2.
kb-service = [
    "PyYAML>=6.0",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
]
# Full runtime dependency set installed by the packaged install.sh.
runtime = [
    "PyYAML>=6.0",
    "hyperloom-inference_optimizer[llm,web,forge]",
]
# Built-in kernel-opt agent (``kernelforge``). ``torch`` is deliberately absent:
# the ROCm build is supplied by the container image and a bare specifier would
# resolve to the CUDA wheel from PyPI.
#
# ``llm`` is a hard requirement, not a convenience: forge's agent backends
# lazy-import ``claude_agent_sdk`` and ``openai_codex`` at the first agent turn,
# so a ``[forge]``-only install imports cleanly and then fails minutes into a
# campaign. It only looked self-contained because ``runtime`` happens to pull
# ``[llm,web,forge]`` together.
forge = [
    "click>=8.0",
    "PyYAML>=6.0",
    "anthropic>=0.40",
    "hyperloom-inference_optimizer[llm]",
]
# ROCm Compute Profiler (rocprof-compute) Python requirements. Nothing in this
# repository imports them: they satisfy the profiler, whose binary is supplied
# by the ROCm image or system package. Without this extra, kernelforge
# profiling degrades to the lightweight PMC path.
forge-profiling = [
    # Exact pins required by ROCm 7.2.x rocprofiler-compute.
    "astunparse==1.6.2",
    "kaleido==0.2.1",
    "colorlover",
    "dash-bootstrap-components",
    "dash-svg",
    "dash>=3.0.0",
    "matplotlib",
    "numpy>=1.17.5",
    "plotext",
    "plotille",
    "plotly",
    "pymongo",
    "setuptools",
    "sqlalchemy>=2.0.42",
    "tabulate",
    "textual",
    "textual-plotext",
    "textual-fspicker>=0.4.3",
    "tqdm",
]
# What only a hosted run needs, on top of ``runtime``. Hosted measurement: Ed25519 signing (cryptography), the E2B
# sandbox SDK and the S3 result archive, each imported lazily, only by the hosted-measurement modules. ``e2b`` 2.53 is the first SDK whose ``connect``
# sends the ``E2b-Sandbox-Id`` header the data-plane router needs and whose errors carry a ``status_code``.
hosted = [
    "cryptography>=42",
    "e2b>=2.53.1,<3",
    "boto3>=1.28",
]
# The measurement runner inside a sealed sandbox: it reads the YAML config and signs its result manifest. The sealed
# runner installs ``requirements/runner.lock``, this list compiled with hashes, and never resolves this list itself.
# The framework stack (torch, triton, sglang, aiter) is the framework image's and must not be listed here.
#
# ``lm_eval[api]`` is the accuracy pass's client: 0.4.13, the release that the ref ``inference_optimizer/cli/preflight.py``
# pins (``_LM_EVAL_PINNED_REF``). It comes from PyPI, not as that ref's GitHub archive, because GitHub does not keep an
# archive's checksum stable and a hash lock must not depend on one. ``tenacity`` is what its ``api`` models import.
runner = [
    "PyYAML>=6.0",
    "cryptography>=42",
    "lm_eval[api]==0.4.13",
    "tenacity",
]
test = [
    "hyperloom-inference_optimizer[runtime]",
    "hyperloom-inference_optimizer[hosted]",
    "hyperloom-inference_optimizer[ci]",
    # The Experience KB tests run on PostgreSQL too when HYPERLOOM_KB_TEST_DATABASE_URL names a server.
    "hyperloom-inference_optimizer[kb-service]",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "jsonschema>=4.18",
    # Property-based tests over the bring-up ladder.
    "hypothesis>=6.0",
    "respx>=0.21",
    "requests>=2.28",
    # psutil-based live-compiler probe in _aiter_jit.
    "psutil>=5.9",
    # framework-agent patch-authoring / isolation paths.
    "libcst>=1.0",
    "patch-ng>=1.18",
]
# Coverage job deps: ``pip install -e ".[test,ci]"``.
ci = [
    "pytest-cov>=5.0",
    "coverage>=7.0",
    # In-runner parallelism (``-n`` in ``pytest_ci_args``).
    "pytest-xdist>=3.5",
    # Cross-job sharding for the coverage matrix (``--splits``/``--group``).
    "pytest-split>=0.8",
    "tomli>=2.0.1; python_version < '3.11'",
]
# Opt-in Langfuse trace sink (HYPERLOOM_LANGFUSE_ENABLE=1).
trace = [
    "langfuse>=2.0",
]
# framework-agent patch-authoring / isolation path.
ast = [
    "libcst>=1.0",
    "patch-ng>=1.18",
]
# Optional ``synthesize --with-llm`` KB-distillation backend.
claude = [
    "claude-agent-sdk>=0.2.110",
]
# Local dev tooling: pre-commit hooks, formatters, type checker.
dev = [
    "pre-commit>=4.0",
    "ruff>=0.8,<1",
    "mypy>=1.0",
    "reuse>=5.0",
]

[project.scripts]
hyperloom = "hyperloom.cli:main"
# Built-in kernel-opt agent. The orchestrator dispatches
# ``python -m kernelforge.cli`` directly; this is for interactive use.
kernelforge = "kernelforge.cli:main"
hyperloom-kb = "hyperloom_kb.cli:main"
hyperloom-kb-serve = "hyperloom_kb.http_service:main"
hyperloom-kb-collect = "hyperloom_kb.collect.cli:main"
hyperloom-multibranch = "hyperloom_multibranch.cli:main"

[tool.setuptools]
# setuptools defaults this to true for pyproject-based config, which makes
# build_py sweep every file living under a package directory -- including
# subdirectories that are NOT packages. ``packages.find.exclude`` keeps
# ``*.tests`` out of the *package* list, but the sweep then re-added the very
# same files as package *data*: the wheel shipped 627 test entries before forge
# was vendored and 833 after (all under ``kernelforge/tests/``).
# ``scripts/check_wheel_contents.py`` has
# been reporting this; it is the ``packaging.yml`` wheel-contents job.
#
# Turning the sweep off makes ``[tool.setuptools.package-data]`` below the sole
# source of shipped non-module files, which is the state the two packaging
# checks already assume: ``test_packaging_lint.py`` walks tree -> declaration
# and check_wheel_contents.py walks declaration -> wheel, so nothing can now
# ship undeclared or be declared and missing.
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
# Test trees are not part of the distribution: their fixture data is not
# package-data, so a shipped copy could never run. Singular/gerund spellings
# are covered too; test_packaging_lint.py fails if a new one escapes.
exclude = [
    "*.tests",
    "*.tests.*",
    "tests",
    "tests.*",
    "*.test",
    "*.test.*",
    "test",
    "test.*",
    "*.testing",
    "*.testing.*",
    "testing",
    "testing.*",
    # KernelForge's examples and local-wiki resources contain .py reference
    # files. Keep those resource trees out of implicit namespace discovery;
    # they ship only through the package-data declarations below.
    "kernelforge.examples",
    "kernelforge.examples.*",
    "kernelforge.knowledge.local_wiki.resources",
    "kernelforge.knowledge.local_wiki.resources.*",
    # Scripted launch/specialist backends and a virtual clock: scaffolding a
    # test drives, not a runtime component. Nothing in the shipped tree imports
    # it, and the production launch boundary it substitutes
    # (``actions/executors/launch_backend.py``) ships as normal.
    "hyperloom.orchestrator.rehearsal",
    "hyperloom.orchestrator.rehearsal.*",
]

[tool.setuptools.data-files]
# Install the setup skill under every agent's discovery dir so /hyperloom-setup
# is visible in Claude Code (.claude), Cursor (.cursor/.agents) and Codex.
".agents/skills/hyperloom-setup" = [
    "src/hyperloom/skills/hyperloom-setup/SKILL.md",
]
".claude/skills/hyperloom-setup" = [
    "src/hyperloom/skills/hyperloom-setup/SKILL.md",
]
".cursor/skills/hyperloom-setup" = [
    "src/hyperloom/skills/hyperloom-setup/SKILL.md",
]
# Operates any Experience KB service with the hyperloom-kb CLI: labels, restores, exclusions, sync.
".agents/skills/hyperloom-kb" = ["src/hyperloom_kb/skills/hyperloom-kb/SKILL.md"]
".claude/skills/hyperloom-kb" = ["src/hyperloom_kb/skills/hyperloom-kb/SKILL.md"]
".cursor/skills/hyperloom-kb" = ["src/hyperloom_kb/skills/hyperloom-kb/SKILL.md"]
# Demo run skills chained from /hyperloom-setup.
".agents/skills/hyperloom-qwen3-8b-3h" = ["examples/hyperloom-qwen3-8b-3h/SKILL.md"]
".claude/skills/hyperloom-qwen3-8b-3h" = ["examples/hyperloom-qwen3-8b-3h/SKILL.md"]
".cursor/skills/hyperloom-qwen3-8b-3h" = ["examples/hyperloom-qwen3-8b-3h/SKILL.md"]
".agents/skills/hyperloom-qwen3-14b-fp8-12h" = ["examples/hyperloom-qwen3-14b-fp8-12h/SKILL.md"]
".claude/skills/hyperloom-qwen3-14b-fp8-12h" = ["examples/hyperloom-qwen3-14b-fp8-12h/SKILL.md"]
".cursor/skills/hyperloom-qwen3-14b-fp8-12h" = ["examples/hyperloom-qwen3-14b-fp8-12h/SKILL.md"]
".agents/skills/hyperloom-qwen3-14b-fp8-12h-forge" = ["examples/hyperloom-qwen3-14b-fp8-12h-forge/SKILL.md"]
".claude/skills/hyperloom-qwen3-14b-fp8-12h-forge" = ["examples/hyperloom-qwen3-14b-fp8-12h-forge/SKILL.md"]
".cursor/skills/hyperloom-qwen3-14b-fp8-12h-forge" = ["examples/hyperloom-qwen3-14b-fp8-12h-forge/SKILL.md"]
".agents/skills/hyperloom-custom-advanced" = ["examples/hyperloom-custom-advanced/SKILL.md"]
".claude/skills/hyperloom-custom-advanced" = ["examples/hyperloom-custom-advanced/SKILL.md"]
".cursor/skills/hyperloom-custom-advanced" = ["examples/hyperloom-custom-advanced/SKILL.md"]

[tool.setuptools.package-data]
hyperloom = [
    "plugs/profiles/*.json",
    "contracts/*.json",
    "hosted/*.sh",
    "orchestrator/prompts/*.md",
    "orchestrator/prompts/references/*.md",
    # JSON Schemas of the hosted-measurement contracts (measurement spec and result manifest).
    "contracts/*.schema.json",
    # The reference rule pack a session reads when HYPERLOOM_RULE_PACK names no other; importing outside_facts fails without it.
    "common/outside_facts/packs/*.yaml",
]
"hyperloom.inference_optimizer" = [
    "SKILL.md",
    "README.md",
    "actions/*.md",
    # Release-contract shell installers + configs.
    "assets/*.sh",
    "assets/*.py",
    "assets/*.example",
    "assets/configs/*.yaml",
    "assets/agentx/*.sh",
    "assets/agentx/*.py",
    # Host-side evidence probe, injected into the benchmark process via a
    # PYTHONPATH prefix (see _framework_rewrite_evidence). Shipped so wheel
    # installs can arm it.
    "assets/host_probe/*.py",
    # Slurm submission bundle (see docs/install/slurm.md).
    "assets/slurm/*.sh",
    "assets/slurm/*.sbatch",
    "assets/slurm/*.tsv",
    "assets/slurm/*.template",
    # run_hyperloom.sbatch copies this template into the container at launch,
    # so it has to ship alongside the .sbatch that references it.
    "assets/slurm/*.sh.in",
    "references/*.md",
]
# Critic LLM skill assets, loaded into the Critic prompt preamble by CriticAgentBackend.
"hyperloom.agents.critic" = [
    "SKILL.md",
    "README.md",
    "actions/*.md",
    "references/*.md",
]
"hyperloom.agents.quantization" = [
    "SKILL.md",
    "README.md",
]
# Vendor-operator-playbook registry (see trace_analysis/_vendor_operator_playbooks.py):
# read at runtime by classify_patchability(), so it must ship.
"hyperloom.orchestrator.trace_analysis" = [
    "vendor_operator_playbooks.json",
]
# ``agentx/deploy.py`` copies these into InferenceX ``benchmarks/`` at runtime
# and raises FileNotFoundError when they are absent from the install.
"hyperloom.inference_optimizer.assets.agentx" = [
    "*.sh",
]
# Breakdown skill assets; the only SKILL.md under src/ that did not ship.
"hyperloom.inference_optimizer.breakdown" = [
    "*.md",
    "contracts/*.json",
]
"hyperloom.inference_optimizer.multi_node" = [
    "SKILL.md",
]
"hyperloom.inference_optimizer.multi_node.scripts" = [
    "*.sh",
]
# KernelForge's read-only resources live with their owning features and are
# resolved through ``kernelforge.config.resources.resource_path``. The globs are
# deliberately type-agnostic because the trees hold several asset types.
kernelforge = [
    "examples/**/*",
]
"kernelforge.knowledge.local_wiki" = [
    "resources/**/*",
]
"kernelforge.roofline_ceiling" = [
    "resources/**/*",
]
hyperloom_kb = [
    "py.typed",
    "declarations/*.yaml",
    "mappings/*.yaml",
]
hyperloom_multibranch = [
    "contracts/llm_prices.json",
    "blackboard/knowledge/declarations/*.yaml",
    "blackboard/knowledge/mappings/*.yaml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One recursive glob covers every per-package tests/ dir under src/ --
# hyperloom and kernelforge alike.
# ``scripts/tests`` is listed separately because the operator scripts sit
# outside the package on purpose -- they have to run on hosts with no Hyperloom
# install -- so the glob above cannot reach them, and without this line their
# tests are collected by nobody and fail in silence.
testpaths = [
    "src/**/tests",
    "scripts/tests",
]
pythonpath = ["src", ".", "scripts"]
markers = [
    "targeted_build_e2e: end-to-end tests that run a real AITER compile on a ROCm host; skip with '-m \"not targeted_build_e2e\"' in CI.",
    "claw_policy: a sandbox contract test of the Claw sandbox service's own policy (sealed paths, signing identity, platform metadata, avoid-nodes); it runs against the local provider and a real Claw service, not against the E2B stand-in.",
]

[tool.coverage.run]
branch = false
# Relative paths so per-shard ``.coverage.*`` files from different CI runners
# combine into consistent totals.
relative_files = true
source = [
    "src/hyperloom",
    "src/kernelforge",
    "src/hyperloom_kb",
    "src/hyperloom_multibranch",
    "OOB",  # optional component; not always present in a clone
]
# Omitted: tests / package boilerplate, CLI drivers, subprocess wrappers, and
# live-serving plumbing that is covered end-to-end rather than by unit tests.
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/__main__.py",
    # Operator scripts that ship outside the package. They exist to run on
    # hosts with no Hyperloom install, so most of each one is argv handling,
    # terminal rendering and hardware probing that only a real EPYC node
    # exercises -- the same reason the CLI drivers below are omitted. Their
    # tests do run (``scripts/tests`` is in ``testpaths``); it is the measured
    # denominator they stay out of, not the suite.
    "scripts/*",
    # Byte-identical upstream KB Store SDK; guarded by a blob checksum test.
    "src/hyperloom/orchestrator/knowledge/remote_recipe/_vendor/*",
    # CLI drivers.
    "src/hyperloom/inference_optimizer/cli/__init__.py",
    "src/hyperloom/inference_optimizer/multi_node/cli.py",
    "src/hyperloom/inference_optimizer/multi_node/scripts/*",
    # Multi-node internals (SSH, probes, Ray dashboard, state hand-off).
    "src/hyperloom/inference_optimizer/multi_node/_internal/*",
    # Subprocess wrappers + multi-node server lifecycle.
    "src/hyperloom/orchestrator/actions/executors/_subprocess_kill.py",
    "src/hyperloom/orchestrator/actions/executors/_multi_node_server_lifecycle.py",
    "src/hyperloom/orchestrator/actions/executors/_multi_node_env.py",
    # Breakdown LLM HTTP client.
    "src/hyperloom/inference_optimizer/breakdown/reporters/llm_client.py",
    # Kernel tools that need real traces or a live framework install.
    "src/hyperloom/orchestrator/trace_analysis/tracelens_analysis.py",
    "src/hyperloom/orchestrator/trace_analysis/tracelens_skill_runner.py",
    "src/hyperloom/orchestrator/kernel/apply_kernel_patch.py",
    "src/hyperloom/orchestrator/kernel/patch_jit_cache.py",
    "src/hyperloom/orchestrator/kernel/patch_rebuild.py",
    # GEAK runner and Ray cluster lifecycle (subprocess submit).
    "src/hyperloom/orchestrator/kernel/geak_runner.py",
    "src/hyperloom/orchestrator/actions/executors/_ray_runtime.py",
    # quantization_agent CLI driver (argparse entrypoint).
    "src/hyperloom/agents/quantization/cli.py",
    # OOB server-side runtime (CLI, HTTP server, scheduler, auth proxy, agent
    # backends). The unit-testable OOB logic stays measured.
    "OOB/cli.py",
    "OOB/server.py",
    "OOB/scheduler.py",
    "OOB/auth_proxy.py",
    "OOB/backends/*",
    # Local-host metrics probes (rocm-smi / nvidia-smi / ps / df / ray status).
    # InferenceX shell-script patcher (fcntl locking + benchmark_lib.sh rewrite).
    "src/hyperloom/orchestrator/actions/executors/_inferencex_patcher.py",
    # TraceLens server patcher (git apply / patch --fuzz subprocess pipeline).
    "src/hyperloom/orchestrator/actions/executors/_server_patcher.py",
    # Breakdown collectors — exercised end-to-end by the reporter tests.
    "src/hyperloom/inference_optimizer/breakdown/collectors/*",
    # Operator CLIs, not library code.
    "src/hyperloom/inference_optimizer/tools/*",
    "src/hyperloom/orchestrator/roles/critic_agent.py",
    # Subprocess-heavy benchmark drivers.
    "src/hyperloom/orchestrator/actions/executors/profile.py",
    "src/hyperloom/orchestrator/actions/executors/baseline.py",
    "src/hyperloom/orchestrator/actions/executors/benchmark_run/*",
    # --- kernelforge (ported verbatim from KernelForge's own omit list) ---
    "*/test_*.py",
    # Shipped sample drivers, reference kernels, and local-wiki assets.
    "src/kernelforge/examples/*",
    "src/kernelforge/knowledge/local_wiki/resources/*",
    # Byte-identical upstream KB Store SDK; validated by checksum contract tests.
    "src/kernelforge/knowledge/kb_store/remote_client.py",
    # CLI entry points (argument plumbing; exercised via the CLIs themselves).
    "src/kernelforge/cli/*",
    # The gemm-tune and forge-fuse pipelines and the stages they drive: agent sessions,
    # tuner subprocesses and serving runs end to end.
    "src/kernelforge/workflows/gemm_tune/pipeline.py",
    "src/kernelforge/workflows/forge_fusion/pipeline.py",
    "src/kernelforge/workflows/forge_fusion/agent_selection.py",
    "src/kernelforge/workflows/forge_fusion/compile_pass_claim.py",
    "src/kernelforge/workflows/forge_fusion/harness_authoring.py",
    "src/kernelforge/workflows/forge_fusion/serving_gate.py",
    "src/kernelforge/workflows/forge_fusion/source_snapshot.py",
    # GPU toolchain + profilers: shell out to rocprofv3 / rocprof-compute /
    # ninja / the build system and require real hardware.
    "src/kernelforge/evaluation/benchmark/runner.py",
    "src/kernelforge/evaluation/profiling/registers.py",
    "src/kernelforge/workflows/forge_loop/iteration/runner.py",
    # ... and the per-job modules it was split into, which answer to the same hardware.
    "src/kernelforge/workflows/forge_loop/iteration/attempt_verdict.py",
    "src/kernelforge/workflows/forge_loop/iteration/best_publication.py",
    "src/kernelforge/workflows/forge_loop/iteration/campaign_report.py",
    "src/kernelforge/workflows/forge_loop/iteration/campaign_runtime.py",
    "src/kernelforge/workflows/forge_loop/iteration/case_coverage.py",
    "src/kernelforge/workflows/forge_loop/iteration/ceiling_runtime.py",
    "src/kernelforge/workflows/forge_loop/iteration/iteration_phases.py",
    "src/kernelforge/workflows/forge_loop/iteration/iteration_types.py",
    "src/kernelforge/workflows/forge_loop/iteration/keep_checkpoint.py",
    "src/kernelforge/workflows/forge_loop/iteration/lane_runtime.py",
    "src/kernelforge/workflows/forge_loop/iteration/locked_run.py",
    "src/kernelforge/workflows/forge_loop/iteration/outcome_runtime.py",
    "src/kernelforge/workflows/forge_loop/iteration/resume_recovery.py",
    "src/kernelforge/workflows/forge_loop/iteration/round_admission.py",
    "src/kernelforge/workflows/forge_loop/iteration/scoring_runtime.py",
    "src/kernelforge/workflows/forge_loop/iteration/supervisor_review.py",
    "src/kernelforge/workflows/forge_loop/iteration/workspace_git.py",
    # Claude Agent SDK transport (spawns the agent CLI, network).
    "src/kernelforge/workflows/forge_loop/roles/agent.py",
    # Filesystem index walker over the curated knowledge tree.
    "src/kernelforge/knowledge/local_wiki/index.py",
    # gemm-tune hardware tuners (drive vendor GEMM libraries on-device).
    "src/kernelforge/workflows/gemm_tune/tuners/sglang_dense_bf16.py",
    "src/kernelforge/workflows/gemm_tune/tuners/vllm_moe_triton.py",
    "src/kernelforge/workflows/gemm_tune/tuners/fmoe_ck.py",
    "src/kernelforge/workflows/gemm_tune/tuners/a4w4_blockscale.py",
    "src/kernelforge/workflows/gemm_tune/tuners/a8w8.py",
    "src/kernelforge/workflows/gemm_tune/tuners/a8w8_blockscale.py",
    "src/kernelforge/workflows/gemm_tune/tuners/a8w8_bpreshuffle.py",
    "src/kernelforge/workflows/gemm_tune/tuners/vllm_dense_tunableop.py",
    "src/kernelforge/workflows/gemm_tune/tuners/_aiter_dense_common.py",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@overload",
]
skip_empty = true
precision = 2
# Tolerate dangling ``.coverage`` entries for transient CI-generated files so
# the standalone ``coverage report`` step does not fail on NoSource.
ignore_errors = true
# Line coverage across all ``[tool.coverage.run].source`` trees.
fail_under = 90

# GitHub Actions ``tests-coverage.yml`` reads this table with inline Python.
[tool.hyperloom.tests_coverage]
# Base trailing argv for ``pytest`` in CI; the workflow appends sharding
# (``--splits``/``--group``) and ``-n`` from the values below.
pytest_ci_args = [
    "-m", "not targeted_build_e2e",
    "--cov=.", "--cov-report=",
]
# In-runner pytest-xdist workers per shard job (``-n auto`` yields 1 on the
# 2-vCPU GitHub runner, so pin it).
xdist_workers = 2
# GitHub matrix shards the suite is split across (pytest-split).
total_shards = 6

# White-box code-metrics gate: ``scripts/code_metrics.py``, run by
# ``.github/workflows/code-metrics.yml``. Each number below carries its reason.
# Each unit over a threshold in a file a change touches is compared with the same
# unit at the merge base, measured in the same run; it may not be new or worse. CI
# refuses a change that loosens anything in this table relative to the base
# branch: a raised limit, a new ``exclude`` entry, a dropped root, a raised
# duplication, dead-code or warning parameter.
[tool.hyperloom.code_metrics]
# Production Python: all of ``src`` (so a new package is in scope by default) and
# ``scripts``. Plain repository paths only; pathspec magic and globs are refused.
# Files under a ``tests/`` directory are exempt from every dimension but
# duplication, as in the style guide's "Size and complexity".
roots = ["src", "scripts"]
# Same vendored / shipped-example trees as ``[tool.ruff] extend-exclude``.
exclude = [
    "src/hyperloom/orchestrator/knowledge/remote_recipe/_vendor/kb_store_client.py",
    "src/kernelforge/examples",
    "src/kernelforge/knowledge/local_wiki/resources",
    "src/kernelforge/knowledge/kb_store/remote_client.py",
]
# SonarSource CPD defaults: a clone is at least 100 tokens and 10 lines (jscpd).
duplication-min-tokens = 100
duplication-min-lines = 10
# vulture's documented setting for CI: report only findings it is >= 80% sure of.
dead-code-min-confidence = 80
# A module over this many lines is listed in the report as a warning, never a
# failure: the size at which a reviewer asks for a split (the style guide's
# module-length review trigger).
module-lines-warning = 800
# Design checks (scripts/code_metrics_design.py), diff-only like the comment and
# literal checks. A1 takes its package units (root packages, layers and
# independent modules) from these import-linter contracts.
import-contracts = ".importlinter"
# A10 compares against the values of the enums defined here; A12 counts the
# implementations of a new ABC or Protocol here.
vocabulary-roots = ["src"]
# A9: a function returning a tuple of more elements than this fails; past two,
# positions stop naming themselves (the review rule's NamedTuple/dataclass line).
tuple-return-max-elements = 2

[tool.hyperloom.code_metrics.thresholds]
# Twice McCabe's 10 (the style guide's review trigger): at 20 a function has
# more paths than a reviewer can hold while reading it, so an explanation in the
# PR no longer makes it reviewable. Same number and the same two cases (added,
# or raised) as the style guide's "Complexity ceiling".
cyclomatic-complexity = 20
# Twice SonarSource's S3776 default of 15, the same step as the cyclomatic
# limit: cognitive complexity weights nesting, so a value past 30 is a function
# a reader has to re-read rather than read.
cognitive-complexity = 30
# Lines of code in the body: the ``def`` lines, decorators, blank, comment and
# docstring lines do not count. Past 50 a function rarely does one thing; split
# it along its steps.
function-lines = 50
# Past four nested blocks the innermost line depends on five conditions at
# once; extract the inner loop or invert a condition.
nested-blocks = 4
# pylint R0913 default: past five, a call site no longer reads as a sentence and the
# values travel together anyway -- pass the object they come from, or name them in a
# dataclass. A first parameter named ``self``/``cls`` does not count; every other
# named parameter does (keyword-only and ``_``-named too), and ``*args`` and
# ``**kwargs`` count one each.
function-args = 5
# Fails above 1200 physical lines: half again the review trigger of 800, the
# size at which a module almost always holds more than one job.
module-lines = 1200
# Any clone (see duplication-min-*) counts; the value is a file's duplicated lines.
duplicated-lines = 0
# Any vulture finding at dead-code-min-confidence counts.
dead-code = 0
# Entries directly in a directory: its modules and the subdirectories holding one.
# Past 50 a reader can no longer scan the listing for the module they need;
# group the modules into subpackages by responsibility.
directory-entries = 50

# Exact versions: the script refuses to measure with any other, because each
# release can change what a metric counts. CI installs these same pins.
[tool.hyperloom.code_metrics.tools]
ruff = "0.16.2"
complexipy = "8.0.1"
radon = "6.0.1"
vulture = "2.16"
jscpd = "5.4.1"

# Bandit security linter. ``B101`` (assert_used) is skipped repo-wide because
# nearly all hits are test assertions and runtime invariants.
[tool.bandit]
skips = ["B101"]
# Shipped knowledge-base sample kernels and reference drivers are third-party
# illustrative code, not Hyperloom's own.
exclude_dirs = [
    "*/tests/*",
    "*/test/*",
    "build",
    ".venv",
    "src/kernelforge/examples",
    "src/kernelforge/knowledge/local_wiki/resources",
]

# Pylint: minimal defaults for local runs; CI passes ``--errors-only``.
[tool.pylint.main]
jobs = 1

[tool.ruff]
target-version = "py310"
line-length = 120
# Generated / vendored trees that ship their own linting.
extend-exclude = [
    "_audit_artifacts",
    "build",
    ".venv",
    "TraceLens-internal",
    "InferenceX",
    "src/hyperloom/orchestrator/knowledge/remote_recipe/_vendor/kb_store_client.py",
    # Local-wiki resources and example drivers are not source whose style this
    # repository owns.
    "src/kernelforge/examples",
    "src/kernelforge/knowledge/local_wiki/resources",
    "src/kernelforge/knowledge/kb_store/remote_client.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "BLE", "RUF100"]
# E501 is owned by ``ruff format``; E741 would only cause churn-only renames in
# math / parsing helpers where single-letter locals are idiomatic.
ignore = ["E501", "E741"]

# Principle rules held at zero: any new finding fails CI. See the style guide's
# "Formatting and lint" section for what each family enforces and why.
extend-select = [
    "G",  # logging calls take %-style args, not pre-formatted strings
    "TD001", "TD003", "TD004", "TD005", "TD006", "TD007",  # TODO hygiene (issue link required)
    "FIX001", "FIX003", "FIX004",  # no FIXME / XXX / HACK markers (TODO stays allowed)
    "PGH",  # no blanket `# noqa` / `# type: ignore`, no eval-like misuse
    "RSE",  # `raise X`, not `raise X()`
    "ERA",  # no commented-out code
    "PIE",  # no redundant pass / range start / lambda wrappers
    "RET",  # explicit, consistent returns
    "DTZ",  # timezone-aware datetimes
    "LOG",  # correct logging API use
    "A",  # do not shadow builtins
    "C4",  # comprehension / collection-call idioms
    "B006",  # no mutable default arguments
    "B012",  # no return / break / continue inside finally
]
# Still off pending a team decision -- each rewrites hundreds of lines that the
# open PRs touch: "I" (import sorting), "UP" (pyupgrade). The rest of "B",
# "SIM" and the rest of "RUF" carry a backlog and belong behind a ratchet, not a
# hard gate.

[tool.ruff.lint.flake8-builtins]
# ``aiter`` is AMD's kernel library, imported under its own name throughout;
# the builtin ``aiter`` (async iterator) is never used in this tree.
ignorelist = ["aiter"]

# C901 (mccabe) stays off: the style guide's complexity trigger (10) and the
# code-metrics gate's ceiling (20) are counted with radon, which also counts every
# and / or, ternary, comprehension and assert. Measure on demand:
#   radon cc -s -n C src/hyperloom src/kernelforge

[tool.ruff.lint.per-file-ignores]
# Tests re-import inside function bodies (E402), redefine fixtures (F811), and
# bind setup values they assert on indirectly (F841). They build fixtures with
# ``dict(key=...)`` (C408), and fakes mirror the keyword names of the APIs they
# stand in for, builtins included (A002, A006).
"**/tests/**/*.py" = ["F811", "E402", "F841", "C408", "A002", "A006"]
# Modules whose imports sit below the module-level constants / helpers they
# close over (cycle-safe or lazy ordering).
"src/hyperloom/orchestrator/loop/coordinator.py" = ["E402"]
"src/hyperloom/orchestrator/state/shared_state.py" = ["E402"]
"src/hyperloom/inference_optimizer/cli/__init__.py" = ["E402"]
"src/hyperloom/inference_optimizer/multi_node/cli.py" = ["E402"]
"src/hyperloom/inference_optimizer/multi_node/commands/infera.py" = ["E402"]
"src/hyperloom/orchestrator/specialists/runner.py" = ["E402"]
"src/hyperloom/inference_optimizer/roofline_ceiling.py" = ["E402"]
"src/hyperloom/orchestrator/prompts/specialist_prompt_builder.py" = ["E402"]
"src/hyperloom/agents/critic/runtime/decision_reviewer.py" = ["E402"]
# The import sits under the comment block explaining why the attribute name is
# shared with kernelforge.agent_backends rather than redeclared here.
"src/kernelforge/workflows/forge_fusion/llm_failure.py" = ["E402"]
# Sphinx reads the module-level name ``copyright``.
"docs/conf.py" = ["A001"]
# Keyword names that mirror a stdlib signature callers already use:
# ``subprocess.run(input=...)`` and ``BaseHTTPRequestHandler.log_message(format, ...)``.
# Renaming them would break keyword callers / the override.
"src/hyperloom/orchestrator/actions/executors/_git.py" = ["A002"]
"src/kernelforge/utils/git.py" = ["A002"]
"src/hyperloom_kb/http_service.py" = ["A002"]
# Naive local-time timestamps are part of these files' on-disk / directory-name
# formats (persisted ``isoformat()`` strings, log-clock parsing); making them
# timezone-aware would change what existing readers parse and compare.
"src/kernelforge/workflows/forge_loop/campaign/experiment.py" = ["DTZ005"]
"src/kernelforge/workflows/forge_loop/campaign/schema.py" = ["DTZ005"]
"src/kernelforge/agent_backends/usage_ledger.py" = ["DTZ005"]
"src/hyperloom/orchestrator/actions/executors/bypass_report.py" = ["DTZ005"]
"src/hyperloom/orchestrator/actions/executors/benchmark_run/bringup.py" = ["DTZ001"]
"src/hyperloom/orchestrator/rehearsal/scenario.py" = ["DTZ001"]
# These call the root logger directly; a root-level call configures logging on
# first use when nothing else has, so moving them to a module logger changes
# what an unconfigured process prints.
"src/hyperloom/inference_optimizer/cli/model_gate.py" = ["LOG015"]
"src/hyperloom/inference_optimizer/model_config_utils.py" = ["LOG015"]
"src/hyperloom/orchestrator/actions/executors/_geak_sweep.py" = ["LOG015"]

# Markdown formatting in Ruff is still preview/experimental; keep ``ruff format``
# scoped to Python so CI ``ruff format --check`` does not rewrite docs/skills.
[tool.ruff.format]
exclude = ["**/*.md", "**/*.rst"]

[tool.mypy]
python_version = "3.10"
files = ["src/hyperloom"]
exclude = [
    ".*/tests/.*",
    "build",
    ".venv",
    "_audit_artifacts",
]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false
disallow_untyped_defs = false
show_error_codes = true
