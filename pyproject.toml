[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperloom-inference-optimizer"
version = "0.8.0"
description = "Autonomous LLM inference optimization runtime for AMD GPU platforms."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.65",
    "openai>=1.50",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]

[project.scripts]
inference-optimizer = "inference_optimizer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inference_optimizer = [
    "actions/*.md",
    "actions/_meta/*.yaml",
    "agents/*/agent_card.yaml",
    "agents/*/system_prompt.md",
    "agents/*/scripts/*",
    "kernel_opt/*.md",
    "orchestrator/system_prompts/*.md",
    "requirements.txt",
    "scripts/*",
]
