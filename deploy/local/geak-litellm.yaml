# GEAK config template for Hyperloom local mode.
# Rendered by entrypoint.sh at container start; do not edit the rendered copy.
# Placeholders below are replaced with values from container env vars:
#   __GEAK_MODEL_NAME__  <- $GEAK_MODEL_NAME (default: claude-opus-4-7)
#   __GEAK_API_KEY__     <- $GEAK_API_KEY or $LLM_API_KEY
#   __GEAK_BASE_URL__    <- $GEAK_BASE_URL or $LLM_API_BASE
model:
  model_class: litellm
  model_name: __GEAK_MODEL_NAME__
  api_key: __GEAK_API_KEY__
  base_url: __GEAK_BASE_URL__
  model_kwargs:
    max_tokens: 16384
