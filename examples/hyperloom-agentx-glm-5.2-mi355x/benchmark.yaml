# Native Magpie AgentX example for the pinned InferenceX revision
# 408c015be4b22d14c69518643609669405507077. inferencex_path is intentionally
# omitted: Hyperloom preflight reuses or clones the tested pin. A custom
# benchmark.inferencex_path only nominates a preferred writable checkout.
benchmark:
  framework: sglang
  model: amd/GLM-5.2-MXFP4
  precision: fp4
  runner_type: mi355x
  run_mode: local

  # This switch automatically selects Hyperloom's AgentX session contract when
  # the file is passed with --benchmark-config. CONC=8 uniquely selects the
  # TP4/EP4 DRAM+HiCache arm below. At a concurrency shared by multiple arms,
  # replace this scalar with an object such as:
  # agentx:
  #   enabled: true
  #   selector:
  #     tp: 4
  #     kv_offloading: dram
  #     kv_offload_backend: hicache
  agentx: enable

  # Magpie resolves serving from the pinned recipe and runs the upstream client.
  # docker_image pins the effective runtime and participates in its fingerprint.
  docker_image: lmsysorg/sglang-rocm:v0.5.20-rocm720-mi35x-20260924

  envs:
    # This is the fixed recipe point to measure. TP/PP/PCP/EP, MODEL_PREFIX,
    # KV offload, and CPU DRAM settings are resolved from the recipe.
    CONC: 8
    # Optional explicit topology assertion. Hyperloom derives the same
    # zero-based mask when it is omitted.
    ROCR_VISIBLE_DEVICES: 0,1,2,3

  # Also derived by Hyperloom for native AgentX; kept explicit as an assertion.
  gpu_selection:
    auto: false

  profiler:
    torch_profiler:
      enabled: false
    system_profiler:
      enabled: false
    tracelens:
      enabled: false
