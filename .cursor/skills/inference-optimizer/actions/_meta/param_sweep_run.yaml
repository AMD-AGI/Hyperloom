name: param_sweep_run
family: shallow
cost_minutes_p50: 8.0
cost_minutes_p75: 15.0
expected_gain_pct: [1.0, 6.0]
accuracy_risk: 0.05
crash_risk: 0.10
prerequisites: []
requires_lanes:
  - server_lifecycle
  - benchmark_lane
allowed_tools:
  - emit_intent
  - Read
  - Bash
side_effects:
  - restarts_server
  - writes_results
allowed_modes:
  - quick_param_sweep
  - guided_kernel_opt
preferred_backend: claude
preferred_model: claude-opus-4-7
max_turns: 30
lease_ttl_sec: 1200
applicable_when:
  - "model_class != gpt_oss_moe or always_safe"
