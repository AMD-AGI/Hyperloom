# Watchdog — multi-CLI agent card.
#
# Monitors event_log for crashes / OOM / hangs. Marathon-only.
# Backend: Claude (Read + limited Bash for log forensics).
name: watchdog
role: watchdog
backend: claude
enabled: true
capabilities:
  - alert
  - send_message
  - update_persona
allowed_modes:
  - marathon_multi_agent
system_prompt: system_prompt.md
inbox_filename: inbox.jsonl
outbox_filename: outbox.jsonl
restart_policy:
  max_restarts: 50
  backoff_seconds: 30
  continue_flag: true
extra:
  notes: |
    Watchdog produces RCA findings under findings/<ts>.json and may emit
    high-severity alerts that the Conductor escalates onto the bus with
    priority=0.
