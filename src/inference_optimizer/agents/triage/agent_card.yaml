# Triage — multi-CLI agent card (v0.4 MVP).
#
# Always-on cross-layer health watcher. Active in every execution mode.
# Backend: Claude (Read + limited Bash for log forensics; emit_intent for
# alert / kill_task / send_message). Tick = 60s (slower than other
# reactors — see standalone_agent_design §13.9.3).
#
# This card replaces the v0.3 `watchdog` card.
name: triage
role: triage
backend: claude
enabled: true
capabilities:
  - alert
  - kill_task
  - send_message
  - update_state
  - update_persona
  - ask_question
  - answer
  # Phase G — scheduling-police intents (PolicyGate restricts source to triage).
  - force_dispatch
  - prune_branch
  - escalate_strategy_change
allowed_modes:
  - quick_param_sweep
  - guided_kernel_opt
  - marathon_multi_agent
system_prompt: system_prompt.md
inbox_filename: inbox.jsonl
outbox_filename: outbox.jsonl
restart_policy:
  max_restarts: 50
  backoff_seconds: 30
  continue_flag: true
extra:
  notes: |
    Triage is the ONLY agent allowed to emit `kill_task` (PolicyGate
    enforces via KILL_TASK_SOURCE_ALLOWLIST). It scans sibling agents'
    outbox/inbox jsonl files for crash/stall signals; the launcher gives
    it `--add-dir $SESSION_DIR/agents/` so reads across siblings work
    without a per-file allowlist.

    kill_task scope is restricted to "task" — server / process kills are
    out of MVP scope per IR-5.

    Phase G expansion — triage is also the sole source for
    `force_dispatch` / `prune_branch` / `escalate_strategy_change`
    (PolicyGate.TRIAGE_ONLY_SOURCE_ALLOWLIST). Use these when the
    executor is stuck or repeating dead paths instead of just alerting.
