# The fixed-workload launch a framework gets on an architecture when no recipe serves the query.
# Left out on purpose: TP and EP (the query's), the context length and the dual-chunk attention
# backend (the host computes them from the model), the MoE runner (a Hyperloom guard), and the
# runner's own environment (HSA_*, HIP renumbering, PYTORCH_ROCM_ARCH).

rows:
  - framework: sglang
    gfx: [gfx942]
    args: [--trust-remote-code, --mem-fraction-static, "0.8"]
    env: {SGLANG_USE_AITER: "1", SGLANG_AITER_MLA_PERSIST: "1"}
  - framework: sglang
    gfx: [gfx950]
    args: [--trust-remote-code, --mem-fraction-static, "0.8"]
    env: {SGLANG_USE_AITER: "1"}
  - framework: sglang
    gfx: [gfx1151]
    args:
      - --trust-remote-code
      - --mem-fraction-static
      - "0.5"
      - --attention-backend
      - triton
      - --disable-cuda-graph
    env: {SGLANG_USE_AITER: "0"}
  - framework: vllm
    gfx: [gfx942, gfx950]
    args: [--trust-remote-code, --gpu-memory-utilization, "0.95"]
    env: {VLLM_ROCM_USE_AITER: "1"}
  - framework: vllm
    gfx: [gfx1201]
    args: [--trust-remote-code, --gpu-memory-utilization, "0.9"]
    env: {VLLM_ROCM_USE_AITER: "0", FLASH_ATTENTION_TRITON_AMD_ENABLE: "TRUE"}
  - framework: vllm
    gfx: [gfx1151]
    args: [--trust-remote-code, --gpu-memory-utilization, "0.95"]
    env: {VLLM_ROCM_USE_AITER: "0", VLLM_ROCM_USE_AITER_MHA: "0", VLLM_ROCM_USE_AITER_RMSNORM: "0"}
  - framework: atom
    gfx: [gfx942, gfx950]
    args: [--trust-remote-code]
    env: {}
