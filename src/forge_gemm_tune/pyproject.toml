[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-gemm-tune"
version = "0.1.0"
description = "Deterministic GEMM tuning CLI for AMD GPUs (sglang + vllm)"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
]

[project.scripts]
forge-gemm-tune = "forge_gemm_tune.cli:main"

# Explicit package mapping (NOT packages.find): the pyproject lives inside the
# forge_gemm_tune package dir, so discovery with where=[".."] would rediscover
# leftover build/ output (build/lib/forge_gemm_tune) and copy it into the next
# build -> recursive build/lib/.../build/lib tree + a dist-info "File exists"
# wheel failure on a shared checkout with stale artifacts (same class as the
# forge_fusion incident). List runtime subpackages explicitly (tests excluded).
[tool.setuptools]
packages = ["forge_gemm_tune", "forge_gemm_tune.tuners", "forge_gemm_tune.tier3"]
package-dir = {"forge_gemm_tune" = "."}
