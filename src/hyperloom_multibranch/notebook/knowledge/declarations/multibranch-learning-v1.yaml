#
# The multi-branch notebook's declaration for what its specialists learnt: one learning of one specialist, in its own
# words, under the session's conditions and, when it names one, about one direction. A learning measures nothing, so
# the schema has no baseline and no measurement; whether tests back it is its decision.
schema_version: 2

objectives:
  - id: specialist_learning@v1
    description: >-
      Carry what a specialist learnt while optimizing an LLM inference deployment to the next decision of any
      specialist optimizing a similar deployment.

identity:
  - {name: model, description: Model identifier from the task configuration., required: true}
  - {name: gpu, description: GPU hardware model of the session., required: true}
  - {name: framework, description: Serving framework name., required: true}
  - {name: model_type, description: Model configuration type.}
  - {name: architecture, description: Model architecture class.}
  - {name: framework_version, description: Serving framework version., kind: version}
  - {name: precision, description: Numeric precision of the session's workload.}
  - {name: tp, description: Tensor-parallel degree., kind: number}
  - {name: conc, description: Request concurrency., kind: number}
  - {name: isl, description: Input sequence length in tokens., kind: number}
  - {name: osl, description: Output sequence length in tokens., kind: number}
  - {name: layer, description: "The layer of the direction the learning is about: config, source or kernel."}

baseline: []

change:
  - name: summary
    description: The learning, in the specialist's words.
    kind: text
    required: true
    role: summary
    search: 4
  - name: learning_fingerprint
    description: SHA-256 of the learning's text, lower-cased, so the same words learnt again join one Repeat Group.
    required: true
    group: true
  - name: kind
    description: What the learning is.
    required: true
    search: 1
    values: [pitfall, insight, tooling, hypothesis, other]
  - name: target
    description: What the direction it is about attacks, when it names one.
    search: 2
  - name: mechanism
    description: How that direction attacks it.
    search: 2

outcome:
  - name: decision
    description: Whether tests the specialist cited back the learning.
    required: true
    role: decision
    values: [measured, unmeasured]
  - name: evidence
    description: Each cited test and how it came out.
    kind: text
    many: true

reflection: []
