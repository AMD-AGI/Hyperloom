format: hyperloom-kb.collect.v2
description: >-
  KernelForge forge-loop runs, one Experience per candidate kernel a run archived, so each lane of a fan-out round
  gets its own, each holding the time it was measured against, the agent's reasoning and plan, the Analysis report
  the plan was built on, the kernel it measured, and what KernelForge measured and decided; from the document
  kernelforge export-runs writes from a run's forge_experiments directory and its forge-loop.log. Each Experience
  links one empty raw log, raw-logs-not-collected.log, which export-runs writes beside the document.
declaration: kernelforge-run-v1
producer:
  name: kernelforge
  # Hand-written label with no upstream source. Collect copies it to provenance.producer_version. The schema
  # requires some non-empty value, and a later change can rename it. It does not name a KernelForge version, a log
  # format, or the archive layout.
  version: "10"

units:
  - each: $doc.runs
    as: run

unit_id: {text: $run.unit_id}

require:
  - reason: >-
      The logs could not be read as a run: export-runs needs a readable campaign_config.json, a run_state.json naming
      its campaign_id, and a readable meta.json for each archived candidate. read_error in the exported document says
      what it found.
    check: {absent: $run.read_error}
  - reason: >-
      No reasoning, which every Experience requires: the logs hold no lesson for this candidate and no rationale in
      its meta.json. A merge never has one, since no agent made it, and neither does a lane whose iteration recorded
      no lesson. For any other candidate, provide the lesson the iteration wrote.
    check: {present: $run.reasoning}

experience:
  run_id: {token: $run.run_id}
  seq: {integer: $run.seq}
  created_at: {text: $run.started_at}
  completed_at: {text: $run.completed_at}
  identity: $run.identity
  objective: kernel_time_ms@v1
  baseline:
    best_wall_ms_before: {number: $run.best_wall_ms_before}
    source_ms: {number: $run.source_ms}
  rationale:
    reasoning: {text: $run.reasoning}
    plan: {text: $run.plan}
    plan_file: $run.plan_file
  change:
    source_code: $run.source_code
    change_diff_file: $run.change_diff_file
  outcome:
    decision: {text: $run.decision}
    candidate_wall_ms: {number: $run.candidate_wall_ms}
  reflection:
    analysis_report: {text: $run.analysis_report}
  raw_logs: $doc.raw_logs
  provenance:
    source_ref: {text: $run.unit_id}
    extra: $run.provenance
