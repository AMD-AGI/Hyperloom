# KernelForge forge-loop runs: one Experience per candidate kernel a run archived (candidates/iter_NNN), the kernel
# one iteration measured and KernelForge's decision to keep or revert it. A run yields one or more: each lane of a
# fan-out round is measured as its own candidate, built from its own plan, so each lane is its own Experience.
# Hyperloom gives every declaration the rationale fields reasoning, alternatives, and preconditions, so they are not
# listed here. rationale.reasoning holds the whole reasoning log the implementer kept beside the plan it executed,
# orchestration/iter_NNN/<plan>.reasoning.md: its Summary line, then its record of what it examined, what it changed,
# what each change measured, and which directions it kept or dropped. When the session kept no log, as in every run
# made before KernelForge asked for one, a single session's reasoning is the first three sentences of the rationale
# its meta.json records, and a lane has none. A log longer than the 32 KB a text field holds makes collect skip the
# candidate. Reasoning is required: a candidate whose logs hold none, such as a merge of two earlier candidates, which
# no agent made, becomes no Experience.
# provenance.extra holds the candidate's metadata, which never reaches a prompt: meta, the whole meta.json
# KernelForge archived for the candidate, verbatim, among it the commit it kept the candidate as, the mean case
# speedup it decided on, the per-case times, every benchmark measurement, and the session's turns and end reason;
# llm_backend and llm_model, the Implementer the run's forge-loop.log names; kb_record, the record KernelForge's own
# experience KB filed a kept candidate under; candidate_origin, session or lane; analysis_generation, the Analysis
# generation reflection.analysis_report comes from, as analysis/<commit>/generation-NNN under forge_experiments; and
# analysis_report_omitted, why a report too long for a text field is not held.
# An Experience carries no raw logs and none of the profiler's output: the only files it links are the plan, the
# measured kernel, and the lesson, and the only Analysis output it holds is the report its plan was built on, as text.
# The objective and every identity field always form the repeat group, with the schema: Hyperloom groups Experiences
# that way by itself (hyperloom_kb/query_view.py repeat_group_key) and accepts group: true only on baseline and change
# fields, so none is declared here.
schema_version: 2

objectives:
  - id: kernel_time_ms@v1
    description: >-
      Minimize the time the kernel takes on the task's benchmark, in milliseconds: the median over three independent
      runs of the task's benchmark driver, each run's time being the driver's median over all the timing samples it
      reports, every benchmark case pooled. KernelForge does not decide on this time: it keeps a candidate only when
      the candidate's mean case speedup, the equal-weight mean over the benchmark cases of the original kernel's time
      on a case divided by the candidate's, clears a bar KernelForge sets from the best result so far and the spread
      of those runs. KernelForge itself labels this time diagnostic and not monotonic, so a kept candidate can
      occasionally be slower in milliseconds than the best kernel before it.
    unit: ms
    direction: lower_is_better

identity:
  - {name: operator, description: "Operator the kernel implements: the operator_name the run's campaign_config.json records, e.g. _softmax_kernel, gemm_a8w8_blockscale_bpreshuffle."}
  - {name: kernel, description: "Kernel the run optimizes: the logical operator KernelForge files its KB records under, the operator's name normalized to lower snake case without a trailing _kernel, e.g. softmax, gemm_a16w16_nt_n1024_k4096."}
  - {name: framework, description: "Framework that owns the source operator, e.g. aiter. Absent when the run records it as unknown."}
  - {name: backend, description: "Kernel language of the candidate, e.g. triton, flydsl, hip."}
  - {name: backend_version, description: "Release of the candidate's kernel language in the run's runtime, e.g. 0.3.2. forge-loop does not record it yet, so Experiences from its runs leave it absent.", kind: version}
  - {name: gpu, description: "GPU model the candidate was measured on, which also fixes its architecture target, e.g. mi355x (gfx950), mi300x (gfx942)."}
  - {name: dtype, description: "Data type of the operator's first input in the benchmark cases, e.g. bfloat16, float8_e4m3fn. forge-loop does not record it yet, so Experiences from its runs leave it absent."}

baseline:
  - name: current_best_median_ms
    description: >-
      The time of the best kernel KernelForge had kept when the iteration began, in milliseconds, as the candidate's
      meta.json records it (best_wall_ms_before): the same median over three benchmark runs as candidate_median_ms,
      for the kernel the candidate was measured against. Until the first KEEP, it is KernelForge's own measurement of
      the kernel the forge-loop started from. KernelForge replaces it only when it keeps a candidate, with that
      candidate's time; since it decides the KEEP on mean case speedup rather than on time, the value can
      occasionally rise.
    kind: number
    role: measurement
  - name: source_ms
    description: >-
      How long the original kernel took before any change, in milliseconds, measured the same way: the pristine
      baseline the run's run_state.json records, which for a run given --baseline-json is that file's time rather
      than the time of the kernel the search started from. A run state that records none leaves the baseline time
      the candidate's meta.json archives (baseline_wall_ms).
    kind: number

rationale:
  - name: plan
    description: >-
      What the plan the candidate was built from sets out to do: the whole Summary line the plan opens with, the
      planner's statement of the problem it addresses and of its goal. For a lane, the plan is the lane's own; for a
      single session, the round's optimization plan, read from its original draft when KernelForge could not revise
      the draft and put the critic's review in front of it (kernelforge/orchestrator/orchestration.py:1711 at
      1c14e79e1); for a merge, the stacked plans as KernelForge records them. A plan without a Summary line, as every
      plan written before KernelForge asked for one is, gives its first three sentences instead: lines a planner wrote
      before the plan's first heading are skipped, as are headings, code blocks, and tables.
    kind: text
  - name: plan_file
    description: >-
      The whole plan the candidate was built from, as KernelForge archived it in the planning round's
      orchestration/iter_NNN/: optimization_plan.md for a single session or a round's first lane, lane_NNN.md for
      the round's other lanes. The Experience links to the file by its name, size, and SHA-256.
    kind: file

change:
  - name: source_code
    description: >-
      The kernel file that was measured, as KernelForge archived it in candidates/iter_NNN/. The Experience links to
      the file by its name, size, and SHA-256, and the knowledge base stores the file once.
    kind: file

outcome:
  - name: decision
    description: KernelForge's decision label for an iteration, as its forge-loop runner assigns them.
    role: decision
    values:
      - KEEP
      - REVERT_PERF
      - REVERT_VALIDATION
      - REVERT_VALIDATION_TIMEOUT
      - REVERT_VALIDATION_ERROR
      - BUILD_FAILED
      - CRASH
      - REVERT_INTEGRITY
      - REVERT_CONTENDED
      - NO_CHANGES
      - API_ERROR
      - AGENT_ERROR
      - ORCHESTRATION_ERROR
  - name: candidate_median_ms
    description: >-
      The candidate's time in milliseconds, as its meta.json records it (wall_ms). KernelForge ran the task's
      benchmark driver three independent times on the candidate; each run reports the median over all its timing
      samples, every benchmark case pooled, and this is the median of those three. It is reported, not decided on:
      KernelForge kept or reverted the candidate on its mean case speedup (provenance.extra.meta.mean_case_speedup),
      so a kept candidate can be slower than current_best_median_ms.
    kind: number
    role: measurement

reflection:
  - name: lesson
    description: >-
      The first three sentences of KernelForge's lesson for the iteration, which it writes after every iteration that
      ran an implementer session (kernelforge/loop/runner.py:3796 at 1c14e79e1): the agent's own record of the
      iteration when KernelForge could get one, otherwise a record KernelForge writes from what the loop observed,
      opening "(no agent summary)". Optional: lanes get no lesson.
    kind: text
    required: false
  - name: lesson_file
    description: >-
      KernelForge's whole lesson for the iteration, lessons/iter_NNN.md. The Experience links to the file by its
      name, size, and SHA-256. Optional, as lesson is.
    kind: file
    required: false
  - name: analysis_report
    description: >-
      The whole report.md of the Analysis generation the candidate's plan was built on: KernelForge's cross-case
      summary of one kernel, which its Analysis agent publishes for the commit it analyzed as one immutable
      generation, forge_experiments/analysis/<commit>/generation-NNN/. Analysis runs on the baseline, and again after
      a KEEP once the canonical mean case speedup has improved 5% on the analyzed kernel's, or just before a
      Supervisor intervention; on a campaign longer than two hours it profiles the kernel with rocprof-compute,
      through rocpc_profile.py, and a shorter campaign's report is written from the source alone. The generation is
      the one the planning round's orchestration/iter_NNN/context.json names as its analysis_bundle evidence: until a
      refresh is published, rounds plan on the last report that was, so candidates on both sides of a KEEP can carry
      the same report. Optional: absent when the round named no published generation, as for a merge, which no round
      planned, and when report.md is over the 32 KB a text field holds, which provenance.extra.analysis_report_omitted
      then says. The profiler's raw output, such as pmc_perf.csv, the rocprofv3 counter CSVs, and the profile/ and
      .rocprofv3/ directories, is never stored: it is large and tied to one binary.
    kind: text
    required: false
