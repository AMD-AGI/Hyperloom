name: agentx
description: "AgentX agentic-coding inference optimization via InferenceX trace replay"

objective:
  kind: maximize_perf
  # The InferenceX dashboard's tput/GPU: input and output tokens per second per GPU. At AgentX's long contexts the
  # output is under 1 % of it, so a pack that gated on output_throughput optimized another number than the one reported.
  # output_throughput stays in every bench_output.json.
  metric: total_throughput
  direction: max
  unit: "tok/s/GPU"
  measurement:
    count: 1
    threshold_rel: 1.01
    # How long one bench runs: a 3600 s AgentX replay with its warmup takes about 64 min. The bench turn's cap is never
    # under it plus 15 min (arbor/component.py); -1 is no cap.
    bench_minutes: 75

validator:
  bench: validator/bench_agentx.sh
  correctness: validator/correctness.sh
  protected:
    - validator/

workload:
  kind: serving

tools:
  kv_trace_collector: "tools/kv_trace_collector.py"
  kv_trace_analyze: "tools/kv_trace_analyze.py"
  kv_trace_simulator: "tools/kv_trace_simulator.py"

constraints:
  - "Profile the decode step on the campaign's own server (rocprofv3) before proposing any change. A change that does not address one of the top-3 ops by GPU time will not move the AgentX metric."
  - "Profile again after every KEEP to see if the bottleneck shifted."
  - "The real work is deep: trace critical paths, edit framework source, write kernels. Knobs are warmup only — exhaust in 2-3 iterations then go deeper permanently."
  - "Every code change must address a real hardware bottleneck confirmed by rocprofv3."
  - "Do not modify InferenceX, AIPerf, or the validator scripts — they are outside the workspace."
  - "One change at a time. Gate it before touching anything else."
  - "Before proposing any code change, search for whether another backend already solved it (the framework's other GPU paths, public kernel libraries). Port proven techniques first."
