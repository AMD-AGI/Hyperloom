# gray-parrot's counter sets for sm_100 (B200, GB100), version 1, 2026-10-22.
#
# On CUDA a counter step is counted as one CUPTI Range Profiler user range (per step: CUPTI's auto
# range skipped CUDA graph launches, runner plan 04 probe A3), so each value is the step's total
# (or, for a ratio or a percentage, its value over the step). Each group must be one pass: the tool
# checks it at the first counter step (cuptiProfilerHostGetNumOfPasses) and refuses counters for the
# run if a group takes more.
#
# Names are CUPTI's (Nsight Compute's), as the Range Profiler lists them on GB100 (CUPTI 130001;
# runner ruppell-accuracy/results/gray-parrot/cuda-probes/a1). Pass counts from probe A1: the DRAM
# pair and the L2 pair each take one pass alone and two together, so they are separate groups;
# throughput metrics (sm__throughput, gpu__compute_memory_throughput) take 5-8 passes and are left
# out. There are no per-block slots on CUDA: `slots` is empty and the device check decides.
version: 1
arch: sm_100
verified: "groups checked on B200 by plan 04's bsets and cset stages (one pass each)"
slots: {}
common: []
sets:
  basic:
    # warps launched and instructions are exact for deterministic work (the W0 witness)
    b1: [smsp__warps_launched.sum, smsp__inst_executed.sum, dram__bytes_read.sum, dram__bytes_write.sum]
  memory:
    # DRAM bytes, read and written, and L2 sector lookups that hit (one pass: plan 04 Part C's cset,
    # 2026-10-22; L2 hits and misses together take two, bsets)
    m1: [dram__bytes_read.sum, dram__bytes_write.sum, lts__t_sectors_lookup_hit.sum]
    # L2 sector lookups that missed (not DRAM traffic: about twice the DRAM bytes on Qwen3-8B, Part B)
    m4: [lts__t_sectors_lookup_miss.sum]
    # L1 global loads: sectors, and the sectors that hit
    m3: [l1tex__t_sectors_pipe_lsu_mem_global_op_ld.sum, l1tex__t_sectors_pipe_lsu_mem_global_op_ld_lookup_hit.sum]
    # L1 global-load requests (sectors per request, across counter steps: with m3 it takes two passes)
    m5: [l1tex__t_requests_pipe_lsu_mem_global_op_ld.sum]
  compute:
    # instructions, SM cycles active, issue slots busy, the tensor pipe
    c1: [smsp__inst_executed.sum, sm__cycles_active.avg, smsp__issue_active.avg.pct_of_peak_sustained_active,
         sm__pipe_tensor_cycles_active.avg.pct_of_peak_sustained_elapsed]
    # tcgen05's pipe (UTC*MMA), and warps launched
    c2: [sm__pipe_tc_cycles_active.avg.pct_of_peak_sustained_elapsed, smsp__warps_launched.sum]
  occupancy:
    # achieved occupancy; the occupancy limits (launch__occupancy_limit_*) are launch attributes,
    # not Range Profiler metrics (Part C's cset)
    o1: [sm__warps_active.avg.pct_of_peak_sustained_active]
  roofline:
    # tensor operations by datatype, one group each (any two together take two passes: bsets,
    # 2026-10-22): tcgen05's utchmma bf16 and fp16, and hmma bf16. tcgen05's fp8/fp6/fp4 counter
    # (sm__ops_path_tensor_op_utcqmma_src_fp4_fp6_fp8_dst_fp32.sum) takes two passes alone, so no
    # counter step can count it: Nsight Compute's.
    r1: [sm__ops_path_tensor_op_utchmma_src_bf16_dst_fp32.sum]
    r2: [sm__ops_path_tensor_op_utchmma_src_fp16_dst_fp32.sum]
    r4: [sm__ops_path_tensor_op_hmma_src_bf16_dst_fp32.sum]
  # device activity over the run (GP4, RUPPELL_DEVICE_COUNTERS=activity@RATE): one PM sampling group,
  # never a counter step's (PM sampling names; one pass, plan 04 Part D's cset, 2026-10-22): GR, SMs,
  # issue, tensor pipe and warps active as percentages of the sample's elapsed cycles, DRAM and NVLink
  # bytes
  activity:
    a1: [gr__cycles_active.avg.pct_of_peak_sustained_elapsed, sm__cycles_active.avg.pct_of_peak_sustained_elapsed,
         sm__inst_executed_realtime.avg.pct_of_peak_sustained_elapsed,
         sm__pipe_tensor_cycles_active_realtime.avg.pct_of_peak_sustained_elapsed,
         sm__warps_active_realtime.avg.pct_of_peak_sustained_elapsed, dram__bytes_read.sum, dram__bytes_write.sum,
         nvlrx__bytes.sum, nvltx__bytes.sum]
