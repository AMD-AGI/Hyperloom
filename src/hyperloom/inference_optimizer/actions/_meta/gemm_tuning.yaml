name: gemm_tuning
family: deep_kernel
cost_minutes_p50: 20.0
cost_minutes_p75: 45.0
expected_gain_pct: [5.0, 20.0]
accuracy_risk: 0.10
crash_risk: 0.10
prerequisites:
  - baseline
  - roofline
requires_lanes:
  - server_lifecycle
  - workspace_mutation
  - benchmark_lane
allowed_tools:
  - emit_intent
  - Read
  - Bash
  - Edit
side_effects:
  - workspace_write
  - server_restart
  - writes_config
preferred_backend: claude
preferred_model: null
max_turns: 25
lease_ttl_sec: 5400
description: >
  GEMM dispatch tuning request. Current GEAK owns the default KERNEL phase and
  decides applicability internally. Private forge tuning is available only when
  the operator set exactly KERNEL_OPT_BACKEND_ORDER=forge.
pipeline_phase: deep
typical_runtime_min: 20.0
applicable_when:
  - "phase == 'deep'"
