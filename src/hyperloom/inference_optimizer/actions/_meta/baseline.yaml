name: baseline
family: prep
cost_minutes_p50: 5.0
cost_minutes_p75: 10.0
expected_gain_pct: [0.0, 0.0]
accuracy_risk: 0.0
crash_risk: 0.05
prerequisites: []
requires_lanes:
  - server_lifecycle
  - benchmark_lane
allowed_tools:
  - emit_intent
  - Read
  - Bash
side_effects:
  - launches_server
  - reads_server
  - writes_results
preferred_backend: claude
preferred_model: claude-opus-4-7
max_turns: 25
lease_ttl_sec: 4200
description: "Launch a fresh server with NO accepted modifications, run Magpie benchmark, and set baseline_tput."
pipeline_phase: measure
typical_runtime_min: 5.0
applicable_when:
  - "baseline_tput == 0"
# Descriptive (not validated by ActionRegistry) — surface Magpie leak-path
# recovery knobs Orchestration may set in propose_action{params=...} to
# route around a model-default script whose hardcoded --result-dir
# leaks results outside the per-task workspace. See SKILL.md
# "Magpie leak-path salvage" + the FAILURE RECOVERY block of the
# Orchestration system prompt for when to use these.
params_schema:
  benchmark_script:
    type: string
    description: |
      Bare *.sh file name (no path separators, no shell metacharacters).
      Force-pins benchmark.benchmark_script in the materialized YAML so
      Magpie runs the operator-picked script instead of its runner_type
      → script auto-selection. MUST match the session framework: only pin a
      "<framework>_<gpu>.sh" for the SAME framework as this run (a vllm run
      must not pin sglang_*.sh, etc.) — a cross-framework script boots the
      wrong engine and is rejected by materialize. Use only to bypass a
      script-specific bug (e.g. a hardcoded --result-dir /workspace/).
  result_dir:
    type: string
    description: |
      Absolute or workspace-relative path. Forwarded as $RESULT_DIR for
      this baseline subprocess. Coordinator defaults RESULT_DIR to the
      per-task workspace; only override when redirecting to a known
      leak destination already on $INFERENCE_OPTIMIZER_RESCUE_PATHS.
