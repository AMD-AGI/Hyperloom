# Default benchmark point for $FRAMEWORK=atom, resolved by default_baseline_config().
# `benchmark.model` is a placeholder: the executor replaces it with --model / $MODEL_PATH.
#
# Atom-specific constraints (see SKILL.md IR-8):
#   - precision is fp8 by default (DeepSeek-R1 / GLM5 are shipped FP8).
#   - EXTRA_ATOM_ARGS includes --trust-remote-code because most production
#     atom-served models ship their modeling code in the model dir
#     (e.g. modeling_deepseek.py + configuration_deepseek.py).
#   - Multi-node is unsupported; the CLI rejects --framework atom with --nodes>=2.

benchmark:
  framework: atom
  model: /models/Qwen-Qwen3-8B
  precision: fp8

  envs:
    TP: 8                      # full-node default; env can override
    CONC: 32                   # production throughput default; env can override
    ISL: 128
    OSL: 128
    RANDOM_RANGE_RATIO: 0.8
    MAX_MODEL_LEN: 4096        # atom-side max context (VRAM-sensitive on MI355X)
    EXTRA_ATOM_ARGS: "--trust-remote-code"
    # ROCR_VISIBLE_DEVICES is injected at materialize time as 0..TP-1 unless the
    # operator exports it. Do not set HIP_VISIBLE_DEVICES: on this stack it makes
    # torch.cuda.is_available() return False even when device_count=1.

  timeout_seconds: 3600        # atom cold start (aiter MoE JIT + weights load) can take ~6 min on first run

  profiler:
    torch_profiler:
      enabled: false
