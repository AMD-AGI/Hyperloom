# Default benchmark point for $FRAMEWORK=sglang, resolved by default_baseline_config().
# `benchmark.model` is a placeholder: the executor replaces it with --model / $MODEL_PATH.

benchmark:
  framework: sglang
  model: /models/Qwen-Qwen3-8B
  precision: bf16

  envs:
    # Last-resort fallbacks only; the CLI always projects the resolved
    # workload (flag > resume-state > default) into these envs before launch.
    TP: 1
    CONC: 64
    ISL: 1024
    OSL: 1024
    RANDOM_RANGE_RATIO: 1
    MAX_MODEL_LEN: 8192        # smaller context = faster warmup
    # ROCR_VISIBLE_DEVICES is injected at materialize time as 0..TP-1 unless the
    # operator exports it. Do not set HIP_VISIBLE_DEVICES: on this stack it makes
    # torch.cuda.is_available() return False even when device_count=1.

  timeout_seconds: 7200        # Qwen-32B TP=1 CONC=64 ISL/OSL=1024 NUM_PROMPTS=320 needs ~85 min incl. server boot

  profiler:
    torch_profiler:
      enabled: false
