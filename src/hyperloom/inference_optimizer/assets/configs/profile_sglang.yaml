# Profile benchmark point for $FRAMEWORK=sglang: baseline_sglang.yaml with the torch profiler on, so the round
# writes a torch_trace dir TraceLens and the kernel agent read. `benchmark.model` is a placeholder: the
# executor replaces it with --model / $MODEL_PATH.
#
# TraceLens needs graph-capture tracing (--enable-profile-cuda-graph), shape and callstack annotations
# (SGLANG_PROFILE_*) and a steady-state window (the start_step / num_steps of the /start_profile body).
#
# --enable-shape-discovery-for-cuda-graph-profile is not in upstream SGLang: it comes from the TraceLens patch
# set, which _server_patcher applies to the installed SGLang at the start of every profile when its version is
# allowed (HYPERLOOM_ENABLE_PATCH=1, the default). On success the flag is appended to EXTRA_SGLANG_ARGS; on
# failure the round keeps --enable-profile-cuda-graph and drops the annotations the unpatched server rejects.

benchmark:
  framework: sglang
  model: /models/Qwen-Qwen3-8B
  precision: bf16

  envs:
    TP: 8
    CONC: 64
    ISL: 256
    OSL: 256
    RANDOM_RANGE_RATIO: 1
    MAX_MODEL_LEN: 8192
    # ROCR_VISIBLE_DEVICES is injected at materialize time as 0..TP-1 unless the operator exports it.
    # --- Profiler: shape + callstack annotations (#126) ---
    SGLANG_PROFILE_WITH_STACK: "true"
    SGLANG_PROFILE_RECORD_SHAPE: "true"
    SGLANG_GRAPH_BATCH_CAPTURE: "1"
    # --- Profiler: graph capture (#126; shape discovery is added only on a patched server) ---
    EXTRA_SGLANG_ARGS: "--enable-profile-cuda-graph"
    # The graph-capture profile dumps the allocator's memory snapshot after the capture, naming every recorded C++ frame.
    # PyTorch's default names them with addr2line and parses its answers with std::stoi, which killed the server with
    # "RuntimeError: stoi" after the traces were written; dladdr names them from the loader's symbol table instead.
    TORCH_SYMBOLIZE_MODE: "dladdr"
    # --- Profiler: graph replays ---
    # The HIP runtime replays a captured graph by dispatching its pre-recorded AQL packets, and the ROCm profiler then
    # records a replay's kernels only for the replay that a host sync follows (the profiler's stop, or a prefill step),
    # so a decode window's shares are those of the eager ops around the replays. Each ROCm line has its own switch to
    # the per-node dispatch path instead; a runtime ignores the switches it does not define, so all three are set:
    #   ROCm 7.1.0-7.2.3:  DEBUG_CLR_GRAPH_PACKET_CAPTURE=0      (packet capture off)
    #   ROCm 7.2.4:        DEBUG_HIP_GRAPH_SEGMENT_SCHEDULING=0  (segmented executor off, so no packet capture)
    #   ROCm 10.x:         DEBUG_HIP_GRAPH_CLASSIC_PATH=1        (classic executor, no packet capture; single-device
    #                      graphs only). On 10.x SEGMENT_SCHEDULING=0 is that runtime's default and changes nothing.
    # Measured on ROCm 7.2.0 only (Qwen3-14B-FP8 decode replays of 764 kernels): a 128-step window recorded 1 of 127
    # replays by default and 128 of 128 with packet capture off. The 7.2.4 and 10.x switches are not yet measured.
    DEBUG_CLR_GRAPH_PACKET_CAPTURE: "0"
    DEBUG_HIP_GRAPH_SEGMENT_SCHEDULING: "0"
    DEBUG_HIP_GRAPH_CLASSIC_PATH: "1"
    # --- Profiler: steady-state window (#194) ---
    # The /start_profile body the client sends. _profile_setup replaces start_step and num_steps with the window
    # it computes from OSL, CONC and HYPERLOOM_PROFILE_MAX_STEPS_CAP (lowering the profile OSL until it fits).
    PROFILE_EXTRA_BODY: '{"shape_discovery": true, "detailed_annotations": true, "start_step": 40, "num_steps": 16, "merge_profiles": false, "profile_by_stage": false}'
    PROFILE: "1"

  timeout_seconds: 14400       # Qwen-32B TP=1 with a steady-state window can take ~3 h

  profiler:
    torch_profiler:
      enabled: true
