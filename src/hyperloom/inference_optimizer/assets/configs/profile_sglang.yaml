# Magpie profile config for SGLang.
# Same shape as baseline_sglang.yaml but with torch_profiler ON so the run
# produces a torch_trace dir downstream consumers (Kernel-agent /
# TraceLens) can read. `benchmark.model` and `benchmark.runner_type` are
# OVERRIDDEN at runtime — see baseline_sglang.yaml header for the full
# rationale.
#
# TraceLens integration (#126): profiler is configured for:
#   1. Graph capture tracing (--enable-profile-cuda-graph)
#   2. Shape + callstack annotations (SGLANG_PROFILE_* env vars)
#   3. Steady-state windowing (PROFILE_EXTRA_BODY start_step/num_steps)
# These are required for TraceLens fusion / roofline analysis.
#
# Issue #194 §5: `--enable-shape-discovery-for-cuda-graph-profile` is
# *not* in upstream SGLang argparse — it comes from the TraceLens patch
# set at TraceLens-internal/examples/custom_workflows/inference_analysis/
# sglang_roofline_patches/. Hyperloom's runtime patcher
# (HYPERLOOM_ENABLE_PATCH=1, default) tries to apply the 10-patch
# atomic transaction to the in-container SGLang install at the start
# of every profile, but only when the installed SGLang version passes the
# minor-version allowlist `_server_patcher._SGLANG_DEFAULT_ALLOWED_MINORS`
# (currently `("0.5",)`, i.e. any 0.5.x). Precedence:
# $HYPERLOOM_SGLANG_PATCH_EXACT_VERSIONS > $HYPERLOOM_SGLANG_PATCH_ALLOWED_MINORS
# > a TraceLens `SUPPORTED_VERSIONS` manifest > that default.
# If patching succeeds, materialize_config_with_envs auto-appends the
# flag to EXTRA_SGLANG_ARGS; if it fails (version unsupported,
# non-editable install layout, fs read-only, ...) we fall back to
# today's safe behaviour: only --enable-profile-cuda-graph plus the
# client-side PROFILE_EXTRA_BODY shape_discovery / detailed_annotations
# settings (which go through SGLang's /start_profile API and don't need
# a patched server). Set HYPERLOOM_ENABLE_PATCH=0 to disable runtime
# patching entirely.

benchmark:
  framework: sglang
  # benchmark_script: sglang_mi300x.sh  # uncomment to force a specific Magpie script
  model: /models/Qwen-Qwen3-8B  # OVERRIDDEN at runtime; see header.
  precision: bf16
  run_mode: local

  envs:
    TP: 8
    CONC: 64
    ISL: 256
    OSL: 256
    RANDOM_RANGE_RATIO: 1
    MAX_MODEL_LEN: 8192
    # ROCR_VISIBLE_DEVICES injected at runtime by baseline.py
    # (`0..TP-1`); export `ROCR_VISIBLE_DEVICES=...` to override.
    PATH: "/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    # --- Profiler: shape + callstack annotations (#126) ---
    SGLANG_PROFILE_WITH_STACK: "true"
    SGLANG_PROFILE_RECORD_SHAPE: "true"
    SGLANG_GRAPH_BATCH_CAPTURE: "1"
    # --- Profiler: graph capture (#126; shape-discovery flag dropped
    # because the deployed SGLang argparse rejects it) ---
    EXTRA_SGLANG_ARGS: "--enable-profile-cuda-graph"
    # --- Profiler: graph replays ---
    # The HIP runtime replays a captured graph from its recorded packets by default, and the ROCm profiler then
    # records a replay's kernels only for the replay that a host sync follows (the profiler's stop, or a prefill step):
    # of the 764-kernel decode replays of a Qwen3-14B-FP8 profile, a 128-step window had them for 1 of 127, a 32-step
    # window for 1 of 32, and 6 of 8 single-step by-stage windows had none, so the window's shares were those of the
    # eager ops around the replays and of its prefill steps. Replayed node by node (0) every replay is recorded, its
    # kernels named in capture order and the eager ops after it with their own times.
    DEBUG_CLR_GRAPH_PACKET_CAPTURE: "0"
    # --- Profiler: steady-state window via extra_body (#194) ---
    # PROFILE_EXTRA_BODY is consumed by InferenceX benchmark_lib.sh to inject
    # into the benchmark request body. start_step skips warmup, num_steps
    # limits trace size. Values are overridden at runtime by
    # materialize_config_with_envs (see
    # orchestrator/actions/executors/_workload_envs.py for the
    # authoritative logic):
    #   num_steps   (max_iters)   = HYPERLOOM_PROFILE_MAX_STEPS_CAP,
    #                                 default 128 (hard override via
    #                                 HYPERLOOM_PROFILE_MAX_ITERS +
    #                                 HYPERLOOM_PROFILE_DELAY_ITERS)
    #   steady_floor = ceil(OSL * (1 + RANDOM_RANGE_RATIO) / (2 * CONC))
    #                  must be <= max_iters; on the auto path the profile
    #                  OSL is lowered until it fits
    #   start_step  (delay_iters) = OSL * (RANDOM_RANGE_RATIO + 1) * 3
    #                                 - max_iters / 2, clamped at 0
    PROFILE_EXTRA_BODY: '{"shape_discovery": true, "detailed_annotations": true, "start_step": 40, "num_steps": 16, "merge_profiles": false, "profile_by_stage": false}'
    # --- Profile mode: cap prompts to reduce trace size ---
    PROFILE: "1"

  gpu_selection:
    auto: false                # executor pins via ROCR_VISIBLE_DEVICES at runtime

  timeout_seconds: 14400             # 4 h hard cap (Qwen-32B TP=1 profile with steady-state window can take ~3 h)

  profiler:
    torch_profiler:
      enabled: true                  # ← key difference vs baseline yaml
    system_profiler:
      enabled: false
    tracelens:
      enabled: false                 # we run TraceLens analysis ourselves
                                     # via Hyperloom/kernel-agent tools
