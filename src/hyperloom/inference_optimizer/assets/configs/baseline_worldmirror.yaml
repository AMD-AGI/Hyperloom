# Magpie baseline benchmark config for WorldMirror (HunyuanWorld-Mirror 2.0).
# Resolved by default_baseline_config() when $FRAMEWORK=worldmirror.
#
# WorldMirror is SCRIPTABLE: no OpenAI-compatible server, no benchmark_serving.py
# client, and no server lifecycle reuse. The wrapper worldmirror_{runner_type}.sh
# runs a 3D reconstruction benchmark, writes inferencex_result.json, and the
# bypass runner converts it into benchmark_report.json for Hyperloom.
#
# Fallback-only fields overridden at runtime:
#   - benchmark.model       <- --model / $MODEL_PATH
#   - benchmark.runner_type <- --gpu-type / $GPU_TYPE / RUNNER_TYPE

benchmark:
  framework: worldmirror
  workload_kind: scriptable
  model: /models/HY-World-2.0
  precision: bf16
  run_mode: local

  envs:
    TP: 1
    WM_TARGET_SIZE: 518
    WM_NUM_ITERATIONS: 5
    # Floor only: the driver warms every timed scene regardless, because a shape
    # the process has not met pays a 3-18s ROCm kernel compile/autotune inside
    # the timed forward (measured iteration 0 = 82.5s vs 9.2s steady state).
    WM_WARMUP_CALLS: 3
    # Empty = all 22 scenes. The metric is the across-scene mean, so per-scene
    # spread averages out: run-to-run CV of that mean measures 0.8-1.6%.
    WM_SCENES: ""
    # Only depth (quality gate) and camera are consumed. Writing gs/points/normal
    # costs 38% wall-clock and leaks ~75MB per reconstruction; "full" restores them.
    WM_SAVE_ARTIFACTS: minimal
    WM_COND_FLAGS: "0 0 0"
    WM_USE_TORCH_COMPILE: 0
    WM_TORCH_COMPILE_MODE: default
    WM_TORCH_COMPILE_DYNAMIC: 0
    WM_USE_AITER_ATTN: 0
    # Headline latency covers the model forward only. A reconstruction also
    # runs CPU sky/edge masking and point-cloud serialisation (~1.9s vs ~0.11s
    # forward); measuring those would dilute a real GPU win below noise.
    # Set to "e2e" to optimize whole-pipeline wall-clock instead.
    WM_METRIC_SCOPE: inference
    # Reuses the existing scriptable quality-ref injection keys.
    XDIT_QUALITY_REF: ""
    WM_QUALITY_REL_MAX: 0.2
    PATH: "/venv/bin:/opt/venv/bin:/opt/rocm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

  gpu_selection:
    auto: false

  server_lifecycle:
    enabled: false

  timeout_seconds: 7200

  profiler:
    torch_profiler:
      enabled: false
    system_profiler:
      enabled: false
    tracelens:
      enabled: false
