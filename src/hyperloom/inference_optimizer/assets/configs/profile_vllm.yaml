# Magpie profile config for vLLM.
# Same shape as baseline_vllm.yaml but with torch_profiler ON so the run
# produces a torch_trace dir downstream consumers (Kernel-agent /
# TraceLens) can read. `benchmark.model` and `benchmark.runner_type` are
# OVERRIDDEN at runtime — see baseline_sglang.yaml header for the full
# rationale.
#
# TraceLens integration (#126): profiler is configured for:
#   1. Steady-state windowing
#      (--profiler-config.delay_iterations/max_iterations)
#   2. Frontend filtering (--profiler-config.ignore_frontend) so the
#      trace contains only the engine forward path
#   3. Torch profiler shape/memory/flops/gzip fields injected by Magpie's
#      vllm_*.sh when PROFILE=1.
# These are required for TraceLens fusion / roofline analysis.
#
# Issue #194 §4: `capture_torch_profiler` and `detailed_trace_annotation`
# ship upstream from vLLM 0.26; below that they come from the TraceLens
# patch set at
# TraceLens-internal/examples/custom_workflows/inference_analysis/vllm_patches/.
# Every supported version still takes a patch, because upstream took the
# config fields but NOT the graph-capture implementation: from 0.26 that
# moved into the v2 runner and stayed patch-only. So Hyperloom's runtime
# patcher (HYPERLOOM_ENABLE_PATCH=1, default) applies the matching
# `config_vllm_v<version>.patch` against the in-container vLLM install at
# the start of every profile, on 0.26+ as well. Capture sidecars land under
# <torch_profiler_dir>/capture_traces, written by the graph-capture module
# the patch creates at vllm/profiler/graph_capture.py -- which is also how
# the patcher tells a patched 0.26+ install from a stock one, since there
# the config fields alone are present either way. If patching succeeds,
# materialize_config_with_envs auto-appends capture_torch_profiler and
# detailed_trace_annotation to EXTRA_VLLM_ARGS; if it fails (version unsupported, fs read-only,
# already-patched fork, etc.) we fall back to today's safe behaviour: only
# delay_iterations / max_iterations + ignore_frontend get injected.
# Set HYPERLOOM_ENABLE_PATCH=0 to disable runtime patching entirely.

benchmark:
  framework: vllm
  # benchmark_script: vllm_mi300x.sh  # uncomment to force a specific Magpie script
  model: /models/Qwen-Qwen3-8B  # OVERRIDDEN at runtime; see header.
  precision: bf16
  run_mode: local

  envs:
    TP: 8
    CONC: 64
    ISL: 256
    OSL: 256
    RANDOM_RANGE_RATIO: 1
    MAX_MODEL_LEN: 8192
    # ROCR_VISIBLE_DEVICES injected at runtime by baseline.py
    # (`0..TP-1`); export `ROCR_VISIBLE_DEVICES=...` to override.
    PATH: "/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    # --- Profiler: vLLM steady-state + annotations (#126) ---
    # Appended to the vllm serve command via EXTRA_VLLM_ARGS. Magpie's
    # vllm_*.sh wires the torch profiler core (profiler / dir /
    # record_shapes / with_memory / with_flops / use_gzip); we add the
    # TraceLens-relevant knobs that map to upstream ProfilerConfig in
    # the validation vLLM build (0.19+). delay_iterations and
    # max_iterations are overridden by materialize_config_with_envs (see
    # orchestrator/actions/executors/_workload_envs.py):
    #   max_iters    = HYPERLOOM_PROFILE_MAX_STEPS_CAP, default 128
    #                  (serialization-safe cap; hard override via
    #                  HYPERLOOM_PROFILE_MAX_ITERS)
    #   steady_floor = ceil(OSL * (1 + RANDOM_RANGE_RATIO) / (2 * CONC))
    #                  must be <= max_iters, else the profile OSL is
    #                  auto-lowered
    #   delay_iters  = OSL * (RANDOM_RANGE_RATIO + 1) * 3 - max_iters / 2,
    #                  clamped at 0
    EXTRA_VLLM_ARGS: "--profiler-config.ignore_frontend True"
    # vLLM timeout must be extended during profiling (graph capture is slow)
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1200"
    # --- Profile mode: cap prompts to reduce trace size ---
    PROFILE: "1"

  gpu_selection:
    auto: false                # executor pins via ROCR_VISIBLE_DEVICES at runtime

  timeout_seconds: 7200              # 2 h hard cap; profiling a large MoE (e.g. DeepSeek-R1 671B) adds far more than the ~30-90s seen on small models; stays < the WARM 7800s outer wall cap

  profiler:
    torch_profiler:
      enabled: true                  # ← key difference vs baseline yaml
    system_profiler:
      enabled: false
    tracelens:
      enabled: false                 # we run TraceLens analysis ourselves
                                     # via Hyperloom/kernel-agent tools
