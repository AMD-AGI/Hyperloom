# Profile benchmark point for $FRAMEWORK=vllm: baseline_vllm.yaml with the torch profiler on, so the round
# writes a torch_trace dir TraceLens and the kernel agent read. `benchmark.model` is a placeholder: the
# executor replaces it with --model / $MODEL_PATH.
#
# TraceLens needs a steady-state window (--profiler-config.delay_iterations / max_iterations, which
# _profile_setup computes from OSL, CONC and HYPERLOOM_PROFILE_MAX_STEPS_CAP) and frontend filtering
# (--profiler-config.ignore_frontend), so the trace holds only the engine forward path.
#
# capture_torch_profiler and detailed_trace_annotation are upstream config fields from vLLM 0.26, but the
# graph-capture implementation stays in the TraceLens patch set on every version, so _server_patcher applies the
# matching config_vllm_v<version>.patch at the start of every profile (HYPERLOOM_ENABLE_PATCH=1, the default).
# On success both fields are appended to EXTRA_VLLM_ARGS and capture sidecars land under
# <torch_profiler_dir>/capture_traces; on failure both are left out.

benchmark:
  framework: vllm
  model: /models/Qwen-Qwen3-8B
  precision: bf16

  envs:
    TP: 8
    CONC: 64
    ISL: 256
    OSL: 256
    RANDOM_RANGE_RATIO: 1
    MAX_MODEL_LEN: 8192
    # ROCR_VISIBLE_DEVICES is injected at materialize time as 0..TP-1 unless the operator exports it.
    EXTRA_VLLM_ARGS: "--profiler-config.ignore_frontend True"
    # --- Profiler: graph replays ---
    # The HIP runtime replays a captured graph by dispatching its pre-recorded AQL packets, and the ROCm profiler then
    # records a replay's kernels only for the replay that a host sync follows (the profiler's stop, or a prefill step),
    # so a decode window's shares are those of the eager ops around the replays. Each ROCm line has its own switch to
    # the per-node dispatch path instead; a runtime ignores the switches it does not define, so all three are set:
    #   ROCm 7.1.0-7.2.3:  DEBUG_CLR_GRAPH_PACKET_CAPTURE=0      (packet capture off)
    #   ROCm 7.2.4:        DEBUG_HIP_GRAPH_SEGMENT_SCHEDULING=0  (segmented executor off, so no packet capture)
    #   ROCm 10.x:         DEBUG_HIP_GRAPH_CLASSIC_PATH=1        (classic executor, no packet capture; single-device
    #                      graphs only). On 10.x SEGMENT_SCHEDULING=0 is that runtime's default and changes nothing.
    # Measured on SGLang on ROCm 7.2.0 only (128 of 128 replays of a 128-step window recorded, 1 of 127 by default);
    # not yet on vLLM, nor with the 7.2.4 and 10.x switches.
    DEBUG_CLR_GRAPH_PACKET_CAPTURE: "0"
    DEBUG_HIP_GRAPH_SEGMENT_SCHEDULING: "0"
    DEBUG_HIP_GRAPH_CLASSIC_PATH: "1"
    # Graph capture under the profiler is slow enough to trip vLLM's per-step timeout.
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1200"
    PROFILE: "1"

  timeout_seconds: 7200        # large MoE (e.g. DeepSeek-R1 671B) profiles far longer than small models; stays below the 7800 s WARM wall cap

  profiler:
    torch_profiler:
      enabled: true
