# Baseline benchmark config for HY-WorldPlay (HunyuanVideo-1.5, server-less video).
# Used by hyperloom.orchestrator.actions.executors.baseline / sweep / explore as
# the default benchmark config when $FRAMEWORK=worldplay.
#
# worldplay is a SCRIPTABLE (server-less) framework: there is no OpenAI server,
# no benchmark_serving.py client, and no server_lifecycle reuse. The vendored
# entrypoint worldplay_{runner_type}.sh runs the customer bench-kit once per
# variant (torchrun bench_fps.py, sequence-parallel = TP), which writes
# inferencex_result.json + benchmark_report.json directly. The metric is
# steady-state GENERATED FRAMES PER SECOND (higher = better), surfaced as
# output_throughput with unit "fps".
#
# Two fields are FALLBACK ONLY and overridden at run time by the executor:
#   - `benchmark.model`       <- --model / $MODEL_PATH
#   - `benchmark.runner_type` <- --gpu-type / $GPU_TYPE / rocm-smi probe
# benchmark_script is pinned to worldplay_{runner_type}.sh at materialize time,
# so it is intentionally NOT set here.
#
# PRECISION IS LOCKED to BF16: a precision change is a different model. The
# customer body forces WORLDPLAY_USE_FP8_GEMMS OFF; it is also blacklisted in
# explore.
#
# OPERATING POINT: the customer's exact headline config — 50 inference steps,
# 125 frames, 832x480, model_type=ar. This node has ONE MI355X, so TP=1 (the
# customer's headline is 8-GPU sp=8); 1-GPU numbers are NOT directly comparable.

benchmark:
  framework: worldplay
  workload_kind: scriptable        # drives server-less branching in the loop
  model: /primus/xiaofei/HY-WorldPlay/models/HunyuanVideo-1.5   # OVERRIDDEN at runtime; see header.
  precision: bf16                  # LOCKED for worldplay sessions
  run_mode: local

  envs:
    TP: 1                          # sequence-parallel degree (= GPU count on this node)
    # ── Workload (customer standard operating point) ──────────────────────────
    WORLDPLAY_MODEL_TYPE: ar
    WORLDPLAY_NUM_STEPS: 50
    WORLDPLAY_NUM_FRAMES: 125
    WORLDPLAY_HEIGHT: 480
    WORLDPLAY_WIDTH: 832
    WORLDPLAY_WARMUP_CHUNKS: 1
    WORLDPLAY_REPEATS: 5
    WORLDPLAY_SEED: 1
    # Offloading OFF = true compute (roofline-relevant); the customer's Arbor
    # wrapper defaults it OFF, and disabling it is the known WorldPlay winner.
    WORLDPLAY_OFFLOADING: 0
    # torch.compile is NOT part of the baseline: the baseline reflects raw eager
    # framework; compile is A/B'd as a discoverable optimization in explore.
    WORLDPLAY_USE_TORCH_COMPILE: 0
    WORLDPLAY_USE_FP8_GEMMS: 0     # LOCKED (precision = BF16); body ignores overrides
    # ── Self-calibrating perceptual quality band ─────────────────────────────
    # The customer body relies on env defaults (it does not pass --quality-*
    # flags for calibration), so they MUST be set here. The establish leg
    # measures the pipeline's own SSIM/MSE/LPIPS drift under an eps latent
    # perturbation and stores that accept band in the reference .npz; compare
    # legs read it back. Best configs land near SSIM~0.79, so a fixed 0.85
    # threshold would false-fail — calibration is why this workload needs it.
    WORLDPLAY_QUALITY_CALIBRATE: 1
    WORLDPLAY_QUALITY_CALIB_EPS: 0.004
    WORLDPLAY_QUALITY_CALIB_SAMPLES: 2
    WORLDPLAY_QUALITY_CALIB_MARGIN: 1.25
    WORLDPLAY_QUALITY_FRAMES: 8
    # Fixed-threshold fallback (only used when WORLDPLAY_QUALITY_CALIBRATE=0).
    WORLDPLAY_QUALITY_SSIM_MIN: 0.85
    WORLDPLAY_QUALITY_LPIPS_MAX: 0.15
    WORLDPLAY_QUALITY_MSE_MAX: 0.006
    # Reference clip path; empty here — the scriptable quality-ref choke point
    # injects XDIT_QUALITY_REF_WRITE on the baseline (establish) leg and
    # XDIT_QUALITY_REF on every compare leg. The customer body reads both.
    XDIT_QUALITY_REF: ""
    # ── Local / offline weight resolution ─────────────────────────────────────
    # The HF hub cache holds empty snapshot stubs on this node; the entrypoint
    # shim supplies on-disk --model_path/--action_ckpt. Keep HF fully offline.
    WORLDPLAY_REPO: /primus/xiaofei/HY-WorldPlay
    HF_HOME: /primus/xiaofei/HY-WorldPlay/models/hf_cache
    HF_HUB_OFFLINE: 1
    TRANSFORMERS_OFFLINE: 1
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    # The customer body uses bare torchrun/hipcc; force the venv + ROCm ahead of
    # system so the correct torch(ROCm) install and hipcc are found.
    PATH: "/opt/venv/bin:/opt/rocm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    # ROCR_VISIBLE_DEVICES is injected at runtime by the executor as 0..TP-1.

  gpu_selection:
    auto: false                    # executor pins via ROCR_VISIBLE_DEVICES at runtime

  server_lifecycle:
    enabled: false                 # server-less: no reuse

  # Single-GPU 50-step/125-frame is slow: baseline is warmup 1 + repeats 5 plus
  # a 2-sample calibration leg. Give it a generous hard cap.
  timeout_seconds: 21600           # 6 h

  profiler:
    torch_profiler:
      enabled: false               # baseline needs throughput + quality only
    system_profiler:
      enabled: false
    tracelens:
      enabled: false
