# Profile benchmark config for HY-WorldPlay (HunyuanVideo-1.5, server-less video).
# Same contract as baseline_worldplay.yaml but with torch_profiler enabled so the
# loop can attribute time across the AR rollout (dit_denoise, vae_decode,
# kv_cache_vision) and drive roofline/kernel analysis. Resolved by
# `_default_profile_config()` when $FRAMEWORK=worldplay.
#
# Fallback-only fields are resolved at runtime: benchmark.model, runner_type,
# WORLDPLAY_REPO_PATH, and the bundled benchmark_script entrypoint.
#
# In profile mode the trace is the deliverable, so one timed repeat is enough and
# the quality gate is off (the choke point forces the reference empty under
# PROFILE, so the customer body emits a skipped quality_gate block).

benchmark:
  framework: worldplay
  workload_kind: scriptable
  model: /models/HunyuanVideo-1.5  # placeholder; overridden at runtime.
  precision: bf16
  run_mode: local

  envs:
    TP: 1
    WORLDPLAY_MODEL_TYPE: ar
    WORLDPLAY_NUM_STEPS: 50
    WORLDPLAY_NUM_FRAMES: 125
    WORLDPLAY_HEIGHT: 480
    WORLDPLAY_WIDTH: 832
    WORLDPLAY_WARMUP_CHUNKS: 1
    WORLDPLAY_REPEATS: 1           # one timed repeat under the profiler
    WORLDPLAY_PROFILE_REPEATS: 1
    WORLDPLAY_SEED: 1
    WORLDPLAY_OFFLOADING: 0
    WORLDPLAY_USE_TORCH_COMPILE: 0
    WORLDPLAY_USE_FP8_GEMMS: 0     # LOCKED (precision = BF16)
    # Quality gate off under profiling (calibrate=0; choke point forces ref empty).
    WORLDPLAY_QUALITY_CALIBRATE: 0
    XDIT_QUALITY_REF: ""
    # Local / offline weight resolution (see baseline_worldplay.yaml).
    HF_HUB_OFFLINE: 1
    TRANSFORMERS_OFFLINE: 1
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    PROFILE: 1                     # body bridges this to bench_fps --torch_profiler_dir
    WORLDPLAY_SUPPORTS_PROFILER: 1 # gate in the body that passes --torch_profiler_dir
    PATH: "/opt/venv/bin:/opt/rocm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

  gpu_selection:
    auto: false

  server_lifecycle:
    enabled: false

  timeout_seconds: 21600           # 6 h

  profiler:
    torch_profiler:
      enabled: true                # collect *.trace.json.gz for TraceLens
    system_profiler:
      enabled: false
    tracelens:
      enabled: true
