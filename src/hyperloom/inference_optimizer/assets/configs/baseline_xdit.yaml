# Default benchmark point for $FRAMEWORK=xdit (diffusion, server-less), resolved by default_baseline_config().
# `benchmark.model` is a placeholder: the executor replaces it with --model / $MODEL_PATH.
#
# xDiT is a scriptable framework: there is no OpenAI server, no serving client
# and no server lifecycle. The shipped xdit script (inference_suite/load/scripts/xdit.sh)
# runs the xDiT CLI once per variant, measures E2E latency, runs the image-quality
# gate (LPIPS/SSIM/MSE vs a fixed BF16 reference) and writes its result directly.
# Throughput is img/s.
#
# PRECISION IS LOCKED to BF16 for an xDiT session: a precision change (FP4/FP8)
# is a different model. XDIT_USE_FP4_GEMMS / XDIT_USE_FP8_GEMMS stay off and are
# on the explore blacklist.

benchmark:
  framework: xdit
  workload_kind: scriptable        # drives server-less branching in the loop
  model: /models/FLUX.1-dev
  precision: bf16                  # LOCKED for xdit sessions

  envs:
    TP: 8                          # = XDIT_ULYSSES_DEGREE (sequence parallel degree)
    XDIT_HEIGHT: 1024
    XDIT_WIDTH: 1024
    XDIT_NUM_STEPS: 28
    XDIT_NUM_ITERATIONS: 25        # timed iterations (steady-state)
    XDIT_WARMUP_CALLS: 5
    XDIT_GUIDANCE_SCALE: 4.0
    XDIT_ATTENTION_BACKEND: aiter  # quantized backends are blacklisted
    # torch.compile is NOT part of the baseline: the baseline reflects the raw
    # eager framework, and compile is A/B'd as a discoverable optimization
    # (explore seeds xdit_compile_reduce_overhead / xdit_no_compile).
    XDIT_USE_TORCH_COMPILE: 0
    XDIT_USE_FP4_GEMMS: 0          # LOCKED (precision = BF16)
    XDIT_USE_FP8_GEMMS: 0          # LOCKED (precision = BF16)
    # Image-quality gate — xDiT tolerance semantics. xDiT validates optimizations
    # against a numeric tolerance (~1e-2 rtol/atol, ~0.15 abs allowed) rather than
    # a tight per-pixel match; these thresholds mirror that so equal-quality /
    # precision-track optims (e.g. compile, fp8 GEMM) pass while gross divergence
    # is still caught. NOTE: feature-level, step-skipping optims (fbcache/teacache)
    # diverge per-image and can only be validated distributionally (FID), which is
    # not yet wired up here. The script writes quality_gate.{passed,lpips,ssim,mse}
    # and _accuracy_gate maps passed->1.0.
    # Reference image path — informational only: the materializer reads
    # $XDIT_QUALITY_REF from the process env, not this key, and overwrites
    # both REF and REF_WRITE. Empty auto-derives
    # <session_dir>/storage/quality_ref/baseline.png: baseline WRITES it,
    # every other variant COMPARES against it. The gate is skipped only on
    # profile / roofline runs.
    XDIT_QUALITY_REF: ""
    XDIT_QUALITY_LPIPS_MAX: 0.15
    XDIT_QUALITY_SSIM_MIN: 0.85
    XDIT_QUALITY_MSE_MAX: 0.006
    # The xdit script runs bare `python3` and `xdit`; put the venv ahead of the
    # system so the xDiT/torch(ROCm) install is picked up rather than /usr/bin/python3.
    # /opt/rocm/bin is REQUIRED so AITER's runtime JIT (module_fmha_v3_fwd) can
    # find `hipcc`; without it the xDiT baseline crashes with
    # "ModuleNotFoundError: aiter.jit.module_fmha_v3_fwd" / "hipcc not found".
    PATH: "/venv/bin:/opt/venv/bin:/opt/rocm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    # ROCR_VISIBLE_DEVICES is injected at materialize time as 0..TP-1.

  timeout_seconds: 7200            # compile + warmup + iters

  profiler:
    torch_profiler:
      enabled: false               # baseline needs throughput + quality only
