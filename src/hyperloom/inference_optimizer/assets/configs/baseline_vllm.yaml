# Default benchmark point for $FRAMEWORK=vllm, resolved by default_baseline_config().
# `benchmark.model` is a placeholder: the executor replaces it with --model / $MODEL_PATH.

benchmark:
  framework: vllm
  model: /models/Qwen-Qwen3-8B
  precision: bf16

  envs:
    # Last-resort fallbacks only; the CLI always projects the resolved
    # workload (flag > resume-state > default) into these envs before launch.
    TP: 1
    CONC: 64
    ISL: 1024
    OSL: 1024
    RANDOM_RANGE_RATIO: 1
    MAX_MODEL_LEN: 8192
    # Graph capture is slow enough to trip vLLM's per-step timeout.
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1200"

  timeout_seconds: 7200        # large MoE (e.g. DeepSeek-R1 671B) exceeds 40 min; stays below the 7800 s WARM wall cap

  profiler:
    torch_profiler:
      enabled: false
