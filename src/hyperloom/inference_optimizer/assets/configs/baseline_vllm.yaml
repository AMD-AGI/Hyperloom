# Magpie baseline benchmark config for vLLM.
# Used as the default vLLM benchmark config; the inference_optimizer
# pipeline overrides `benchmark.model` and injects `benchmark.runner_type`
# at runtime (see baseline_sglang.yaml header for the full rationale).

benchmark:
  framework: vllm
  # benchmark_script: vllm_mi300x.sh  # uncomment to force a specific Magpie script
  model: /models/Qwen-Qwen3-8B  # OVERRIDDEN at runtime; see header.
  precision: bf16
  run_mode: local

  envs:
    # Last-resort fallbacks only; the CLI always projects the resolved
    # workload (flag > resume-state > default) into these envs before launch.
    TP: 1
    CONC: 64
    ISL: 1024
    OSL: 1024
    RANDOM_RANGE_RATIO: 1
    MAX_MODEL_LEN: 8192
    # ROCR_VISIBLE_DEVICES injected at runtime by baseline.py
    # (`0..TP-1`); export `ROCR_VISIBLE_DEVICES=...` to override.
    # Graph capture is slow enough to trip vLLM's per-step timeout.
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1200"
    PATH: "/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

  gpu_selection:
    auto: false                # executor pins via ROCR_VISIBLE_DEVICES at runtime

  timeout_seconds: 7200        # 2 h hard cap (large MoE e.g. DeepSeek-R1 671B: profiled roofline run far exceeds 40 min; stays < the WARM 7800s outer wall cap)

  profiler:
    torch_profiler:
      enabled: false
    system_profiler:
      enabled: false
    tracelens:
      enabled: false
