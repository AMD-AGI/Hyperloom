# Magpie profile benchmark config for xDiT (diffusion, server-less).
# Same contract as baseline_xdit.yaml but with torch_profiler enabled so the
# loop can attribute time across GEMM (QKV/MLP), AllToAll (Ulysses), and
# norm/activation. Resolved by `_default_profile_config()` when $FRAMEWORK=xdit.
#
# Fallback-only fields (overridden at runtime): benchmark.model, runner_type.
# benchmark_script is pinned to xdit_{runner_type}.sh at materialize time.

benchmark:
  framework: xdit
  workload_kind: scriptable
  # benchmark_script: xdit_mi355x.sh  # uncomment to force a specific Magpie script
  model: /path/models/FLUX.1-dev     # OVERRIDDEN at runtime.
  precision: bf16
  run_mode: local

  envs:
    TP: 8
    XDIT_HEIGHT: 1024
    XDIT_WIDTH: 1024
    XDIT_NUM_STEPS: 28
    XDIT_NUM_ITERATIONS: 10        # fewer timed iters under the profiler
    XDIT_WARMUP_CALLS: 3
    XDIT_GUIDANCE_SCALE: 4.0
    XDIT_ATTENTION_BACKEND: aiter
    # Profiling runs WITH torch.compile (unlike the raw-eager baseline in
    # baseline_xdit.yaml): the empty/uncorrelatable-trace problem is fixed
    # upstream (profiler side), so the trace carries the real compiled GPU
    # kernels we actually want to attribute time across.
    XDIT_USE_TORCH_COMPILE: 1
    XDIT_USE_FP4_GEMMS: 0
    XDIT_USE_FP8_GEMMS: 0
    # xDiT tolerance semantics (see baseline_xdit.yaml for rationale).
    XDIT_QUALITY_REF: ""
    XDIT_QUALITY_LPIPS_MAX: 0.15
    XDIT_QUALITY_SSIM_MIN: 0.85
    XDIT_QUALITY_MSE_MAX: 0.006
    PROFILE: 1                     # wrapper bridges this to xDiT torch-profiler dir
    XDIT_SUPPORTS_PROFILER: 1      # gate in the wrapper that actually passes --torch_profiler_dir
    PATH: "/venv/bin:/opt/venv/bin:/opt/rocm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

  gpu_selection:
    auto: false

  server_lifecycle:
    enabled: false

  timeout_seconds: 7200

  profiler:
    torch_profiler:
      enabled: true                # collect *.pt.trace.json.gz for TraceLens
    system_profiler:
      enabled: false
    tracelens:
      enabled: true
