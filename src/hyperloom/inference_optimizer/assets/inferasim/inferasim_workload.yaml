# InferaSim workload template used by Hyperloom's inferasim benchmark backend.
#
# This is an env-driven Infera (inferasim) workload spec. The inferasim bridge
# (hyperloom.orchestrator.actions.executors.inferasim_bridge) points
# `inferasim inference --config` at this file and sets:
#   INFERASIM_MODEL  - model preset name (e.g. gpt_oss_120B), from the resolved
#                     Hyperloom model or HYPERLOOM_INFERASIM_MODEL
#   INFERASIM_TP/PP/EP - parallelism (also forced via CLI overrides)
#
# The model preset (`<INFERASIM_MODEL>.yaml`) is resolved from Infera's own
# configs/models/megatron search path, so this template works regardless of
# where it lives. To use a fully custom Infera workload instead, set
# HYPERLOOM_INFERASIM_WORKLOAD=/path/to/your_workload.yaml.
work_group: ${INFERASIM_TEAM:hyperloom}
user_name: ${INFERASIM_USER:hyperloom}
exp_name: ${INFERASIM_EXP_NAME:hyperloom-inferasim}
workspace: ./output

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml

    # Model preset to project; overridden per-run via INFERASIM_MODEL.
    model: ${INFERASIM_MODEL:gpt_oss_120B}.yaml
    overrides:
      # Sequence sizing; the serving request length is set separately by the
      # bridge via --input-len / --output-len.
      seq_length: ${INFERASIM_SEQ_LENGTH:4096}
      max_position_embeddings: ${INFERASIM_MAX_POSITION_EMBEDDINGS:4096}

      # Parallelism (env defaults; the bridge also forces these via CLI
      # overrides so an explicit workload YAML is honored too).
      tensor_model_parallel_size: ${INFERASIM_TP:1}
      pipeline_model_parallel_size: ${INFERASIM_PP:1}
      expert_model_parallel_size: ${INFERASIM_EP:1}

      # Keep the projection self-contained (no data / checkpoints).
      mock_data: true
      train_data_path: null
      valid_data_path: null
      test_data_path: null
