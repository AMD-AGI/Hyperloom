name: framework-agent

on:
  pull_request:
    paths: ["src/hyperloom/agents/framework/**"]
  push:
    branches: [main]
    paths: ["src/hyperloom/agents/framework/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install hyperloom (editable + test extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Smoke test - fa schema
        run: |
          python -m hyperloom.agents.framework.runtime.cli schema
      - name: Run unit tests
        run: |
          pytest src/hyperloom/agents/framework/tests -v
