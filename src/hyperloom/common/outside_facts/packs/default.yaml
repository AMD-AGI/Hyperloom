  component_layout_triton:
    kind: component_layout
    project: triton
    reason: >-
      Triton is installed as a wheel: its Python is python/triton in the repository, and the AMD backend and the HIP language
      extension, which the wheel moves into the package, are third_party/amd/backend and third_party/amd/language/hip. The wheel
      carries its compiler as native files (libtriton.so, the bitcode libraries, the C launcher stub driver.c): a Python patch
      cannot change them, so a patch that names one is refused with its path instead of being laid beside the old binary.
    import_name: triton
    sections:
      - {prefix: python/triton, base: package}
      - {prefix: third_party/amd/backend, base: package, into: backends/amd}
      - {prefix: third_party/amd/language/hip, base: package, into: language/extra/hip}
