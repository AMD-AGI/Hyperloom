      - "*.td"
      - "CMakeLists.txt"
      - "*.cmake"
      - "setup.py"
      - "pyproject.toml"
      - "Makefile"
      - "*.ld"
    generated: []
    examples:
      place:
        - "python/triton/language/core.py -> package:language/core.py"
        - "third_party/amd/backend/compiler.py -> package:backends/amd/compiler.py"
        - "third_party/amd/language/hip/libdevice.py -> package:language/extra/hip/libdevice.py"
      refuse:
