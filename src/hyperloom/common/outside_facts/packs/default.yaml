  aiter_tuned_row_columns:
    kind: names
    project: aiter
    reason: >-
      A row of a table aiter's tuner writes says, in these columns, which library runs its kernel (libtype, "asm" for a
      hand-written assembly kernel) and how many splits of the K dimension the kernel makes (splitK). The rows an accuracy
      check must treat differently, the asm kernels at a splitK above 1, are told apart by them.
    names:
      libtype_column: libtype
      splitk_column: splitK
      asm_libtype: asm
    examples:
      - "hyperloom_multibranch.toolbox.tools.tune_rows: a row is one of the rows judged by its relative-norm error when its libtype column says asm and its splitK column a number above 1, and the profile of the tuner's candidates is searched by the same two columns"

  forge_rel_norm_err:
    kind: names
    project: Forge (kernelforge gemm_tune)
    reason: >-
      aiter's tuner counts the elements of a candidate's output that lie outside the reference's tolerance (errRatio). An
      asm kernel at a splitK above 1 accumulates its partial results in bf16 with atomics, which fails that count while the
      output as a whole stays accurate, so Forge also measures such a row by the relative norm of its error,
      ||out - ref|| / ||ref|| against the fp32 dequantized matmul, ships the row when that is within 0.01, and writes the
      figure to this column of the tuned table. Only those rows carry a figure; the column is Forge's, not aiter's, and a
      table without it comes from a Forge that does not make the check.
    names:
      column: relNormErr
    examples:
      - "hyperloom_multibranch.toolbox.tools.tune_rows: an asm row at a splitK above 1 whose mismatch ratio is above the limit is verified when this column holds a figure from 0 to 0.01, and the column is left out of the rows handed over"

  upstream_pr_repos:
    kind: names
    project: SGLang, vLLM, aiter, PyTorch
    reason: >-
      The GitHub repositories whose pull requests a specialist may search for a change that looks relevant to the
      measurement in hand (the upstream_pr_search analysis tool). The search runs in the toolbox host process and, when
      the host holds a GitHub token, with it, so the tool answers only for these repositories and never for one a caller
      names; a repository that moved or was renamed upstream is changed here, by publishing a pack.
    names:
      sglang: sgl-project/sglang
      vllm: vllm-project/vllm
      aiter: ROCm/aiter
      pytorch: pytorch/pytorch
    examples:
      - "hyperloom_multibranch.toolbox.tools.upstream_pr: a search names a repository by its GitHub URL, and is refused unless the owner/name of that URL is one of these"

  component_layout_sglang:
    kind: component_layout
    project: sglang
    reason: >-
      SGLang's package is python/sglang in its repository and lies over the installed sglang.
    import_name: sglang
    sections:
      - {prefix: python/sglang, base: package}
    refuse: []
    generated: []
    examples:
      place:
        - "python/sglang/srt/server_args.py -> package:srt/server_args.py"
      refuse:
        - "python/sgl-kernel/setup.py"
        - "docs/index.md"

  component_layout_vllm:
    kind: component_layout
    project: vllm
    reason: >-
      vLLM's package is vllm at the top of its repository and lies over the installed vllm. Its operators are native
      extensions beside the package (vllm/_C, vllm/_moe_C and vllm/_rocm_C on ROCm, *.so), which its setup.py builds with
      CMake from csrc at the top of the repository: a Python patch cannot change them, so a patch that names a native file
      is refused with its path, and the build definition (CMakeLists.txt, setup.py, cmake/) with it.
    import_name: vllm
    sections:
      - {prefix: vllm, base: package}
    refuse:
      - "*.so"
      - "*.so.*"
      - "*.a"
      - "*.o"
      - "*.bc"
      - "*.co"
      - "*.hsaco"
      - "*.cubin"
      - "*.pyd"
      - "*.c"
      - "*.cc"
      - "*.cpp"
      - "*.cxx"
      - "*.h"
      - "*.hh"
      - "*.hpp"
      - "*.cu"
      - "*.cuh"
      - "*.hip"
      - "*.inc"
      - "CMakeLists.txt"
      - "*.cmake"
      - "setup.py"
      - "pyproject.toml"
      - "Makefile"
    generated: []
    examples:
      place:
        - "vllm/envs.py -> package:envs.py"
      refuse:
        - "csrc/cache_kernels.cu"
        - "csrc/rocm/attention.cu"
        - "csrc/ops.h"
        - "vllm/_C.abi3.so"
        - "CMakeLists.txt"
        - "setup.py"
        - "cmake/utils.cmake"

  component_layout_aiter:
    kind: component_layout
    project: aiter
    reason: >-
      aiter's Python package is aiter at the top of its repository and lies over the installed aiter. A compiled module or a
      code object is a build product, which a text patch cannot make; the runtime writes its builds into the directories listed in
      generated. csrc and hsa lie over aiter's meta directory (AITER_META_DIR), where aiter builds its modules from and reads
      its code generators and tables: a text change there is measured by building the modules it touches again, while the
      code objects under hsa (*.co) stay as they are.
    import_name: aiter
    sections:
      - {prefix: aiter, base: package}
      - {prefix: csrc, base: meta, into: csrc}
      - {prefix: hsa, base: meta, into: hsa}
    refuse:
      - "*.so"
      - "*.so.*"
      - "*.a"
      - "*.o"
      - "*.co"
      - "*.hsaco"
      - "*.cubin"
    generated:
      - jit/build
      - jit/hyperloom_jit_backup
      - jit/flydsl_cache
    examples:
      place:
        - "aiter/ops/mha.py -> package:ops/mha.py"
        - "csrc/kernels/activation_kernels.cu -> meta:csrc/kernels/activation_kernels.cu"
        - "hsa/gfx942/pa/pa_bf16.csv -> meta:hsa/gfx942/pa/pa_bf16.csv"
      refuse:
        - "aiter/jit/module_activation.so"
        - "hsa/gfx942/pa/pa_bf16.co"
        - "3rdparty/composable_kernel/include/ck/ck.hpp"

  component_layout_atom:
    kind: component_layout
    project: atom
    reason: >-
      ATOM's package is atom at the top of its repository and lies over the installed atom.
    import_name: atom
    sections:
      - {prefix: atom, base: package}
    refuse: []
    generated: []
    examples:
