[extend]
useDefault = true

[[allowlists]]
description = "Known non-secret Hyperloom identifiers"
regexTarget = "line"
regexes = [
  '''inferenceX_key:\s+[A-Za-z0-9._-]+''',
  '''llm_key\s*=\s*"approved-msg_abc123"''',
  '''"per_token":\s*"a8w8_untuned_gemm\.csv"''',
  # actions/cache key/restore-keys for the CI test-duration DB in
  # tests-coverage.yml -- a cache identifier, not a secret (flagged by the
  # generic-api-key rule on the ``key:`` line).
  '''(key|restore-keys):\s*test-durations-''',
]

[[allowlists]]
description = "GEMM tuner script keys -- an aiter script name, not a credential"
# ``script_key="a8w8_bpreshuffle"`` selects which aiter tuning script to run;
# the generic-api-key rule sees ``key="<long token>"``. Scoped to the tuner
# package and to a snake_case literal so it cannot cover a real key elsewhere.
paths = ['''^src/kernelforge/workflows/gemm_tune/tuners/.*\.py$''']
regexTarget = "line"
regexes = ['''script_key=(SPLITK_TRIAL_SCRIPT_KEY|"[a-z][a-z0-9_]*")''']

[[allowlists]]
description = "Redaction test fixtures -- the credentials a test asserts are removed"
# test_summarize_tool_input_redacts_bearer_and_assignment feeds these to
# _summarize_tool_input and asserts they come back redacted, so they have to be
# literals in the source for the test to mean anything.
#
# Matched on content alone rather than scoped by path: `paths` and `regexes` in
# one allowlist are OR'd, so naming the file would exempt the whole file and let
# a real credential committed there pass. These are the two fake strings and
# nothing else.
regexTarget = "line"
regexes = [
  '''Authorization: Bearer secret-token-value''',
  '''OPENAI_API_KEY=sk-live-abcdef''',
]

[[allowlists]]
description = "Hosted sandbox fixtures and a type annotation -- no credential"
# The generic-api-key rule reads ``key: <Type>`` and ``KEY...= "<token>"`` as an
# assignment. These are a dataclass field's type (the Ed25519 signer), fake
# sequential sandbox keys in tests, and an E2B sandbox id quoted in an error
# message. Matched on the exact line content, not by path, for the reason given
# in the allowlist above.
regexTarget = "line"
regexes = [
  '''^\s*key: Ed25519PrivateKey = field\(repr=False\)$''',
  '''KEY_MEASUREMENT = "e2b_measurement_key_0123456789"''',
  '''"idempotency_key_spent: sbx-f7f56db77ec7244ae34d9886d2ed9dde"''',
  '''"HYPERLOOM_SANDBOX_KEY_MEASUREMENT": "m-key-0123456789"''',
]
