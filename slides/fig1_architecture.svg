<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="870" viewBox="0 0 1400 870" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="0" stdDeviation="0" flood-color="#000" flood-opacity="0"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#475569"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#3b82f6"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#ea580c"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#16a34a"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="870" fill="#0f172a"/>

  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700">Workload Optimization: Iterative Closed-Loop Architecture</text>
  <text x="700" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">Agent-driven optimization with MCP tool integrations (TraceLens Jarvis + GEAK / Claude / OpenAI)</text>

  <!-- ============================================================ -->
  <!-- ROW 1: SETUP PHASE (horizontal, top)                         -->
  <!-- ============================================================ -->
  <rect x="50" y="95" width="1060" height="80" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <text x="70" y="118" fill="#64748b" font-size="10" font-weight="600">SETUP PHASE</text>

  <!-- Workload -->
  <rect x="70" y="124" width="120" height="36" rx="8" fill="#7c3aed" filter="url(#sh)"/>
  <text x="130" y="147" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Workload</text>

  <!-- Arrow -->
  <line x1="190" y1="142" x2="220" y2="142" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Understand -->
  <rect x="220" y="124" width="150" height="42" rx="8" fill="#334155" filter="url(#sh)"/>
  <text x="295" y="142" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">1. Understand Stack</text>
  <text x="295" y="157" text-anchor="middle" fill="#94a3b8" font-size="8">Config + CLI + Launch</text>

  <line x1="370" y1="142" x2="400" y2="142" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Baseline -->
  <rect x="400" y="118" width="150" height="48" rx="8" fill="#334155" filter="url(#sh)"/>
  <text x="475" y="135" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">2. Baseline Run</text>
  <text x="475" y="148" text-anchor="middle" fill="#94a3b8" font-size="8">Run training + benchmark</text>
  <text x="475" y="161" text-anchor="middle" fill="#4ade80" font-size="8" font-weight="600">Collect gold-standard I/O</text>

  <line x1="550" y1="142" x2="580" y2="142" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Profile -->
  <rect x="580" y="118" width="150" height="48" rx="8" fill="#334155" filter="url(#sh)"/>
  <text x="655" y="135" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">3. Profile</text>
  <text x="655" y="148" text-anchor="middle" fill="#94a3b8" font-size="8">torch.profiler trace</text>
  <text x="655" y="161" text-anchor="middle" fill="#4ade80" font-size="8" font-weight="600">Record kernel shapes + ref data</text>

  <line x1="730" y1="142" x2="760" y2="142" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>

  <!-- TraceLens Jarvis -->
  <rect x="760" y="110" width="160" height="56" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="2" filter="url(#sh)"/>
  <text x="780" y="128" fill="#3b82f6" font-size="8" font-weight="700">MCP SERVER</text>
  <text x="840" y="142" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">TraceLens Jarvis</text>
  <text x="840" y="158" text-anchor="middle" fill="#60a5fa" font-size="8">run_full_standalone_analysis</text>

  <!-- Jarvis -> Magpie call -->
  <line x1="920" y1="138" x2="940" y2="138" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>

  <!-- Magpie -->
  <rect x="940" y="110" width="160" height="56" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="2" filter="url(#sh)"/>
  <text x="960" y="128" fill="#3b82f6" font-size="8" font-weight="700">MCP SERVER</text>
  <text x="1020" y="142" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">Magpie</text>

  <!-- Gold-standard data flow: Profile -> Correctness Gate -->
  <path d="M 655 156 L 655 170 L 1380 170 L 1380 540 L 1335 540" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#ag)"/>
  <text x="1385" y="360" fill="#4ade80" font-size="9" font-weight="600" transform="rotate(90 1385 360)" text-anchor="middle">gold-standard tensor I/O for correctness</text>

  <!-- ============================================================ -->
  <!-- ROW 2: TRACELENS OUTPUT -> GEAK DECISION                     -->
  <!-- ============================================================ -->

  <!-- TraceLens output arrow down -->
  <line x1="840" y1="166" x2="840" y2="210" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>

  <!-- Kernel Breakdown box -->
  <rect x="730" y="210" width="220" height="48" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1" filter="url(#sh)"/>
  <text x="840" y="230" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">Kernel Breakdown + Roofline</text>
  <text x="840" y="248" text-anchor="middle" fill="#60a5fa" font-size="9">Top-20 kernels by GPU time %</text>

  <!-- Arrow from breakdown -> GEAK decision -->
  <line x1="840" y1="258" x2="840" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Arrow from breakdown -> optimization loop (left) -->
  <line x1="730" y1="234" x2="540" y2="234" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="540" y1="234" x2="540" y2="430" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ab)"/>
  <text x="555" y="340" fill="#60a5fa" font-size="8">informs</text>
  <text x="555" y="350" fill="#60a5fa" font-size="8">THINK step</text>

  <!-- GEAK Decision diamond -->
  <polygon points="840,300 910,340 840,380 770,340" fill="#422006" stroke="#f59e0b" stroke-width="2" filter="url(#sh)"/>
  <text x="840" y="336" text-anchor="middle" fill="#fef3c7" font-size="10" font-weight="600">Hot custom</text>
  <text x="840" y="349" text-anchor="middle" fill="#fef3c7" font-size="10" font-weight="600">kernel?</text>

  <!-- "No" path: left to optimization loop -->
  <line x1="770" y1="340" x2="680" y2="340" stroke="#475569" stroke-width="2"/>
  <line x1="680" y1="340" x2="680" y2="430" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="710" y="335" fill="#94a3b8" font-size="10" font-weight="600">No</text>

  <!-- "Yes" path: right to GEAK -->
  <line x1="910" y1="340" x2="1020" y2="340" stroke="#ea580c" stroke-width="2" marker-end="url(#ao)"/>
  <text x="950" y="332" fill="#fb923c" font-size="10" font-weight="600">Yes</text>

  <!-- ============================================================ -->
  <!-- RIGHT COLUMN: KERNEL OPTIMIZATION (configurable backend)     -->
  <!-- ============================================================ -->
  <rect x="1020" y="190" width="340" height="300" rx="12" fill="#1a0f08" stroke="#ea580c" stroke-width="2" stroke-dasharray="8,4" filter="url(#sh)"/>
  <text x="1190" y="213" text-anchor="middle" fill="#fb923c" font-size="14" font-weight="700">Kernel Optimization</text>
  <text x="1190" y="229" text-anchor="middle" fill="#94a3b8" font-size="9">Async via MCP (10-30 min, runs in parallel)</text>

  <!-- Backend selector -->
  <text x="1048" y="250" fill="#94a3b8" font-size="8" font-weight="600">BACKEND:</text>
  <rect x="1098" y="239" width="78" height="18" rx="4" fill="#422006" stroke="#ea580c" stroke-width="1.5"/>
  <text x="1137" y="252" text-anchor="middle" fill="#fed7aa" font-size="9" font-weight="700">GEAK</text>
  <rect x="1184" y="239" width="78" height="18" rx="4" fill="#1c1917" stroke="#737373" stroke-width="1"/>
  <text x="1223" y="252" text-anchor="middle" fill="#d4d4d4" font-size="9" font-weight="600">Claude</text>
  <rect x="1270" y="239" width="78" height="18" rx="4" fill="#1c1917" stroke="#737373" stroke-width="1"/>
  <text x="1309" y="252" text-anchor="middle" fill="#d4d4d4" font-size="9" font-weight="600">OpenAI</text>

  <!-- Step 1 -->
  <rect x="1045" y="268" width="290" height="32" rx="6" fill="#422006" stroke="#ea580c" stroke-width="1"/>
  <text x="1190" y="288" text-anchor="middle" fill="#fed7aa" font-size="10">1. Extract kernel source + shapes</text>

  <!-- Step 2 -->
  <rect x="1045" y="308" width="290" height="36" rx="6" fill="#422006" stroke="#ea580c" stroke-width="1"/>
  <text x="1190" y="323" text-anchor="middle" fill="#fed7aa" font-size="10" font-weight="600">2. Submit optimization task via MCP</text>
  <text x="1190" y="336" text-anchor="middle" fill="#a16207" font-size="8">Backend rewrites kernel on GPU / cloud</text>

  <!-- Step 3 -->
  <rect x="1045" y="352" width="290" height="32" rx="6" fill="#422006" stroke="#ea580c" stroke-width="1"/>
  <text x="1190" y="372" text-anchor="middle" fill="#fed7aa" font-size="10">3. Poll for task completion</text>

  <!-- Step 4 -->
  <rect x="1045" y="392" width="290" height="32" rx="6" fill="#422006" stroke="#ea580c" stroke-width="1"/>
  <text x="1190" y="412" text-anchor="middle" fill="#fed7aa" font-size="10">4. Download optimized kernel</text>

  <!-- Internal arrows between steps -->
  <line x1="1190" y1="300" x2="1190" y2="308" stroke="#ea580c" stroke-width="1.5" marker-end="url(#ao)"/>
  <line x1="1190" y1="344" x2="1190" y2="352" stroke="#ea580c" stroke-width="1.5" marker-end="url(#ao)"/>
  <line x1="1190" y1="384" x2="1190" y2="392" stroke="#ea580c" stroke-width="1.5" marker-end="url(#ao)"/>

  <!-- Arrow from box down to Correctness Gate -->
  <line x1="1190" y1="424" x2="1190" y2="500" stroke="#ea580c" stroke-width="2" marker-end="url(#ao)"/>

  <!-- Correctness Gate (OUTSIDE the orange GEAK box) -->
  <rect x="1045" y="500" width="290" height="80" rx="8" fill="#052e16" stroke="#16a34a" stroke-width="2" filter="url(#sh)"/>
  <text x="1190" y="519" text-anchor="middle" fill="#86efac" font-size="11" font-weight="700">5. Correctness Gate</text>
  <text x="1190" y="534" text-anchor="middle" fill="#4ade80" font-size="9">Uses gold-standard I/O from profile stage</text>
  <text x="1190" y="549" text-anchor="middle" fill="#4ade80" font-size="9">torch.allclose(orig, optimized, atol=1e-2)</text>
  <text x="1190" y="564" text-anchor="middle" fill="#4ade80" font-size="9">Micro-benchmark: kernel speedup check</text>

  <!-- Arrow from Correctness Gate left to optimization loop -->
  <line x1="1190" y1="580" x2="1190" y2="600" stroke="#16a34a" stroke-width="2"/>
  <line x1="1190" y1="600" x2="750" y2="600" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="970" y="595" text-anchor="middle" fill="#86efac" font-size="10" font-weight="600">Passes gate - enters loop as attempt</text>

  <!-- ============================================================ -->
  <!-- CENTER: OPTIMIZATION LOOP                                     -->
  <!-- ============================================================ -->
  <rect x="70" y="430" width="680" height="190" rx="14" fill="#0c1929" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
  <text x="410" y="458" text-anchor="middle" fill="#60a5fa" font-size="16" font-weight="700">Optimization Loop<tspan fill="#94a3b8" font-size="10" baseline-shift="super">*</tspan></text>
  <text x="410" y="474" text-anchor="middle" fill="#475569" font-size="9">one change at a time - config overrides, code patches, env vars, or optimized kernel</text>

  <!-- THINK -->
  <rect x="100" y="490" width="120" height="46" rx="8" fill="#1e40af" filter="url(#sh)"/>
  <text x="160" y="512" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">THINK</text>
  <text x="160" y="527" text-anchor="middle" fill="#bfdbfe" font-size="9">Pick 1 idea</text>

  <line x1="220" y1="513" x2="255" y2="513" stroke="#60a5fa" stroke-width="2" marker-end="url(#ab)"/>

  <!-- TRY -->
  <rect x="255" y="490" width="120" height="46" rx="8" fill="#1e40af" filter="url(#sh)"/>
  <text x="315" y="512" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">TRY</text>
  <text x="315" y="527" text-anchor="middle" fill="#bfdbfe" font-size="9">Run torchrun</text>

  <line x1="375" y1="513" x2="410" y2="513" stroke="#60a5fa" stroke-width="2" marker-end="url(#ab)"/>

  <!-- MEASURE -->
  <rect x="410" y="490" width="120" height="46" rx="8" fill="#1e40af" filter="url(#sh)"/>
  <text x="470" y="512" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">MEASURE</text>
  <text x="470" y="527" text-anchor="middle" fill="#bfdbfe" font-size="9">ms/iter (6-10)</text>

  <line x1="530" y1="513" x2="565" y2="513" stroke="#60a5fa" stroke-width="2" marker-end="url(#ab)"/>

  <!-- DECIDE -->
  <rect x="565" y="490" width="120" height="46" rx="8" fill="#1e40af" filter="url(#sh)"/>
  <text x="625" y="512" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">DECIDE</text>
  <text x="625" y="527" text-anchor="middle" fill="#bfdbfe" font-size="9">Keep / Revert</text>

  <!-- Loop-back arrow (below the boxes, clean U-shape) -->
  <path d="M 625 536 L 625 575 L 160 575 L 160 536" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#ab)"/>
  <text x="393" y="592" text-anchor="middle" fill="#3b82f6" font-size="9">repeat until stopping criteria met</text>

  <!-- ============================================================ -->
  <!-- BOTTOM ROW: OUTPUTS (3 boxes)                                 -->
  <!-- ============================================================ -->

  <!-- Stopping Criteria -->
  <rect x="70" y="680" width="360" height="110" rx="10" fill="#1c1917" stroke="#dc2626" stroke-width="1.5" filter="url(#sh)"/>
  <text x="250" y="705" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">Stopping Criteria (each attempt)</text>
  <text x="90" y="728" fill="#f87171" font-size="10">1. Plateau: last 5 under 0.5% gain</text>
  <text x="90" y="748" fill="#f87171" font-size="10">2. Two or more crashes</text>
  <text x="90" y="768" fill="#f87171" font-size="10">3. Three consecutive discards</text>
  <text x="310" y="728" fill="#f87171" font-size="10">4. Roofline from Jarvis</text>

  <!-- Arrow from loop to stopping -->
  <line x1="250" y1="620" x2="250" y2="680" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Final Report -->
  <rect x="480" y="680" width="260" height="110" rx="10" fill="#052e16" stroke="#16a34a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="705" text-anchor="middle" fill="#86efac" font-size="12" font-weight="700">Final Report</text>
  <text x="500" y="725" fill="#4ade80" font-size="10">Re-profile optimized config</text>
  <text x="500" y="742" fill="#60a5fa" font-size="10">TraceLens MCP: baseline vs optimized</text>
  <text x="500" y="759" fill="#4ade80" font-size="10">results.tsv + optimization_report.md</text>
  <text x="500" y="776" fill="#4ade80" font-size="10">Kernel profile comparison</text>

  <!-- Arrow from loop to report -->
  <line x1="610" y1="620" x2="610" y2="680" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="625" y="655" fill="#4ade80" font-size="9">stop</text>

  <!-- Knowledge Base -->
  <rect x="790" y="680" width="300" height="110" rx="10" fill="#1a1523" stroke="#a855f7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="940" y="705" text-anchor="middle" fill="#d8b4fe" font-size="12" font-weight="700">Growing Knowledge Base</text>
  <text x="810" y="728" fill="#c4b5fd" font-size="10">Config override priority (validated %)</text>
  <text x="810" y="745" fill="#c4b5fd" font-size="10">What to avoid (crash/regression log)</text>
  <text x="810" y="762" fill="#c4b5fd" font-size="10">Kernel name guide + backend lessons</text>

  <!-- KB feedback: DECIDE deposits lessons -->
  <path d="M 700 520 L 750 520 L 750 640 L 940 640 L 940 680" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#ap)"/>
  <text x="850" y="635" fill="#a855f7" font-size="9">learns from results</text>

  <!-- KB informs THINK: route along LEFT edge, avoiding all bottom boxes -->
  <path d="M 790 760 L 760 760 L 760 810 L 45 810 L 45 513 L 100 513" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#ap)"/>
  <text x="400" y="826" text-anchor="middle" fill="#a855f7" font-size="9">informs next run's decisions</text>

  <!-- ============================================================ -->
  <!-- LEGEND (bottom right)                                         -->
  <!-- ============================================================ -->
  <rect x="1140" y="615" width="220" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="1250" y="637" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">Legend</text>
  <line x1="1155" y1="653" x2="1195" y2="653" stroke="#3b82f6" stroke-width="2"/>
  <text x="1205" y="657" fill="#94a3b8" font-size="10">TraceLens MCP</text>
  <line x1="1155" y1="673" x2="1195" y2="673" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="1205" y="677" fill="#94a3b8" font-size="10">Kernel opt. MCP (async)</text>
  <line x1="1155" y1="693" x2="1195" y2="693" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="1205" y="697" fill="#94a3b8" font-size="10">Knowledge feedback</text>
  <rect x="1155" y="707" width="40" height="12" rx="3" fill="#052e16" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1205" y="717" fill="#94a3b8" font-size="10">Correctness gate</text>

  <!-- ============================================================ -->
  <!-- AGENT SKILLS (below legend)                                   -->
  <!-- ============================================================ -->
  <rect x="1140" y="733" width="220" height="88" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="1250" y="753" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">Agent Skills (4)</text>
  <text x="1155" y="772" fill="#94a3b8" font-size="9">1. Optimization loop + orchestration</text>
  <text x="1155" y="788" fill="#94a3b8" font-size="9">2. TraceLens Jarvis</text>
  <text x="1155" y="804" fill="#94a3b8" font-size="9">3. Magpie</text>
  <text x="1155" y="820" fill="#94a3b8" font-size="9">4. Kernel Optimization (GEAK / Claude / OpenAI)</text>

  <!-- ============================================================ -->
  <!-- FOOTNOTE: autoresearch reference (right-aligned)              -->
  <!-- ============================================================ -->
  <text x="1360" y="845" text-anchor="end" fill="#64748b" font-size="9">* Optimization loop inspired by <tspan fill="#60a5fa" text-decoration="underline">github.com/karpathy/autoresearch</tspan></text>
  <text x="1360" y="861" text-anchor="end" fill="#64748b" font-size="9">Adapted and scaled for multi-GPU jobs, optimizing for throughput + accuracy across training and inference.</text>
</svg>
