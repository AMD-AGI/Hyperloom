<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#475569"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#16a34a"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#dc2626"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="1200" height="880" fill="#0f172a"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700">GEAK Decision Process: Should This Kernel Be Optimized?</text>
  <text x="600" y="60" text-anchor="middle" fill="#94a3b8" font-size="13">Three-stage filter applied to each kernel from the TraceLens profile</text>

  <!-- ============================================================ -->
  <!-- INPUT                                                         -->
  <!-- ============================================================ -->
  <rect x="430" y="82" width="340" height="42" rx="10" fill="#7c3aed" filter="url(#sh)"/>
  <text x="600" y="108" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Top-20 GPU Kernels from Profile</text>

  <line x1="600" y1="124" x2="600" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- ============================================================ -->
  <!-- STAGE 1: TYPE CLASSIFICATION                                  -->
  <!-- ============================================================ -->
  <rect x="60" y="160" width="1080" height="260" rx="12" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="600" y="188" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700">Stage 1: What type of kernel is it?</text>
  <text x="600" y="206" text-anchor="middle" fill="#64748b" font-size="11">Classify by name pattern from profiler trace</text>

  <!-- Row 1: SKIP kernels (red) -->
  <text x="90" y="236" fill="#dc2626" font-size="11" font-weight="700">SKIP (vendor-optimized, untouchable):</text>

  <!-- Cijk -->
  <rect x="90" y="248" width="230" height="60" rx="8" fill="#1c0a0a" stroke="#dc2626" stroke-width="1.5" filter="url(#sh)"/>
  <text x="205" y="268" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">Cijk_* (hipBLASLt)</text>
  <text x="205" y="284" text-anchor="middle" fill="#f87171" font-size="9">Vendor BLAS - hand-tuned MFMA</text>
  <text x="205" y="297" text-anchor="middle" fill="#f87171" font-size="9">tile schedules, 60-70% of GPU time</text>

  <!-- aiter -->
  <rect x="340" y="248" width="230" height="60" rx="8" fill="#1c0a0a" stroke="#dc2626" stroke-width="1.5" filter="url(#sh)"/>
  <text x="455" y="268" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">aiter::fmha_v3_*</text>
  <text x="455" y="284" text-anchor="middle" fill="#f87171" font-size="9">Vendor attention - already</text>
  <text x="455" y="297" text-anchor="middle" fill="#f87171" font-size="9">optimized for gfx950</text>

  <!-- FmhaBwd -->
  <rect x="590" y="248" width="230" height="60" rx="8" fill="#1c0a0a" stroke="#dc2626" stroke-width="1.5" filter="url(#sh)"/>
  <text x="705" y="268" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">FmhaBwdDQDKDV</text>
  <text x="705" y="284" text-anchor="middle" fill="#f87171" font-size="9">Composable Kernel library</text>
  <text x="705" y="297" text-anchor="middle" fill="#f87171" font-size="9">Switch backend instead</text>

  <!-- Row 2: CANDIDATE kernels (green) -->
  <text x="90" y="336" fill="#16a34a" font-size="11" font-weight="700">CANDIDATE (has modifiable source code):</text>

  <!-- Triton -->
  <rect x="90" y="348" width="230" height="60" rx="8" fill="#021a0a" stroke="#16a34a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="205" y="368" text-anchor="middle" fill="#86efac" font-size="12" font-weight="700">triton_* / _permute_*</text>
  <text x="205" y="384" text-anchor="middle" fill="#4ade80" font-size="9">Triton kernels - Python source</text>
  <text x="205" y="397" text-anchor="middle" fill="#4ade80" font-size="9">@triton.jit, GEAK can rewrite</text>

  <!-- Custom HIP -->
  <rect x="340" y="348" width="230" height="60" rx="8" fill="#021a0a" stroke="#16a34a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="455" y="368" text-anchor="middle" fill="#86efac" font-size="12" font-weight="700">Custom __global__</text>
  <text x="455" y="384" text-anchor="middle" fill="#4ade80" font-size="9">Custom HIP/CUDA kernels</text>
  <text x="455" y="397" text-anchor="middle" fill="#4ade80" font-size="9">Primary GEAK target</text>

  <!-- Elementwise (yellow - try torch.compile first) -->
  <rect x="590" y="348" width="230" height="60" rx="8" fill="#1a1200" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="705" y="368" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="700">vectorized_elementwise</text>
  <text x="705" y="384" text-anchor="middle" fill="#fcd34d" font-size="9">Try torch.compile fusion first</text>
  <text x="705" y="397" text-anchor="middle" fill="#fcd34d" font-size="9">GEAK only if still hot after</text>

  <!-- Red X for skipped, green check for candidates -->
  <text x="855" y="285" fill="#dc2626" font-size="20">&#x2717;</text>
  <text x="855" y="385" fill="#16a34a" font-size="20">&#x2713;</text>

  <!-- ============================================================ -->
  <!-- Arrow: Stage 1 -> Stage 2                                     -->
  <!-- ============================================================ -->
  <line x1="600" y1="420" x2="600" y2="465" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="615" y="448" fill="#4ade80" font-size="10">Candidates only</text>

  <!-- ============================================================ -->
  <!-- STAGE 2: SIGNIFICANCE THRESHOLD                               -->
  <!-- ============================================================ -->
  <rect x="250" y="465" width="700" height="80" rx="12" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="600" y="490" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700">Stage 2: Is it significant enough?</text>

  <!-- Two check boxes side by side -->
  <rect x="290" y="502" width="260" height="32" rx="6" fill="#052e16" stroke="#16a34a" stroke-width="1"/>
  <text x="420" y="523" text-anchor="middle" fill="#86efac" font-size="11">In the top-5 by total GPU time?</text>

  <text x="575" y="523" fill="#64748b" font-size="14" font-weight="700">AND</text>

  <rect x="610" y="502" width="300" height="32" rx="6" fill="#052e16" stroke="#16a34a" stroke-width="1"/>
  <text x="760" y="523" text-anchor="middle" fill="#86efac" font-size="11">Accounts for more than 3% of GPU time?</text>

  <!-- ============================================================ -->
  <!-- Arrow: Stage 2 -> Stage 3                                     -->
  <!-- ============================================================ -->
  <line x1="600" y1="545" x2="600" y2="585" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>

  <!-- ============================================================ -->
  <!-- STAGE 3: SOURCE AVAILABLE                                     -->
  <!-- ============================================================ -->
  <rect x="300" y="585" width="600" height="70" rx="12" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="600" y="612" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700">Stage 3: Can we find the source code?</text>
  <text x="600" y="632" text-anchor="middle" fill="#94a3b8" font-size="11">Search for @triton.jit definition or __global__ in .hip/.cu files</text>

  <!-- ============================================================ -->
  <!-- TWO OUTCOMES                                                  -->
  <!-- ============================================================ -->

  <!-- YES path -->
  <line x1="600" y1="655" x2="600" y2="700" stroke="#ea580c" stroke-width="2.5" marker-end="url(#ao)"/>

  <rect x="430" y="700" width="340" height="44" rx="10" fill="#7c2d12" stroke="#ea580c" stroke-width="2" filter="url(#sh)"/>
  <text x="600" y="727" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Submit to GEAK MCP</text>

  <!-- Subtext under submit -->
  <text x="600" y="762" text-anchor="middle" fill="#94a3b8" font-size="10">Extract source + shapes + hardware context</text>
  <text x="600" y="776" text-anchor="middle" fill="#94a3b8" font-size="10">geak_create_task + geak_submit_task (async, 10-30 min)</text>

  <!-- NO path from Stage 2 (left side) -->
  <line x1="250" y1="518" x2="180" y2="518" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="180" y1="518" x2="180" y2="700" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="140" y="512" fill="#dc2626" font-size="10" font-weight="600">No</text>

  <!-- NO path from Stage 3 (left side) -->
  <line x1="300" y1="620" x2="180" y2="620" stroke="#dc2626" stroke-width="1.5"/>
  <text x="220" y="614" fill="#dc2626" font-size="10" font-weight="600">No</text>

  <!-- Skip box -->
  <rect x="100" y="700" width="200" height="44" rx="10" fill="#1c0a0a" stroke="#dc2626" stroke-width="1.5" filter="url(#sh)"/>
  <text x="200" y="727" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="700">Skip GEAK</text>

  <text x="200" y="760" text-anchor="middle" fill="#94a3b8" font-size="10">Continue with config overrides</text>
  <text x="200" y="774" text-anchor="middle" fill="#94a3b8" font-size="10">and code patches only</text>

  <!-- ============================================================ -->
  <!-- KNOWLEDGE BOX: GEAK mixed results (bottom)                    -->
  <!-- ============================================================ -->
  <rect x="60" y="800" width="1080" height="65" rx="10" fill="#1c1917" stroke="#78716c" stroke-width="1"/>
  <text x="600" y="822" text-anchor="middle" fill="#d6d3d1" font-size="12" font-weight="700">Knowledge Base: GEAK results are mixed on Triton for AMD CDNA4</text>
  <text x="170" y="842" text-anchor="middle" fill="#a8a29e" font-size="10">SiLU*mul: 2.2x slower</text>
  <text x="390" y="842" text-anchor="middle" fill="#a8a29e" font-size="10">RMSNorm: 1.6x slower</text>
  <text x="700" y="842" text-anchor="middle" fill="#a8a29e" font-size="10">GEAK is better suited for HIP/C++ kernel optimization than Triton block-size tuning</text>
  <text x="1070" y="842" text-anchor="middle" fill="#78716c" font-size="10">Always measure.</text>
</svg>
