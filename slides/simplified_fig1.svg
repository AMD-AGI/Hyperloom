<svg xmlns="http://www.w3.org/2000/svg" width="3300" height="1608" viewBox="0 0 1100 536" font-family="DejaVu Sans, sans-serif" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#475569"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#3b82f6"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#16a34a"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#a855f7"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#ea580c"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="536" fill="#0f172a"/>

  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Workload Optimization: Iterative Closed-Loop Architecture</text>
  <text x="550" y="55" text-anchor="middle" fill="#94a3b8" font-size="12">Agent-driven optimization with MCP tool integrations</text>

  <!-- ============================================================ -->
  <!-- SETUP PHASE                                                   -->
  <!-- ============================================================ -->
  <rect x="170" y="72" width="760" height="82" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <text x="550" y="90" text-anchor="middle" fill="#64748b" font-size="10" font-weight="600">SETUP PHASE</text>

  <rect x="200" y="101" width="110" height="36" rx="8" fill="#7c3aed"/>
  <text x="255" y="124" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Workload</text>

  <line x1="310" y1="119" x2="340" y2="119" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="340" y="101" width="140" height="36" rx="8" fill="#334155"/>
  <text x="410" y="124" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="600">1. Understand Stack</text>

  <line x1="480" y1="119" x2="510" y2="119" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="510" y="101" width="150" height="36" rx="8" fill="#334155"/>
  <text x="585" y="124" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="600">2. Baseline + Accuracy</text>

  <line x1="660" y1="119" x2="690" y2="119" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="690" y="96" width="210" height="46" rx="8" fill="#334155" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="795" y="115" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="600">3. Profile</text>
  <text x="795" y="132" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="600">TraceLens Agent</text>

  <!-- Arrow from setup to loop (tighter gap) -->
  <line x1="550" y1="154" x2="550" y2="179" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- ============================================================ -->
  <!-- MIDDLE ROW: Stopping | Optimization Loop | Final Report       -->
  <!-- ============================================================ -->

  <!-- STOPPING CRITERIA -->
  <rect x="45" y="202" width="220" height="108" rx="10" fill="#1c1917" stroke="#dc2626" stroke-width="1.5"/>
  <text x="155" y="226" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="700">Stopping Criteria</text>
  <text x="62" y="246" fill="#f87171" font-size="9">- Plateau: last 5 &lt; 0.5% gain</text>
  <text x="62" y="262" fill="#f87171" font-size="9">- Two or more crashes</text>
  <text x="62" y="278" fill="#f87171" font-size="9">- Three consecutive discards</text>
  <text x="62" y="294" fill="#f87171" font-size="9">- Roofline ceiling reached</text>

  <line x1="290" y1="256" x2="265" y2="256" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>

  <!-- OPTIMIZATION LOOP -->
  <rect x="290" y="179" width="520" height="155" rx="14" fill="#0c1929" stroke="#2563eb" stroke-width="2"/>
  <text x="550" y="204" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="700">Optimization Loop*</text>
  <text x="550" y="218" text-anchor="middle" fill="#475569" font-size="9">one change at a time - config, code patch, env var, or optimized kernel</text>

  <!-- THINK -->
  <rect x="320" y="232" width="100" height="44" rx="8" fill="#1e40af"/>
  <text x="370" y="252" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">THINK</text>
  <text x="370" y="266" text-anchor="middle" fill="#bfdbfe" font-size="9">Pick 1 idea</text>

  <line x1="420" y1="254" x2="440" y2="254" stroke="#60a5fa" stroke-width="2" marker-end="url(#ab)"/>

  <!-- TRY -->
  <rect x="440" y="232" width="100" height="44" rx="8" fill="#1e40af"/>
  <text x="490" y="252" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">TRY</text>
  <text x="490" y="266" text-anchor="middle" fill="#bfdbfe" font-size="9">Run benchmark</text>

  <line x1="540" y1="254" x2="560" y2="254" stroke="#60a5fa" stroke-width="2" marker-end="url(#ab)"/>

  <!-- MEASURE -->
  <rect x="560" y="232" width="100" height="44" rx="8" fill="#1e40af"/>
  <text x="610" y="252" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">MEASURE</text>
  <text x="610" y="266" text-anchor="middle" fill="#bfdbfe" font-size="9">tok/s, latency</text>

  <line x1="660" y1="254" x2="680" y2="254" stroke="#60a5fa" stroke-width="2" marker-end="url(#ab)"/>

  <!-- DECIDE -->
  <rect x="680" y="232" width="100" height="44" rx="8" fill="#1e40af"/>
  <text x="730" y="252" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">DECIDE</text>
  <text x="730" y="266" text-anchor="middle" fill="#bfdbfe" font-size="9">Keep / Revert</text>

  <!-- Loop-back arrow -->
  <path d="M 730 276 L 730 306 L 370 306 L 370 276" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#ab)"/>
  <text x="550" y="322" text-anchor="middle" fill="#3b82f6" font-size="9">repeat until stopping criteria met</text>

  <!-- FINAL REPORT -->
  <rect x="835" y="202" width="220" height="108" rx="10" fill="#052e16" stroke="#16a34a" stroke-width="1.5"/>
  <text x="945" y="226" text-anchor="middle" fill="#86efac" font-size="11" font-weight="700">Final Report</text>
  <text x="852" y="246" fill="#4ade80" font-size="9">- Re-profile optimized config</text>
  <text x="852" y="262" fill="#60a5fa" font-size="9">- TraceLens: baseline vs optimized</text>
  <text x="852" y="278" fill="#4ade80" font-size="9">- results.tsv + report.md</text>
  <text x="852" y="294" fill="#4ade80" font-size="9">- Kernel profile comparison</text>

  <line x1="810" y1="256" x2="835" y2="256" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="822" y="247" text-anchor="middle" fill="#4ade80" font-size="9">stop</text>

  <!-- ============================================================ -->
  <!-- KERNEL OPTIMIZATION                                           -->
  <!-- ============================================================ -->
  <line x1="550" y1="334" x2="550" y2="354" stroke="#ea580c" stroke-width="2" marker-end="url(#ao)"/>

  <rect x="395" y="354" width="310" height="55" rx="10" fill="#1a0f08" stroke="#ea580c" stroke-width="2"/>
  <text x="550" y="373" text-anchor="middle" fill="#fb923c" font-size="12" font-weight="700">Kernel Optimization</text>

  <rect x="408" y="381" width="86" height="22" rx="5" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="451" y="396" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="600">Claude Code</text>

  <rect x="502" y="381" width="86" height="22" rx="5" fill="#422006" stroke="#ea580c" stroke-width="1.5"/>
  <text x="545" y="396" text-anchor="middle" fill="#fed7aa" font-size="9" font-weight="700">GEAK<tspan font-size="6" dy="-4">†</tspan></text>

  <rect x="596" y="381" width="86" height="22" rx="5" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="639" y="396" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="600">OpenAI Codex</text>

  <!-- ============================================================ -->
  <!-- KNOWLEDGE BASE                                                -->
  <!-- ============================================================ -->
  <rect x="295" y="422" width="510" height="80" rx="10" fill="#1a1523" stroke="#a855f7" stroke-width="1.5"/>
  <text x="550" y="445" text-anchor="middle" fill="#d8b4fe" font-size="11" font-weight="700">Growing Knowledge Base</text>
  <text x="315" y="463" fill="#c4b5fd" font-size="9">- Config override priority (validated %)</text>
  <text x="315" y="479" fill="#c4b5fd" font-size="9">- What to avoid (crash/regression log)</text>
  <text x="315" y="495" fill="#c4b5fd" font-size="9">- Kernel + backend lessons learned</text>

  <!-- "learns" arrow -->
  <path d="M 740 334 L 740 422" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#ap)"/>
  <text x="750" y="382" fill="#a855f7" font-size="9">learns</text>

  <!-- "informs" arrow -->
  <path d="M 360 422 L 360 334" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#ap)"/>
  <text x="342" y="382" fill="#a855f7" font-size="9" text-anchor="end">informs</text>

  <!-- Footnotes -->
  <text x="1060" y="514" text-anchor="end" fill="#64748b" font-size="8">* Loop inspired by github.com/karpathy/autoresearch - adapted for multi-GPU throughput + accuracy optimization</text>
  <text x="1060" y="528" text-anchor="end" fill="#64748b" font-size="8">† GEAK: Generating Efficient AI-Centric Kernels — github.com/AMD-AGI/GEAK</text>
</svg>
