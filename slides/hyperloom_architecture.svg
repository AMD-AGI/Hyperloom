<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#94a3b8"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#3b82f6"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#16a34a"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#f59e0b"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#06b6d4"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#a855f7"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="750" fill="#0f172a"/>

  <!-- Title -->
  <text x="700" y="38" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="700">Hyperloom &#x2014; Autonomous Inference Optimization</text>
  <text x="700" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">End-to-end system that automatically optimizes LLM serving performance on AMD GPUs</text>

  <!-- ============================================================ -->
  <!-- TOP ROW: Three boxes centered                                 -->
  <!-- ============================================================ -->

  <!-- Model Input (centered at x=340) -->
  <rect x="240" y="85" width="200" height="70" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="340" y="113" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Model Input</text>
  <text x="340" y="133" text-anchor="middle" fill="#94a3b8" font-size="11">Any HuggingFace model + vLLM / SGLang</text>

  <line x1="440" y1="120" x2="485" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- TraceLens Agent (centered at x=610) -->
  <rect x="485" y="85" width="250" height="70" rx="12" fill="#0c2337" stroke="#06b6d4" stroke-width="2"/>
  <text x="610" y="113" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="700">TraceLens Agent</text>
  <text x="610" y="133" text-anchor="middle" fill="#67e8f9" font-size="11">GPU roofline profiling + bottleneck identification</text>

  <line x1="735" y1="120" x2="780" y2="120" stroke="#06b6d4" stroke-width="2" marker-end="url(#ac)"/>

  <!-- Kernel Optimization Backends (centered at x=970) -->
  <rect x="780" y="85" width="380" height="70" rx="12" fill="#1a1523" stroke="#7c3aed" stroke-width="2"/>
  <text x="970" y="108" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="700">Kernel Optimization Backends</text>
  <rect x="800" y="120" width="90" height="26" rx="6" fill="#2e1065" stroke="#8b5cf6" stroke-width="1"/>
  <text x="845" y="137" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">GEAK</text>
  <rect x="900" y="120" width="90" height="26" rx="6" fill="#2e1065" stroke="#8b5cf6" stroke-width="1"/>
  <text x="945" y="137" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">Claude</text>
  <rect x="1000" y="120" width="90" height="26" rx="6" fill="#2e1065" stroke="#8b5cf6" stroke-width="1"/>
  <text x="1045" y="137" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">Codex</text>

  <!-- Arrows from top boxes down (stop above ARBOR label, y=207) -->
  <path d="M 340 155 L 340 205" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M 610 155 L 610 205" stroke="#06b6d4" stroke-width="2" fill="none" marker-end="url(#ac)"/>
  <path d="M 970 155 L 970 205" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#ap)"/>

  <!-- ============================================================ -->
  <!-- ARBOR BOUNDING BOX (more space from top)                      -->
  <!-- ============================================================ -->
  <rect x="30" y="220" width="1340" height="370" rx="18" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10,5"/>

  <!-- Arbor label (same font size as other titles = 14) -->
  <rect x="450" y="207" width="500" height="28" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="700" y="225" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="800">ARBOR &#x2014; Self-Evolving Optimization Search</text>
  <text x="700" y="248" text-anchor="middle" fill="#fcd34d" font-size="11">Tree-based cognition layer navigating large search spaces</text>

  <!-- ============================================================ -->
  <!-- ORCHESTRATOR                                                  -->
  <!-- ============================================================ -->
  <rect x="50" y="260" width="410" height="310" rx="14" fill="#0c1929" stroke="#2563eb" stroke-width="2"/>
  <text x="265" y="285" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="700">Orchestrator &#x2014; Search Loop</text>
  <text x="265" y="303" text-anchor="middle" fill="#94a3b8" font-size="11">Scored depth-first search with dynamic re-prioritization</text>

  <!-- POP -->
  <rect x="70" y="320" width="115" height="50" rx="8" fill="#1e40af"/>
  <text x="127" y="342" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">POP</text>
  <text x="127" y="358" text-anchor="middle" fill="#bfdbfe" font-size="10">Best-scored action</text>

  <line x1="185" y1="345" x2="200" y2="345" stroke="#60a5fa" stroke-width="2" marker-end="url(#ab)"/>

  <!-- EXECUTE -->
  <rect x="200" y="320" width="115" height="50" rx="8" fill="#1e40af"/>
  <text x="257" y="342" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">EXECUTE</text>
  <text x="257" y="358" text-anchor="middle" fill="#bfdbfe" font-size="10">Apply optimization</text>

  <line x1="315" y1="345" x2="330" y2="345" stroke="#60a5fa" stroke-width="2" marker-end="url(#ab)"/>

  <!-- MEASURE -->
  <rect x="330" y="320" width="115" height="50" rx="8" fill="#1e40af"/>
  <text x="387" y="342" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">MEASURE</text>
  <text x="387" y="358" text-anchor="middle" fill="#bfdbfe" font-size="10">Benchmark tok/s</text>

  <!-- Arrow down from MEASURE to row 2 -->
  <line x1="387" y1="370" x2="387" y2="395" stroke="#60a5fa" stroke-width="2" marker-end="url(#ab)"/>

  <!-- Row 2: VALIDATE, Keep/Revert, INTROSPECT - same y -->
  <rect x="330" y="395" width="115" height="50" rx="8" fill="#052e16" stroke="#16a34a" stroke-width="1.5"/>
  <text x="387" y="417" text-anchor="middle" fill="#86efac" font-size="12" font-weight="600">VALIDATE</text>
  <text x="387" y="433" text-anchor="middle" fill="#4ade80" font-size="10">Accuracy + regression</text>

  <line x1="330" y1="420" x2="300" y2="420" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- Decision diamond (center y=420) -->
  <polygon points="270,398 300,420 270,442 240,420" fill="#111827" stroke="#eab308" stroke-width="2"/>
  <text x="270" y="417" text-anchor="middle" fill="#fef3c7" font-size="10" font-weight="700">Keep /</text>
  <text x="270" y="430" text-anchor="middle" fill="#fef3c7" font-size="10" font-weight="700">Revert</text>

  <line x1="240" y1="420" x2="210" y2="420" stroke="#eab308" stroke-width="1.5" marker-end="url(#ao)"/>

  <!-- INTROSPECT -->
  <rect x="95" y="395" width="115" height="50" rx="8" fill="#1c1917" stroke="#eab308" stroke-width="1.5"/>
  <text x="152" y="417" text-anchor="middle" fill="#fef3c7" font-size="11" font-weight="600">INTROSPECT</text>
  <text x="152" y="433" text-anchor="middle" fill="#fde68a" font-size="10">Re-score + next</text>

  <!-- Loop arrow: Introspect back up to POP -->
  <path d="M 95 420 L 70 420 L 70 345 L 70 345" stroke="#3b82f6" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#ab)"/>
  <text x="58" y="385" fill="#3b82f6" font-size="9" font-weight="600" transform="rotate(-90 58 385)" text-anchor="middle">loop</text>

  <!-- KB feedback arrow INSIDE yellow box (centered under orchestrator, orch center=255) -->
  <rect x="115" y="510" width="280" height="26" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="255" y="527" text-anchor="middle" fill="#86efac" font-size="10">Priors + pitfalls from KB feed into scoring</text>
  <path d="M 1150 560 L 1150 575 L 255 575 L 255 536" stroke="#16a34a" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#ag)"/>

  <!-- ============================================================ -->
  <!-- DYNAMIC SPECIALISTS                                           -->
  <!-- ============================================================ -->
  <rect x="530" y="260" width="370" height="310" rx="14" fill="#1c0f0a" stroke="#ea580c" stroke-width="2"/>
  <text x="720" y="285" text-anchor="middle" fill="#fb923c" font-size="14" font-weight="700">Dynamic Specialist Agents</text>
  <text x="720" y="303" text-anchor="middle" fill="#fdba74" font-size="11">Created on-the-fly per detected bottleneck</text>

  <!-- Illustration: stack layers with agents spawning -->
  <text x="560" y="328" fill="#a8a29e" font-size="10" font-weight="600">BOTTLENECK DETECTED</text>
  <text x="745" y="328" fill="#fdba74" font-size="10" font-weight="600">AGENT SPAWNED</text>

  <!-- Row 1 -->
  <rect x="545" y="338" width="140" height="28" rx="5" fill="#292524" stroke="#78716c" stroke-width="1"/>
  <text x="615" y="356" text-anchor="middle" fill="#e7e5e4" font-size="10">Attention is slow</text>
  <line x1="685" y1="352" x2="715" y2="352" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#ao)"/>
  <rect x="715" y="338" width="170" height="28" rx="5" fill="#7c2d12" stroke="#f97316" stroke-width="1.5"/>
  <text x="800" y="356" text-anchor="middle" fill="#fed7aa" font-size="10" font-weight="600">Attention Agent</text>

  <!-- Row 2 -->
  <rect x="545" y="374" width="140" height="28" rx="5" fill="#292524" stroke="#78716c" stroke-width="1"/>
  <text x="615" y="392" text-anchor="middle" fill="#e7e5e4" font-size="10">GEMM underutilized</text>
  <line x1="685" y1="388" x2="715" y2="388" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#ao)"/>
  <rect x="715" y="374" width="170" height="28" rx="5" fill="#7c2d12" stroke="#f97316" stroke-width="1.5"/>
  <text x="800" y="392" text-anchor="middle" fill="#fed7aa" font-size="10" font-weight="600">Kernel Tuner</text>

  <!-- Row 3 -->
  <rect x="545" y="410" width="140" height="28" rx="5" fill="#292524" stroke="#78716c" stroke-width="1"/>
  <text x="615" y="428" text-anchor="middle" fill="#e7e5e4" font-size="10">KV cache thrashing</text>
  <line x1="685" y1="424" x2="715" y2="424" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#ao)"/>
  <rect x="715" y="410" width="170" height="28" rx="5" fill="#7c2d12" stroke="#f97316" stroke-width="1.5"/>
  <text x="800" y="428" text-anchor="middle" fill="#fed7aa" font-size="10" font-weight="600">Fusion Specialist</text>

  <!-- Row 4 -->
  <rect x="545" y="446" width="140" height="28" rx="5" fill="#292524" stroke="#78716c" stroke-width="1"/>
  <text x="615" y="464" text-anchor="middle" fill="#e7e5e4" font-size="10">Scheduler stalls</text>
  <line x1="685" y1="460" x2="715" y2="460" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#ao)"/>
  <rect x="715" y="446" width="170" height="28" rx="5" fill="#7c2d12" stroke="#f97316" stroke-width="1.5"/>
  <text x="800" y="464" text-anchor="middle" fill="#fed7aa" font-size="10" font-weight="600">Scheduler Agent</text>

  <!-- Row 5 -->
  <rect x="545" y="482" width="140" height="28" rx="5" fill="#292524" stroke="#78716c" stroke-width="1"/>
  <text x="615" y="500" text-anchor="middle" fill="#e7e5e4" font-size="10">HW queue contention</text>
  <line x1="685" y1="496" x2="715" y2="496" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#ao)"/>
  <rect x="715" y="482" width="170" height="28" rx="5" fill="#7c2d12" stroke="#f97316" stroke-width="1.5"/>
  <text x="800" y="500" text-anchor="middle" fill="#fed7aa" font-size="10" font-weight="600">Systems Agent</text>

  <!-- Dynamic indicator -->
  <text x="720" y="530" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="600">Agents created dynamically &#x2014; not predefined</text>
  <text x="720" y="545" text-anchor="middle" fill="#fdba74" font-size="10">New bottleneck? New specialist spawned on-the-fly.</text>

  <!-- Dispatch arrow (in the gap between orch and specialists) -->
  <line x1="460" y1="370" x2="530" y2="370" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ao)"/>
  <text x="495" y="363" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">dispatch</text>

  <!-- Results arrow back -->
  <line x1="530" y1="500" x2="460" y2="500" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="495" y="516" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="600">results</text>

  <!-- ============================================================ -->
  <!-- KNOWLEDGE BASE                                                -->
  <!-- ============================================================ -->
  <rect x="940" y="260" width="420" height="310" rx="14" fill="#052e16" stroke="#16a34a" stroke-width="2"/>
  <text x="1150" y="285" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="700">Knowledge Base</text>
  <text x="1150" y="303" text-anchor="middle" fill="#86efac" font-size="11">Continual learning across all sessions</text>

  <rect x="955" y="320" width="390" height="55" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="1150" y="342" text-anchor="middle" fill="#bbf7d0" font-size="12" font-weight="600">Every optimization result is stored</text>
  <text x="1150" y="360" text-anchor="middle" fill="#86efac" font-size="11">What worked, what failed, for which architectures</text>

  <rect x="955" y="385" width="390" height="55" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="1150" y="407" text-anchor="middle" fill="#bbf7d0" font-size="12" font-weight="600">Knowledge compounds over time</text>
  <text x="1150" y="425" text-anchor="middle" fill="#86efac" font-size="11">Session N+1 starts smarter than session N</text>

  <rect x="955" y="450" width="390" height="55" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="1150" y="472" text-anchor="middle" fill="#bbf7d0" font-size="12" font-weight="600">Future optimizations run faster</text>
  <text x="1150" y="490" text-anchor="middle" fill="#86efac" font-size="11">Proven strategies prioritized, pitfalls avoided</text>

  <text x="1150" y="530" text-anchor="middle" fill="#86efac" font-size="11">Domains: kernels &#xB7; frameworks &#xB7; compilers &#xB7; fusion &#xB7; systems</text>

  <!-- Arrow: Specialists feed KB (from specialist box edge to KB box edge) -->
  <line x1="900" y1="420" x2="940" y2="420" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="920" y="408" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="600">learn</text>

  <!-- ============================================================ -->
  <!-- SAFETY GATES                                                  -->
  <!-- ============================================================ -->
  <rect x="40" y="630" width="640" height="65" rx="14" fill="#111827" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="657" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="700">Deterministic Safety Gates</text>
  <text x="360" y="677" text-anchor="middle" fill="#86efac" font-size="11">Accuracy &#xB7; Regression &#xB7; Correctness &#x2014; No LLM in the decision, only hard metrics</text>

  <!-- ============================================================ -->
  <!-- OUTPUT                                                        -->
  <!-- ============================================================ -->
  <rect x="720" y="630" width="640" height="65" rx="14" fill="#052e16" stroke="#16a34a" stroke-width="2"/>
  <text x="1040" y="657" text-anchor="middle" fill="#86efac" font-size="14" font-weight="700">Output</text>
  <text x="1040" y="677" text-anchor="middle" fill="#4ade80" font-size="11">Optimized serving configs + kernel patches + CI-ready performance report</text>

  <!-- Arrows from Arbor to bottom -->
  <path d="M 360 590 L 360 630" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <path d="M 1040 590 L 1040 630" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#ag)"/>

  <!-- AMD branding -->
  <text x="1360" y="740" text-anchor="end" fill="#334155" font-size="10">AMD &#xB7; Hyperloom</text>
</svg>
