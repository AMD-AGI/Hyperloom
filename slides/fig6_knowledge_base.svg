<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a855f7"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1100" height="600" fill="url(#bg)"/>

  <text x="550" y="36" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Growing Knowledge Base  -  Institutional Memory for Agents</text>
  <text x="550" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">Each optimization run deposits lessons learned; future runs start smarter</text>

  <!-- ==================== THE FEEDBACK LOOP ==================== -->

  <!-- Optimization Run box -->
  <rect x="60" y="90" width="300" height="140" rx="12" fill="#1e293b" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="115" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700">Optimization Run N</text>
  <text x="80" y="140" fill="#94a3b8" font-size="10">Agent tries ideas, measures ms/iter</text>
  <text x="80" y="158" fill="#94a3b8" font-size="10">Some work, some don't, some crash</text>
  <text x="80" y="180" fill="#93c5fd" font-size="10" font-weight="600">Produces:</text>
  <text x="95" y="198" fill="#60a5fa" font-size="10">results.tsv + optimization_report.md</text>
  <text x="95" y="215" fill="#60a5fa" font-size="10">TraceLens comparison data</text>

  <!-- Arrow: Run → Knowledge Base -->
  <path d="M 360 160 L 470 160" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="415" y="150" fill="#d8b4fe" font-size="10" font-weight="600">deposits</text>
  <text x="415" y="163" fill="#d8b4fe" font-size="10" font-weight="600">lessons</text>

  <!-- Knowledge Base (center, large) -->
  <rect x="470" y="80" width="360" height="400" rx="16" fill="#1a1523" stroke="#a855f7" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="650" y="110" text-anchor="middle" fill="#d8b4fe" font-size="16" font-weight="700">Knowledge Base</text>
  <text x="650" y="128" text-anchor="middle" fill="#94a3b8" font-size="10">Embedded in SKILL.md  -  grows with each run</text>

  <!-- KB Section 1: Priority -->
  <rect x="490" y="145" width="320" height="70" rx="8" fill="#312e81" filter="url(#shadow)"/>
  <text x="500" y="164" fill="#c4b5fd" font-size="11" font-weight="700">Config Override Priority (Validated %)</text>
  <text x="500" y="182" fill="#a5b4fc" font-size="9">1. moe_permute_fusion=true (+1.19%)</text>
  <text x="500" y="196" fill="#a5b4fc" font-size="9">2. gradient_accumulation_fusion (+0.46%)</text>
  <text x="500" y="210" fill="#a5b4fc" font-size="9">3. fused_router_with_aux_score (neutral, free cleanup)</text>

  <!-- KB Section 2: What to Avoid -->
  <rect x="490" y="225" width="320" height="70" rx="8" fill="#4c0519" filter="url(#shadow)"/>
  <text x="500" y="244" fill="#fda4af" font-size="11" font-weight="700">What to Avoid (Crash/Regression Log)</text>
  <text x="500" y="262" fill="#fb7185" font-size="9"> -  turbo_grouped_mlp + wide FFN → regression</text>
  <text x="500" y="276" fill="#fb7185" font-size="9"> -  sink_sliding_window → crash (ValueError)</text>
  <text x="500" y="290" fill="#fb7185" font-size="9"> -  TunableOp + torch.compile → crash (CUDA graphs)</text>

  <!-- KB Section 3: Kernel Guide -->
  <rect x="490" y="305" width="320" height="55" rx="8" fill="#052e16" filter="url(#shadow)"/>
  <text x="500" y="324" fill="#86efac" font-size="11" font-weight="700">Kernel Name Guide</text>
  <text x="500" y="342" fill="#4ade80" font-size="9">Cijk_* = vendor BLAS | aiter::fmha = attention</text>
  <text x="500" y="356" fill="#4ade80" font-size="9">_permute_kernel = fused MoE | NCCL = comms</text>

  <!-- KB Section 4: Backend Lessons -->
  <rect x="490" y="370" width="320" height="50" rx="8" fill="#422006" filter="url(#shadow)"/>
  <text x="500" y="389" fill="#fde68a" font-size="11" font-weight="700">Backend Lessons</text>
  <text x="500" y="406" fill="#fcd34d" font-size="9">aiter deterministic=True → 2.7× slower BWD on gfx950</text>
  <text x="500" y="418" fill="#fcd34d" font-size="9">Triton attn beat aiter v3 for GPT-OSS 20B (64 Q-heads)</text>

  <!-- KB Section 5: GEAK Lessons -->
  <rect x="490" y="430" width="320" height="40" rx="8" fill="#7c2d12" filter="url(#shadow)"/>
  <text x="500" y="449" fill="#fed7aa" font-size="11" font-weight="700">GEAK Lessons</text>
  <text x="500" y="464" fill="#fb923c" font-size="9">Better for HIP/C++ than Triton tuning on CDNA4</text>

  <!-- Arrow: Knowledge Base → Next Run -->
  <path d="M 470 400 L 360 400" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="415" y="390" fill="#93c5fd" font-size="10" font-weight="600">informs</text>
  <text x="415" y="403" fill="#93c5fd" font-size="10" font-weight="600">next run</text>

  <!-- Next optimization run -->
  <rect x="60" y="340" width="300" height="100" rx="12" fill="#1e293b" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="370" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700">Optimization Run N+1</text>
  <text x="80" y="395" fill="#94a3b8" font-size="10">Agent reads knowledge base FIRST</text>
  <text x="80" y="413" fill="#94a3b8" font-size="10">Skips known bad ideas, tries known good ones first</text>
  <text x="80" y="431" fill="#60a5fa" font-size="10" font-weight="600">Faster convergence, fewer wasted attempts</text>

  <!-- Right side: What knowledge accumulation enables -->
  <rect x="870" y="90" width="210" height="390" rx="12" fill="#1c1917" stroke="#78716c" stroke-width="1" filter="url(#shadow)"/>
  <text x="975" y="118" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">What This Enables</text>

  <rect x="885" y="140" width="180" height="48" rx="6" fill="#172554"/>
  <text x="975" y="160" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Transfer Across</text>
  <text x="975" y="176" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Workloads</text>

  <rect x="885" y="198" width="180" height="48" rx="6" fill="#172554"/>
  <text x="975" y="218" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Transfer Across</text>
  <text x="975" y="234" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">GPU Architectures</text>

  <rect x="885" y="256" width="180" height="48" rx="6" fill="#172554"/>
  <text x="975" y="276" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Avoid Repeated</text>
  <text x="975" y="292" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Failures</text>

  <rect x="885" y="314" width="180" height="48" rx="6" fill="#172554"/>
  <text x="975" y="334" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Prioritize High-Impact</text>
  <text x="975" y="350" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Changes First</text>

  <rect x="885" y="372" width="180" height="48" rx="6" fill="#172554"/>
  <text x="975" y="392" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Encode Hardware</text>
  <text x="975" y="408" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Tribal Knowledge</text>

  <!-- Arrow from KB to right side -->
  <line x1="830" y1="280" x2="870" y2="280" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Bottom comparison -->
  <rect x="60" y="500" width="1000" height="80" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="550" y="525" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Contrast with Traditional Approach</text>

  <text x="170" y="555" text-anchor="middle" fill="#dc2626" font-size="11">Without Knowledge Base:</text>
  <text x="170" y="572" text-anchor="middle" fill="#a8a29e" font-size="10">Every run starts from zero</text>

  <text x="550" y="548" text-anchor="middle" fill="#64748b" font-size="20">vs</text>

  <text x="900" y="555" text-anchor="middle" fill="#16a34a" font-size="11">With Growing Knowledge Base:</text>
  <text x="900" y="572" text-anchor="middle" fill="#a8a29e" font-size="10">Each run is smarter than the last</text>
</svg>
