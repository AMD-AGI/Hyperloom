<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1100" height="550" fill="url(#bg)"/>

  <text x="550" y="38" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Stopping Criteria  -  When the Agent Decides to Stop</text>
  <text x="550" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">All 6 checks evaluated after EVERY optimization attempt</text>

  <!-- Central loop icon -->
  <circle cx="550" cy="280" r="55" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="550" y="275" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="700">After each</text>
  <text x="550" y="293" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="700">attempt</text>

  <!-- 1. Plateau (top left) -->
  <rect x="60" y="90" width="280" height="110" rx="12" fill="#1c1917" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="90" width="280" height="28" rx="12" fill="#dc2626"/>
  <rect x="60" y="104" width="280" height="14" fill="#dc2626"/>
  <text x="200" y="110" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">1. DIMINISHING RETURNS</text>
  <text x="80" y="140" fill="#fca5a5" font-size="14" font-weight="700">Last 5 attempts &amp;amp;lt; 0.5%</text>
  <text x="80" y="158" fill="#fca5a5" font-size="14" font-weight="700">total new improvement</text>
  <text x="80" y="180" fill="#a8a29e" font-size="10">Primary signal  -  you're on a plateau</text>
  <!-- line to center -->
  <line x1="340" y1="160" x2="497" y2="260" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 2. Time Budget (top center) -->
  <rect x="410" y="90" width="280" height="110" rx="12" fill="#1c1917" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <rect x="410" y="90" width="280" height="28" rx="12" fill="#ea580c"/>
  <rect x="410" y="104" width="280" height="14" fill="#ea580c"/>
  <text x="550" y="110" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">2. TIME BUDGET</text>
  <text x="430" y="140" fill="#fed7aa" font-size="14" font-weight="700">Wall clock &amp;amp;gt; 60 min</text>
  <text x="430" y="160" fill="#a8a29e" font-size="10">Each distributed training run H 3 - 5 min</text>
  <text x="430" y="178" fill="#a8a29e" font-size="10">~12 - 20 attempts per hour max</text>
  <!-- line to center -->
  <line x1="550" y1="200" x2="550" y2="225" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 3. Crash Budget (top right) -->
  <rect x="760" y="90" width="280" height="110" rx="12" fill="#1c1917" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="760" y="90" width="280" height="28" rx="12" fill="#b45309"/>
  <rect x="760" y="104" width="280" height="14" fill="#b45309"/>
  <text x="900" y="110" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">3. CRASH BUDGET</text>
  <text x="780" y="140" fill="#fde68a" font-size="14" font-weight="700">e 2 crashes total</text>
  <text x="780" y="160" fill="#a8a29e" font-size="10">Environment is likely unstable</text>
  <text x="780" y="178" fill="#a8a29e" font-size="10">Further attempts risky</text>
  <!-- line to center -->
  <line x1="760" y1="160" x2="603" y2="260" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 4. Consecutive Failures (bottom left) -->
  <rect x="60" y="350" width="280" height="110" rx="12" fill="#1c1917" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="350" width="280" height="28" rx="12" fill="#7c3aed"/>
  <rect x="60" y="364" width="280" height="14" fill="#7c3aed"/>
  <text x="200" y="370" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">4. CONSECUTIVE FAILURES</text>
  <text x="80" y="400" fill="#d8b4fe" font-size="14" font-weight="700">3 discards in a row</text>
  <text x="80" y="420" fill="#a8a29e" font-size="10">Exhausted easy ideas at this</text>
  <text x="80" y="438" fill="#a8a29e" font-size="10">level of abstraction</text>
  <!-- line to center -->
  <line x1="340" y1="390" x2="497" y2="300" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 5. Good Enough (bottom center) -->
  <rect x="410" y="350" width="280" height="110" rx="12" fill="#1c1917" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <rect x="410" y="350" width="280" height="28" rx="12" fill="#16a34a"/>
  <rect x="410" y="364" width="280" height="14" fill="#16a34a"/>
  <text x="550" y="370" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">5. GOOD ENOUGH</text>
  <text x="430" y="400" fill="#86efac" font-size="14" font-weight="700">Speedup &amp;amp;gt; 5% (config)</text>
  <text x="430" y="420" fill="#86efac" font-size="14" font-weight="700">Speedup &amp;amp;gt; 10% (code+config)</text>
  <text x="430" y="440" fill="#a8a29e" font-size="10">Strong result  -  report and ship</text>
  <!-- line to center -->
  <line x1="550" y1="350" x2="550" y2="335" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 6. Theoretical Ceiling (bottom right) -->
  <rect x="760" y="350" width="280" height="110" rx="12" fill="#1c1917" stroke="#0ea5e9" stroke-width="2" filter="url(#shadow)"/>
  <rect x="760" y="350" width="280" height="28" rx="12" fill="#0369a1"/>
  <rect x="760" y="364" width="280" height="14" fill="#0369a1"/>
  <text x="900" y="370" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">6. THEORETICAL CEILING</text>
  <text x="780" y="400" fill="#7dd3fc" font-size="14" font-weight="700">GEMMs &amp;amp;gt; 60% + near-</text>
  <text x="780" y="418" fill="#7dd3fc" font-size="14" font-weight="700">optimal vendor BLAS</text>
  <text x="780" y="438" fill="#a8a29e" font-size="10">Captured &amp;amp;gt;50% of non-GEMM headroom</text>
  <text x="780" y="455" fill="#a8a29e" font-size="10">→ Need FP8/arch changes, not config</text>
  <!-- line to center -->
  <line x1="760" y1="390" x2="603" y2="300" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Bottom note -->
  <text x="550" y="510" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">Always write the report even if stopped early  -  partial results are valuable.</text>
  <text x="550" y="530" text-anchor="middle" fill="#94a3b8" font-size="11">GBS (global batch size) must match baseline for every attempt  -  invalid-GBS attempts auto-discard</text>
</svg>
