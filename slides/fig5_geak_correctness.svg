<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arr-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1100" height="580" fill="url(#bg)"/>

  <text x="550" y="36" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">GEAK Correctness Validation Pipeline</text>
  <text x="550" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">Four gates before an AI-optimized kernel enters the training workload</text>

  <!-- ==================== GEAK OUTPUT ==================== -->
  <rect x="40" y="90" width="180" height="55" rx="10" fill="#7c2d12" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="113" text-anchor="middle" fill="#fed7aa" font-size="12" font-weight="700">GEAK Output</text>
  <text x="130" y="130" text-anchor="middle" fill="#fb923c" font-size="9">Optimized kernel code</text>

  <line x1="220" y1="117" x2="280" y2="117" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ==================== GATE 1: COMPILE ==================== -->
  <rect x="280" y="75" width="180" height="90" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="280" y="75" width="180" height="28" rx="12" fill="#92400e"/>
  <rect x="280" y="89" width="180" height="14" fill="#92400e"/>
  <text x="370" y="95" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">GATE 1: Compile</text>
  <text x="300" y="120" fill="#fde68a" font-size="10">Can it import/compile?</text>
  <text x="300" y="136" fill="#a8a29e" font-size="9">Triton: import + @triton.jit</text>
  <text x="300" y="150" fill="#a8a29e" font-size="9">HIP: load_inline()</text>

  <!-- Fail path -->
  <line x1="370" y1="165" x2="370" y2="200" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="305" y="200" width="130" height="30" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
  <text x="370" y="220" text-anchor="middle" fill="#fca5a5" font-size="10">Fix obvious issues</text>
  <text x="370" y="250" text-anchor="middle" fill="#dc2626" font-size="9">If unfixable → log crash, skip</text>

  <!-- Pass path -->
  <line x1="460" y1="117" x2="530" y2="117" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-grn)"/>
  <text x="495" y="110" fill="#4ade80" font-size="9" font-weight="600">PASS</text>

  <!-- ==================== GATE 2: CORRECTNESS ==================== -->
  <rect x="530" y="75" width="220" height="130" rx="12" fill="#1e293b" stroke="#16a34a" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="530" y="75" width="220" height="28" rx="12" fill="#052e16"/>
  <rect x="530" y="89" width="220" height="14" fill="#052e16"/>
  <text x="640" y="95" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">GATE 2: Correctness</text>

  <!-- Code block -->
  <rect x="545" y="115" width="190" height="75" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="555" y="132" fill="#79c0ff" font-size="9" font-family="JetBrains Mono, Consolas, monospace">orig = original_kernel(x)</text>
  <text x="555" y="147" fill="#79c0ff" font-size="9" font-family="JetBrains Mono, Consolas, monospace">geak = geak_kernel(x)</text>
  <text x="555" y="165" fill="#ffa657" font-size="9" font-family="JetBrains Mono, Consolas, monospace">assert torch.allclose(</text>
  <text x="565" y="180" fill="#ffa657" font-size="9" font-family="JetBrains Mono, Consolas, monospace">orig, geak, atol=1e-2)</text>

  <!-- bf16 note -->
  <text x="555" y="196" fill="#4ade80" font-size="8">Relaxed tolerance for bf16 numerics</text>

  <!-- Fail path gate 2 -->
  <line x1="640" y1="205" x2="640" y2="235" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="560" y="235" width="160" height="30" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
  <text x="640" y="255" text-anchor="middle" fill="#fca5a5" font-size="10">REJECT  -  wrong results</text>
  <text x="640" y="282" text-anchor="middle" fill="#dc2626" font-size="9">Log "crash (incorrect)", revert</text>

  <!-- Pass path -->
  <line x1="750" y1="140" x2="820" y2="140" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-grn)"/>
  <text x="785" y="133" fill="#4ade80" font-size="9" font-weight="600">PASS</text>

  <!-- ==================== GATE 3: MICRO-BENCHMARK ==================== -->
  <rect x="820" y="75" width="240" height="160" rx="12" fill="#1e293b" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <rect x="820" y="75" width="240" height="28" rx="12" fill="#1e3a5f"/>
  <rect x="820" y="89" width="240" height="14" fill="#1e3a5f"/>
  <text x="940" y="95" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">GATE 3: Micro-Benchmark</text>

  <text x="840" y="120" fill="#93c5fd" font-size="10" font-weight="600">Isolated kernel timing:</text>

  <rect x="835" y="130" width="210" height="50" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="845" y="147" fill="#79c0ff" font-size="9" font-family="JetBrains Mono, Consolas, monospace">warmup(50 iters)</text>
  <text x="845" y="162" fill="#79c0ff" font-size="9" font-family="JetBrains Mono, Consolas, monospace">time(200 iters) each</text>
  <text x="845" y="177" fill="#ffa657" font-size="9" font-family="JetBrains Mono, Consolas, monospace">print(orig_ms, geak_ms)</text>

  <text x="840" y="200" fill="#93c5fd" font-size="10">Compare: speedup % on this kernel</text>
  <text x="840" y="216" fill="#64748b" font-size="9">If regression → skip integration entirely</text>

  <!-- Fail path gate 3 -->
  <line x1="940" y1="235" x2="940" y2="265" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="860" y="265" width="160" height="30" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
  <text x="940" y="285" text-anchor="middle" fill="#fca5a5" font-size="10">REJECT  -  regression</text>
  <text x="940" y="310" text-anchor="middle" fill="#dc2626" font-size="9">Log "discard (GEAK slower)", skip</text>

  <!-- Pass path down to Gate 4 -->
  <path d="M 940 235 L 940 340 Q 940 350 930 350 L 580 350" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arr-grn)"/>
  <text x="770" y="343" fill="#4ade80" font-size="9" font-weight="600">Kernel faster → integrate</text>

  <!-- ==================== GATE 4: END-TO-END TRAINING ==================== -->
  <rect x="130" y="330" width="450" height="130" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="130" y="330" width="450" height="28" rx="12" fill="#4c1d95"/>
  <rect x="130" y="344" width="450" height="14" fill="#4c1d95"/>
  <text x="355" y="350" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">GATE 4: End-to-End Training Benchmark (THE REAL TEST)</text>

  <text x="150" y="380" fill="#d8b4fe" font-size="11">Patch kernel into training stack → run full torchrun:</text>

  <rect x="150" y="392" width="410" height="35" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="160" y="409" fill="#79c0ff" font-size="9" font-family="JetBrains Mono, Consolas, monospace">torchrun --nproc_per_node=8 -m primus.cli.main train pretrain \</text>
  <text x="170" y="421" fill="#79c0ff" font-size="9" font-family="JetBrains Mono, Consolas, monospace">--config &amp;amp;lt;yaml&amp;amp;gt; &amp;amp;lt;all_kept_overrides&amp;amp;gt;</text>

  <text x="150" y="446" fill="#d8b4fe" font-size="10">Extract ms/iter (iter 6 - 10 avg) " Verify GBS unchanged " Compare to best-so-far</text>

  <!-- Final outcomes -->
  <!-- Keep -->
  <line x1="355" y1="460" x2="200" y2="510" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-grn)"/>
  <rect x="80" y="500" width="240" height="55" rx="10" fill="#052e16" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="523" text-anchor="middle" fill="#86efac" font-size="13" font-weight="700">KEEP</text>
  <text x="200" y="542" text-anchor="middle" fill="#4ade80" font-size="10">ms/iter improved + GBS valid</text>

  <!-- Revert -->
  <line x1="355" y1="460" x2="510" y2="510" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="390" y="500" width="240" height="55" rx="10" fill="#450a0a" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="510" y="523" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="700">REVERT</text>
  <text x="510" y="542" text-anchor="middle" fill="#f87171" font-size="10">No improvement or regression</text>

  <!-- Summary note -->
  <rect x="680" y="370" width="380" height="185" rx="12" fill="#1c1917" stroke="#78716c" stroke-width="1" filter="url(#shadow)"/>
  <text x="870" y="395" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">Why 4 gates?</text>
  <text x="700" y="420" fill="#a8a29e" font-size="10" font-weight="600">GEAK uses an LLM to rewrite kernels.</text>
  <text x="700" y="438" fill="#a8a29e" font-size="10" font-weight="600">LLM-generated code can:</text>
  <text x="710" y="458" fill="#a8a29e" font-size="10">1. Not compile (syntax errors, bad intrinsics)</text>
  <text x="710" y="476" fill="#a8a29e" font-size="10">2. Compile but produce wrong results</text>
  <text x="710" y="494" fill="#a8a29e" font-size="10">3. Be correct but slower (bad tuning)</text>
  <text x="710" y="512" fill="#a8a29e" font-size="10">4. Be faster in isolation but regress e2e</text>
  <text x="700" y="538" fill="#d6d3d1" font-size="10" font-weight="600">Each gate catches a different failure mode.</text>
</svg>
