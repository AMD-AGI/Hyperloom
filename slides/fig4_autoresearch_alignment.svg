<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bg)"/>

  <text x="600" y="36" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Design Philosophy: Aligned with Modern Agent-Driven Research</text>
  <text x="600" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">Same core loop pattern as Karpathy's autoresearch  -  adapted for GPU workload optimization</text>

  <!-- ==================== SHARED PRINCIPLES (center top) ==================== -->
  <rect x="280" y="75" width="640" height="165" rx="14" fill="#1a1a2e" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="100" text-anchor="middle" fill="#d8b4fe" font-size="16" font-weight="700">Shared Core Principles</text>

  <!-- Principle boxes -->
  <rect x="305" y="115" width="175" height="50" rx="8" fill="#312e81"/>
  <text x="392" y="137" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="700">Autonomous Loop</text>
  <text x="392" y="153" text-anchor="middle" fill="#a5b4fc" font-size="9">Agent never pauses to ask</text>

  <rect x="500" y="115" width="175" height="50" rx="8" fill="#312e81"/>
  <text x="587" y="137" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="700">Single Metric</text>
  <text x="587" y="153" text-anchor="middle" fill="#a5b4fc" font-size="9">One number to optimize</text>

  <rect x="695" y="115" width="200" height="50" rx="8" fill="#312e81"/>
  <text x="795" y="137" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="700">Measure → Keep/Revert</text>
  <text x="795" y="153" text-anchor="middle" fill="#a5b4fc" font-size="9">Evidence-based decisions</text>

  <rect x="350" y="178" width="210" height="50" rx="8" fill="#312e81"/>
  <text x="455" y="200" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="700">results.tsv Experiment Log</text>
  <text x="455" y="216" text-anchor="middle" fill="#a5b4fc" font-size="9">Structured record of all attempts</text>

  <rect x="580" y="178" width="210" height="50" rx="8" fill="#312e81"/>
  <text x="685" y="200" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="700">Git-Based Checkpointing</text>
  <text x="685" y="216" text-anchor="middle" fill="#a5b4fc" font-size="9">Branch per experiment run</text>

  <!-- ==================== AUTORESEARCH (left) ==================== -->
  <rect x="40" y="270" width="520" height="380" rx="14" fill="#0c1524" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="296" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="700">autoresearch (Karpathy)</text>
  <text x="300" y="314" text-anchor="middle" fill="#64748b" font-size="10">program.md  -  ~115 lines</text>

  <!-- Loop diagram -->
  <rect x="70" y="335" width="130" height="36" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="135" y="358" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Hack train.py</text>

  <text x="220" y="358" fill="#64748b" font-size="16">→</text>

  <rect x="240" y="335" width="130" height="36" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="305" y="358" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">uv run train.py</text>

  <text x="390" y="358" fill="#64748b" font-size="16">→</text>

  <rect x="410" y="335" width="130" height="36" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="475" y="352" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Check val_bpb</text>
  <text x="475" y="364" text-anchor="middle" fill="#60a5fa" font-size="8">keep / git reset</text>

  <!-- Loop back arrow -->
  <path d="M 475 371 L 475 390 Q 475 398 465 398 L 145 398 Q 135 398 135 390 L 135 371" stroke="#3b82f6" stroke-width="1.5" fill="none"/>
  <polygon points="135,375 130,385 140,385" fill="#3b82f6"/>
  <text x="305" y="412" text-anchor="middle" fill="#3b82f6" font-size="9">forever (never stop until human interrupts)</text>

  <!-- Characteristics -->
  <text x="70" y="445" fill="#e2e8f0" font-size="12" font-weight="600">Characteristics:</text>

  <rect x="70" y="458" width="460" height="28" rx="5" fill="#172554"/>
  <text x="80" y="477" fill="#93c5fd" font-size="10">Metric: val_bpb (lower = better)  "  Single file: train.py</text>

  <rect x="70" y="492" width="460" height="28" rx="5" fill="#172554"/>
  <text x="80" y="511" fill="#93c5fd" font-size="10">No profiling tools  "  No MCP  "  Agent figures out what to try</text>

  <rect x="70" y="526" width="460" height="28" rx="5" fill="#172554"/>
  <text x="80" y="545" fill="#93c5fd" font-size="10">5-min fixed time budget per experiment  "  ~12 experiments/hour</text>

  <rect x="70" y="560" width="460" height="28" rx="5" fill="#172554"/>
  <text x="80" y="579" fill="#93c5fd" font-size="10">Minimal instructions → maximal agent creativity</text>

  <rect x="70" y="594" width="460" height="28" rx="5" fill="#172554"/>
  <text x="80" y="613" fill="#93c5fd" font-size="10">Stopping: NEVER (runs overnight, ~100 experiments while you sleep)</text>

  <!-- ==================== OUR SKILL (right) ==================== -->
  <rect x="600" y="270" width="560" height="380" rx="14" fill="#0c1524" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="880" y="296" text-anchor="middle" fill="#fb923c" font-size="15" font-weight="700">workload-optimization (Ours)</text>
  <text x="880" y="314" text-anchor="middle" fill="#64748b" font-size="10">SKILL.md + GEAK extension  -  ~1600 lines</text>

  <!-- Loop diagram -->
  <rect x="625" y="335" width="100" height="36" rx="6" fill="#422006" stroke="#ea580c" stroke-width="1"/>
  <text x="675" y="358" text-anchor="middle" fill="#fed7aa" font-size="10" font-weight="600">THINK</text>

  <text x="738" y="358" fill="#64748b" font-size="14">→</text>

  <rect x="750" y="335" width="100" height="36" rx="6" fill="#422006" stroke="#ea580c" stroke-width="1"/>
  <text x="800" y="358" text-anchor="middle" fill="#fed7aa" font-size="10" font-weight="600">TRY</text>

  <text x="863" y="358" fill="#64748b" font-size="14">→</text>

  <rect x="875" y="335" width="110" height="36" rx="6" fill="#422006" stroke="#ea580c" stroke-width="1"/>
  <text x="930" y="358" text-anchor="middle" fill="#fed7aa" font-size="10" font-weight="600">MEASURE</text>

  <text x="998" y="358" fill="#64748b" font-size="14">→</text>

  <rect x="1010" y="335" width="110" height="36" rx="6" fill="#422006" stroke="#ea580c" stroke-width="1"/>
  <text x="1065" y="358" text-anchor="middle" fill="#fed7aa" font-size="10" font-weight="600">DECIDE</text>

  <!-- Loop back arrow -->
  <path d="M 1065 371 L 1065 390 Q 1065 398 1055 398 L 685 398 Q 675 398 675 390 L 675 371" stroke="#ea580c" stroke-width="1.5" fill="none"/>
  <polygon points="675,375 670,385 680,385" fill="#ea580c"/>
  <text x="870" y="412" text-anchor="middle" fill="#ea580c" font-size="9">until 6 stopping criteria met</text>

  <!-- Characteristics -->
  <text x="625" y="445" fill="#e2e8f0" font-size="12" font-weight="600">What we add beyond autoresearch:</text>

  <rect x="625" y="458" width="510" height="28" rx="5" fill="#351c06"/>
  <text x="635" y="477" fill="#fed7aa" font-size="10">Metric: ms/iter (lower = better)  "  Config overrides + code patches + kernels</text>

  <rect x="625" y="492" width="510" height="28" rx="5" fill="#351c06"/>
  <text x="635" y="511" fill="#fed7aa" font-size="10">MCP: TraceLens Jarvis (profiling analysis) + GEAK (kernel optimization)</text>

  <rect x="625" y="526" width="510" height="28" rx="5" fill="#351c06"/>
  <text x="635" y="545" fill="#fed7aa" font-size="10">Domain knowledge base: validated overrides, known pitfalls, kernel guide</text>

  <rect x="625" y="560" width="510" height="28" rx="5" fill="#351c06"/>
  <text x="635" y="579" fill="#fed7aa" font-size="10">GEAK correctness gate: torch.allclose + micro-bench before integration</text>

  <rect x="625" y="594" width="510" height="28" rx="5" fill="#351c06"/>
  <text x="635" y="613" fill="#fed7aa" font-size="10">6 explicit stopping criteria  "  GBS immutability constraint  "  Structured report</text>
</svg>
