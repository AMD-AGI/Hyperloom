name: framework-agent

on:
  pull_request:
    paths: ["framework-agent/**"]
  push:
    branches: [main]
    paths: ["framework-agent/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install framework-agent (editable + test extra)
        run: |
          cd framework-agent
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Smoke test - fa schema
        run: |
          cd framework-agent
          python -m framework_agent.runtime.cli schema
      - name: Run unit tests
        run: |
          cd framework-agent
          pytest -v
