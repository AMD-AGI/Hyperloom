# Llama 4 Scout 17B-16E Full Finetune Distributed — Baseline Config
# Platform: 8× AMD Instinct MI355X (gfx950, CDNA4)
# Weights: /shared_nfs/sego/models/Llama-4-Scout-17B-16E/ (read-only)
# All outputs: /shared_nfs/nehaprakriya/results/llama4_scout_17b_optimization_20260323/

output_dir: /shared_nfs/nehaprakriya/results/llama4_scout_17b_optimization_20260323/checkpoints

# Model — MoE: 48 layers, 16 experts, top-1 routing
model:
  _component_: torchtune.models.llama4.llama4_scout_17b_16e

# Tensor Parallel (stock: TP=2)
tensor_parallel_dim: 2
tensor_parallel_plan:
  _component_: torchtune.models.llama4.decoder_only_tp_plan
data_parallel_shard_dim: -1
data_parallel_replicate_dim: 1

# Tokenizer
tokenizer:
  _component_: torchtune.models.llama4.llama4_transform
  path: /shared_nfs/sego/models/Llama-4-Scout-17B-16E/tokenizer.model
  max_seq_len: null
  max_num_tiles: 16

# Checkpointer — reads from sego (read-only), writes to nehaprakriya
checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: /shared_nfs/sego/models/Llama-4-Scout-17B-16E
  checkpoint_files:
    filename_format: model-{}-of-{}.safetensors
    max_filename: "00050"
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: LLAMA4
resume_from_checkpoint: False

# Dataset — real alpaca_cleaned, full scale
dataset:
  _component_: torchtune.datasets.alpaca_cleaned_dataset
  packed: False
  split: train[:95%]
seed: null
shuffle: True

# Validation
run_val_every_n_steps: null
dataset_val:
  _component_: torchtune.datasets.alpaca_cleaned_dataset
  split: train[95%:]
batch_size_val: ${batch_size}

# Training — stock defaults
epochs: 1
max_steps_per_epoch: 15
batch_size: 1
gradient_accumulation_steps: 1
optimizer:
  _component_: torch.optim.AdamW
  lr: 2e-5
  fused: False
optimizer_in_bwd: False
loss:
  _component_: torchtune.modules.loss.LinearCrossEntropyLoss
clip_grad_norm: null

# Environment
device: cuda
dtype: bf16

# Memory management — stock defaults
enable_activation_checkpointing: True
enable_activation_offloading: False
fsdp_cpu_offload: True
compile: False

# Logging
metric_logger:
  _component_: torchtune.training.metric_logging.DiskLogger
  log_dir: /shared_nfs/nehaprakriya/results/llama4_scout_17b_optimization_20260323/logs
log_every_n_steps: 1
log_peak_memory_stats: True
log_level: INFO

# Profiler (disabled for baseline)
profiler:
  _component_: torchtune.training.setup_torch_profiler
  enabled: False
  output_dir: /shared_nfs/nehaprakriya/results/llama4_scout_17b_optimization_20260323/traces
  cpu: True
  cuda: True
  profile_memory: False
  with_stack: False
  record_shapes: True
  with_flops: False
  wait_steps: 5
  warmup_steps: 3
  active_steps: 2
  num_cycles: 1
