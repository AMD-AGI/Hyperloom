# Qwen3 32B LoRA Finetune Distributed — Baseline Config
# Platform: 8× AMD Instinct MI355X (gfx950, CDNA4)
# Weights: /shared_nfs/models/Qwen-Qwen3-32B/ (read-only)
# All outputs: /shared_nfs/nehaprakriya/results/qwen3_32b_lora_optimization_20260323/

output_dir: /shared_nfs/nehaprakriya/results/qwen3_32b_lora_optimization_20260323/checkpoints

# Model — LoRA on Qwen3 32B (stock torchtune config)
model:
  _component_: torchtune.models.qwen3.lora_qwen3_32b
  lora_attn_modules: ['q_proj', 'v_proj', 'output_proj']
  apply_lora_to_mlp: True
  apply_lora_to_output: False
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.0

# Tokenizer
tokenizer:
  _component_: torchtune.models.qwen3.qwen3_tokenizer
  path: /shared_nfs/models/Qwen-Qwen3-32B/vocab.json
  merges_file: /shared_nfs/models/Qwen-Qwen3-32B/merges.txt
  max_seq_len: null

# Checkpointer — reads from shared, writes to nehaprakriya
checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: /shared_nfs/models/Qwen-Qwen3-32B
  checkpoint_files:
    filename_format: model-{}-of-{}.safetensors
    max_filename: "00017"
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: QWEN3
resume_from_checkpoint: False

# Dataset — real alpaca_cleaned, full scale
dataset:
  _component_: torchtune.datasets.alpaca_cleaned_dataset
  packed: False
seed: null
shuffle: True
batch_size: 2

# Optimizer and Scheduler
optimizer:
  _component_: torch.optim.AdamW
  fused: True
  weight_decay: 0.01
  lr: 3e-4
lr_scheduler:
  _component_: torchtune.training.lr_schedulers.get_cosine_schedule_with_warmup
  num_warmup_steps: 100

optimizer_in_bwd: False
loss:
  _component_: torchtune.modules.loss.LinearCrossEntropyLoss

# Training — stock defaults
epochs: 1
max_steps_per_epoch: 15
gradient_accumulation_steps: 8
clip_grad_norm: null
compile: False

# Logging
metric_logger:
  _component_: torchtune.training.metric_logging.DiskLogger
  log_dir: /shared_nfs/nehaprakriya/results/qwen3_32b_lora_optimization_20260323/logs
log_every_n_steps: 1
log_peak_memory_stats: True
log_level: INFO

# Environment
device: cuda
dtype: bf16
enable_activation_checkpointing: False
enable_activation_offloading: False

# Profiler (disabled for baseline)
profiler:
  _component_: torchtune.training.setup_torch_profiler
  enabled: False
  output_dir: /shared_nfs/nehaprakriya/results/qwen3_32b_lora_optimization_20260323/traces
  cpu: True
  cuda: True
  profile_memory: False
  with_stack: False
  record_shapes: True
  with_flops: False
  wait_steps: 5
  warmup_steps: 3
  active_steps: 2
  num_cycles: 1
