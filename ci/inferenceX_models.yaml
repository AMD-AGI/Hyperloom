# InferenceX API model name mapping (verified 2026-04-08)
#
# Website display name → API `model` parameter
# API: https://inferencex.semianalysis.com/api/v1/benchmarks?model=<api_name>

models:
  - display_name: DeepSeek R1 0528
    api_name: DeepSeek-R1-0528
    hf_model: deepseek-ai/DeepSeek-R1-0528
    model_prefix: dsr1
    verified_count: 1738

  - display_name: Qwen 3.5 397B-A17B
    api_name: Qwen-3.5-397B-A17B
    hf_model: Qwen/Qwen3.5-397B-A17B
    model_prefix: qwen3.5
    verified_count: 178

  # ── GLM 5 — DISABLED 2026-05-11 (paired with ci-config.yaml entry) ──
  # Re-enable when InferenceX adds an MI300X baseline for GLM-5 (or when CI
  # injects MI300X memory/topology adjustments before the prompt reaches the
  # agent). Keeping the mapping commented so build_summary doesn't surface
  # GLM-5 results against a wrong (MI355X) baseline.
  # - display_name: GLM 5
  #   api_name: GLM-5
  #   hf_model: zai-org/GLM-5-FP8
  #   model_prefix: glm5
  #   verified_count: 58

  - display_name: Kimi K2.5 1T
    api_name: Kimi-K2.5
    hf_model: moonshotai/Kimi-K2.5
    model_prefix: kimik2.5
    verified_count: 145

  - display_name: MiniMax M2.5 230B-A10B
    api_name: MiniMax-M2.5
    hf_model: MiniMaxAI/MiniMax-M2.5
    model_prefix: minimaxm2.5
    verified_count: 280

  - display_name: gpt-oss 120B
    api_name: gpt-oss-120b
    hf_model: openai/gpt-oss-120b
    model_prefix: gptoss
    verified_count: 611

# ── 以下模型 InferenceX 暂无数据 ──
# GLM 4.7 — InferenceX 上没有
# Qwen3-Next-80B — InferenceX 上没有

# ─── production pool 排除关键词（substring，case-insensitive） ────────────
#
# ci/build_production_leaderboard_pool.py 读取这一段并在选模型时丢弃 repo_id
# 命中任一关键词的行 —— 排除"InferenceX 已经在长任务里跑"以及"客户/路线明确
# 不希望进入 Hyperloom 常规 8h pool"两类模型，且会顺带覆盖第三方量化变体
# （unsloth/QuantTrio/cyankiwi/AWQ 等），而上面 models[].hf_model 的精确匹配
# 只能拦官方 repo。
#
# 规则：纯子串匹配，对 repo_id.lower() 检查；新增条目前请先在 leaderboard
# 用 `grep <keyword>` 思路确认不会误伤无关模型。
production_pool_exclusion_keywords:
  # InferenceX 已覆盖（5 个家族 + 所有第三方变体）
  - gpt-oss-120b
  - kimi-k2.5
  - kimi-k25
  - qwen3.5-397b
  - qwen3-5-397b
  - deepseek-r1-0528
  - r1-0528
  - minimax-m2.5
  - minimax-m25

  # 客户路线明确不进 production pool（GLM-5 P2 暂不做；DeepSeek V4 系列 +
  # GLM-5.1 都是 P0 InferenceX 长任务负责）
  - glm-5
  - glm5
  - deepseek-v4
