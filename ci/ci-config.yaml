claw:
  endpoint: ${SAFE_BASE_URL}/claw-api/v1
  api_key_env: CLAW_API_KEY
  sandbox_workspace_env: SANDBOX_WORKSPACE
  # InferenceX comparison jobs are intentionally long-running (up to 3 days)
  # and are separate from the production_1000 optimize-submit pool.
  sandbox_timeout: 259200
  agent_id: agent_default
  # plugin 4 (Hyperloom) bundles two tools:
  #   - tool 3:  hyperloom-public-mcp (primus-safe-core42 MCP server)
  #   - tool 85: hyperloom-prompt → @/wekafs/HyperloomV2/inference_optimizer/SKILL.md
  # CI sends pluginId=4 + tools=[] in the message body; the agent reads
  # SKILL.md off the WekaFS mount and runs the Python `inference_optimizer
  # optimize` CLI. Marketplace skill download is intentionally NOT used —
  # the runtime IS on the mount, no /workspace/.skills/ layout required.
  plugin_id: 4

inferenceX:
  repo: https://github.com/SemiAnalysisAI/InferenceX.git
  config_path: .github/configs/amd-master.yaml
  scripts_path: benchmarks/single_node
  api_url: https://inferencex.semianalysis.com/api/v1/benchmarks
  harbor_prefix: ${HARBOR_PREFIX}

results:
  # result_dir is no longer rendered into the agent prompt — inference_optimizer
  # has its own canonical session_dir at /workspace/hyperloom (SKILL.md "##
  # What This Skill Runs"). Kept here for any local CI bookkeeping that
  # still wants a path string.
  result_dir: /workspace/hyperloom
  nfs_base: ${NFS_ROOT}/results/ci
  artifact_retention_days: 90

notification:
  webhook_env: WEBHOOK_URL                # Slack / Teams Incoming Webhook both work

defaults:
  mode: local
  geak_step_limit: 100
  kernel_opt_workspace: ${KERNEL_OPT_WORKSPACE}
  min_kernels: 5
  inferencex_path: ${NFS_ROOT}/InferenceX
  oob_path: ${NFS_ROOT}/OOB
  tracelens_root: ${NFS_ROOT}/TraceLens-internal
  kernel_opt_backends: geak
  random_range_ratio: 0.8

models:
  # ── DeepSeek R1 (FP8, TP=8) ──
  - inferenceX_key: dsr1-fp8-mi300x-sglang
    inferenceX_api_name: DeepSeek-R1-0528
    model_path_override: ${NFS_ROOT}/models/DeepSeek-R1-0528
    optimization_depth: full
    kernel_opt_backends: claude
    target_gpu: mi300x

  # ── gpt-oss 120B (FP4, TP=8, vLLM) ──
  - inferenceX_key: gptoss-fp4-mi300x-vllm
    inferenceX_api_name: gpt-oss-120b
    model_path_override: ${NFS_ROOT}/models/gpt-oss-120b
    optimization_depth: full
    kernel_opt_backends: claude
    target_gpu: mi300x

  # ── Kimi K2.5 (INT4, TP=8, vLLM) ──
  - inferenceX_key: kimik2.5-int4-mi300x-vllm
    inferenceX_api_name: Kimi-K2.5
    model_path_override: ${NFS_ROOT}/models/Kimi-K2.5
    optimization_depth: full
    kernel_opt_backends: claude
    target_gpu: mi300x

  # ── MiniMax M2.5 (FP8, TP=8, vLLM) ──
  - inferenceX_key: minimaxm2.5-fp8-mi300x-vllm
    inferenceX_api_name: MiniMax-M2.5
    model_path_override: ${NFS_ROOT}/models/MiniMaxAI-MiniMax-M2.5
    optimization_depth: full
    kernel_opt_backends: claude
    target_gpu: mi300x

  # ── GLM 5 (FP8, MoE+MLA+NSA) multi-node — TP=16 across 2 MI300X nodes ──
  # Standalone entry: carries model_hf / image / framework / precision / conc /
  # isl_osl_configs directly. orchestrator.py uses the
  # synthesize_entry_from_ci_config() path when inferenceX_key is absent.
  - key: glm5-multinode-fp8-mi300x-sglang
    model_hf: zai-org/GLM-5
    model_path_override: ${NFS_ROOT}/models/zai-org-GLM-5
    # profilerfix: rocprofiler captures HipGraphLaunch kernels (issue #352)
    # Pre-profilerfix image (restore when reverting): lmsysorg/sglang:v0.5.11-rocm720-mi30x
    image: primussafe/sglang:v0.5.11-rocm720-mi30x-profilerfix
    framework: sglang
    precision: fp8
    conc: 64
    isl_osl_configs:
      - [1024, 1024]
    optimization_depth: full
    kernel_opt_backends: claude
    target_gpu: mi300x
    tp: 16
    ep: 1
    mode: remote
    # Multi-node knobs — see prompt_template.md "Task submission" block.
    # nodes=2 triggers the RayJob 2-node multi-node prompt path.
    # GLM-5 multi-node typically needs 2-3 h cold-start + benchmark before
    # kernel-opt; target_gain / max_hours are sized accordingly.
    nodes: 2
    target_gain: 30
    max_hours: 24
    random_range_ratio: 0.8
    rayjob_image: harbor.core42.primus-safe.amd.com/custom/sync/sglang:202605190643
    # NOTE: do NOT set `claw_plugin_id: null` here. A Claw GUI manual session
    # defaults to plugin_id=4; without a pluginId the sandbox doesn't load the
    # plugin tool bundle (Bash/Read/Write/Grep/etc.), so the agent receives the
    # prompt but has no tools to invoke and the session times out with 0 tool
    # calls. Leave the field absent → inherits the default plugin_id=4.

  # ── Qwen3.5 MoE 397B (BF16, TP=8) ──
  - inferenceX_key: qwen3.5-bf16-mi300x-sglang
    inferenceX_api_name: Qwen-3.5-397B-A17B
    model_path_override: ${NFS_ROOT}/models/Qwen-Qwen3.5-397B-A17B
    optimization_depth: full
    kernel_opt_backends: claude
    target_gpu: mi300x
