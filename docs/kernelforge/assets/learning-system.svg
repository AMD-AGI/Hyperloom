<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="campaignG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="extractG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fc5c7d"/>
      <stop offset="100%" style="stop-color:#6a82fb"/>
    </linearGradient>
    <linearGradient id="accumulateG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e"/>
      <stop offset="100%" style="stop-color:#38ef7d"/>
    </linearGradient>
    <linearGradient id="futureG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
    <filter id="sh3" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <marker id="arrW" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrFeedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f5576c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="360" rx="12" fill="#0f172a"/>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">SELF-IMPROVING LEARNING SYSTEM</text>
  <text x="480" y="46" text-anchor="middle" fill="#64748b" font-size="10">Every campaign makes the system smarter for the next one</text>

  <!-- ═══ Stage 1: Campaign ═══ -->
  <rect x="30" y="70" width="190" height="220" rx="12" fill="#1e293b" stroke="#764ba2" stroke-width="1.5" filter="url(#sh3)"/>
  <rect x="30" y="70" width="190" height="32" rx="12" fill="url(#campaignG)" opacity="0.85"/>
  <rect x="30" y="92" width="190" height="10" fill="#1e293b"/>
  <text x="125" y="92" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">CAMPAIGN</text>
  <text x="125" y="112" text-anchor="middle" fill="#94a3b8" font-size="10">Each optimization run</text>

  <!-- Campaign items -->
  <circle cx="55" cy="138" r="4" fill="#667eea"/>
  <text x="68" y="142" fill="#cbd5e1" font-size="10">Build iterations</text>
  <circle cx="55" cy="162" r="4" fill="#667eea"/>
  <text x="68" y="166" fill="#cbd5e1" font-size="10">SNR measurements</text>
  <circle cx="55" cy="186" r="4" fill="#667eea"/>
  <text x="68" y="190" fill="#cbd5e1" font-size="10">Wall-clock benchmarks</text>
  <circle cx="55" cy="210" r="4" fill="#667eea"/>
  <text x="68" y="214" fill="#cbd5e1" font-size="10">PMC counter profiles</text>
  <circle cx="55" cy="234" r="4" fill="#667eea"/>
  <text x="68" y="238" fill="#cbd5e1" font-size="10">Config → result pairs</text>
  <circle cx="55" cy="258" r="4" fill="#667eea"/>
  <text x="68" y="262" fill="#cbd5e1" font-size="10">Agent decisions &amp; outcomes</text>

  <!-- Arrow 1→2 -->
  <line x1="220" y1="180" x2="250" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrW)"/>

  <!-- ═══ Stage 2: Auto-Extract ═══ -->
  <rect x="258" y="70" width="190" height="220" rx="12" fill="#1e293b" stroke="#6a82fb" stroke-width="1.5" filter="url(#sh3)"/>
  <rect x="258" y="70" width="190" height="32" rx="12" fill="url(#extractG)" opacity="0.85"/>
  <rect x="258" y="92" width="190" height="10" fill="#1e293b"/>
  <text x="353" y="92" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">AUTO-EXTRACT</text>
  <text x="353" y="112" text-anchor="middle" fill="#94a3b8" font-size="10">PostMortem analysis</text>

  <!-- Extract items with thresholds -->
  <rect x="272" y="125" width="162" height="28" rx="6" fill="#f87171" opacity="0.1" stroke="#f87171" stroke-width="0.5"/>
  <text x="280" y="143" fill="#f87171" font-size="10" font-weight="600">Pitfalls</text>
  <text x="418" y="143" text-anchor="end" fill="#64748b" font-size="9">&gt; 15% regress</text>

  <rect x="272" y="159" width="162" height="28" rx="6" fill="#38ef7d" opacity="0.1" stroke="#38ef7d" stroke-width="0.5"/>
  <text x="280" y="177" fill="#38ef7d" font-size="10" font-weight="600">Optimizations</text>
  <text x="418" y="177" text-anchor="end" fill="#64748b" font-size="9">&gt; 15% improve</text>

  <rect x="272" y="193" width="162" height="28" rx="6" fill="#fbbf24" opacity="0.1" stroke="#fbbf24" stroke-width="0.5"/>
  <text x="280" y="211" fill="#fbbf24" font-size="10" font-weight="600">Occupancy Cliffs</text>
  <text x="418" y="211" text-anchor="end" fill="#64748b" font-size="9">VGPR ≥ 256</text>

  <rect x="272" y="227" width="162" height="28" rx="6" fill="#a78bfa" opacity="0.1" stroke="#a78bfa" stroke-width="0.5"/>
  <text x="280" y="245" fill="#a78bfa" font-size="10" font-weight="600">Correctness Traps</text>
  <text x="418" y="245" text-anchor="end" fill="#64748b" font-size="9">SNR &lt; 20 dB</text>

  <rect x="272" y="261" width="162" height="22" rx="6" fill="#4facfe" opacity="0.1" stroke="#4facfe" stroke-width="0.5"/>
  <text x="280" y="276" fill="#4facfe" font-size="10" font-weight="600">Plateau Patterns</text>

  <!-- Arrow 2→3 -->
  <line x1="448" y1="180" x2="478" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrW)"/>

  <!-- ═══ Stage 3: Accumulate ═══ -->
  <rect x="486" y="70" width="190" height="220" rx="12" fill="#1e293b" stroke="#38ef7d" stroke-width="1.5" filter="url(#sh3)"/>
  <rect x="486" y="70" width="190" height="32" rx="12" fill="url(#accumulateG)" opacity="0.85"/>
  <rect x="486" y="92" width="190" height="10" fill="#1e293b"/>
  <text x="581" y="92" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">ACCUMULATE</text>
  <text x="581" y="112" text-anchor="middle" fill="#94a3b8" font-size="10">Knowledge grows</text>

  <!-- Accumulate items -->
  <rect x="500" y="125" width="162" height="44" rx="8" fill="#38ef7d" opacity="0.08"/>
  <text x="510" y="143" fill="#38ef7d" font-size="11" font-weight="700">Tuning Database</text>
  <text x="510" y="160" fill="#64748b" font-size="9">Config → Perf lookup table</text>

  <rect x="500" y="177" width="162" height="44" rx="8" fill="#a78bfa" opacity="0.08"/>
  <text x="510" y="195" fill="#a78bfa" font-size="11" font-weight="700">Skill Library</text>
  <text x="510" y="212" fill="#64748b" font-size="9">Atomic → Compound → Meta</text>

  <rect x="500" y="229" width="162" height="44" rx="8" fill="#4facfe" opacity="0.08"/>
  <text x="510" y="247" fill="#4facfe" font-size="11" font-weight="700">Knowledge Base</text>
  <text x="510" y="264" fill="#64748b" font-size="9">16+ curated files + learned</text>

  <!-- Arrow 3→4 -->
  <line x1="676" y1="180" x2="706" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrW)"/>

  <!-- ═══ Stage 4: Future Campaigns ═══ -->
  <rect x="714" y="70" width="216" height="220" rx="12" fill="#1e293b" stroke="#f5576c" stroke-width="1.5" filter="url(#sh3)"/>
  <rect x="714" y="70" width="216" height="32" rx="12" fill="url(#futureG)" opacity="0.85"/>
  <rect x="714" y="92" width="216" height="10" fill="#1e293b"/>
  <text x="822" y="92" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">FUTURE CAMPAIGNS</text>
  <text x="822" y="112" text-anchor="middle" fill="#94a3b8" font-size="10">Agents start smarter</text>

  <!-- Future items -->
  <rect x="728" y="125" width="188" height="36" rx="8" fill="#f5576c" opacity="0.08"/>
  <text x="738" y="141" fill="#f5576c" font-size="10" font-weight="600">Prompt Injection</text>
  <text x="738" y="155" fill="#64748b" font-size="9">Knowledge auto-loaded per backend</text>

  <rect x="728" y="169" width="188" height="36" rx="8" fill="#f5576c" opacity="0.08"/>
  <text x="738" y="185" fill="#f5576c" font-size="10" font-weight="600">Config Filtering</text>
  <text x="738" y="199" fill="#64748b" font-size="9">Skip known-bad configurations</text>

  <rect x="728" y="213" width="188" height="36" rx="8" fill="#f5576c" opacity="0.08"/>
  <text x="738" y="229" fill="#f5576c" font-size="10" font-weight="600">Transfer Rules</text>
  <text x="738" y="243" fill="#64748b" font-size="9">Cross-operation learning</text>

  <rect x="728" y="257" width="188" height="26" rx="8" fill="#f5576c" opacity="0.08"/>
  <text x="738" y="275" fill="#f5576c" font-size="10" font-weight="600">Faster convergence</text>

  <!-- Feedback loop arrow (curves back from Stage 4 to Stage 1) -->
  <path d="M 822 290 L 822 320 Q 822 340 802 340 L 145 340 Q 125 340 125 320 L 125 295" fill="none" stroke="#f5576c" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrFeedback)" opacity="0.5"/>
  <rect x="420" y="330" width="140" height="20" rx="4" fill="#0f172a"/>
  <text x="490" y="344" text-anchor="middle" fill="#f5576c" font-size="10" font-weight="600" opacity="0.7">Continuous improvement loop</text>
</svg>
