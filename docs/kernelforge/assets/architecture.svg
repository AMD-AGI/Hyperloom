  <text x="500" y="108" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">Edit · Build · Test · Bench · Profile · Gate on measurement</text>
  <text x="500" y="122" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-size="10">Tracks the experiment log · Keeps only measured improvements</text>

  <!-- Connector lines from the loop to the backend prompts -->
