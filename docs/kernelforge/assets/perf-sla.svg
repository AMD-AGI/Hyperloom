<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="tritonBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#475569"/>
      <stop offset="100%" style="stop-color:#64748b"/>
    </linearGradient>
    <linearGradient id="ckBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#11998e"/>
      <stop offset="100%" style="stop-color:#38ef7d"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="barShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="500" rx="12" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">SPARSE LINEAR ATTENTION — CK vs TRITON</text>
  <text x="480" y="52" text-anchor="middle" fill="#64748b" font-size="11">Measured on AMD Instinct MI355X (gfx950) · 30-iteration median · In-context</text>

  <!-- Legend -->
  <rect x="340" y="64" width="14" height="14" rx="3" fill="url(#tritonBar)"/>
  <text x="360" y="75" fill="#94a3b8" font-size="11">Triton (Published Autotuned Baseline)</text>
  <rect x="580" y="64" width="14" height="14" rx="3" fill="url(#ckBar)"/>
  <text x="600" y="75" fill="#94a3b8" font-size="11">CK (KernelForge Optimized)</text>

  <!-- ═══ Config B Section ═══ -->
  <text x="60" y="115" fill="#e2e8f0" font-size="14" font-weight="700">Config B</text>
  <text x="60" y="132" fill="#64748b" font-size="10">BLKQ=64 · B=1 H=24 S=65536 D=128 · sparsity=0.90</text>

  <!-- Grid lines -->
  <line x1="190" y1="145" x2="700" y2="145" stroke="#1e293b" stroke-width="1"/>
  <line x1="190" y1="179" x2="700" y2="179" stroke="#1e293b" stroke-width="1"/>
  <line x1="190" y1="213" x2="700" y2="213" stroke="#1e293b" stroke-width="1"/>
  <line x1="190" y1="247" x2="700" y2="247" stroke="#1e293b" stroke-width="1"/>

  <!-- Config B: Forward -->
  <text x="60" y="160" fill="#94a3b8" font-size="11" font-weight="600">Forward</text>
  <rect x="190" y="148" width="266" height="24" rx="4" fill="url(#tritonBar)" filter="url(#barShadow)" opacity="0.8"/>
  <text x="466" y="165" fill="#94a3b8" font-size="11" font-weight="600">13.29 ms</text>
  <rect x="190" y="176" width="222" height="24" rx="4" fill="url(#ckBar)" filter="url(#barShadow)"/>
  <text x="422" y="193" fill="#38ef7d" font-size="11" font-weight="700">11.06 ms</text>
  <rect x="530" y="170" width="60" height="28" rx="6" fill="#38ef7d" opacity="0.15"/>
  <text x="560" y="189" text-anchor="middle" fill="#38ef7d" font-size="12" font-weight="700">1.20x</text>

  <!-- Config B: Backward -->
  <text x="60" y="228" fill="#94a3b8" font-size="11" font-weight="600">Backward</text>
  <rect x="190" y="216" width="476" height="24" rx="4" fill="url(#tritonBar)" filter="url(#barShadow)" opacity="0.8"/>
  <text x="676" y="233" fill="#94a3b8" font-size="11" font-weight="600">47.56 ms</text>
  <rect x="190" y="244" width="339" height="24" rx="4" fill="url(#ckBar)" filter="url(#barShadow)"/>
  <text x="539" y="261" fill="#38ef7d" font-size="11" font-weight="700">33.79 ms</text>
  <rect x="610" y="238" width="60" height="28" rx="6" fill="#38ef7d" opacity="0.15"/>
  <text x="640" y="257" text-anchor="middle" fill="#38ef7d" font-size="12" font-weight="700">1.41x</text>

  <!-- Config B: Total with highlight -->
  <rect x="55" y="274" width="710" height="40" rx="8" fill="#38ef7d" opacity="0.04"/>
  <text x="60" y="300" fill="#e2e8f0" font-size="12" font-weight="700">TOTAL</text>
  <rect x="190" y="282" width="500" height="24" rx="4" fill="url(#tritonBar)" filter="url(#barShadow)" opacity="0.8"/>
  <text x="700" y="299" fill="#94a3b8" font-size="11" font-weight="600">60.85 ms</text>
  <rect x="190" y="282" width="370" height="24" rx="4" fill="url(#ckBar)" filter="url(#barShadow)"/>
  <text x="570" y="299" fill="#fff" font-size="11" font-weight="700">44.97 ms</text>
  <rect x="770" y="278" width="80" height="32" rx="8" fill="#38ef7d" opacity="0.2" stroke="#38ef7d" stroke-width="1"/>
  <text x="810" y="300" text-anchor="middle" fill="#38ef7d" font-size="15" font-weight="800" filter="url(#glow)">1.35x</text>

  <!-- Separator -->
  <line x1="60" y1="328" x2="900" y2="328" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ═══ Config C Section ═══ -->
  <text x="60" y="355" fill="#e2e8f0" font-size="14" font-weight="700">Config C</text>
  <text x="60" y="372" fill="#64748b" font-size="10">BLKQ=128 · B=1 H=24 S=65536 D=128 · sparsity=0.90</text>

  <!-- Grid lines -->
  <line x1="190" y1="383" x2="700" y2="383" stroke="#1e293b" stroke-width="1"/>
  <line x1="190" y1="417" x2="700" y2="417" stroke="#1e293b" stroke-width="1"/>

  <!-- Config C: Forward -->
  <text x="60" y="398" fill="#94a3b8" font-size="11" font-weight="600">Forward</text>
  <rect x="190" y="386" width="228" height="24" rx="4" fill="url(#tritonBar)" filter="url(#barShadow)" opacity="0.8"/>
  <text x="428" y="403" fill="#94a3b8" font-size="11" font-weight="600">11.41 ms</text>
  <rect x="190" y="414" width="179" height="24" rx="4" fill="url(#ckBar)" filter="url(#barShadow)"/>
  <text x="379" y="431" fill="#38ef7d" font-size="11" font-weight="700">8.94 ms</text>
  <rect x="490" y="408" width="60" height="28" rx="6" fill="#38ef7d" opacity="0.15"/>
  <text x="520" y="427" text-anchor="middle" fill="#38ef7d" font-size="12" font-weight="700">1.28x</text>

  <!-- Config C: Backward -->
  <text x="60" y="464" fill="#94a3b8" font-size="11" font-weight="600">Backward</text>
  <rect x="190" y="447" width="467" height="24" rx="4" fill="url(#tritonBar)" filter="url(#barShadow)" opacity="0.8"/>
  <text x="667" y="464" fill="#94a3b8" font-size="11" font-weight="600">46.71 ms</text>
  <rect x="190" y="447" width="339" height="24" rx="4" fill="url(#ckBar)" filter="url(#barShadow)"/>
  <text x="539" y="464" fill="#38ef7d" font-size="11" font-weight="700">33.84 ms</text>
  <rect x="740" y="441" width="80" height="32" rx="8" fill="#38ef7d" opacity="0.2" stroke="#38ef7d" stroke-width="1"/>
  <text x="780" y="463" text-anchor="middle" fill="#38ef7d" font-size="15" font-weight="800" filter="url(#glow)">1.38x</text>

  <!-- Big highlight: overall best -->
  <rect x="815" y="130" width="130" height="130" rx="16" fill="#38ef7d" opacity="0.08" stroke="#38ef7d" stroke-width="1.5"/>
  <text x="880" y="165" text-anchor="middle" fill="#64748b" font-size="10" font-weight="600">BEST RESULT</text>
  <text x="880" y="205" text-anchor="middle" fill="#38ef7d" font-size="36" font-weight="800" filter="url(#glow)">1.38x</text>
  <text x="880" y="228" text-anchor="middle" fill="#94a3b8" font-size="10">bwd Config C</text>
  <text x="880" y="245" text-anchor="middle" fill="#64748b" font-size="9">46.71 → 33.84 ms</text>

  <!-- Optimization journey callout -->
  <rect x="815" y="290" width="130" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="880" y="312" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">VGPR JOURNEY</text>
  <text x="880" y="332" text-anchor="middle" fill="#f87171" font-size="14" font-weight="600">296</text>
  <text x="880" y="344" text-anchor="middle" fill="#64748b" font-size="10">→</text>
  <text x="880" y="360" text-anchor="middle" fill="#38ef7d" font-size="14" font-weight="600">238</text>
  <text x="880" y="375" text-anchor="middle" fill="#475569" font-size="8">Zero spills</text>
</svg>
