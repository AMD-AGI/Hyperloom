<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="30%" style="stop-color:#1e1b4b"/>
      <stop offset="60%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#38ef7d"/>
    </linearGradient>
    <linearGradient id="statBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.06)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="titleGlow" x="-5%" y="-15%" width="110%" height="130%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="200" rx="12" fill="url(#heroBg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.015)" stroke-width="1"/>
  </pattern>
  <rect width="960" height="200" fill="url(#grid)"/>

  <!-- Accent circles (decorative) -->
  <circle cx="80" cy="100" r="120" fill="#667eea" opacity="0.03"/>
  <circle cx="880" cy="100" r="100" fill="#38ef7d" opacity="0.03"/>

  <!-- Title -->
  <text x="480" y="55" text-anchor="middle" fill="url(#titleGrad)" font-size="36" font-weight="800" letter-spacing="2" filter="url(#titleGlow)">KERNEL AGENTS</text>
  <text x="480" y="80" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="400" letter-spacing="4">AI-POWERED GPU KERNEL DEVELOPMENT</text>

  <!-- Subtitle -->
  <text x="480" y="106" text-anchor="middle" fill="#64748b" font-size="12">8 backend fellows automating Build → Test → Bench → Profile → Optimize → Learn</text>
  <text x="480" y="122" text-anchor="middle" fill="#475569" font-size="11">Built on Claude Agent SDK · AMD Instinct MI300X / MI355X</text>

  <!-- Stat boxes -->
  <rect x="130" y="140" width="130" height="44" rx="8" fill="url(#statBox)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="195" y="160" text-anchor="middle" fill="#38ef7d" font-size="18" font-weight="800">1.38x</text>
  <text x="195" y="176" text-anchor="middle" fill="#64748b" font-size="9">SLA Attention</text>

  <rect x="290" y="140" width="130" height="44" rx="8" fill="url(#statBox)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="355" y="160" text-anchor="middle" fill="#a78bfa" font-size="18" font-weight="800">1.33x</text>
  <text x="355" y="176" text-anchor="middle" fill="#64748b" font-size="9">MoE Inference</text>

  <rect x="450" y="140" width="130" height="44" rx="8" fill="url(#statBox)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="515" y="160" text-anchor="middle" fill="#667eea" font-size="18" font-weight="800">1.15x</text>
  <text x="515" y="176" text-anchor="middle" fill="#64748b" font-size="9">Sage Attention</text>

  <rect x="610" y="140" width="130" height="44" rx="8" fill="url(#statBox)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="675" y="160" text-anchor="middle" fill="#fbbf24" font-size="18" font-weight="800">12K</text>
  <text x="675" y="176" text-anchor="middle" fill="#64748b" font-size="9">Lines of Code</text>

  <rect x="770" y="140" width="100" height="44" rx="8" fill="url(#statBox)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="820" y="160" text-anchor="middle" fill="#fc5c7d" font-size="18" font-weight="800">6</text>
  <text x="820" y="176" text-anchor="middle" fill="#64748b" font-size="9">AI Agents</text>
</svg>
